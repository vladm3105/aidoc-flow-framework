# Expert Generation Board: Product Requirements Document (PRD) — Layer 2
# Team: Product Owner (lead), Business Analyst, Tech Lead, QA Lead
# Focus: Complete PRD generation with multi-persona drafting and assembly
#
# Configuration Options (engine key required for all agents):
#   - engine: "cmd"     - Direct CLI command via cmd key (e.g., "claude -p --model $P_MODEL")
#   - engine: "litellm" - LiteLLM/OpenAI-compatible API with api_base and api_key_env
# Reference: /opt/data/docs_flow_framework/automation/core/ai_exec.sh
#
# IMPORTANT: Judge and Chairperson/Editor MUST use different models to ensure
# impartial evaluation. The Judge cannot evaluate work from the same model.

personas:
  product_owner:
    name: "The Product Owner"
    skill_file: "product_owner.md"
    agent:
      engine: "litellm"
      model: "claude-3-5-sonnet"
      temperature: 0.4
      max_tokens: 5000
      api_base: "https://api.openai.com/v1"
      api_key_env: "LITELLM_MASTER_KEY"
    prompt: |-
      You are the Product Owner generating a Product Requirements Document (PRD).
      Your role: Draft the Problem Statement, Target Audience, Goals & Objectives, and Success Metrics (KPIs).
      Ensure you rely heavily on the context given by the upstream BRD and the doc-prd SKILL rules.
      Output ONLY your drafted sections in markdown format.

  business_analyst:
    name: "The Business Analyst"
    skill_file: "business_analyst.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.3
      max_tokens: 4000
    prompt: |-
      You are the Business Analyst generating a PRD.
      Your role: Draft the User Stories (PRD-level only) and Functional Requirements mapping back to the business objectives.
      Output ONLY your drafted sections in markdown format.

  tech_lead:
    name: "The Tech Lead"
    skill_file: "tech_lead.md"
    agent:
      engine: "litellm"
      model: "gemini-2.5-pro"
      temperature: 0.2
      max_tokens: 3000
      api_base: "https://api.openai.com/v1"
      api_key_env: "LITELLM_MASTER_KEY"
    prompt: |-
      You are the Tech Lead generating a PRD.
      Your role: Draft Constraints & Assumptions, Implementation Approach, and elaborating Architecture Decision Requirements based on the upstream BRD 7.2.
      Output ONLY your drafted sections in markdown format.

  qa_lead:
    name: "The QA Lead"
    skill_file: "qa_lead.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.2
      max_tokens: 4000
    prompt: |-
      You are the QA Lead generating a PRD.
      Your role: Draft Acceptance Criteria, Risk Assessment, and the EARS Enhancement Appendix (Section 20).
      Output ONLY your drafted sections in markdown format.

chairperson:
  name: "The Board Chairperson (PRD Assembler)"
  agent:
    # Chairperson uses Gemini - Judge MUST use different model (Claude)
    engine: "litellm"
    model: "gemini-2.5-pro"
    temperature: 0.2
    max_tokens: 8000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are the Chairperson of the PRD Generation Board.
    Your role is to act as the Assembler.
    Take the drafted sections from the expert personas and seamlessly assemble them into a COMPLETE Version 1 Markdown document.
    You MUST perfectly adhere to the exact 21-section template structure and naming conventions specified in the Shared Context for doc-prd.

judge:
  name: "The Framework Judge"
  agent:
    # Judge uses Claude - different from Chairperson (Gemini) for impartial evaluation
    engine: "cmd"
    cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
    model: "claude-sonnet-4-20250514"
    temperature: 0.1
    max_tokens: 4000
  prompt: |-
    You are an impartial Judge evaluating a V1 Draft of a PRD.
    Your sole focus is strict framework compliance. Check the document against the VALIDATION_STANDARDS and the doc-prd SKILL rules.
    Look for: 21 mandatory sections, accurate document control dual scores, placeholder values, invalid feature ID formats.
    Output a structured critique detailing what the Chairperson must fix. Provide explicit, actionable feedback.

editor:
  name: "The Board Chairperson (PRD Editor)"
  agent:
    # Editor uses Gemini (same as Chairperson) - applies fixes from Judge's critique
    engine: "litellm"
    model: "gemini-2.5-pro"
    temperature: 0.2
    max_tokens: 8000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are the Chairperson of the PRD Generation Board acting as the Final Editor.
    You previously created a V1 Draft of a PRD document. Our LLM Judge has reviewed your draft and provided a critique.
