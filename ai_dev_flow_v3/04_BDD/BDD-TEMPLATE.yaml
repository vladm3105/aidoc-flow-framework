# =============================================================================
#  BDD-TEMPLATE.yaml — BDD Scenarios (SDD v3)
# =============================================================================
#  Document Authority: PRIMARY STANDARD
#  Purpose: AI-consumable + human-reviewable BDD template
#  Lifecycle: MVP → PROD → NEW MVP
#
#  Convention:
#    _guidance     — authoring instructions, ignored by MCP tools
#    _antipatterns — common mistakes to avoid
#    _note         — contextual clarification
#    _example      — sample values for reference
#
#  Downstream: ADR (Layer 5), TDD (Layer 6)
#  Upstream: BRD (Layer 1), PRD (Layer 2), EARS (Layer 3)
#
#  v3 changes: Added TDD as downstream; removed SYS, TSPEC, TASKS refs
# =============================================================================

id: BDD-NN
title: "[Feature/Component Under Test]"

# =============================================================================
# Template Metadata (not a content section — template configuration only)
# =============================================================================

metadata:
  schema_version: "1.0"
  document_type: "bdd-document"
  layer: 4
  lifecycle: mvp-prod-newmvp
  total_sections: 5
  last_updated: "2026-03-29"
  validation:
    tool: sdd_validate
    server: mcp_sdd
    _guidance: |
      All validation runs through mcp_sdd MCP tools.
      ADR-Ready Score: >=90/100 required before downstream ADR generation.

      ADR-Ready scoring criteria:
        Scenario coverage (40%): all EARS requirements have scenarios
        Gherkin quality (25%): valid syntax, atomic scenarios, executable
        Traceability (20%): cumulative tags (@brd + @prd + @ears) complete
        Edge case coverage (15%): error, recovery, parameterized scenarios

      Execution environment: QA STAGING ONLY — do NOT run in CI pipeline.
      Use UTEST/ITEST for CI. BDD validates user acceptance criteria.

  c4_level:
    _guidance: |
      BDD is NOT a C4 level. It is a refinement step that formalizes
      the transition from Context (BRD) to Container (PRD), alongside EARS.

      SDD v3 C4 map (7 layers):
        Context (BRD)    — business environment, actors, boundaries
        Container (PRD)  — product features, functional blocks
        EARS              — formalize Context→Container transition
        BDD               — executable acceptance scenarios         ← this layer
        ADR               — architecture decisions
        TDD               — test-driven development guide
        Code (SPEC)       — implementation-ready specifications

      BDD translates EARS formal requirements into executable Given-When-Then
      scenarios. Content must be executable test scenarios — not narrative.
      scenarios. Content must be precise, executable Gherkin — not narrative.

  diagram_standard:
    _guidance: |
      BDD uses sequence diagrams for scenario flow visualization.
      Not C4 diagrams — BDD operates at the scenario/test level.

  tags:
    - bdd-document
    - layer-4-artifact
    - shared-architecture

  deliverable_type:
    _guidance: |
      Inherited from upstream PRD (which inherits from BRD).
    value: code  # code | document | ux | risk | process

  id_standard:
    _guidance: |
      All element IDs use content-derived hashes scoped to BDD content.
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
      Example: BDD.01.03.d7a2

      Hash algorithm (SHA256, 4-char hex):
        1. Build input: "{doc_id}:{section_id}:{title}:{description}"
           - from BDD content, NOT upstream EARS/PRD/BRD content
        2. Compute: hashlib.sha256(input.encode('utf-8')).hexdigest()[:4]
        3. Collision: extend hash from 4 to 8 chars if duplicate detected

      Template placeholder: "xxxx" represents the hash suffix.

    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8
    placeholder: "xxxx"

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  _guidance: |
    ADR-Ready Score: >=90/100 required before ADR generation.
    Source Document: link to upstream EARS using hash-based IDs.
    Cumulative tags: BDD (Layer 4) requires @brd + @prd + @ears tags.

    Pre-generation checks:
      - Verify all upstream EARS requirements exist
      - Confirm PRD features are stable (no pending changes)
      - Validate threshold references resolve to valid PRD keys
  version: "1.0"
  status: Draft  # Draft | In Review | Approved
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[QA Engineer]"
  priority: P1  # P1 (Critical) | P2 (High) | P3 (Medium) | P4 (Low)
  ears_reference: "@ears: EARS.NN.03.xxxx"
  prd_reference: "@prd: PRD.NN.09.xxxx"
  brd_reference: "@brd: BRD.NN.07.xxxx"
  adr_ready_score: "[Score]/100"

  revision_history:
    - version: "1.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial BDD scenarios"

# =============================================================================
# Section 2: Feature Definition
# =============================================================================

feature_definition:
  _guidance: |
    Define the feature under test with required Gherkin tags.
    Feature name should match the EARS requirement being tested.

    Required Gherkin tags (NO spaces after colon):
      @brd:BRD.NN.07.xxxx
      @prd:PRD.NN.09.xxxx
      @ears:EARS.NN.03.xxxx

    Tags appear on separate lines BEFORE the Feature: keyword.
    All three traceability tags are MANDATORY for Layer 4.

    File size rules:
      - Single .feature file per module (default), monolithic up to 50,000 tokens
      - If >50,000 tokens: create a new BDD document with its own scope
      - Do NOT split into sectioned files — each document is self-contained
      - Keep scenarios atomic (one behavior per scenario)

  _example: |
    @brd:BRD.01.07.a7f3
    @prd:PRD.01.09.b3f2
    @ears:EARS.01.03.c4d8

    Feature: User Authentication
      As a registered user
      I want to authenticate with the system
      So that I can access protected resources

      Background:
        Given the system is in a ready state
        And the current time is "09:30:00" in "America/New_York"

  feature_name: "[Feature Name matching EARS requirement]"
  description: |
    [As a {role}, I want {capability}, So that {benefit}]

  background:
    _guidance: |
      Background runs before each scenario. Include system state
      and timezone. Default timezone: America/New_York (IANA format).
    steps:
      - "Given the system is in a ready state"
      - 'And the current time is "HH:MM:SS" in "America/New_York"'

# =============================================================================
# Section 3: Scenario Structure
# =============================================================================

scenario_structure:
  _guidance: |
    Five scenario categories with required tag and priority conventions.

    | Category      | Tag                          | Min Per | Priority |
    | success       | @scenario-type:success       | 1/EARS  | P0-P1    |
    | error         | @scenario-type:error         | 1/error | P1-P2    |
    | recovery      | @scenario-type:recovery      | 1/CB    | P1       |
    | parameterized | @scenario-type:parameterized | 1/multi | P1-P2    |
    | optional      | @scenario-type:optional      | 1/opt   | P2-P3    |

    Each scenario MUST have:
      - @scenario-type:{category} tag
      - @p{0-3}-{level} priority tag
      - @scenario-id:BDD.NN.03.xxxx hash-based ID tag
      - Given-When-Then steps (executable Gherkin)
      - Threshold references for timing constraints

    AI-Agent BDD patterns:
      - Agent autonomy scenarios: Given agent has {capability}
      - Multi-agent coordination: Given agents {A} and {B} are active
      - Fallback scenarios: Given primary agent is unavailable

  _example: |
    @scenario-type:success @p0-critical @scenario-id:BDD.NN.03.xxxx
    Scenario: User logs in with valid credentials
      Given a registered user with email "user@example.com"
      When the user submits valid credentials
      Then the system SHALL authenticate the user
      And a session token SHALL be returned WITHIN @threshold:PRD.NN.perf.auth.p95

    @scenario-type:error @p1-high @scenario-id:BDD.NN.03.xxxx
    Scenario: Invalid credentials return error
      Given a registered user with email "user@example.com"
      When the user submits invalid credentials
      Then the system SHALL NOT authenticate the user
      And error code "AUTH_INVALID" SHALL be returned

    @scenario-type:parameterized @p2-medium @scenario-id:BDD.NN.03.xxxx
    Scenario Outline: Validation accepts valid <input_type>
      Given a valid <input_type> value "<value>"
      When the value is validated
      Then validation SHALL pass

      Examples:
        | input_type | value            |
        | email      | user@example.com |
        | phone      | +1-555-123-4567  |
        | date       | 2026-03-29       |

  _antipatterns:
    - "FAIL: non-executable scenario (vague 'Then it works') — must be specific and testable"
    - "FAIL: missing Given step — every scenario needs preconditions"
    - "FAIL: spaces after colon in tags '@brd: BRD.01' — use '@brd:BRD.01'"
    - "FAIL: compound scenario (tests multiple things) — split into atomic scenarios"
    - "FAIL: running BDD in CI pipeline — QA staging only"
    - "FAIL: >12 scenarios in single file without splitting"

  scenarios:
    success:
      - id: "BDD.NN.03.xxxx"
        name: "[Primary success path]"
        given: "[Precondition from EARS WHEN clause]"
        when: "[Action from EARS trigger]"
        then: "[Outcome from EARS SHALL clause]"
        threshold: "@threshold:PRD.NN.perf.api.p95"

    error:
      - id: "BDD.NN.03.xxxx"
        name: "[Error condition results in expected behavior]"
        given: "[Error precondition from EARS IF clause]"
        when: "[Action that triggers error]"
        then: "[System SHALL NOT / error response]"

    recovery:
      - id: "BDD.NN.03.xxxx"
        name: "[System recovers from failure type]"
        given: "[Failure condition]"
        when: "[Recovery trigger]"
        then: "[System SHALL recover WITHIN threshold]"

    parameterized:
      - id: "BDD.NN.03.xxxx"
        name: "[Parameterized test description]"
        outline: true
        examples:
          headers: ["variable", "input", "expected"]
          rows:
            - ["value1", "input1", "result1"]
            - ["value2", "input2", "result2"]

    optional:
      - id: "BDD.NN.03.xxxx"
        name: "[Feature with default behavior]"
        given: "[Context without optional field]"
        when: "[Action]"
        then: "[System SHALL use default value]"

# =============================================================================
# Section 4: Traceability
# =============================================================================

traceability:
  _guidance: |
    Cumulative Tagging Hierarchy — Layer 4 requires @brd + @prd + @ears tags.
    Upstream: REQUIRED — all BDD must reference EARS, PRD, and BRD elements.
    Downstream: OPTIONAL — only add links to artifacts that exist.

    Gherkin tag format (NO spaces after colon):
      @brd:BRD.NN.07.xxxx
      @prd:PRD.NN.09.xxxx
      @ears:EARS.NN.03.xxxx

    Tags appear on separate lines BEFORE Feature: keyword.

  tags:
    - "@bdd: BDD-NN"

  upstream:
    ears_references:
      - "@ears: EARS.NN.03.xxxx"
    prd_references:
      - "@prd: PRD.NN.09.xxxx"
    brd_references:
      - "@brd: BRD.NN.07.xxxx"

  downstream_expected:
    - type: ADR
      layer: 5
      description: "Architecture decisions informed by BDD scenario coverage"
    - type: TDD
      layer: 6
      description: "Test-driven development guide mapping BDD scenarios to test implementation"

  cross_links:
    depends:
      - "@depends: BDD-NN"
    discoverability:
      - "@discoverability: BDD-NN (short rationale)"

  health_score:
    adr_ready: "[X]%"
    ears_coverage: "[X]%"
    target_score: ">=90/100"

# =============================================================================
# Section 5: Glossary
# =============================================================================

glossary:
  _guidance: "Flat list of project-specific terms. Keep concise."

  terms:
    - term: BDD
      definition: "Behavior-Driven Development"
    - term: Gherkin
      definition: "Structured syntax for executable test scenarios (Given-When-Then)"
    - term: ADR-Ready
      definition: "Score measuring BDD maturity for ADR transition (>=90%)"
    - term: Scenario Outline
      definition: "Parameterized Gherkin scenario with Examples table"
    - term: "[Domain term]"
      definition: "[Definition]"

# =============================================================================
# End of BDD-TEMPLATE.yaml
# =============================================================================
