# TDD-TEMPLATE.yaml — Test-Driven Development Guide
# SDD v3 Layer 6 — Bridges BDD scenarios to test implementation ordering
# Version: 3.0

metadata:
  schema_version: "1.0"
  document_type: "tdd-document"
  layer: 6
  total_sections: 5
  last_updated: "2026-04-28"
  deliverable_type: code
  tags:
    - tdd-document
    - layer-6-artifact
    - shared-architecture

# =============================================================================
# Section 1: Document Control
# =============================================================================
document_control:
  status: Draft
  version: "1.0"
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Author]"
  component: "[Component Name]"
  spec_ready_score: "[Score]/100"

# =============================================================================
# Section 2: Test Pyramid
# =============================================================================
test_pyramid:
  _guidance: |
    Define distribution of test effort across types.
    Percentages are targets, not strict quotas.
  distribution:
    unit: 70
    integration: 20
    e2e: 10
  diagram: |
    flowchart TD
        subgraph "70% Unit Tests"
            UT[Test individual functions/methods in isolation]
        end
        subgraph "20% Integration Tests"
            IT[Test component interactions and contracts]
        end
        subgraph "10% E2E Tests"
            E2E[Test full user workflows from BDD scenarios]
        end
        UT --> IT --> E2E

# =============================================================================
# Section 3: BDD Scenario to Test Mapping
# =============================================================================
test_mapping:
  _guidance: |
    Each BDD scenario maps to one or more test types.
    Test file paths declare where tests will be written.
    TDD ORDER: test files must exist before implementation files
    (enforced by the AI when generating code from this document).
  scenarios:
    - bdd_scenario: "@bdd: BDD.NN.03.xxxx"
      description: "[Scenario name from BDD]"
      tests:
        - type: unit
          file: "tests/unit/test_[module].py"
          function: "test_[scenario_slug]"
          status: pending
        - type: integration
          file: "tests/integration/test_[module].py"
          function: "test_[scenario_slug]_integration"
          status: pending
        - type: e2e
          file: "tests/e2e/test_[workflow].py"
          function: "test_[scenario_slug]_e2e"
          status: pending

  coverage_table:
    columns: [BDD Scenario, Unit, Integration, E2E, Total]
    rows: []

# =============================================================================
# Section 4: Test Thresholds
# =============================================================================
thresholds:
  _guidance: |
    Quality gates per test type. CI must enforce these.
  unit:
    coverage_target: ">=90%"
    pass_criteria:
      - "All unit tests pass"
      - "No skipped tests"
    fail_action: "Block merge; fix or document exception"
  integration:
    coverage_target: ">=85%"
    pass_criteria:
      - "All integration tests pass"
      - "Contract validation passes"
    fail_action: "Block merge"
  e2e:
    coverage_target: ">=75% of happy paths"
    timeout_budget: "<=300s"
    pass_criteria:
      - "All critical path scenarios pass"
      - "No regression failures"
    fail_action: "Block deploy to staging"
  security:
    _note: "Optional — include only if ADR mandates security testing"
    coverage_target: "All authentication/authorization paths"
    pass_criteria:
      - "No OWASP Top 10 vulnerabilities detected"
    fail_action: "Block deploy"

# =============================================================================
# Section 5: TDD Execution Order
# =============================================================================
tdd_order:
  _guidance: |
    Declares the order AI must follow when generating code.
    Test files are generated FIRST, implementation files SECOND.
    This is the enforcement mechanism for test-driven development.
  phases:
    - phase: 1
      name: "Write Tests"
      action: "Generate all test files from Section 3 mappings"
      output: "Test files at declared paths"
    - phase: 2
      name: "Run Tests (Red)"
      action: "Execute tests; confirm they fail (no implementation yet)"
      output: "Test failure report"
    - phase: 3
      name: "Implement"
      action: "Generate implementation files; make tests pass"
      output: "Implementation files"
    - phase: 4
      name: "Verify (Green)"
      action: "Run tests; confirm all pass"
      output: "Test pass report"
    - phase: 5
      name: "Refactor"
      action: "Clean up code; tests remain green"
      output: "Refactored code"

# =============================================================================
# Section 6: Traceability
# =============================================================================
traceability:
  tags:
    - "@tdd: TDD-NN"
  upstream:
    adr_references:
      - "@adr: ADR-NN.03.xxxx"
    bdd_references:
      - "@bdd: BDD.NN.03.xxxx"
  downstream:
    - type: SPEC
      layer: 7
      description: "Technical specification informed by test contracts"
  health_score:
    spec_ready: "[X]%"
    target_score: ">=90/100"
