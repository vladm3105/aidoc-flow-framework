name: Dispatch Issue to AI Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to dispatch'
        required: true
        type: string
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to dispatch'
        required: true
        type: string
      model:
        description: 'Claude model alias (sonnet, haiku, opus)'
        type: string
        default: 'sonnet'
      max-budget-usd:
        description: 'Maximum API spend per implementation in USD'
        type: string
        default: '5.00'
      max-timeout-minutes:
        description: 'Maximum implementation timeout in minutes'
        type: string
        default: '20'
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      ELEVATED_PAT:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GH_HOST: "{GITHUB_HOST}"

concurrency:
  group: dispatch-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch to AI Agent
    runs-on: self-hosted
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_call') ||
      (github.event.label.name == 'ai:ready')

    steps:
      # ============================================================
      # Phase 1: Setup (Steps 1-6)
      # ============================================================

      - name: "Step 1: Verify Claude Code CLI"
        id: verify-cli
        run: |
          if ! command -v claude &> /dev/null; then
            echo "::error::Claude Code CLI not found on runner. Install with: npm install -g @anthropic-ai/claude-code"
            exit 1
          fi
          echo "Claude Code CLI version: $(claude --version 2>/dev/null || echo 'unknown')"

      - name: "Step 2: Get issue number"
        id: issue
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ISSUE_NUM="${{ inputs.issue_number }}"
          elif [ "${{ github.event_name }}" == "workflow_call" ]; then
            ISSUE_NUM="${{ inputs.issue_number }}"
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi

          # Validate issue number is not empty
          if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" == "null" ]; then
            echo "::error::Issue number could not be determined. For workflow_dispatch, provide issue_number input."
            exit 1
          fi

          echo "number=${ISSUE_NUM}" >> $GITHUB_OUTPUT
          echo "Issue number: ${ISSUE_NUM}"

      - name: "Step 3: Pre-flight — check labels"
        id: check-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          LABELS=$(gh issue view "${ISSUE_NUMBER}" --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          # Check for skip label
          if echo "$LABELS" | grep -q "skip-ai-implement"; then
            echo "::notice::Issue has skip-ai-implement label — skipping dispatch"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if already in progress
          if echo "$LABELS" | grep -q "ai:in-progress"; then
            echo "::warning::Issue already has ai:in-progress label — skipping dispatch"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      # ============================================================
      # Phase 2: Pre-flight (Steps 4-6)
      # ============================================================

      - name: "Step 4: Pre-flight — fetch issue context"
        if: steps.check-labels.outputs.skip != 'true'
        id: fetch-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Fetch issue body (guard null with // "")
          gh api "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '{title: .title, body: (.body // ""), labels: [.labels[].name], state: .state}' \
            > /tmp/issue-context.json

          # Fetch issue comments (for additional context)
          gh api "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --jq '[.[] | {user: .user.login, body: (.body // ""), created_at: .created_at}]' \
            > /tmp/issue-comments.json 2>/dev/null || echo '[]' > /tmp/issue-comments.json

          # Extract body for parsing
          python3 -c "
          import json
          ctx = json.load(open('/tmp/issue-context.json'))
          with open('/tmp/issue-body.txt', 'w') as f:
              f.write(ctx.get('body', ''))
          print(f'Issue #${ISSUE_NUMBER}: {ctx[\"title\"]}')" 2>/dev/null

          # Parse Depends on #X references
          DEPS=$(python3 -c "
          import re, json
          body = json.load(open('/tmp/issue-context.json')).get('body', '')
          deps = re.findall(r'[Dd]epends on #(\d+)', body)
          print(' '.join(deps) if deps else '')
          " 2>/dev/null || echo "")
          echo "ISSUE_DEPS=${DEPS}" >> "$GITHUB_ENV"

          # Parse ADR/spec references (e.g., ADR-002, docs/specs/foo.md)
          ADRS=$(python3 -c "
          import re, json
          body = json.load(open('/tmp/issue-context.json')).get('body', '')
          adrs = re.findall(r'ADR-(\d+)', body)
          specs = re.findall(r'(docs/\S+\.md)', body)
          print(' '.join([f'docs/adr/{a.zfill(3)}' for a in adrs] + specs))
          " 2>/dev/null || echo "")
          echo "ISSUE_ADRS=${ADRS}" >> "$GITHUB_ENV"

          # Store issue URL for notifications
          echo "ISSUE_URL=${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUMBER}" >> "$GITHUB_ENV"

      - name: "Step 5: Pre-flight — validate issue"
        if: steps.check-labels.outputs.skip != 'true'
        id: validate-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Check acceptance criteria exist
          HAS_CRITERIA=$(python3 -c "
          import json, re
          body = json.load(open('/tmp/issue-context.json')).get('body', '')
          checks = re.findall(r'- \[[ x]\]', body)
          has_section = bool(re.search(r'##.*[Aa]cceptance\s*[Cc]riteria', body))
          print('true' if (checks or has_section) else 'false')
          " 2>/dev/null || echo "false")

          if [ "$HAS_CRITERIA" != "true" ]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --body "**AI Dispatch skipped**: No acceptance criteria found in issue body.

          Please add an \`## Acceptance Criteria\` section with \`- [ ]\` checkboxes, then re-apply the \`ai:ready\` label.

          Example:
          \`\`\`
          ## Acceptance Criteria
          - [ ] Criterion 1
          - [ ] Criterion 2
          \`\`\`"
            echo "SKIP_DISPATCH=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Check for phase label
          HAS_PHASE=$(python3 -c "
          import json
          labels = json.load(open('/tmp/issue-context.json')).get('labels', [])
          print('true' if any(l.startswith('phase:') for l in labels) else 'false')
          " 2>/dev/null || echo "false")

          if [ "$HAS_PHASE" != "true" ]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --body "**AI Dispatch skipped**: No \`phase:*\` label found. Add a phase label (e.g., \`phase:1\`) and re-apply \`ai:ready\`."
            echo "SKIP_DISPATCH=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Check for needs-iplan label (requires human IPLAN first)
          HAS_NEEDS_IPLAN=$(python3 -c "
          import json
          labels = json.load(open('/tmp/issue-context.json')).get('labels', [])
          print('true' if 'needs-iplan' in labels else 'false')
          " 2>/dev/null || echo "false")

          if [ "$HAS_NEEDS_IPLAN" == "true" ]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --body "**AI Dispatch skipped**: Issue has \`needs-iplan\` label — requires a human-created IPLAN before automated implementation. Create the IPLAN, remove the label, and re-apply \`ai:ready\`."
            echo "SKIP_DISPATCH=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SKIP_DISPATCH=false" >> "$GITHUB_ENV"

      - name: "Step 6: Pre-flight — check dependencies"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -n "$ISSUE_DEPS" ]; then
            OPEN_DEPS=""
            for DEP_NUM in $ISSUE_DEPS; do
              DEP_STATE=$(gh api \
                "/repos/${GITHUB_REPOSITORY}/issues/${DEP_NUM}" \
                --jq '.state' 2>/dev/null || echo "unknown")
              if [ "$DEP_STATE" != "closed" ]; then
                OPEN_DEPS="${OPEN_DEPS} #${DEP_NUM}"
              fi
            done

            if [ -n "$OPEN_DEPS" ]; then
              gh issue comment "${ISSUE_NUMBER}" \
                --body "**AI Dispatch skipped**: Upstream dependencies still open:${OPEN_DEPS}

          Close these issues first, then re-apply \`ai:ready\`."
              echo "SKIP_DISPATCH=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: "Step 6.5: Create AI Agent Memory file"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Extract issue details for memory file
          ISSUE_TITLE=$(python3 -c "
          import json
          ctx = json.load(open('/tmp/issue-context.json'))
          print(ctx.get('title', 'Unknown'))
          " 2>/dev/null || echo "Unknown")

          PHASE=$(python3 -c "
          import json
          labels = json.load(open('/tmp/issue-context.json')).get('labels', [])
          phase = next((l for l in labels if l.startswith('phase:')), 'unassigned')
          print(phase)
          " 2>/dev/null || echo "unassigned")

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Create memory directory structure
          mkdir -p governance/memory/active

          # Generate memory file from template with substitutions
          cat > /tmp/memory-file.md << MEMEOF
          # AI Agent Memory - Issue #${ISSUE_NUMBER}

          ## Session Context

          - **Issue**: #${ISSUE_NUMBER} - ${ISSUE_TITLE}
          - **Phase**: ${PHASE}
          - **Started**: ${TIMESTAMP}
          - **Last Updated**: ${TIMESTAMP}

          ---

          ## Key Decisions

          <!-- AI Agent: Record architectural decisions, approach choices, trade-offs made during implementation -->

          ---

          ## Learnings

          <!-- AI Agent: Record project-specific patterns, conventions, or insights discovered -->

          ---

          ## Blockers & Resolutions

          <!-- AI Agent: Track blockers encountered and how they were resolved -->

          | Blocker | Resolution | Date |
          |---------|------------|------|

          ---

          ## Code Patterns Used

          <!-- AI Agent: Document reusable patterns applied for future reference -->

          ---

          ## Files Modified

          <!-- AI Agent: Track files touched during implementation with change summaries -->

          | File | Change Summary |
          |------|----------------|

          ---

          ## Test Coverage

          <!-- AI Agent: Document tests added/modified and coverage status -->

          ---

          ## Next Session Notes

          <!-- AI Agent: Leave notes for the next session or human reviewer to pick up -->

          ---

          ## Cross-References

          - **IPLAN**: \`governance/plans/IPLAN-${ISSUE_NUMBER}_*.md\`
          - **PR**: (created after implementation)
          - **Related Issues**: $(python3 -c "
          import re, json
          body = json.load(open('/tmp/issue-context.json')).get('body', '')
          refs = re.findall(r'#(\d+)', body)
          print(', '.join(['#' + r for r in refs[:5]]) if refs else 'None')
          " 2>/dev/null || echo "None")
          MEMEOF

          # Save memory file path for later steps
          MEMORY_FILE="governance/memory/active/MEMORY-${ISSUE_NUMBER}.md"
          cp /tmp/memory-file.md "${MEMORY_FILE}" 2>/dev/null || true
          echo "MEMORY_FILE=${MEMORY_FILE}" >> "$GITHUB_ENV"
          echo "Created AI agent memory file: ${MEMORY_FILE}"

      - name: "Step 7: Lock issue for AI Agent"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Remove ai:ready, add ai:in-progress
          gh issue edit "${ISSUE_NUMBER}" \
            --remove-label "ai:ready" \
            --add-label "ai:in-progress"

      - name: "Step 8: Update board → In Progress"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Get the project item ID for this issue (paginated — handles >100 items)
          # NOTE: Update PROJECT_NUMBER and field IDs for your project
          PROJECT_NUMBER="${PROJECT_BOARD_NUMBER:-1}"
          ORG_NAME="${{ github.repository_owner }}"

          ITEM_ID=""
          CURSOR=""
          while true; do
            AFTER_ARG=""
            if [ -n "$CURSOR" ]; then
              AFTER_ARG="-f cursor=${CURSOR}"
            fi
            RESULT=$(gh api graphql -f query='
              query($org: String!, $number: Int!, $cursor: String) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content { ... on Issue { number } }
                      }
                    }
                  }
                }
              }
            ' -f org="${ORG_NAME}" -F number="${PROJECT_NUMBER}" $AFTER_ARG 2>/dev/null || echo "{}")

            FOUND=$(echo "$RESULT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          nodes = data.get('data',{}).get('organization',{}).get('projectV2',{}).get('items',{}).get('nodes',[])
          for n in nodes:
              content = n.get('content') or {}
              if content.get('number') == ${ISSUE_NUMBER}:
                  print(n['id'])
                  break
          " 2>/dev/null || echo "")

            if [ -n "$FOUND" ]; then
              ITEM_ID="$FOUND"
              break
            fi

            HAS_NEXT=$(echo "$RESULT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          pi = data.get('data',{}).get('organization',{}).get('projectV2',{}).get('items',{}).get('pageInfo',{})
          print('true' if pi.get('hasNextPage') else 'false')
          " 2>/dev/null || echo "false")

            if [ "$HAS_NEXT" != "true" ]; then
              break
            fi

            CURSOR=$(echo "$RESULT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          pi = data.get('data',{}).get('organization',{}).get('projectV2',{}).get('items',{}).get('pageInfo',{})
          print(pi.get('endCursor', ''))
          " 2>/dev/null || echo "")
          done

          echo "ITEM_ID=${ITEM_ID}" >> "$GITHUB_ENV"

          if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then
            # NOTE: Update PROJECT_ID, FIELD_ID, and STATUS_VALUE_ID for your project
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $value }
                }) { projectV2Item { id } }
              }
            ' -f project="${PROJECT_ID:-MDk6UHJvamVjdFYyOTg=}" \
              -f item="$ITEM_ID" \
              -f field="${STATUS_FIELD_ID:-MDI2OlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkMTIyMA==}" \
              -f value="${IN_PROGRESS_STATUS_ID:-47fc9ee4}" 2>/dev/null \
              || echo "::warning::Board status update failed (non-fatal)"
          else
            echo "::warning::Issue not found on project board (non-fatal)"
          fi

      - name: "Step 9: Teams notification — dispatch started"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -n "${TEAMS_WEBHOOK:-}" ]; then
            curl -sS -H "Content-Type: application/json" -d '{
              "@type": "MessageCard",
              "themeColor": "0076D7",
              "summary": "Issue Dispatched to AI Agent",
              "sections": [{
                "activityTitle": "Issue #'"${ISSUE_NUMBER}"' Dispatched",
                "facts": [
                  {"name": "Issue", "value": "'"${ISSUE_URL}"'"},
                  {"name": "Status", "value": "AI Agent assigned"}
                ]
              }]
            }' "${TEAMS_WEBHOOK}" || true
          fi

      - name: "Step 10: Checkout main"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Inline checkout (no marketplace actions — GHES compatible)
          rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* 2>/dev/null || true
          git clone "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}" --depth 1 --branch main
          cd "${GITHUB_WORKSPACE}"

          # Remove embedded token from .git/config to prevent Claude CLI access
          git remote set-url origin "https://${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"

          # Use transient credential helper for subsequent git operations
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password='"${GH_TOKEN}"'"; }; f'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Phase 3: Implementation (Steps 11-13)
      # ============================================================

      - name: "Step 11: Create feature branch"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          # Extract slug from issue title: lowercase, replace non-alnum with dash, truncate 40 chars
          ISSUE_SLUG=$(python3 -c "
          import json, re
          title = json.load(open('/tmp/issue-context.json')).get('title', 'impl')
          # Remove [P1-T01] prefix if present
          title = re.sub(r'^\[.*?\]\s*', '', title)
          slug = re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')[:40]
          print(slug)
          " 2>/dev/null || echo "implementation")

          BRANCH_NAME="ai/${ISSUE_NUMBER}-${ISSUE_SLUG}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

          git checkout -b "${BRANCH_NAME}"
          echo "Created branch: ${BRANCH_NAME}"

      # ── Step 11b: Generate IPLAN (Item #2 from ai_governance_automation.md) ──
      - name: "Step 11b: Generate IPLAN from issue"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          # Check if IPLAN already exists for this issue
          EXISTING_IPLAN=$(ls governance/plans/IPLAN-${ISSUE_NUMBER}_*.md 2>/dev/null | head -1 || echo "")

          if [ -n "${EXISTING_IPLAN}" ]; then
            echo "IPLAN already exists: ${EXISTING_IPLAN}"
            echo "IPLAN_PATH=${EXISTING_IPLAN}" >> "$GITHUB_ENV"
          else
            echo "Generating IPLAN from issue #${ISSUE_NUMBER}"

            # Generate IPLAN using the scaffolding script
            if [ -f "governance/scripts/workflows/generate_iplan_from_issue.py" ]; then
              python3 governance/scripts/workflows/generate_iplan_from_issue.py \
                --issue-number "${ISSUE_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --output-dir "governance/plans"

              IPLAN_PATH=$(ls governance/plans/IPLAN-${ISSUE_NUMBER}_*.md 2>/dev/null | head -1 || echo "")
              if [ -n "${IPLAN_PATH}" ]; then
                echo "Generated IPLAN: ${IPLAN_PATH}"
                echo "IPLAN_PATH=${IPLAN_PATH}" >> "$GITHUB_ENV"

                # Stage IPLAN for commit with implementation
                git add "${IPLAN_PATH}"
              fi
            else
              echo "::warning::IPLAN generation script not found. Skipping."
            fi
          fi

      - name: "Step 12: Prepare implement instructions"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          # Extract project name and GitHub host for placeholder substitution
          PROJECT_NAME="${GITHUB_REPOSITORY##*/}"
          GITHUB_HOST=$(echo "${GITHUB_SERVER_URL}" | sed 's|https://||; s|http://||')

          # Copy base instructions with placeholder substitution
          sed "s/{PROJECT_NAME}/${PROJECT_NAME}/g; s/{GITHUB_HOST}/${GITHUB_HOST}/g" \
            governance/AI_PR_Review/IMPLEMENT_INSTRUCTIONS.md > /tmp/implement-instructions.txt

          # Append issue context
          echo "" >> /tmp/implement-instructions.txt
          echo "---" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          echo "## Issue Context" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          echo "### Issue #${ISSUE_NUMBER}" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          cat /tmp/issue-body.txt >> /tmp/implement-instructions.txt

          # Append comments
          if [ -s /tmp/issue-comments.json ] && [ "$(cat /tmp/issue-comments.json)" != "[]" ]; then
            echo "" >> /tmp/implement-instructions.txt
            echo "### Issue Comments" >> /tmp/implement-instructions.txt
            echo "" >> /tmp/implement-instructions.txt
            python3 -c "
          import json
          comments = json.load(open('/tmp/issue-comments.json'))
          for c in comments:
              print(f'**{c[\"user\"]}** ({c[\"created_at\"]}):')
              print(c['body'])
              print()
          " >> /tmp/implement-instructions.txt 2>/dev/null || true
          fi

          # Append ADR/spec content if referenced
          if [ -n "$ISSUE_ADRS" ]; then
            echo "" >> /tmp/implement-instructions.txt
            echo "### Referenced Documents" >> /tmp/implement-instructions.txt
            for ADR_PATH in $ISSUE_ADRS; do
              if [ -f "${ADR_PATH}" ] || [ -f "${ADR_PATH}.md" ]; then
                FILE_PATH="${ADR_PATH}"
                [ -f "${ADR_PATH}.md" ] && FILE_PATH="${ADR_PATH}.md"
                echo "" >> /tmp/implement-instructions.txt
                echo "#### ${FILE_PATH}" >> /tmp/implement-instructions.txt
                echo '```' >> /tmp/implement-instructions.txt
                head -200 "${FILE_PATH}" >> /tmp/implement-instructions.txt 2>/dev/null || true
                echo '```' >> /tmp/implement-instructions.txt
              fi
            done
          fi

          # Append AI Agent Memory context
          echo "" >> /tmp/implement-instructions.txt
          echo "---" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          echo "## AI Agent Memory" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          echo "### Session Memory (update during implementation)" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          echo "Memory file: \`${MEMORY_FILE}\`" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          if [ -f "${MEMORY_FILE}" ]; then
            cat "${MEMORY_FILE}" >> /tmp/implement-instructions.txt
          fi

          # Append global learnings
          if [ -f "governance/memory/GLOBAL_LEARNINGS.md" ]; then
            echo "" >> /tmp/implement-instructions.txt
            echo "### Global Project Learnings" >> /tmp/implement-instructions.txt
            echo "" >> /tmp/implement-instructions.txt
            cat governance/memory/GLOBAL_LEARNINGS.md >> /tmp/implement-instructions.txt
          fi

          # Add memory update instructions
          echo "" >> /tmp/implement-instructions.txt
          echo "---" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          echo "## Memory Update Instructions" >> /tmp/implement-instructions.txt
          echo "" >> /tmp/implement-instructions.txt
          echo "During implementation, update \`${MEMORY_FILE}\` with:" >> /tmp/implement-instructions.txt
          echo "- Key architectural decisions and rationale" >> /tmp/implement-instructions.txt
          echo "- Blockers encountered and how they were resolved" >> /tmp/implement-instructions.txt
          echo "- Code patterns discovered or reused" >> /tmp/implement-instructions.txt
          echo "- Files modified with change summaries" >> /tmp/implement-instructions.txt
          echo "- Notes for next session or human reviewer" >> /tmp/implement-instructions.txt

          echo "Instructions prepared: $(wc -l < /tmp/implement-instructions.txt) lines"

      - name: "Step 13: Run Claude Code implementation"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        timeout-minutes: ${{ inputs.max-timeout-minutes || 20 }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          CLAUDE_MODEL: ${{ inputs.model || 'sonnet' }}
          CLAUDE_BUDGET: ${{ inputs.max-budget-usd || '5.00' }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          claude -p \
            --model "${CLAUDE_MODEL}" \
            --tools "Read,Glob,Grep,Bash,Edit,Write" \
            --dangerously-skip-permissions \
            --no-session-persistence \
            --max-budget-usd "${CLAUDE_BUDGET}" \
            --append-system-prompt "$(cat /tmp/implement-instructions.txt)" \
            "Implement issue #${ISSUE_NUMBER}. Follow the methodology in IMPLEMENT_INSTRUCTIONS.md exactly. Read the issue context appended to this prompt, explore the codebase, implement the changes, and run tests. Do NOT commit, push, or post to GitHub."

      # ============================================================
      # Phase 4: Verification & PR (Steps 14-19)
      # ============================================================

      - name: "Step 14: Verify changes exist"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          if git diff --quiet && git diff --staged --quiet; then
            echo "::warning::Implementation agent completed but no files were modified"

            gh issue comment "${ISSUE_NUMBER}" \
              --body "**AI Implementation produced no changes.**

          The AI agent analyzed the issue but did not modify any files. This may indicate:
          - Acceptance criteria are ambiguous or require architecture decisions
          - The issue scope is too large for automated implementation
          - Required dependencies are not yet available in the codebase

          **Action required**: A human developer should review this issue and implement manually.

          Labeling \`needs-human\` for escalation."

            gh issue edit "${ISSUE_NUMBER}" \
              --remove-label "ai:in-progress" \
              --add-label "needs-human"

            # Teams notification: failure
            if [ -n "${TEAMS_WEBHOOK:-}" ]; then
              curl -sS -H "Content-Type: application/json" -d '{
                "@type": "MessageCard",
                "themeColor": "FF0000",
                "summary": "AI Implementation Failed",
                "sections": [{
                  "activityTitle": "Issue #'"${ISSUE_NUMBER}"' — No Changes Produced",
                  "facts": [
                    {"name": "Issue", "value": "'"${ISSUE_URL}"'"},
                    {"name": "Status", "value": "Escalated to human (needs-human)"}
                  ]
                }]
              }' "${TEAMS_WEBHOOK}" || true
            fi

            echo "SKIP_DISPATCH=true" >> "$GITHUB_ENV"
          fi

      - name: "Step 15: Run tests for affected components"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          # Detect affected directories from changed files
          CHANGED_DIRS=$(git diff --name-only | grep -oP '^[^/]+' | sort -u || echo "")
          TEST_FAILED=false

          # Run Python tests if pyproject.toml or pytest.ini exists
          if [ -f "pyproject.toml" ] || [ -f "pytest.ini" ]; then
            echo "Running Python tests..."
            python -m pytest tests/ -x -q 2>&1 | tee /tmp/test-output.txt || TEST_FAILED=true
          fi

          # Run Node tests if package.json exists
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            echo "Running Node tests..."
            npm test 2>&1 | tee -a /tmp/test-output.txt || TEST_FAILED=true
          fi

          # Run Go tests if go.mod exists
          if [ -f "go.mod" ]; then
            echo "Running Go tests..."
            go test ./... 2>&1 | tee -a /tmp/test-output.txt || TEST_FAILED=true
          fi

          if [ "$TEST_FAILED" == "true" ]; then
            echo "::warning::Tests failed after implementation"

            gh issue comment "${ISSUE_NUMBER}" \
              --body "**AI Implementation completed but tests failed.**

          The AI agent implemented changes but the test suite did not pass. Test output:
          \`\`\`
          $(tail -50 /tmp/test-output.txt 2>/dev/null || echo 'No output captured')
          \`\`\`

          **Action required**: A human developer should review the implementation and fix the failing tests.

          Labeling \`needs-human\` for escalation."

            gh issue edit "${ISSUE_NUMBER}" \
              --remove-label "ai:in-progress" \
              --add-label "needs-human"

            # Teams notification: test failure
            if [ -n "${TEAMS_WEBHOOK:-}" ]; then
              curl -sS -H "Content-Type: application/json" -d '{
                "@type": "MessageCard",
                "themeColor": "FF0000",
                "summary": "AI Implementation Tests Failed",
                "sections": [{
                  "activityTitle": "Issue #'"${ISSUE_NUMBER}"' — Tests Failed",
                  "facts": [
                    {"name": "Issue", "value": "'"${ISSUE_URL}"'"},
                    {"name": "Status", "value": "Escalated to human (needs-human)"}
                  ]
                }]
              }' "${TEAMS_WEBHOOK}" || true
            fi

            echo "SKIP_DISPATCH=true" >> "$GITHUB_ENV"
          fi

      - name: "Step 16: Commit changes"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          git add -A

          # Safety: abort if sensitive files are staged (anchored patterns to avoid false positives)
          if git diff --cached --name-only | grep -qE '(\.env|\.env\.[^/]+)$|\.key$|\.pem$|\.p12$|\.token$|/credentials\.json$|/service.?account.*\.json$|id_rsa|id_ed25519|\.aws/credentials$'; then
            echo "::error::Potentially sensitive files staged — aborting commit"
            git reset HEAD
            echo "SKIP_DISPATCH=true" >> "$GITHUB_ENV"
            echo "SENSITIVE_ABORT=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Infer conventional commit prefix from issue title/labels
          COMMIT_PREFIX=$(python3 -c "
          import json, re
          ctx = json.load(open('/tmp/issue-context.json'))
          title = ctx.get('title', '').lower()
          labels = [l.lower() for l in ctx.get('labels', [])]
          label_str = ' '.join(labels)
          if any(w in title for w in ['fix', 'bug', 'patch', 'hotfix']) or 'bug' in label_str:
              print('fix')
          elif any(w in title for w in ['doc', 'readme']) or 'documentation' in label_str:
              print('docs')
          elif any(w in title for w in ['chore', 'refactor', 'cleanup', 'rename']) or 'chore' in label_str:
              print('chore')
          elif any(w in title for w in ['test', 'coverage']) or 'testing' in label_str:
              print('test')
          elif any(w in title for w in ['ci', 'workflow', 'pipeline']) or 'ci' in label_str:
              print('ci')
          else:
              print('feat')
          " 2>/dev/null || echo "feat")
          echo "COMMIT_PREFIX=${COMMIT_PREFIX}" >> "$GITHUB_ENV"

          # Build commit message
          TITLE_SHORT=$(python3 -c "
          import json, re
          title = json.load(open('/tmp/issue-context.json')).get('title', 'implement issue')
          title = re.sub(r'^\[.*?\]\s*', '', title)
          print(title[:72])
          " 2>/dev/null || echo "implement issue #${ISSUE_NUMBER}")

          COMMIT_MSG=$(printf '%s\n\nCloses #%s\n\nAutomated implementation by AI agent (Claude).\n\nCo-Authored-By: Claude <noreply@anthropic.com>' \
            "${COMMIT_PREFIX}: ${TITLE_SHORT}" "${ISSUE_NUMBER}")
          git commit -m "$COMMIT_MSG"

      # ── Step 16b: Handle sensitive file abort ───────────────────────
      - name: "Step 16b: Handle sensitive file abort"
        if: env.SENSITIVE_ABORT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "**AI Implementation aborted**: Potentially sensitive files detected in staged changes (.env, credentials, keys). A human must review before committing.

          Labeling \`needs-human\` for escalation."

          gh issue edit "${ISSUE_NUMBER}" \
            --remove-label "ai:in-progress" \
            --add-label "needs-human"

          # Teams notification: sensitive files
          if [ -n "${TEAMS_WEBHOOK:-}" ]; then
            curl -sS -H "Content-Type: application/json" -d '{
              "@type": "MessageCard",
              "themeColor": "FF0000",
              "summary": "AI Implementation Aborted — Sensitive Files",
              "sections": [{
                "activityTitle": "Issue #'"${ISSUE_NUMBER}"' — Sensitive Files Detected",
                "facts": [
                  {"name": "Issue", "value": "'"${ISSUE_URL}"'"},
                  {"name": "Status", "value": "Escalated to human (needs-human)"}
                ]
              }]
            }' "${TEAMS_WEBHOOK}" || true
          fi

      - name: "Step 17: Push and create PR"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true'
        env:
          ELEVATED_PAT: ${{ secrets.ELEVATED_PAT }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          cd "${GITHUB_WORKSPACE}"

          # Use ELEVATED_PAT so the push + PR triggers ai-review.yml
          git remote set-url origin "https://x-access-token:${ELEVATED_PAT}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git push -u origin HEAD

          # Extract acceptance criteria for PR body
          AC_CHECKLIST=$(python3 -c "
          import json, re
          body = json.load(open('/tmp/issue-context.json')).get('body', '')
          checks = re.findall(r'(- \[[ x]\] .+)', body)
          print('\n'.join(checks) if checks else '- [ ] See linked issue for acceptance criteria')
          " 2>/dev/null || echo "- [ ] See linked issue for acceptance criteria")

          ISSUE_TITLE_SHORT=$(python3 -c "
          import json, re
          title = json.load(open('/tmp/issue-context.json')).get('title', 'implement issue')
          title = re.sub(r'^\[.*?\]\s*', '', title)
          print(title[:72])
          " 2>/dev/null || echo "implement issue")

          # Create PR (reviewers are optional — may fail if users not in repo)
          gh pr create \
            --title "feat: ${ISSUE_TITLE_SHORT}" \
            --body "$(cat <<PREOF
          ## Summary
          Automated implementation for issue #${ISSUE_NUMBER}.

          ## Linked Issue
          Closes #${ISSUE_NUMBER}

          ## Type of Change
          - [x] New feature

          ## Changes Made
          See commit diff for full changes.

          ## Acceptance Criteria (from issue)
          ${AC_CHECKLIST}

          ## Pre-Merge Checks
          - [ ] CI passes (lint, unit tests, security scan)
          - [ ] Coverage threshold met (≥80% unit)

          ## Checklist
          - [x] Self-reviewed code (AI agent verification phase)
          - [x] No secrets or credentials exposed (sensitive file guard)
          - [ ] Cost impact considered (if applicable)

          ---
          Automated by AI Agent (Claude) | $(TZ="America/New_York" date '+%Y-%m-%d %H:%M EST' 2>/dev/null || date '+%Y-%m-%d %H:%M')
          PREOF
          )" || true

          # Get PR info
          PR_URL=$(gh pr view --json url --jq '.url' 2>/dev/null || echo "")
          PR_NUMBER=$(gh pr view --json number --jq '.number' 2>/dev/null || echo "")
          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"
          echo "PR_NUMBER_CREATED=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "Created PR #${PR_NUMBER}: ${PR_URL}"

      # ── Step 18a: Log acceptance criteria status ──────────────────────
      - name: "Step 18a: Log acceptance criteria status"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true' && env.PR_NUMBER_CREATED != ''
        run: |
          # Do NOT update the issue body here — formal verification and
          # check-off happens in ai-review.yml after actual code review.
          # This step only logs criteria count for the workflow summary.
          CRITERIA_COUNT=$(python3 -c "
          import json, re
          body = json.load(open('/tmp/issue-context.json')).get('body', '')
          criteria = re.findall(r'- \[ \] (.+)', body)
          print(len(criteria))
          " 2>/dev/null || echo "0")
          echo "Acceptance criteria pending verification: ${CRITERIA_COUNT}"
          echo "::notice::Criteria check-off deferred to ai-review.yml after formal review"

      - name: "Step 18b-d: Labels, board, issue comment"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true' && env.PR_NUMBER_CREATED != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # 18b: Label transition ai:in-progress → ai:review-requested
          gh issue edit "${ISSUE_NUMBER}" \
            --remove-label "ai:in-progress" \
            --add-label "ai:review-requested"

          # 18c: Board status → In Review (safety net — issue-label-sync.yml may also fire)
          if [ -n "${ITEM_ID}" ] && [ "${ITEM_ID}" != "null" ]; then
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $value }
                }) { projectV2Item { id } }
              }
            ' -f project="${PROJECT_ID:-MDk6UHJvamVjdFYyOTg=}" \
              -f item="$ITEM_ID" \
              -f field="${STATUS_FIELD_ID:-MDI2OlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkMTIyMA==}" \
              -f value="${IN_REVIEW_STATUS_ID:-de81af01}" 2>/dev/null \
              || echo "::warning::Board status update to In Review failed (non-fatal)"
          fi

          # 18d: Post PR link as comment on issue
          gh issue comment "${ISSUE_NUMBER}" \
            --body "**PR created**: #${PR_NUMBER_CREATED} — ${PR_URL}
          **Branch**: \`${BRANCH_NAME}\`
          **Date**: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M EST' 2>/dev/null || date '+%Y-%m-%d %H:%M')
          **Status**: Awaiting AI review (\`ai-review.yml\` triggered automatically)"

      - name: "Step 19: Teams notification — PR created"
        if: steps.check-labels.outputs.skip != 'true' && env.SKIP_DISPATCH != 'true' && env.PR_NUMBER_CREATED != ''
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -n "${TEAMS_WEBHOOK:-}" ]; then
            curl -sS -H "Content-Type: application/json" -d '{
              "@type": "MessageCard",
              "themeColor": "00CC00",
              "summary": "PR Created by AI Agent",
              "sections": [{
                "activityTitle": "Issue #'"${ISSUE_NUMBER}"' — PR Created",
                "facts": [
                  {"name": "Issue", "value": "'"${ISSUE_URL}"'"},
                  {"name": "PR", "value": "'"${PR_URL}"'"},
                  {"name": "Status", "value": "PR created, awaiting review"}
                ]
              }]
            }' "${TEAMS_WEBHOOK}" || true
          fi

      # ============================================================
      # Phase 5: Cleanup (Step 20)
      # ============================================================

      - name: "Step 20: Cleanup"
        if: always()
        run: |
          rm -f /tmp/implement-instructions.txt \
               /tmp/issue-context.json \
               /tmp/issue-body.txt \
               /tmp/issue-comments.json \
               /tmp/updated-issue-body.txt \
               /tmp/test-output.txt \
               /tmp/dep-*.json \
               /tmp/adr-*.txt 2>/dev/null || true
