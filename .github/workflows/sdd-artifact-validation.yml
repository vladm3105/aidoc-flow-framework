# SDD Artifact Validation Workflow
# Validates SDD artifacts (BRD, PRD, SPEC, TASKS, etc.) and updates traceability matrix.
#
# Trigger: Push/PR changes to docs/ directory
# No marketplace actions per GOVERNANCE_RULES.md Section 2a

name: SDD Artifact Validation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.yaml'
      - 'docs/**/*.feature'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.yaml'
      - 'docs/**/*.feature'
  schedule:
    # Weekly drift check - Sundays at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* 2>/dev/null || true
          CLONE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}" --depth 1 --branch "${CLONE_BRANCH}"

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PR, compare against base branch
            git fetch origin ${{ github.base_ref }} --depth 1
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^docs/.*\.(md|yaml|feature)$' | tr '\n' ' ' || true)
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Full validation on schedule
            FILES=$(find docs -name "*.md" -o -name "*.yaml" -o -name "*.feature" 2>/dev/null | tr '\n' ' ' || true)
          else
            # For push, compare against previous commit
            FILES=$(git diff --name-only HEAD~1 2>/dev/null | grep -E '^docs/.*\.(md|yaml|feature)$' | tr '\n' ' ' || true)
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Setup Python
        run: |
          python3 --version
          pip3 install --quiet pyyaml

      - name: Validate SDD artifacts
        if: steps.changed.outputs.files != ''
        run: |
          echo "=== Validating SDD Artifacts ==="

          # Check each changed file for required structure
          for file in ${{ steps.changed.outputs.files }}; do
            if [ -f "$file" ]; then
              echo "Validating: $file"

              # Extract layer from path (e.g., docs/01_BRD/ -> BRD)
              layer=$(echo "$file" | sed -n 's|docs/[0-9]*_\([A-Z]*\)/.*|\1|p')

              case "$layer" in
                BRD|PRD)
                  # Check for required sections
                  if ! grep -q "## " "$file"; then
                    echo "WARNING: $file missing required sections"
                  fi
                  ;;
                SPEC|TASKS)
                  # YAML validation
                  if [[ "$file" == *.yaml ]]; then
                    python3 -c "import yaml; yaml.safe_load(open('$file'))" 2>/dev/null || \
                      echo "ERROR: $file is not valid YAML"
                  fi
                  ;;
                BDD)
                  # Gherkin validation
                  if [[ "$file" == *.feature ]]; then
                    if ! grep -q "Feature:" "$file"; then
                      echo "ERROR: $file missing Feature keyword"
                    fi
                  fi
                  ;;
              esac
            fi
          done

          echo "=== Validation Complete ==="

      - name: Check traceability tags
        if: steps.changed.outputs.files != ''
        run: |
          echo "=== Checking Traceability Tags ==="

          for file in ${{ steps.changed.outputs.files }}; do
            if [ -f "$file" ]; then
              # Check for @tags in markdown files
              if [[ "$file" == *.md ]]; then
                tags=$(grep -oE '@(brd|prd|ears|adr|sys|req|spec|tasks|tspec):' "$file" | sort -u | tr '\n' ' ' || true)
                if [ -n "$tags" ]; then
                  echo "$file: $tags"
                fi
              fi
            fi
          done

          echo "=== Traceability Check Complete ==="

      - name: Update traceability matrix (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "=== Updating Traceability Matrix ==="

          # Create or update matrix file
          MATRIX_FILE="docs/traceability_matrix.md"

          echo "# Traceability Matrix" > "$MATRIX_FILE"
          echo "" >> "$MATRIX_FILE"
          echo "Auto-generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$MATRIX_FILE"
          echo "" >> "$MATRIX_FILE"
          echo "| Artifact | Upstream References |" >> "$MATRIX_FILE"
          echo "|----------|---------------------|" >> "$MATRIX_FILE"

          # Scan all SDD artifacts for traceability
          find docs -name "*.md" -o -name "*.yaml" 2>/dev/null | sort | while read -r file; do
            refs=$(grep -oE '@(brd|prd|ears|adr|sys|req|spec|tasks):[A-Z0-9.-]+' "$file" 2>/dev/null | tr '\n' ', ' | sed 's/,$//' || true)
            if [ -n "$refs" ]; then
              echo "| $file | $refs |" >> "$MATRIX_FILE"
            fi
          done

          echo "" >> "$MATRIX_FILE"
          echo "---" >> "$MATRIX_FILE"
          echo "*This file is auto-updated by sdd-artifact-validation.yml*" >> "$MATRIX_FILE"

          # Commit if changes exist
          if git diff --quiet "$MATRIX_FILE" 2>/dev/null; then
            echo "No matrix changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MATRIX_FILE"
            git commit -m "chore: Update traceability matrix [skip ci]" || true
            git push || echo "Push failed - may need permissions"
          fi

          echo "=== Matrix Update Complete ==="
