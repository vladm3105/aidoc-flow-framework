name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (from dev registry)'
        required: true
        type: string
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  issues: write

env:
  SERVICE_NAME: "{PROJECT_PREFIX}-{SERVICE_NAME}"
  GCP_PROJECT_DEV: ${{ secrets.GCP_PROJECT_DEV }}
  GCP_PROJECT_STAGING: ${{ secrets.GCP_PROJECT_STAGING }}
  REGION: "{GCP_REGION}"
  GH_HOST: "{GITHUB_HOST}"

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone "https://x-access-token:${{ secrets.ELEVATED_PAT }}@{GITHUB_HOST}/${{ github.repository }}.git" . --depth 1

      - name: Update staging status to deploying
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/workflows/update_staging_tracking.py \
            --tracking-file governance/cicd/phase-deployments.json \
            --status deploying \
            --image-tag ${{ inputs.image_tag }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add governance/cicd/phase-deployments.json
          git commit -m "chore: staging deploying

          Co-Authored-By: {AI_TOOL_NAME} <{AI_TOOL_EMAIL}>"
          git push origin main

      - name: Authenticate to GCP (Dev - pull image)
        run: |
          echo '${{ secrets.WIF_CREDENTIALS_DEV }}' > /tmp/creds-dev.json
          gcloud auth login --cred-file=/tmp/creds-dev.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_DEV }}
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Copy image from dev to staging registry
        run: |
          DEV_IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_DEV}/{PROJECT_PREFIX}/${SERVICE_NAME}:${{ inputs.image_tag }}"
          STAGING_IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_STAGING}/{PROJECT_PREFIX}/${SERVICE_NAME}:${{ inputs.image_tag }}"
          echo "Pulling image from dev: ${DEV_IMAGE}"
          docker pull ${DEV_IMAGE}
          docker tag ${DEV_IMAGE} ${STAGING_IMAGE}
          echo '${{ secrets.WIF_CREDENTIALS_STAGING }}' > /tmp/creds-staging.json
          gcloud auth login --cred-file=/tmp/creds-staging.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_STAGING }}
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          echo "Pushing image to staging: ${STAGING_IMAGE}"
          docker push ${STAGING_IMAGE}

      - name: Deploy to Cloud Run (Staging)
        run: |
          STAGING_IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_STAGING}/{PROJECT_PREFIX}/${SERVICE_NAME}:${{ inputs.image_tag }}"
          gcloud run deploy ${SERVICE_NAME} \
            --image ${STAGING_IMAGE} \
            --region ${REGION} \
            --min-instances 1 \
            --max-instances 5 \
            --memory 1Gi \
            --cpu 1 \
            --set-env-vars="ENVIRONMENT=staging"

      - name: Configure revision retention
        run: |
          gcloud run revisions list \
            --service ${SERVICE_NAME} \
            --region ${REGION} \
            --format="value(name)" \
            --sort-by="~metadata.creationTimestamp" | tail -n +11 | while read REVISION; do
              echo "Deleting old revision: $REVISION"
              gcloud run revisions delete $REVISION --region ${REGION} --quiet || true
            done

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${SERVICE_NAME} --region ${REGION} --format 'value(status.url)')
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Staging URL: ${URL}"

      - name: Health check with retry
        run: |
          for i in 1 2 3 4 5; do
            sleep 15
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.url.outputs.url }}/health)
            if [ "$HTTP_CODE" == "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed with HTTP $HTTP_CODE"
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt --quiet || true

      - name: Run full acceptance tests (all phases)
        id: tests
        run: |
          set +e
          pytest tests/acceptance \
            --base-url=${{ steps.url.outputs.url }} \
            -n auto \
            --timeout=300 \
            -v --tb=short \
            --junitxml=test-results.xml 2>&1 || TEST_EXIT_CODE=$?
          set -e
          TEST_EXIT_CODE=${TEST_EXIT_CODE:-0}
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "test_failed=true" >> $GITHUB_OUTPUT
          else
            echo "test_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update staging tracking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.tests.outputs.test_failed }}" == "true" ]; then
            STATUS="failed"
            TEST_RESULT="failed"
          else
            STATUS="deployed"
            TEST_RESULT="passed"
          fi
          python3 scripts/workflows/update_staging_tracking.py \
            --tracking-file governance/cicd/phase-deployments.json \
            --status ${STATUS} \
            --url ${{ steps.url.outputs.url }} \
            --test-results ${TEST_RESULT} \
            --test-report-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull origin main --rebase || true
          git add governance/cicd/phase-deployments.json
          git commit -m "chore: staging ${STATUS}

          Co-Authored-By: {AI_TOOL_NAME} <{AI_TOOL_EMAIL}>"
          git push origin main

      - name: Close all deployment issues
        if: steps.tests.outputs.test_failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_URL: ${{ steps.url.outputs.url }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          DEPLOY_ISSUES=$(GH_HOST={GITHUB_HOST} gh issue list \
            --label "ai:deployment" \
            --state open \
            --json number --jq '.[].number' 2>/dev/null || echo "")
          CLOSED_COUNT=0
          for ISSUE in $DEPLOY_ISSUES; do
            echo "Closing deployment issue #${ISSUE}"
            printf "## Deployed to Staging\n\n**Staging URL**: %s\n**Deployment Run**: %s\n**Image**: %s\n\nAll phases deployed to staging. Full acceptance tests passed.\nQA testing complete." \
              "${STAGING_URL}" "${RUN_URL}" "${IMAGE_TAG}" > /tmp/deploy_comment.md
            GH_HOST={GITHUB_HOST} gh issue close ${ISSUE} \
              --reason completed \
              --comment "$(cat /tmp/deploy_comment.md)" || true
            CLOSED_COUNT=$((CLOSED_COUNT + 1))
          done
          echo "::notice::Closed ${CLOSED_COUNT} deployment issues"

      - name: Create issues for test failures
        if: steps.tests.outputs.test_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/workflows/create_test_failure_issues.py \
            --junit-xml test-results.xml \
            --phase 8 \
            --labels "regression,ai:ready"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/creds-dev.json /tmp/creds-staging.json

      - name: Post summary to Teams
        if: always()
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          if [ "${{ steps.tests.outputs.test_failed }}" == "true" ]; then
            STATUS="FAILED - Regression issues created"
            COLOR="attention"
          else
            STATUS="PASSED - All phases deployed"
            COLOR="good"
          fi
          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "themeColor": "'${COLOR}'",
            "summary": "Staging Deployment",
            "sections": [{
              "activityTitle": "Staging Deployment Complete",
              "facts": [
                {"name": "Status", "value": "'${STATUS}'"},
                {"name": "URL", "value": "'${{ steps.url.outputs.url }}'"},
                {"name": "Image", "value": "'${{ inputs.image_tag }}'"},
                {"name": "Test Report", "value": "'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'"}
              ]
            }]
          }' ${TEAMS_WEBHOOK} || true

      - name: Fail workflow if tests failed
        if: steps.tests.outputs.test_failed == 'true'
        run: exit 1
