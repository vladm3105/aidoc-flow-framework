name: Auto Add to Project

# Auto-adds issues/PRs to project board and applies phase labels
# based on issue title patterns like [P1-...] or [P2-...].
#
# References:
#   - work_plans/ai_governance_automation.md (Item #12)

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  repository-projects: write

env:
  PROJECT_NUMBER: 31
  ORG: "{GITHUB_ORG}"

jobs:
  add-to-project:
    name: Add to Project Board
    runs-on: self-hosted
    steps:
      # Item #12: Auto-add phase labels based on issue title
      - name: Extract phase and apply label
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: "{GITHUB_HOST}"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Extract phase from title: [P1-...], [P2-...], etc.
          PHASE=$(echo "${ISSUE_TITLE}" | grep -oE '\[P([0-9]+)' | head -1 | grep -oE '[0-9]+' || echo "")

          if [ -z "${PHASE}" ]; then
            # Try alternative patterns: "Phase 1", "phase:1"
            PHASE=$(echo "${ISSUE_TITLE}" | grep -oiE 'phase\s*:?\s*([0-9]+)' | head -1 | grep -oE '[0-9]+' || echo "")
          fi

          if [ -z "${PHASE}" ]; then
            echo "No phase detected in issue title. Skipping phase label."
          else
            PHASE_LABEL="phase:${PHASE}"
            echo "Detected phase: ${PHASE}, checking label: ${PHASE_LABEL}"

            # Check if phase label already exists
            EXISTING_LABELS=$(gh issue view "${ISSUE_NUMBER}" --json labels --jq '.labels[].name' 2>/dev/null || echo "")

            if echo "${EXISTING_LABELS}" | grep -q "^phase:"; then
              echo "Phase label already exists. Skipping."
            else
              # Ensure label exists (create if needed)
              gh label create "${PHASE_LABEL}" \
                --color "0e8a16" \
                --description "Phase ${PHASE} issue" \
                --force 2>/dev/null || true

              # Apply label
              gh issue edit "${ISSUE_NUMBER}" --add-label "${PHASE_LABEL}"
              echo "Applied label: ${PHASE_LABEL}"
            fi
          fi

      - name: Add item and set status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_HOST: "{GITHUB_HOST}"
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          # Determine content node ID and target status
          if [ "$EVENT_NAME" = "issues" ]; then
            CONTENT_ID="$ISSUE_NODE_ID"
            TARGET_STATUS="Todo"
            ITEM_TYPE="Issue #${ISSUE_NUMBER}"
          else
            CONTENT_ID="$PR_NODE_ID"
            TARGET_STATUS="In Review"
            ITEM_TYPE="PR #${PR_NUMBER}"
          fi

          # Get project ID
          PROJECT_ID=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org="${ORG}" -F number=${PROJECT_NUMBER} \
            --jq '.data.organization.projectV2.id')

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "ERROR: Could not find project #${PROJECT_NUMBER}"
            exit 1
          fi

          # Add item to project (replaces actions/add-to-project@v1.0.2)
          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {
                projectId: $project
                contentId: $content
              }) {
                item {
                  id
                }
              }
            }' -f project="$PROJECT_ID" -f content="$CONTENT_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "ERROR: Failed to add ${ITEM_TYPE} to project"
            exit 1
          fi
          echo "Added ${ITEM_TYPE} to project (item: $ITEM_ID)"

          # Get Status field ID and target option ID
          FIELD_DATA=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options {
                        id
                        name
                      }
                    }
                  }
                }
              }
            }' -f org="${ORG}" -F number=${PROJECT_NUMBER})

          STATUS_FIELD_ID=$(echo "$FIELD_DATA" | jq -r '.data.organization.projectV2.field.id')
          OPTION_ID=$(echo "$FIELD_DATA" | jq -r --arg status "$TARGET_STATUS" \
            '.data.organization.projectV2.field.options[] | select(.name == $status) | .id')

          if [ -z "$STATUS_FIELD_ID" ] || [ -z "$OPTION_ID" ] || [ "$OPTION_ID" = "null" ]; then
            echo "Warning: Could not find status option '${TARGET_STATUS}'"
            exit 0
          fi

          # Set status
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: {singleSelectOptionId: $value}
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" -f value="$OPTION_ID" > /dev/null

          echo "Set ${ITEM_TYPE} status to: ${TARGET_STATUS}"

          # Set Environment field (mandatory for all items)
          ENV_FIELD_ID="MDI2OlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkMTI3OQ=="
          ENV_DEVELOPMENT_ID="37fcaf5f"
          TARGET_ENV_ID="$ENV_DEVELOPMENT_ID"
          TARGET_ENV_NAME="Development"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # For PRs: inherit Environment from linked issue
            # Extract linked issue number from PR body (Closes #X, Fixes #Y, Resolves #Z)
            LINKED_ISSUE=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves|close|fix|resolve)\s*#[0-9]+' | head -1 | grep -oE '[0-9]+')

            if [ -n "$LINKED_ISSUE" ]; then
              echo "Found linked issue: #${LINKED_ISSUE}"

              # Get the linked issue's node_id (use different var name to avoid conflict with env var)
              LINKED_NODE_ID=$(gh api "/repos/${REPO}/issues/${LINKED_ISSUE}" --jq '.node_id' 2>/dev/null || echo "")

              if [ -n "$LINKED_NODE_ID" ] && [ "$LINKED_NODE_ID" != "null" ]; then
                # Find the issue's project item and get its Environment value
                ISSUE_ENV=$(gh api graphql -f query='
                  query($org: String!, $number: Int!, $nodeId: String!) {
                    organization(login: $org) {
                      projectV2(number: $number) {
                        items(first: 100) {
                          nodes {
                            content { ... on Issue { id } }
                            fieldValueByName(name: "Environment") {
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                optionId
                                name
                              }
                            }
                          }
                        }
                      }
                    }
                  }' -f org="${ORG}" -F number=${PROJECT_NUMBER} -f nodeId="$LINKED_NODE_ID" \
                  | jq -r --arg nid "$LINKED_NODE_ID" \
                    '.data.organization.projectV2.items.nodes[] | select(.content.id == $nid) | .fieldValueByName | "\(.optionId):\(.name)"' 2>/dev/null || echo "")

                if [ -n "$ISSUE_ENV" ] && [ "$ISSUE_ENV" != ":" ] && [ "$ISSUE_ENV" != "null:null" ]; then
                  TARGET_ENV_ID=$(echo "$ISSUE_ENV" | cut -d: -f1)
                  TARGET_ENV_NAME=$(echo "$ISSUE_ENV" | cut -d: -f2)
                  echo "Inheriting environment from issue #${LINKED_ISSUE}: ${TARGET_ENV_NAME}"
                else
                  echo "Linked issue #${LINKED_ISSUE} has no Environment set, using default: Development"
                fi
              fi
            else
              echo "No linked issue found in PR body, using default: Development"
            fi
          fi

          # Set Environment field
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: {singleSelectOptionId: $value}
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$ENV_FIELD_ID" -f value="$TARGET_ENV_ID" > /dev/null

          echo "Set ${ITEM_TYPE} environment to: ${TARGET_ENV_NAME}"
