name: pre-commit

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint / format / security hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The local 'conformance' hook runs the suite via system python.
      - name: Install pre-commit + conformance deps
        run: pip install pre-commit -r tests/conformance/requirements.txt

      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency audit (pip-audit)
        run: pre-commit run --all-files --hook-stage manual pip-audit
