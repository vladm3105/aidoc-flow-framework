# Caller template for aidoc-flow-ci's reusable codeql workflow.
#
# Triggers per GitHub's recommended pattern: push + PR to default
# branch + weekly cron + workflow_dispatch. Cron is staggered (Mon
# 14:20 UTC = ~10:20 EST / 7:20 PST) to avoid contention with other
# weekly jobs.
#
# Adjust the `languages` input to match your repo. Default ["actions"]
# scans the workflows themselves — every consumer benefits. Add other
# languages as appropriate (e.g., '["actions","python","javascript-typescript"]').

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/codeql.yml@ci/v3.0.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # `python` carried over from this repo's pre-canon local codeql.yml (build-mode
      # none — Python is interpreted); `actions` is canon's default and scans the
      # workflows themselves. This input is why the manifest marks codeql
      # safe_to_replace:false — `--update` must never overwrite it.
      languages: '["actions","python"]'
      # No runner_labels override: this is a PUBLIC repo, so CI stays GitHub-hosted
      # per CLAUDE.md's runner split (free minutes; a fork PR must not reach the host).
      # PRIVATE consumers override:
      # runner_labels: '["self-hosted", "ci-runner", "single-use"]'
