# CI runs on GitHub-hosted runners — this is a PUBLIC repo. Do NOT switch to self-hosted:
# no cost benefit (public-repo Actions minutes are free) + a fork PR could run code on the
# host. The ephemeral self-hosted runner is for PRIVATE repos only. Ref: aidoc-flow-operations IPLAN-0012.
name: Claude Code plugin

on:
  push:
    paths:
      - 'platforms/claude-code-plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'platforms/claude-code-plugin/**'
      - '.github/workflows/plugin.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Plugin smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Validate plugin manifest is JSON
        run: python -m json.tool < platforms/claude-code-plugin/.claude-plugin/plugin.json

      - name: Coupling sweep — no Hermes references in plugin runtime
        run: |
          if grep -rEln 'ucx_flow|UCX_FLOW|ucx_hermes' \
               platforms/claude-code-plugin/.claude-plugin \
               platforms/claude-code-plugin/commands \
               platforms/claude-code-plugin/agents 2>/dev/null; then
            echo "::error::Found forbidden Hermes-engine tokens in plugin runtime"
            exit 1
          fi
          echo "ok: no forbidden tokens"

      - name: Plugin structural sanity
        run: |
          skills=$(find platforms/claude-code-plugin/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          if [ "$skills" -ne 52 ]; then
            echo "::error::Plugin skill count $skills does not match canonical set of 52 (50 active + 2 deprecated stubs)"
            exit 1
          fi
          echo "ok: $skills skills"
