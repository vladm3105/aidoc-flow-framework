# AI PR Review Workflow — Claude Code on GitHub-hosted Runner
#
# Uses Claude Code CLI in non-interactive mode (-p) to review PR diffs
# and post formal GitHub reviews with inline comments.
#
# Triggers automatically on PRs in this repo.
#
# Prerequisites:
#   - ANTHROPIC_API_KEY secret set on the repo (or org-level)
#
# References:
#   - Docs: governance/AI_PR_Review/README.md

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (for manual trigger)"
        required: true
        type: number
      model:
        description: "Claude model alias"
        type: choice
        options:
          - sonnet
          - haiku
          - opus
        default: "sonnet"

  workflow_call:
    inputs:
      model:
        description: "Claude model alias (sonnet, haiku, opus)"
        type: string
        default: "sonnet"
      max-budget-usd:
        description: "Maximum API spend per review in USD"
        type: string
        default: "1.00"
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI Code Review (Claude)
    runs-on: ubuntu-latest
    if: >-
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')

    concurrency:
      group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true

    steps:
      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Determine PR number
        id: pr
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch PR diff and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api -H "Accept: application/vnd.github.diff" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > /tmp/pr-diff.txt

          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{title: .title, body: .body, user: .user.login, base: .base.ref, head: .head.ref, changed_files: .changed_files, additions: .additions, deletions: .deletions}' \
            > /tmp/pr-metadata.json

          DIFF_SIZE=$(wc -c < /tmp/pr-diff.txt)
          CHANGED_FILES=$(jq -r .changed_files /tmp/pr-metadata.json)
          echo "PR #${PR_NUMBER}: ${DIFF_SIZE} bytes diff, ${CHANGED_FILES} files changed"

          if [ "$DIFF_SIZE" -lt 10 ]; then
            echo "Empty or trivial diff — skipping AI review"
            echo "SKIP_REVIEW=true" >> "$GITHUB_ENV"
          fi

      - name: Write review instructions
        if: env.SKIP_REVIEW != 'true'
        run: |
          cat > /tmp/review-instructions.txt << 'INSTRUCTIONS_EOF'
          You are an automated CI code reviewer for the docs_flow_framework project.

          ## Task
          1. Read the PR diff at /tmp/pr-diff.txt
          2. Read PR metadata at /tmp/pr-metadata.json
          3. Analyze code changes for bugs, security issues, performance problems, and error handling gaps
          4. You may read source files in the current directory for additional context beyond the diff
          5. Post a formal GitHub review with inline comments using the gh API

          ## Focus Areas
          - Bugs, logic errors, off-by-one, null/None handling
          - Security: injection, credential leaks, auth bypass, OWASP Top 10
          - Performance: N+1 queries, unbounded loops, memory leaks
          - Error handling: bare except, swallowed exceptions, missing retries
          - Type safety and API contract violations
          - YAML/workflow syntax errors
          - Shell script issues (unquoted variables, missing error handling)

          ## Skip (Do NOT Flag)
          - Style or formatting issues (linters handle this)
          - Missing docstrings or comments
          - Import ordering, line length
          - Non-code file changes: *.md, *.txt, *.json (unless security-relevant)
          - Changes in docs/, LICENSE, .gitignore, .gitmodules

          ## Severity Tags (use in comment body)
          - [Critical]: Security vulnerabilities, data loss, crashes, auth bypass
          - [Medium]: Bugs, incorrect behavior, missing error handling, resource leaks
          - [Low]: Minor improvements, best practices, potential edge cases

          ## Review Event Rules
          - APPROVE: No Critical or Medium findings (zero bugs/security issues)
          - COMMENT: Low-severity informational findings only (not blocking)
          - REQUEST_CHANGES: Any Critical or Medium finding affecting correctness or security

          ## How to Post the Review
          Create a JSON review payload and post it via gh api. The env vars PR_NUMBER, COMMIT_SHA,
          REPO_FULL, and GH_TOKEN are available in your shell environment.

          Step 1 — Build the payload file /tmp/review-payload.json:
          {
            "commit_id": "<value of COMMIT_SHA env var>",
            "event": "APPROVE" or "COMMENT" or "REQUEST_CHANGES",
            "body": "**AI Review (Claude)**\n\n<one-paragraph summary of findings>",
            "comments": [
              {
                "path": "relative/path/to/file.py",
                "line": 42,
                "body": "[Medium] Description of the issue and suggested fix."
              }
            ]
          }

          Step 2 — Post:
            gh api "/repos/${REPO_FULL}/pulls/${PR_NUMBER}/reviews" --input /tmp/review-payload.json

          Step 3 — If the POST returns HTTP 422 (stale line mapping), retry WITHOUT inline comments:
          remove the "comments" array, set "event" to "COMMENT", append findings as bullet points
          in "body", and POST again.

          ## Rules
          - Maximum 15 inline comments per review
          - "line" must reference a line from the NEW side of the diff (lines starting with +)
          - "path" must match the file path exactly as shown in the diff header
          - If there are no issues at all, post APPROVE with body: "**AI Review (Claude)**\n\nNo issues found. Code changes look correct."
          - Do NOT read or analyze files that are outside the diff (only use source reads for context on changed files)
          - Keep the summary body concise (one paragraph)

          ## Step 4 — Post Conclusion Comment
          After posting the review, post a separate conclusion comment for human visibility:

          1. Create /tmp/conclusion-payload.json with:
             {
               "body": "## Review Conclusion\n\n**Decision**: <Approved to merge|Work needed>\n\n| Metric | Value |\n|:-------|:------|\n| Findings | <N> Critical, <N> Medium, <N> Low |\n| Review event | <APPROVE|COMMENT|REQUEST_CHANGES> |\n| Model | <model name> |\n\n<one-sentence summary of the decision>\n\n---\n_AI Code Review (Claude) | <date>_\n\n<!-- AI_REVIEW_METADATA {\"decision\":\"<approved|rejected>\",\"model\":\"<model>\",\"pr\":<PR_NUMBER>,\"repo\":\"<REPO_FULL>\",\"findings\":{\"critical\":<N>,\"medium\":<N>,\"low\":<N>},\"review_event\":\"<EVENT>\",\"timestamp\":\"<ISO8601>\"} AI_REVIEW_METADATA -->"
             }
          2. POST: gh api "/repos/${REPO_FULL}/issues/${PR_NUMBER}/comments" --input /tmp/conclusion-payload.json
          3. Decision mapping:
             - "Approved to merge" / "approved": APPROVE or COMMENT event with zero critical/medium findings
             - "Work needed" / "rejected": REQUEST_CHANGES event

          ## Step 5 — Apply PR Label
          After posting the conclusion comment, apply the appropriate PR label:

          1. Remove existing AI review labels (idempotent):
             gh api -X DELETE "/repos/${REPO_FULL}/issues/${PR_NUMBER}/labels/ai%3Areview-passed" 2>/dev/null || true
             gh api -X DELETE "/repos/${REPO_FULL}/issues/${PR_NUMBER}/labels/ai%3Areview-failed" 2>/dev/null || true

          2. Create /tmp/label-payload.json with: {"labels": ["ai:review-passed"]} or {"labels": ["ai:review-failed"]}

          3. POST: gh api -X POST "/repos/${REPO_FULL}/issues/${PR_NUMBER}/labels" --input /tmp/label-payload.json

          4. Label mapping:
             - ai:review-passed: APPROVE or COMMENT event with zero critical/medium findings
             - ai:review-failed: REQUEST_CHANGES event
          INSTRUCTIONS_EOF

      - name: Run Claude Code review
        if: env.SKIP_REVIEW != 'true'
        timeout-minutes: 8
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          COMMIT_SHA: ${{ steps.pr.outputs.sha }}
          REPO_FULL: ${{ github.repository }}
        run: |
          claude -p \
            --model "${{ inputs.model || 'sonnet' }}" \
            --tools "Read,Glob,Grep,Bash" \
            --dangerously-skip-permissions \
            --no-session-persistence \
            --max-budget-usd "${{ inputs.max-budget-usd || '1.00' }}" \
            --append-system-prompt "$(cat /tmp/review-instructions.txt)" \
            "Review PR #${PR_NUMBER} in repo ${REPO_FULL}. The unified diff is at /tmp/pr-diff.txt and metadata at /tmp/pr-metadata.json. The commit SHA is ${COMMIT_SHA}. The repo source code is checked out in the current directory. Analyze the code changes and post a formal GitHub review."

      - name: Cleanup
        if: always()
        run: rm -f /tmp/pr-diff.txt /tmp/pr-metadata.json /tmp/review-instructions.txt /tmp/review-payload.json /tmp/conclusion-payload.json /tmp/label-payload.json
