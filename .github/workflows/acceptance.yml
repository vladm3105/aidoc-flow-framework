# CI runs on GitHub-hosted runners — this is a PUBLIC repo. Do NOT switch to self-hosted:
# no cost benefit (public-repo Actions minutes are free) + a fork PR could run code on the
# host. The ephemeral self-hosted runner is for PRIVATE repos only. Ref: aidoc-flow-operations IPLAN-0012.
name: Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # CI-0025 / REPO_STANDARDS §23: ALLOWLIST of the code-changing events.
  # This workflow feeds a REQUIRED context. Every event other than a push or a
  # code-changing PR action fires at the CURRENT head SHA, and a cancelled required
  # check is not success — it is retained alongside any later success from a
  # separate run, so the rollup stays FAILURE and the PR is --admin-only. Here the
  # untyped `pull_request` trigger admits `reopened`, which lands in the SAME group
  # at the SAME head SHA as an in-flight `synchronize` run. Expressed as `==` so an
  # empty `github` context yields false and cancels nothing; a `!=` denylist would
  # cancel everything in that degraded state.
  #
  # An earlier version of this comment argued blanket cancellation was safe here
  # because `push` (refs/heads/<branch>) and `pull_request` (refs/pull/<N>/merge)
  # resolve to different groups. That is true and irrelevant — the collision is
  # WITHIN `pull_request`. It was written while this workflow was still
  # non-required; it became the 6th required context on 2026-07-27.
  cancel-in-progress: >-
    ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
          && contains(fromJSON('["opened","synchronize"]'), github.event.action)) }}

jobs:
  acceptance:
    # This exact string is the required-status-check context (`<job name>`, NOT
    # the workflow `name:` above). Changing it silently un-satisfies branch
    # protection, which never fires again — rename only with a matching
    # required_status_checks update.
    name: Acceptance tier (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The tier's only non-stdlib import is PyYAML, already pinned here.
      # There is no acceptance-specific requirements file.
      - name: Install dependencies
        run: pip install -r tests/conformance/requirements.txt

      # `deterministic` only. The `live/` tier needs a plugin runtime and is
      # gated behind LIVE=1; it is not part of this check.
      - name: Run deterministic acceptance tier
        run: python -m unittest discover -s tests/acceptance/deterministic -v
