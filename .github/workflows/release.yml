name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: self-hosted
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: "{GITHUB_HOST}"
        run: |
          TAG="${GITHUB_REF_NAME}"

          PRERELEASE=""
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
