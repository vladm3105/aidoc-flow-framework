name: Release

# Creates GitHub releases with QA results and issue links.
#
# References:
#   - work_plans/ai_governance_automation.md (Item #10)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  issues: read

jobs:
  release:
    name: Create Release
    runs-on: self-hosted
    steps:
      # Item #10: Include QA results and issue links in release notes
      - name: Gather release information
        id: release-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: "{GITHUB_HOST}"
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Extract version components for phase detection
          # Assumes semantic versioning: major.minor.patch
          MAJOR=$(echo "$TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$TAG" | sed 's/^v//' | cut -d. -f2)

          # Determine phase from version (customize mapping as needed)
          # Example: v1.x = Phase 1, v2.x = Phase 2
          PHASE="${MAJOR}"

          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "PHASE=${PHASE}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes with QA results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: "{GITHUB_HOST}"
          TAG: ${{ steps.release-info.outputs.TAG }}
          PHASE: ${{ steps.release-info.outputs.PHASE }}
        run: |
          # Get closed issues since last release
          LAST_TAG=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 2 | tail -1 | awk '{print $1}' || echo "")

          if [ -n "$LAST_TAG" ]; then
            SINCE_DATE=$(gh release view "$LAST_TAG" --repo "${GITHUB_REPOSITORY}" --json createdAt --jq '.createdAt' 2>/dev/null || echo "")
          fi

          # Get issues closed in this phase
          PHASE_ISSUES=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label "phase:${PHASE}" \
            --state closed \
            --json number,title,labels \
            --limit 100 2>/dev/null || echo "[]")

          ISSUE_COUNT=$(echo "$PHASE_ISSUES" | jq length)

          # Categorize issues
          FEATURES=$(echo "$PHASE_ISSUES" | jq -r '.[] | select(.labels[].name == "enhancement" or .labels[].name == "feature") | "- #\(.number): \(.title)"' || echo "")
          BUGS=$(echo "$PHASE_ISSUES" | jq -r '.[] | select(.labels[].name == "bug") | "- #\(.number): \(.title)"' || echo "")
          AI_IMPLEMENTED=$(echo "$PHASE_ISSUES" | jq -r '.[] | select(.labels[].name | startswith("ai:")) | "- [AI] #\(.number): \(.title)"' || echo "")

          # Count AI vs human implemented
          AI_COUNT=$(echo "$PHASE_ISSUES" | jq '[.[] | select(.labels[].name | startswith("ai:"))] | length')
          HUMAN_COUNT=$((ISSUE_COUNT - AI_COUNT))

          # Build release notes
          cat > /tmp/release-notes.md << EOF
          ## Release ${TAG}

          ### Summary
          - **Total Issues**: ${ISSUE_COUNT}
          - **AI Implemented**: ${AI_COUNT} ($(( AI_COUNT * 100 / (ISSUE_COUNT > 0 ? ISSUE_COUNT : 1) ))%)
          - **Human Implemented**: ${HUMAN_COUNT}

          ### Features
          ${FEATURES:-"No new features in this release."}

          ### Bug Fixes
          ${BUGS:-"No bug fixes in this release."}

          ### AI-Implemented Changes
          ${AI_IMPLEMENTED:-"No AI-implemented changes in this release."}

          ---
          *Generated automatically with QA results integration*
          EOF

          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: "{GITHUB_HOST}"
        run: |
          TAG="${GITHUB_REF_NAME}"

          PRERELEASE=""
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE="--prerelease" ;;
          esac

          # Create release with custom notes
          if [ -f /tmp/release-notes.md ]; then
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              $PRERELEASE
          else
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE
          fi
