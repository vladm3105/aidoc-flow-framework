# CI runs on GitHub-hosted runners — this is a PUBLIC repo. Do NOT switch to self-hosted:
# no cost benefit (public-repo Actions minutes are free) + a fork PR could run code on the
# host. The ephemeral self-hosted runner is for PRIVATE repos only. Ref: aidoc-flow-operations IPLAN-0012.
name: Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # CI-0025 / REPO_STANDARDS §23: ALLOWLIST of the code-changing events.
  # This workflow feeds a REQUIRED context. Every event other than a push or a
  # code-changing PR action fires at the CURRENT head SHA, and a cancelled required
  # check is not success — it is retained alongside any later success from a
  # separate run, so the rollup stays FAILURE and the PR is --admin-only. Here the
  # untyped `pull_request` trigger admits `reopened`, which lands in the SAME group
  # at the SAME head SHA as an in-flight `synchronize` run. Expressed as `==` so an
  # empty `github` context yields false and cancels nothing; a `!=` denylist would
  # cancel everything in that degraded state.
  cancel-in-progress: >-
    ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
          && contains(fromJSON('["opened","synchronize"]'), github.event.action)) }}

jobs:
  conformance:
    name: Framework + platform conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so test_release_record_integrity can read the VERSION
          # files' history (#617). actions/checkout defaults to depth 1, which
          # would make that guard measure nothing rather than fail. chg-gate.yml
          # sets this for the same class of reason.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install conformance suite dependencies
        run: pip install -r tests/conformance/requirements.txt

      - name: Run conformance suite
        run: python -m unittest discover -s tests/conformance -v
