# Governance Documentation Validation
#
# Detects drift between governance docs and reality.
#
# References:
#   - work_plans/ai_governance_automation.md (Item #11)

name: Validate Governance

on:
  push:
    paths:
      - 'governance/**'
      - 'CLAUDE.md'
      - 'README_AIAGENT.md'
  pull_request:
    paths:
      - 'governance/**'
      - 'CLAUDE.md'
      - 'README_AIAGENT.md'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8am UTC

permissions:
  contents: read
  issues: read

jobs:
  validate:
    name: Validate Governance Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            .

      - name: Validate governance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 governance/scripts/workflows/validate_governance.py \
            --repo "${{ github.repository }}" \
            ${{ github.event_name == 'push' && '--strict' || '' }}
