# dependabot.yml — canonical shape per docs/REPO_STANDARDS.md §6.
#
# Multi-ecosystem: enable only ecosystems present in the target repo.
# Weekly cadence + grouped patch/minor to reduce CI churn; major bumps
# get individual PRs for breaking-change scrutiny.
#
# Auto-merge policy: Dependabot PRs pass through ai-review.yml +
# composition.yml + auto-merge-ai-prs.yml on green per the repo's
# auto_merge.repos allowlist in operations config.json. Governance-
# tier repos do NOT auto-merge Dependabot PRs — human merge only.

version: 2
updates:
  # Every repo: bump reusable-workflow uses: pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # RE-ARMED semver-major hold on vladm3105/aidoc-flow-ci/* (D-0085, #603).
    #
    # History: a `ci/v1.9.5` hold lived here until CI-CANON-V2-001
    # (plans/CI-CANON-V2-MIGRATION-PLAN.md) removed it, on the reasoning that
    # "a future major still needs its own migration review, since ci/v2.0.0
    # proved these bumps are not mechanical." That reasoning was right and the
    # removal was wrong: nothing enforced the review, so **ten** canon majors
    # then merged unreviewed — five to `ci/v3.0.0` (#522-#526) and five to
    # `ci/v4.0.0` (#590-#594). Every pin in this repo above `ci/v2.16.0`
    # arrived that way.
    #
    # One of them, #591, repinned `doc-maintainer.yml` to `ci/v4.0.0` — a tag
    # at which canon had DELETED that reusable (v4 BC #2 / CI-0040). A caller
    # pointing at a nonexistent reusable can only `startup_failure`, and canon's
    # release notes say to delete the caller BEFORE repinning. It merged green
    # because the workflow was already `disabled_manually`, so the broken pin
    # never executed.
    #
    # `--repin` rewrites tag strings and nothing else, so it structurally cannot
    # deliver a caller-body change or notice a deleted reusable. That is the
    # class of change Dependabot also cannot make, which is why the hold is on
    # MAJORS only: minor/patch canon bumps stay in scope, because canon does not
    # change the caller contract within a major.
    #
    # DO NOT remove this entry to unblock a migration. The migration is a PR that
    # edits caller bodies and rewrites pins together (see
    # plans/CI-CANON-V4-MIGRATION-PLAN.md); this entry does not stand in its way,
    # it only stops the bump arriving as an unreviewed dependency update.
    #
    # ⚠️ This file is `safe_to_replace: true` in canon's manifest, so
    # `install.sh --update --non-interactive` silently deletes this hold and its
    # rationale, with no warning — the same failure shape the hold itself exists
    # to prevent, one level up.
    #
    # And the detector points the WRONG WAY. `sync/check-drift.sh` covers only
    # the manifest's `.github/workflows/` surface and `check-standards-drift.sh`
    # only server-side settings — neither sees this file. But
    # `install/apply-standards.sh:434` exact-matches it, and canon's
    # `install/templates/dependabot.yml` has no `ignore:` block, so
    # `apply-standards.sh --check` reports THIS BLOCK as the drift and exits 1.
    # Nothing detects its deletion. Do NOT "restore canonical" on that red. The
    # durable fix is to push the hold upstream into canon's template. See D-0085.
    ignore:
      # BOTH forms are required. Dependabot names a REUSABLE WORKFLOW dependency
      # `owner/repo/<path>.yml` — covered by the first pattern, since `*` in a
      # `dependency-name` matches across `/` and `.`. A bare composite action
      # (`uses: vladm3105/aidoc-flow-ci@ci/vX.Y.Z`) would be named `owner/repo`
      # and is NOT matched by it. Zero such sites today; canon's v3 was a
      # composite-action rework, so one is plausible. The second entry is cheap
      # insurance against a silent escape.
      - dependency-name: "vladm3105/aidoc-flow-ci/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "vladm3105/aidoc-flow-ci"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  # Python — enable only if the repo has a pyproject.toml or
  # requirements*.txt at /. Extend `directory` if the code lives in a
  # subpath (e.g. `/service`).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # Node / JS — enable only if the repo has a package.json at /.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      javascript-runtime:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # Docker — enable only if the repo has a Dockerfile at / or /docker.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docker-baseimages:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # Git submodules — umbrella tier only (aidoc-flow). Remove this
  # entry on non-umbrella repos.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      submodules:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - submodules
