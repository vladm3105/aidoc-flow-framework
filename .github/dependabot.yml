version: 2
updates:
  # Python — Hermes MCP server (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/platforms/hermes"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python — shared conformance suite (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/tests/conformance"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
