version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "{TIMEZONE}"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "P3-low"
    commit-message:
      prefix: "deps"
    reviewers:
      - "{GITHUB_ORG}/{TEAM_SLUG}"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "{TIMEZONE}"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "type:infra"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # NPM (if frontend exists)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "component:ui"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "type:infra"