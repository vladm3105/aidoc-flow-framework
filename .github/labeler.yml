# Configuration for actions/labeler (v5 format: changed-files / any-glob-to-any-file).
#
# Path -> label map for the multi-platform layout. Run by .github/workflows/labeler.yml.
# The labels below must exist in the repo (actions/labeler does not create them).

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

framework:
  - changed-files:
      - any-glob-to-any-file:
          - "framework/**"

governance:
  - changed-files:
      - any-glob-to-any-file:
          - "framework/governance/**"
          - "CLAUDE.md"
          - "docs/PROJECT.md"

framework:
  - changed-files:
      - any-glob-to-any-file:
          - "framework/**"

linter:
  - changed-files:
      - any-glob-to-any-file:
          - "sdd_doc_lint/**"

hooks:
  - changed-files:
      - any-glob-to-any-file:
          - "hooks/**"

conformance:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".pre-commit-config.yaml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/requirements*.txt"
          - "**/pyproject.toml"
