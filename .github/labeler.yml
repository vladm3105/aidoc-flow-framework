# Configuration for actions/labeler

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'

type:infra:
  - changed-files:
      - any-glob-to-any-file:
          - 'terraform/**/*'
          - 'infrastructure/**/*'
          - '.github/workflows/**/*'
          - 'Dockerfile*'
          - 'docker-compose*.yml'

component:mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'components/mcp-servers/**/*'
          - '**/mcp_*.py'

component:sdk:
  - changed-files:
      - any-glob-to-any-file:
          - 'sdk/**/*'
          - '**/telemetry*.py'

component:agents:
  - changed-files:
      - any-glob-to-any-file:
          - 'agents/**/*'
          - '**/agent*.py'

component:ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**/*'
          - 'ui/**/*'
          - '**/*.tsx'
          - '**/*.jsx'

cloud:gcp:
  - changed-files:
      - any-glob-to-any-file:
          - '**/gcp/**/*'
          - '**/google/**/*'
          - '**/bigquery*'

cloud:aws:
  - changed-files:
      - any-glob-to-any-file:
          - '**/aws/**/*'
          - '**/s3*'
          - '**/lambda*'

cloud:azure:
  - changed-files:
      - any-glob-to-any-file:
          - '**/azure/**/*'

needs-tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.py'
          - '!tests/**/*'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements*.txt'
          - 'pyproject.toml'
          - 'setup.py'
          - 'package*.json'
