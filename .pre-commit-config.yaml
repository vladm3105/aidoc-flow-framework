        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ears-ready-score
        name: Validate EARS BDD-Ready score (≥90%)
        entry: bash ai_dev_ssd_flow/03_EARS/scripts/ears_ready_score_hook.sh ai_dev_ssd_flow/03_EARS
