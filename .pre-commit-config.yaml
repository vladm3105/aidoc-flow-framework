repos:
  - repo: local
    hooks:
      - id: prd-core-wrapper
        name: Validate PRD core checks (wrapper, framework library)
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/prd_core_wrapper_hook.sh ai_dev_ssd_flow/02_PRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: prd-standardized-element-codes
        name: Validate PRD standardized element type codes
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/prd_standardized_element_codes_hook.sh ai_dev_ssd_flow/02_PRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: prd-legacy-patterns
        name: Detect PRD legacy element ID patterns
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/prd_legacy_pattern_hook.sh ai_dev_ssd_flow/02_PRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: prd-quality-gate
        name: "DEPRECATED alias: Validate PRD core checks (wrapper)"
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/validate_prd_wrapper.sh ai_dev_ssd_flow/02_PRD --skip-advisory
        language: system
        pass_filenames: false
        stages: [manual]

      - id: brd-quality-gate
        name: "DEPRECATED alias: Validate BRD core checks (wrapper)"
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/validate_brd_wrapper.sh ai_dev_ssd_flow/01_BRD --skip-advisory
        language: system
        pass_filenames: false
        stages: [manual]

      - id: brd-core-wrapper
        name: Validate BRD core checks (wrapper, framework library)
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/brd_core_wrapper_hook.sh ai_dev_ssd_flow/01_BRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: brd-standardized-element-codes
        name: Validate BRD standardized element type codes
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/brd_standardized_element_codes_hook.sh ai_dev_ssd_flow/01_BRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: brd-legacy-patterns
        name: Detect BRD legacy element ID patterns
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/brd_legacy_pattern_hook.sh ai_dev_ssd_flow/01_BRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: brd-claude-skill-audit
        name: Run Claude BRD skill audit (manual only)
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/claude_brd_skill_audit_hook.sh
        language: system
        files: ^ai_dev_ssd_flow/01_BRD/.*\.md$
        pass_filenames: true
        stages: [manual]

      - id: prd-claude-skill-audit
        name: Run Claude PRD skill audit (optional)
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/claude_prd_skill_audit_hook.sh
        language: system
        files: ^ai_dev_ssd_flow/02_PRD/.*\.md$
        pass_filenames: true
        stages: [manual]

      # ======================
      # EARS Validation Hooks
      # ======================

      - id: ears-core-validator
        name: Validate EARS core checks (validator, framework library)
