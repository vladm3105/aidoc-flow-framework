# Pre-commit hooks — https://pre-commit.com
#
# Setup:   pip install pre-commit && pre-commit install
# Run now: pre-commit run --all-files
# Update pins to current: pre-commit autoupdate
#
# Scope notes: Python lives only in platforms/hermes + tests; the plugin is
# markdown/YAML. legacy/ is the frozen pre-migration archive. framework/ is the
# GATE-SPEC-governed spec — no auto-fixing hook may modify it (a style edit there
# would trip GATE-SPEC); its validation is the conformance suite's job. The
# plugin's platforms/claude-code-plugin/framework/ is a GENERATED byte-identical
# vendored copy of that spec (D-0022) — no hook may modify it either (a style fix
# there would break the byte-identity drift guard). All are excluded from all hooks.
exclude: '^(legacy/|framework/|platforms/claude-code-plugin/framework/|.*\.pytest_cache/|.*/__pycache__/)'

repos:
  # ---- general hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # ---- Python: lint + format -------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---- Python: security (SAST), gate on medium+ severity ---------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["--severity-level", "medium", "--confidence-level", "medium"]
        files: '^(platforms/hermes/src/|tests/).*\.py$'

  # ---- Markdown --------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix]
        # Hermes agent-skills/prompts/skills are vendored/parsed content — exclude
        # from style-linting (framework/ is already excluded globally). Done via
        # pre-commit exclude because markdownlint-cli ignores .markdownlintignore
        # when pre-commit passes file paths explicitly. sdd_doc_lint fixtures are
        # deliberately-malformed sample docs for the doc-linter's own tests.
        exclude: '^(platforms/hermes/(agent-skills|prompts|skills)|tools/sdd_doc_lint/fixtures)/'

  # ---- YAML ------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # ---- secrets ---------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks  # git-aware secret scan; config in .gitleaks.toml

  # ---- dependency vulnerability audit ----------------------------------------
  # Heavy / network-bound — runs in the `manual` stage (CI) + pre-push, not on
  # every commit. Invoke: pre-commit run --hook-stage manual pip-audit
  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        stages: [manual]
        args: [-r, tests/conformance/requirements.txt]

  # ---- project gate: the shared conformance suite ----------------------------
  - repo: local
    hooks:
      - id: conformance
        name: framework/platform conformance suite
        entry: python3 -m unittest discover -s tests/conformance
        language: system
        pass_filenames: false
        always_run: true

      # Mechanical doc-sync: when a VERSION file changes, auto-propagate the
      # new version string into all the docs-of-record that quote it
      # (plugin.json, marketplace.json, 52 SKILL.md frontmatter, READMEs,
      # PARITY.md current-state row, etc.). Re-stages on its own; idempotent.
      # See CLAUDE.md §"Durable conventions" — "Update docs of record per PR".
      - id: sync-version-refs
        name: auto-sync version references (CLAUDE.md / README / PARITY / SKILL frontmatter / ...)
        entry: bash scripts/sync-version-refs.sh
        language: system
        pass_filenames: false
        # Only run when one of the authoritative VERSION files changes — this
        # keeps the hook silent on commits that don't bump a version.
        files: '^(platforms/[^/]+/VERSION|framework/VERSION)$'

      # Warning hook: when a commit changes code/spec/skills but does NOT
      # touch any of the documents-of-record (CHANGELOG, ROADMAP, README,
      # HANDOFF, HERMES-BACKLOG, …), print a checklist of likely-stale docs.
      # Does NOT fail the commit; informational only. False-positive friendly.
      # The mechanical sync above handles version-references; this hook
      # handles the semantic content that can't be auto-generated.
      - id: check-docs-updated
        name: docs-of-record reminder (CHANGELOG / ROADMAP / HANDOFF / ...)
        entry: bash scripts/check-docs-updated.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true   # so the WARN block is visible in pre-commit's output

  - repo: local
    hooks:
      - id: check-plan
        name: verified-planning gate (claim ledger + review log)
        entry: python .claude/skills/verified-planning/check_plan.py
        language: system
        files: (^|/)PLAN-[^/]*\.md$
        exclude: (^|/)PLAN-TEMPLATE(\.snippet)?\.md$
        pass_filenames: true
