name: SDD Artifact Validation

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.yaml'
      - 'docs/**/*.yml'
      - 'docs/**/*.feature'
  push:
    branches:
      - main
    paths:
      - 'docs/**/*'
  schedule:
    # Weekly drift check - Friday 5pm EST (22:00 UTC)
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      validation_type:
        description: 'Type of validation to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - artifacts
          - gates
          - drift

jobs:
  validate-artifacts:
    name: Validate Changed Artifacts
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r ai_dev_ssd_flow/scripts/requirements-project.txt

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: |
            docs/**/*.md
            docs/**/*.yaml
            docs/**/*.yml
            docs/**/*.feature

      - name: Validate changed artifacts
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Validating: $file"
            python ai_dev_ssd_flow/scripts/validate_artifact.py --path "$file" --strict
          done

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: tmp/validation_report.md
          retention-days: 7

  validate-gates:
    name: Validate Gate Requirements
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r ai_dev_ssd_flow/scripts/requirements-project.txt

      - name: Detect affected gates
        id: detect-gates
        run: |
          python ai_dev_ssd_flow/scripts/validate_artifact.py \
            --detect-gates \
            --output tmp/gate_analysis.json

      - name: Validate gate transitions
        run: |
          python ai_dev_ssd_flow/scripts/validate_artifact.py \
            --validate-gates \
            --gates-file tmp/gate_analysis.json

  update-matrix:
    name: Update Traceability Matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r ai_dev_ssd_flow/scripts/requirements-project.txt

      - name: Generate traceability matrix
        run: |
          python ai_dev_ssd_flow/scripts/generate_traceability_matrix.py \
            --sdd-root docs/ \
            --output docs/TRACEABILITY_MATRIX.md

      - name: Commit matrix update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update traceability matrix [skip ci]'
          file_pattern: 'docs/TRACEABILITY_MATRIX.md'

  drift-check:
    name: Weekly Drift Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.validation_type == 'drift')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r ai_dev_ssd_flow/scripts/requirements-project.txt

      - name: Run drift check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ai_dev_ssd_flow/scripts/drift_check.py \
            --sdd-root docs/ \
            --repo ${{ github.repository }} \
            --max-age-days 14 \
            --report tmp/drift_report.md

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: tmp/drift_report.md
          retention-days: 30

      - name: Create issue for drift alerts
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('tmp/drift_report.md', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Drift Alert] Documentation currency issues detected',
              body: report,
              labels: ['documentation', 'drift-alert']
            });
