# UCX Scoring Template: Fintech/Financial Services
# Version: 1.0.0
#
# Industry-specific compliance keywords and weight adjustments
# for financial technology and banking applications.
#
# Usage in project config (docs/UCX/scoring_weights.yaml):
#   extends: fintech_compliance
#   categories:
#     compliance:
#       keywords_append:
#         - "Custom term"

industry: fintech
description: "Financial technology, banking, money transmission, payments"

compliance:
  keywords:
    # US Federal Regulations
    - "FinCEN"
    - "Financial Crimes Enforcement Network"
    - "OFAC"
    - "Office of Foreign Assets Control"
    - "BSA"
    - "Bank Secrecy Act"
    - "AML"
    - "Anti-Money Laundering"
    - "KYC"
    - "Know Your Customer"
    - "CDD"
    - "Customer Due Diligence"
    - "SAR"
    - "Suspicious Activity Report"
    - "CTR"
    - "Currency Transaction Report"
    - "MTL"
    - "Money Transmitter License"
    - "FFIEC"
    - "SOX"
    - "Sarbanes-Oxley"
    - "GLBA"
    - "Gramm-Leach-Bliley Act"
    - "Reg E"
    - "Regulation E"
    - "UDAP"
    - "UDAAP"
    - "CFPB"
    - "OCC"

    # Payment Card Industry
    - "PCI-DSS"
    - "PCI DSS"
    - "Payment Card Industry"
    - "PA-DSS"
    - "P2PE"
    - "PTS"
    - "PIN"
    - "EMV"
    - "Tokenization"

    # International
    - "FATF"
    - "Financial Action Task Force"
    - "SWIFT"
    - "SEPA"
    - "PSD2"
    - "Open Banking"
    - "FCA"
    - "MiFID"

    # State Regulations
    - "BitLicense"
    - "NMLS"
    - "State MTL"
    - "Money Services Business"
    - "MSB"

    # Crypto/Digital Assets
    - "Virtual Currency"
    - "Digital Asset"
    - "Stablecoin"
    - "VASP"
    - "Travel Rule"
    - "MiCA"

  # Weight adjustment: increase compliance weight for fintech
  weight_adjustment: 0.00  # Use default (already high at 0.20)

risk:
  keywords:
    - "Fraud"
    - "Fraud detection"
    - "Chargeback"
    - "Disputed transaction"
    - "Unauthorized"
    - "Identity theft"
    - "Account takeover"
    - "Sanctions"
    - "Blocked person"
    - "SDN list"
    - "Watchlist"
    - "Enhanced due diligence"
    - "High-risk"
    - "Risk-based"
    - "Transaction monitoring"
