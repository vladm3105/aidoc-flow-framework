# Expert Generation Board: Architecture Decision Record (ADR) — Layer 5
# Team: Architect (lead), Tech Lead, Operator
# Focus: Complete ADR generation with multi-persona drafting and assembly
#
# Configuration Options (engine key required for all agents):
#   - engine: "cmd"     - Direct CLI command via cmd key (e.g., "claude -p --model $P_MODEL")
#   - engine: "litellm" - LiteLLM/OpenAI-compatible API with api_base and api_key_env
# Reference: /opt/data/docs_flow_framework/automation/core/ai_exec.sh
#
# IMPORTANT: Judge and Chairperson/Editor MUST use different models to ensure
# impartial evaluation. The Judge cannot evaluate work from the same model.

personas:
  architect:
    name: "The Platform Architect"
    skill_file: "architect.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.2
      max_tokens: 5000
    prompt: |-
      You are the Architect generating an Architecture Decision Record (ADR).
      Your role: Draft the Context and Problem Statement, Decision Drivers, and the Proposed Options.
      Output ONLY your drafted sections in markdown format.

  tech_lead:
    name: "The Tech Lead"
    skill_file: "tech_lead.md"
    agent:
      engine: "litellm"
      model: "gemini-2.5-pro"
      temperature: 0.3
      max_tokens: 4000
      api_base: "https://api.openai.com/v1"
      api_key_env: "LITELLM_MASTER_KEY"
    prompt: |-
      You are the Tech Lead generating an ADR.
      Your role: Draft the Pros and Cons of each Option, and the Implementation Constraints.
      Output ONLY your drafted sections in markdown format.

  operator:
    name: "The Systems Operator"
    skill_file: "operator.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.2
      max_tokens: 3000
    prompt: |-
      You are the Operator generating an ADR.
      Your role: Draft the Operational Impact, Security Considerations, and Validation Strategy.
      Output ONLY your drafted sections in markdown format.

chairperson:
  name: "The Board Chairperson (ADR Assembler)"
  agent:
    # Chairperson uses Gemini - Judge MUST use different model (GPT-4o)
    engine: "litellm"
    model: "gemini-2.5-pro"
    temperature: 0.2
    max_tokens: 6000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are the Chairperson of the ADR Generation Board.
    Your role is to act as the Assembler.
    Take the drafted sections from the expert personas and seamlessly assemble them into a COMPLETE Version 1 Markdown document using the ADR framework template.
    You MUST perfectly adhere to the exact section structure rules in the Shared Context.

judge:
  name: "The Framework Judge"
  agent:
    # Judge uses GPT-4o - different from Chairperson (Gemini) for impartial evaluation
    engine: "litellm"
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 3000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are an impartial Judge evaluating a V1 Draft of an ADR.
    Your sole focus is strict framework compliance.
    Check the document against the doc-adr SKILL rules.
    Look for: Status metadata, accurate alternatives evaluation, structured pros/cons list.
    Output a structured critique detailing what the Chairperson must fix. Provide explicit, actionable feedback.

editor:
  name: "The Board Chairperson (ADR Editor)"
  agent:
    # Editor uses Gemini (same as Chairperson) - applies fixes from Judge's critique
    engine: "litellm"
    model: "gemini-2.5-pro"
    temperature: 0.2
    max_tokens: 6000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are the Chairperson of the ADR Generation Board acting as the Final Editor.
    You previously created a V1 Draft of an ADR document. Our LLM Judge has reviewed your draft and provided a critique.
