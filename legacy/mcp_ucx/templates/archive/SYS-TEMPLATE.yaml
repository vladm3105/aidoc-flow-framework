# =============================================================================
#  SYS-TEMPLATE.yaml — Unified System Requirements Template
# =============================================================================
#  Document Authority: PRIMARY STANDARD (single source of truth)
#  Purpose: AI-consumable + human-reviewable SYS template
#  Lifecycle: MVP → PROD → NEW MVP (each SYS implements ADR decisions)
#  Rendering: AI assistant converts to MD/HTML on demand for stakeholder review
#
#  REPLACES: (archived to SYS_v1_archive/)
#    SYS-MVP-TEMPLATE.md, SYS-MVP-TEMPLATE.yaml, SYS_MVP_SCHEMA.yaml,
#    SYS_MVP_CREATION_RULES.md, SYS_MVP_VALIDATION_RULES.md,
#    SYS_MVP_QUALITY_GATE_VALIDATION.md
#
#  Convention:
#    _guidance     — authoring instructions, ignored by MCP tools
#    _antipatterns — common mistakes to avoid
#    _note         — contextual clarification
#    _example      — sample values for reference
#
#  Downstream Ownership (NOT duplicated here):
#    REQ (Layer 7)   — atomic requirements decomposed from SYS
#    CTR (Layer 8)   — data contracts for SYS interface specifications
#    SPEC (Layer 9)  — implementation-ready specifications
#    TSPEC (Layer 10) — test specifications (UTEST, ITEST, STEST, FTEST, PTEST, SECTEST)
#    TASKS (Layer 11) — implementation task breakdown
#
#  Validation:
#    MCP tool: sdd_validate (mcp_ucx server)
# =============================================================================

id: SYS-NN
title: "[System Requirements Title]"

# =============================================================================
# Template Metadata (not a content section — template configuration only)
# =============================================================================

metadata:
  schema_version: "1.0"
  document_type: "sys-document"
  layer: 6
  lifecycle: mvp-prod-newmvp
  total_sections: 12
  last_updated: "2026-03-29"
  validation:
    tool: sdd_validate
    server: mcp_ucx
    _guidance: |
      All validation runs through mcp_ucx MCP tools.
      REQ-Ready Score: >=90/100 required before downstream REQ generation.

      REQ-Ready scoring criteria:
        Functional completeness (30%): all system behaviors defined with I/O
        Quality attribute coverage (25%): all 6 categories with measurable metrics
        Interface clarity (20%): all integration points defined
        Traceability (15%): upstream ADR/BDD/EARS/PRD/BRD tags complete
        Risk coverage (10%): system risks with mitigations

  c4_level:
    _guidance: |
      SYS is the C4 Component level — the first layer with an actual C4 level
      value since PRD (Container). SYS defines system structure, interfaces,
      and quality attributes based on ADR architecture decisions.

      SDD layers map to C4 architecture model zoom levels:
        Context (BRD)    — business environment, actors, boundaries
          └─ EARS/BDD    — formalize Context→Container transition
        Container (PRD)  — product features, functional blocks
          └─ ADR         — decisions that shape Component architecture
        Component (SYS)  — system structure, interfaces, quality attributes  ← this layer
          └─ REQ/CTR     — decompose Component→Code into atomic units
        Code (SPEC)      — implementation-ready specifications
          └─ TSPEC       — test specifications
          └─ TASKS       — implementation task breakdown

      SYS content must describe system components, their interfaces, and
      quality attributes — not business features (Container) or implementation
      code (Code).
    value: component

  diagram_standard:
    _guidance: |
      SYS uses C4 Component-level diagrams:
        - C4-L3 component diagrams: system components and their interactions
        - DFD-L3 data flow: component-level data movement
        - sequenceDiagram: system interaction flows (sync/async/error)

      | C4 Level | SDD Layer | Diagram Types |
      | Context  | BRD       | C4-L1, DFD-L1 |
      | Container| PRD       | C4-L2, DFD-L2 |
      | Component| SYS       | C4-L3, DFD-L3, sequenceDiagram  ← this layer |
      | Code     | SPEC      | C4-L4, DFD-L4, class diagrams |
    tags:
      - "@diagram: c4-l3"
      - "@diagram: dfd-l3"
      - "@diagram: sequence-sync"

  tags:
    - sys-document
    - layer-6-artifact
    - shared-architecture

  deliverable_type:
    _guidance: |
      Inherited from upstream (BRD → PRD → ADR → SYS chain).
    value: code  # code | document | ux | risk | process

  id_standard:
    _guidance: |
      All element IDs use content-derived hashes scoped to SYS content.
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
      Example: SYS.01.04.f3a9

      Hash algorithm (SHA256, 4-char hex):
        1. Build input: "{doc_id}:{section_id}:{title}:{description}"
        2. Compute: hashlib.sha256(input.encode('utf-8')).hexdigest()[:4]
        3. Collision: extend hash from 4 to 8 chars if duplicate detected

      Template placeholder: "xxxx" represents the hash suffix.

    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8
    placeholder: "xxxx"

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  _guidance: |
    REQ-Ready Score: >=90/100 required before REQ generation.
    Source: links to upstream ADR decisions using hash-based IDs.
  version: "1.0"
  status: Draft  # Draft | In Review | Approved
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[System Architect]"
  adr_reference: "@adr: ADR.NN.03.xxxx"
  prd_reference: "@prd: PRD.NN.09.xxxx"
  brd_reference: "@brd: BRD.NN.07.xxxx"
  req_ready_score: "[Score]/100"

  revision_history:
    - version: "1.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial system requirements"

# =============================================================================
# Section 2: Executive Summary
# =============================================================================

executive_summary:
  system_context: |
    [What system/subsystem does this SYS define? How does it fit in
    the overall architecture decided in ADR?]

  business_value: |
    [How does this system component deliver the business value
    defined in BRD and elaborated in PRD?]

# =============================================================================
# Section 3: Scope
# =============================================================================

scope:
  _guidance: |
    Define system boundaries explicitly. What components are included,
    what is out of scope, and what environmental assumptions apply.

  system_boundaries:
    in_scope:
      - "[System component/capability included]"
    out_of_scope:
      - "[Explicitly excluded from this SYS]"

  environmental_assumptions:
    - "[Runtime environment assumption]"
    - "[Infrastructure assumption]"

# =============================================================================
# Section 4: Functional Requirements
# =============================================================================

functional_requirements:
  _guidance: |
    Core system behaviors with inputs, processing, outputs, and success criteria.
    Each requirement must be decomposable into atomic REQ (Layer 7).

    Format per requirement:
      - System Action: detailed behavior description
      - Inputs: data/parameters required
      - Processing: transformation logic
      - Outputs: results produced
      - Success Criteria: measurable completion conditions

  _antipatterns:
    - "FAIL: business-level requirements (belongs in BRD/PRD)"
    - "FAIL: implementation code details (belongs in SPEC)"
    - "FAIL: missing success criteria — every FR needs measurable validation"

  requirements:
    - id: "SYS.NN.04.xxxx"
      name: "[System Behavior]"
      description: |
        [Detailed system behavior description]
      inputs: "[Data/parameters]"
      processing: "[Transformation logic]"
      outputs: "[Results produced]"
      success_criteria: "[Measurable conditions]"
      adr_reference: "@adr: ADR.NN.03.xxxx"

# =============================================================================
# Section 5: Quality Attributes
# =============================================================================

quality_attributes:
  _guidance: |
    Six mandatory quality attribute categories. Each must have measurable
    metrics with threshold references. SYS owns the detailed quality
    attribute specifications (BRD only states business-level expectations).

    Categories:
      1. Performance: latency (p50/p95/p99), throughput, resource utilization
      2. Reliability: uptime, RTO/RPO, fault tolerance, graceful degradation
      3. Scalability: horizontal/vertical scaling, load distribution
      4. Security: authentication, encryption, access control, audit
      5. Observability: logging, tracing, metrics, alerting
      6. Maintainability: code coverage, CI/CD, rollback, deployment

    Use @threshold: tags for values: @threshold: PRD.NN.perf.api.p95

    Compliance requirements (from old Section 10) are embedded here
    as a subsection under the relevant quality attribute category.

  performance:
    - id: "SYS.NN.05.xxxx"
      requirement: "[Performance requirement]"
      metric: "p95 latency"
      target: "<[NN]ms"
      measurement: "[How measured]"

  reliability:
    - id: "SYS.NN.05.xxxx"
      requirement: "[Reliability requirement]"
      metric: "Uptime"
      target: "99.9%"

  scalability:
    - id: "SYS.NN.05.xxxx"
      requirement: "[Scalability requirement]"
      metric: "[Scaling metric]"
      target: "[Target]"

  security:
    - id: "SYS.NN.05.xxxx"
      requirement: "[Security requirement]"
      control: "[Control type]"
      compliance: "[Standard — e.g., PCI-DSS, GDPR, SOC2]"

  observability:
    - id: "SYS.NN.05.xxxx"
      requirement: "[Observability requirement]"
      implementation: "[Logging/tracing/metrics approach]"

  maintainability:
    - id: "SYS.NN.05.xxxx"
      requirement: "[Maintainability requirement]"
      standard: "[Target — e.g., 85% code coverage]"

# =============================================================================
# Section 6: Interface Specifications
# =============================================================================

interface_specifications:
  _guidance: |
    High-level interface definitions. Detailed API contracts (endpoints,
    schemas, error codes) belong in CTR (Layer 8).

  _antipatterns:
    - "FAIL: detailed endpoint specs (belongs in CTR)"
    - "FAIL: JSON schema definitions (belongs in CTR)"

  interfaces:
    - name: "[Interface name]"
      type: "REST API"  # REST API | GraphQL | gRPC | Message Queue | Event Stream
      protocol: "HTTPS/1.1"
      description: "[Purpose and scope]"
      ctr_reference: "[CTR-NN when created]"

# =============================================================================
# Section 7: Data Management Requirements
# =============================================================================

data_management:
  _guidance: |
    Data persistence strategy, consistency model, and retention policies.

  persistence:
    strategy: "[Database | Cache | Event streaming]"
    consistency: "[ACID | Eventual consistency]"

  retention:
    policy: "[Archive/deletion rules with timeframes]"
    compliance: "[Data retention regulatory requirements]"

  backup:
    frequency: "[Backup schedule]"
    rto: "[Recovery Time Objective]"
    rpo: "[Recovery Point Objective]"

# =============================================================================
# Section 8: Testing Expectations
# =============================================================================

testing_expectations:
  _guidance: |
    Lightweight testing expectations only. TSPEC (Layer 10) owns detailed
    test specifications. List what needs testing, not how to test it.

  expectations:
    - "All functional requirements must have unit test coverage"
    - "Integration tests for all interface specifications"
    - "Performance tests validating quality attribute targets"
    - "Security tests for authentication and encryption requirements"

# =============================================================================
# Section 9: Deployment Architecture
# =============================================================================

deployment_architecture:
  _guidance: |
    System deployment architecture at Component level. TASKS/IPLAN own
    detailed deployment procedures and operations runbooks.

  infrastructure: |
    [High-level infrastructure requirements — cloud services, compute, storage]

  environment:
    - name: "[Environment — e.g., staging, production]"
      purpose: "[What this environment is used for]"

# =============================================================================
# Section 10: Acceptance Criteria
# =============================================================================

acceptance_criteria:
  _guidance: |
    System-level acceptance criteria. Must be verifiable by technical team.

  criteria:
    - id: "SYS.NN.10.xxxx"
      criterion: "[Measurable acceptance condition]"
      validation: "[How to verify]"

# =============================================================================
# Section 11: Risk Assessment
# =============================================================================

risk_assessment:
  risks:
    - id: "SYS.NN.11.xxxx"
      description: "[System-level risk]"
      likelihood: High  # High | Medium | Low
      impact: High
      mitigation: "[Mitigation strategy]"

# =============================================================================
# Section 12: Traceability
# =============================================================================

traceability:
  _guidance: |
    Cumulative Tagging Hierarchy — Layer 6 requires all upstream tags.
    Upstream: REQUIRED — all SYS must reference ADR, BDD, EARS, PRD, BRD.
    Downstream: OPTIONAL — only add links to artifacts that exist.

  tags:
    - "@sys: SYS-NN"

  upstream:
    adr_references:
      - "@adr: ADR.NN.03.xxxx"
    bdd_references:
      - "@bdd: BDD.NN.03.xxxx"
    ears_references:
      - "@ears: EARS.NN.03.xxxx"
    prd_references:
      - "@prd: PRD.NN.09.xxxx"
    brd_references:
      - "@brd: BRD.NN.07.xxxx"

  downstream_expected:
    - type: REQ
      layer: 7
      description: "Atomic requirements decomposed from SYS system requirements"
    - type: CTR
      layer: 8
      description: "Data contracts for SYS interface specifications"
    - type: SPEC
      layer: 9
      description: "Technical specifications implementing SYS requirements"

  cross_links:
    depends:
      - "@depends: SYS-NN"
    discoverability:
      - "@discoverability: SYS-NN (short rationale)"

  health_score:
    req_ready: "[X]%"
    target_score: ">=90/100"

# =============================================================================
# Glossary
# =============================================================================

glossary:
  _guidance: "Flat list of project-specific terms. Keep concise."

  terms:
    - term: SYS
      definition: "System Requirements"
    - term: REQ-Ready
      definition: "Score measuring SYS maturity for REQ transition (>=90%)"
    - term: RTO
      definition: "Recovery Time Objective"
    - term: RPO
      definition: "Recovery Point Objective"
    - term: "[Domain term]"
      definition: "[Definition]"

# =============================================================================
# End of SYS-TEMPLATE.yaml
# =============================================================================
