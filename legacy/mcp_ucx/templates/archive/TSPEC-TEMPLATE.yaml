# =============================================================================
#  TSPEC-TEMPLATE.yaml — Unified Test Specification Aggregator Template
# =============================================================================
#  Document Authority: PRIMARY STANDARD (single source of truth)
#  Purpose: Parent aggregator for 6 test specification subtypes
#  Rendering: AI generates per-subtype test specs from routing table
#
#  REPLACES: (archived to TSPEC_v1_archive/)
#    TSPEC-MVP-TEMPLATE.md, TSPEC-MVP-TEMPLATE.yaml (parent aggregator)
#    UTEST/, ITEST/, STEST/, FTEST/, PTEST/, SECTEST/ (6 subtype dirs, 42 files)
#    Shared section structure + per-type overrides replace 6 separate templates
#
#  Test Specification Subtypes (6):
#    UTEST  — Unit tests (component-level behavior)
#    ITEST  — Integration tests (contract/interaction validation)
#    STEST  — Smoke tests (deployment critical-path)
#    FTEST  — Functional tests (quality-attribute validation)
#    PTEST  — Performance tests (load, stress, endurance, spike)
#    SECTEST — Security tests (threat/control validation)
#
#  Convention:
#    _guidance     — authoring instructions, ignored by MCP tools
#    _antipatterns — common mistakes to avoid
#
#  Downstream: TASKS (Layer 11) — implementation task breakdown
#
#  Validation:
#    MCP tool: sdd_validate (mcp_ucx server)
# =============================================================================

id: TSPEC-NN
title: "[Test Specification Aggregator Title]"

# =============================================================================
# Template Metadata
# =============================================================================

metadata:
  schema_version: "1.0"
  document_type: "tspec-document"
  layer: 10
  lifecycle: mvp-prod-newmvp
  total_sections: 6
  last_updated: "2026-03-30"
  validation:
    tool: sdd_validate
    server: mcp_ucx
    _guidance: |
      TASKS-Ready Score: >=90/100 required before TASKS generation.
      Validates: all 6 test subtypes have specs, coverage targets met,
      quality gates defined.

  c4_level:
    _guidance: |
      TSPEC is NOT a C4 level. It validates Code (SPEC) implementation.

      Code (SPEC)      — implementation-ready specifications
        └─ TSPEC       — test specifications (validates SPEC)       ← this layer
        └─ TASKS       — implementation task breakdown

  diagram_standard:
    _guidance: "No diagram tags — test specification level."

  tags:
    - tspec-document
    - layer-10-artifact
    - shared-architecture

  deliverable_type:
    _guidance: "Inherited from upstream chain."
    value: code

  id_standard:
    _guidance: |
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
      Example: TSPEC.01.04.c3b1
      Hash: SHA256 of content, first 4 hex chars.
    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8
    placeholder: "xxxx"

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  _guidance: |
    TASKS-Ready Score: >=90/100 required before TASKS generation.
    TSPEC aggregates all 6 test subtype status.
  version: "1.0"
  status: Draft
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[QA Lead]"
  spec_reference: "@spec: SPEC.NN.08.xxxx"
  tasks_ready_score: "[Score]/100"

  revision_history:
    - version: "1.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial test specification aggregator"

# =============================================================================
# Section 2: Traceability
# =============================================================================

traceability:
  _guidance: |
    Cumulative tags. TSPEC links to SPEC (primary), REQ, CTR, SYS upstream.

  tags:
    - "@tspec: TSPEC-NN"

  upstream:
    spec_references:
      - "@spec: SPEC.NN.05.xxxx"
    req_references:
      - "@req: REQ.NN.03.xxxx"
    ctr_references:
      - "@ctr: CTR.NN.05.xxxx"
    sys_references:
      - "@sys: SYS.NN.04.xxxx"

  downstream_expected:
    - type: TASKS
      layer: 11
      description: "Implementation tasks including test implementation"

  cross_links:
    depends:
      - "@depends: TSPEC-NN"
    discoverability:
      - "@discoverability: TSPEC-NN (short rationale)"

  health_score:
    tasks_ready: "[X]%"
    target_score: ">=90/100"

# =============================================================================
# Section 3: Test Strategy Overview
# =============================================================================

test_strategy:
  _guidance: |
    Test pyramid approach — more unit tests, fewer e2e tests.
    Each layer validates different quality aspects.

    Test Pyramid (bottom to top):
      UTEST (most)  → Component behavior, business logic
      ITEST         → Contract verification, service interaction
      STEST         → Deployment validation, critical-path smoke
      FTEST         → Quality attribute validation (SYS requirements)
      PTEST         → Load, stress, endurance, spike testing
      SECTEST (least) → Threat modeling, security control validation

    Coverage targets:
      UTEST: >=90% line coverage for core logic
      ITEST: All CTR contracts tested
      STEST: All deployment critical paths
      FTEST: All SYS quality attributes
      PTEST: p50/p95/p99 targets validated
      SECTEST: OWASP Top 10 + threat model coverage

  approach: |
    [High-level testing approach for this SPEC implementation]

  environment:
    - name: "[Test environment]"
      purpose: "[What tests run here]"

# =============================================================================
# Section 4: Test Summary by Type
# =============================================================================

test_summary:
  _guidance: |
    6 test subtypes defined in this template (shared structure + type overrides).
    AI generates {TYPE}-NN instances using subtype_document_structure below.

    Test Document References:
      | Test Type          | Document ID | Instance Path                        |
      | Unit Tests         | UTEST-NN    | docs/10_TSPEC/UTEST-NN_{component}/  |
      | Integration Tests  | ITEST-NN    | docs/10_TSPEC/ITEST-NN_{component}/  |
      | Smoke Tests        | STEST-NN    | docs/10_TSPEC/STEST-NN_{component}/  |
      | Functional Tests   | FTEST-NN    | docs/10_TSPEC/FTEST-NN_{component}/  |
      | Performance Tests  | PTEST-NN    | docs/10_TSPEC/PTEST-NN_{component}/  |
      | Security Tests     | SECTEST-NN  | docs/10_TSPEC/SECTEST-NN_{component}/|

    | Subtype | Test Category | Scope | Upstream Source |
    | UTEST   | Unit          | Component-level behavior | REQ, SPEC |
    | ITEST   | Integration   | Contract/interaction     | CTR, SPEC |
    | STEST   | Smoke         | Deployment critical-path | SPEC |
    | FTEST   | Functional    | Quality-attribute        | SYS, SPEC |
    | PTEST   | Performance   | Load/stress/endurance    | SYS, SPEC |
    | SECTEST | Security      | Threat/control           | SYS, SPEC |

  coverage_requirements:
    _guidance: |
      Coverage targets per test level (testing pyramid):
        | Test Level     | Coverage Target    | Priority  | Pyramid % |
        | UTEST          | >= 90%             | Critical  | 70%       |
        | ITEST          | >= 85%             | High      | 20%       |
        | STEST          | >= 75%             | Medium    | 10%       |
        | FTEST          | 100% happy paths   | High      | —         |
        | PTEST          | All NFRs           | Medium    | —         |
        | SECTEST        | All security REQs  | Critical  | —         |

  subtypes:
    utest:
      document_id: "UTEST-NN"
      document_path: "docs/10_TSPEC/UTEST-NN_{component}/"
      status: Draft
      categories:
        - name: "Logic"
          test_count: "[N]"
        - name: "State"
          test_count: "[N]"
        - name: "Validation"
          test_count: "[N]"
        - name: "Edge Cases"
          test_count: "[N]"
      total_tests: "[N]"
      coverage: "[XX]%"
      coverage_target: ">=90%"

    itest:
      document_id: "ITEST-NN"
      document_path: "docs/10_TSPEC/ITEST-NN_{component}/"
      status: Draft
      categories:
        - name: "Database"
          test_count: "[N]"
        - name: "External APIs"
          test_count: "[N]"
        - name: "Internal Services"
          test_count: "[N]"
      total_tests: "[N]"
      coverage: "[XX]%"
      coverage_target: ">=85%"

    stest:
      document_id: "STEST-NN"
      document_path: "docs/10_TSPEC/STEST-NN_{component}/"
      status: Draft
      categories:
        - name: "Happy Path"
          test_count: "[N]"
        - name: "Error Scenarios"
          test_count: "[N]"
        - name: "Edge Cases"
          test_count: "[N]"
      total_tests: "[N]"
      coverage: "[XX]%"
      coverage_target: ">=75%"

    ftest:
      document_id: "FTEST-NN"
      document_path: "docs/10_TSPEC/FTEST-NN_{component}/"
      status: Draft
      categories:
        - name: "[Feature 1]"
          test_count: "[N]"
          bdd_refs: "[BDD refs]"
        - name: "[Feature 2]"
          test_count: "[N]"
          bdd_refs: "[BDD refs]"
      total_tests: "[N]"
      coverage: "[XX]%"
      coverage_target: "100% happy paths"

    ptest:
      document_id: "PTEST-NN"
      document_path: "docs/10_TSPEC/PTEST-NN_{component}/"
      status: Draft
      categories:
        - name: "Response Time"
          target: "< 100ms p95"
          test_type: "Load test"
        - name: "Throughput"
          target: "> 1000 req/s"
          test_type: "Stress test"
        - name: "Resource Usage"
          target: "< 512MB"
          test_type: "Soak test"
      coverage: "[XX]%"
      coverage_target: "All NFRs"

    sectest:
      document_id: "SECTEST-NN"
      document_path: "docs/10_TSPEC/SECTEST-NN_{component}/"
      status: Draft
      categories:
        - name: "Authentication"
          test_count: "[N]"
          owasp: "[Items]"
        - name: "Authorization"
          test_count: "[N]"
          owasp: "[Items]"
        - name: "Input Validation"
          test_count: "[N]"
          owasp: "[Items]"
        - name: "Data Protection"
          test_count: "[N]"
          owasp: "[Items]"
      coverage: "[XX]%"
      coverage_target: "All security REQs"

# =============================================================================
# Subtype Document Structure (shared by all 6 test types)
# =============================================================================
# Each sub-test document (UTEST-NN, ITEST-NN, etc.) follows this SHARED
# 6-section structure. Only Section 5 and Appendix differ per type.
# This replaces 6 separate subtype templates — 95% identical structure.
# =============================================================================

subtype_document_structure:
  _guidance: |
    All 6 sub-test types share this 6-section structure.
    AI generates {TYPE}-NN instances using these sections plus
    the type-specific Section 5 and Appendix from the overrides below.

    Shared sections (identical across all 6 types):
      1. Document Control — status, version, dates, component, SPEC reference
      2. Test Scope — what is tested, boundaries, assumptions
      3. Test Case Index — summary table of all test cases with IDs
      4. Test Case Details — full test case definitions (Given-When-Then)
      5. [TYPE-SPECIFIC] Coverage Matrix — varies per type (see overrides)
      6. Traceability — upstream SPEC/REQ/CTR/SYS, downstream TASKS

    Instance naming: {TYPE}-NN_{component}/{TYPE}-NN_{component}.md
    Instance location: docs/10_TSPEC/{TYPE}-NN_{component}/
    Nested folder rule: ALL sub-test documents use nested folders.

  shared_sections:
    section_1_document_control:
      fields:
        - status: "Draft | Review | Approved"
        - version: "1.0.0"
        - component: "[Component/module name]"
        - spec_reference: "SPEC-NN"
        - test_count: "[N]"
        - coverage: "[XX]%"

    section_2_test_scope:
      _guidance: "What is tested, boundaries, out-of-scope, assumptions."
      in_scope: "[Components/behaviors under test]"
      out_of_scope: "[Explicitly excluded]"
      assumptions: "[Test environment assumptions]"

    section_3_test_case_index:
      _guidance: |
        Summary table of all test cases.
        Format: | TC-ID | Name | Priority | Category | Status |
      cases: []

    section_4_test_case_details:
      _guidance: |
        Full test case definitions. Each test case includes:
          - ID: {TYPE}.NN.04.xxxx (hash-based)
          - Name: descriptive test name
          - Priority: P0-P3
          - Preconditions: setup required
          - Steps: Given-When-Then format
          - Expected Result: measurable outcome
          - Traceability: @spec/@req/@ctr tags
      cases: []

    section_6_traceability:
      _guidance: "Upstream SPEC/REQ/CTR/SYS, downstream TASKS."
      upstream:
        - "@spec: SPEC.NN.05.xxxx"
        - "@req: REQ.NN.03.xxxx"
      downstream_expected:
        - type: TASKS
          layer: 11
          description: "Test implementation tasks"

  # Per-type overrides (Section 5 + Appendix only)
  type_overrides:
    UTEST:
      section_5:
        name: "REQ Coverage Matrix"
        _guidance: "Maps unit tests to REQ atomic requirements."
        upstream_source: "@req: REQ.NN.03.xxxx"
        matrix_columns: ["REQ ID", "Test Cases", "Coverage %"]
      appendix:
        name: "Test Infrastructure"
        content: "Mocking frameworks, test runners, fixtures"

    ITEST:
      section_5:
        name: "CTR Coverage Matrix"
        _guidance: "Maps integration tests to CTR contract endpoints."
        upstream_source: "@ctr: CTR.NN.05.xxxx"
        matrix_columns: ["CTR Endpoint", "Test Cases", "Coverage %"]
      appendix:
        name: "Test Infrastructure"
        content: "Test containers, service stubs, contract mocks"

    STEST:
      section_5:
        name: "Rollback Procedures"
        _guidance: "Defines rollback steps if smoke tests fail post-deployment."
        upstream_source: "@spec: SPEC.NN.05.xxxx"
        matrix_columns: ["Critical Path", "Rollback Steps", "Timeout"]
      appendix:
        name: "Execution Configuration"
        content: "Deployment targets, health check endpoints, timeout values"

    FTEST:
      section_5:
        name: "SYS Coverage Matrix"
        _guidance: "Maps functional tests to SYS quality attribute requirements."
        upstream_source: "@sys: SYS.NN.05.xxxx"
        matrix_columns: ["SYS QA ID", "Test Cases", "Pass/Fail"]
      appendix:
        name: "Test Infrastructure"
        content: "Test data, environment config, feature flags"

    PTEST:
      section_5:
        name: "SYS Coverage Matrix"
        _guidance: "Maps performance tests to SYS NFR targets (p50/p95/p99)."
        upstream_source: "@sys: SYS.NN.05.xxxx"
        matrix_columns: ["NFR", "Target", "Test Type", "Result"]
      appendix:
        name: "Test Infrastructure"
        content: "Load generators, monitoring dashboards, baseline configs"

    SECTEST:
      section_5:
        name: "Security Coverage Matrix"
        _guidance: "Maps security tests to threat model and OWASP controls."
        upstream_source: "@sys: SYS.NN.05.xxxx"
        matrix_columns: ["Threat/Control", "Test Cases", "OWASP Item", "Status"]
      appendix:
        name: "Security Testing Tools"
        content: "SAST/DAST tools, penetration test configs, compliance checks"

# =============================================================================
# Section 5: Quality Gates
# =============================================================================

quality_gates:
  _guidance: "All gates must pass before TASKS generation."

  readiness_checklist:
    - criterion: "UTEST document complete"
      status: false
    - criterion: "ITEST document complete"
      status: false
    - criterion: "STEST document complete"
      status: false
    - criterion: "FTEST document complete"
      status: false
    - criterion: "PTEST document complete"
      status: false
    - criterion: "SECTEST document complete"
      status: false
    - criterion: "All coverage targets met"
      status: false
    - criterion: "Traceability verified"
      status: false

  coverage_summary:
    - metric: "Overall Unit Coverage"
      target: ">=90%"
      actual: "[XX]%"
    - metric: "Overall Integration Coverage"
      target: ">=85%"
      actual: "[XX]%"
    - metric: "REQ Coverage"
      target: "100%"
      actual: "[XX]%"
    - metric: "SPEC Coverage"
      target: "100%"
      actual: "[XX]%"

  tasks_ready_threshold: ">=90/100"

# =============================================================================
# Section 6: Glossary
# =============================================================================

glossary:
  terms:
    - term: TSPEC
      definition: "Test Specification (aggregator for 6 test types)"
    - term: UTEST
      definition: "Unit Test Specification"
    - term: ITEST
      definition: "Integration Test Specification"
    - term: STEST
      definition: "Smoke Test Specification"
    - term: FTEST
      definition: "Functional Test Specification"
    - term: PTEST
      definition: "Performance Test Specification"
    - term: SECTEST
      definition: "Security Test Specification"

# =============================================================================
# End of TSPEC-TEMPLATE.yaml
# =============================================================================
