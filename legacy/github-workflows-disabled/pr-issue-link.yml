# Auto-post PR link to linked issue when PR created
#
# Triggers on pull_request.opened, extracts issue number from PR body,
# and posts a comment on the linked issue with the PR details.
#
# References:
#   - plans/ai_governance_automation.md (Item #3)

name: PR Issue Link

on:
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: read

jobs:
  post-pr-link:
    runs-on: ubuntu-latest
    steps:
      - name: Extract linked issue and post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          # Extract issue number from PR body (Closes #N, Fixes #N, Resolves #N)
          ISSUE_NUMBER=$(echo "${PR_BODY}" | grep -oE '(Closes|Fixes|Resolves|closes|fixes|resolves)\s*#([0-9]+)' | head -1 | grep -oE '[0-9]+' || echo "")

          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "No linked issue found in PR body. Skipping."
            exit 0
          fi

          echo "Found linked issue: #${ISSUE_NUMBER}"

          # Check if we already posted a PR link comment (idempotent)
          EXISTING_COMMENT=$(gh issue view "${ISSUE_NUMBER}" --json comments --jq '.comments[].body' 2>/dev/null | grep -c "PR Created.*#${PR_NUMBER}" || echo "0")

          if [ "${EXISTING_COMMENT}" -gt 0 ]; then
            echo "PR link comment already exists. Skipping."
            exit 0
          fi

          # Post PR link comment
          CURRENT_DATE=$(TZ="America/New_York" date '+%Y-%m-%d %H:%M EST' 2>/dev/null || date '+%Y-%m-%d %H:%M')

          printf "**PR Created**: #%s - %s\n\n**Branch**: \`%s\`\n**URL**: %s\n**Date**: %s\n\nThis PR addresses the requirements in this issue." \
            "${PR_NUMBER}" "${PR_TITLE}" "${BRANCH_NAME}" "${PR_URL}" "${CURRENT_DATE}" > /tmp/pr_link_comment.md
          gh issue comment "${ISSUE_NUMBER}" \
            --body-file /tmp/pr_link_comment.md

          echo "Posted PR link to issue #${ISSUE_NUMBER}"
