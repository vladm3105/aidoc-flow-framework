name: Validate BRD Skill Template Version

on:
  push:
    branches: [main]
    paths:
      - 'ucx_flow_v3/01_BRD/BRD-TEMPLATE.yaml'
      - 'mcp_ucx/templates/BRD-TEMPLATE.yaml'
      - '.claude/skills/doc-brd/SKILL.md'
      - '.claude/skills/doc-brd-audit/SKILL.md'
      - '.claude/skills/doc-brd-validator/SKILL.md'
      - '.claude/skills/doc-brd-reviewer/SKILL.md'
      - '.claude/skills/doc-brd-fixer/SKILL.md'
      - '.claude/skills/doc-brd-autopilot/SKILL.md'
  pull_request:
    branches: [main]
    paths:
      - 'ucx_flow_v3/01_BRD/BRD-TEMPLATE.yaml'
      - 'mcp_ucx/templates/BRD-TEMPLATE.yaml'
      - '.claude/skills/doc-brd/SKILL.md'
      - '.claude/skills/doc-brd-audit/SKILL.md'
      - '.claude/skills/doc-brd-validator/SKILL.md'
      - '.claude/skills/doc-brd-reviewer/SKILL.md'
      - '.claude/skills/doc-brd-fixer/SKILL.md'
      - '.claude/skills/doc-brd-autopilot/SKILL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skill-template-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            .

      - name: Run skill/template version drift check
        run: |
          python3 << 'PYEOF'
          from pathlib import Path

          canonical = Path("ucx_flow_v3/01_BRD/BRD-TEMPLATE.yaml")
          runtime = Path("mcp_ucx/templates/BRD-TEMPLATE.yaml")

          for path in (canonical, runtime):
              if not path.exists():
                  raise SystemExit(f"Missing template file: {path}")

          if canonical.read_text(encoding="utf-8") != runtime.read_text(encoding="utf-8"):
              raise SystemExit(
                  "Template drift detected between ucx_flow_v3 and mcp_ucx runtime copy. "
                  "Sync with: cp ucx_flow_v3/01_BRD/BRD-TEMPLATE.yaml mcp_ucx/templates/BRD-TEMPLATE.yaml"
              )

          skill_files = [
              Path(".claude/skills/doc-brd/SKILL.md"),
              Path(".claude/skills/doc-brd-autopilot/SKILL.md"),
          ]

          required_ref = "BRD-TEMPLATE.yaml"
          forbidden_refs = ("BRD-MVP-TEMPLATE", "/01_BRD/BRD-MVP-TEMPLATE")

          for skill in skill_files:
              text = skill.read_text(encoding="utf-8")
              if required_ref not in text:
                  raise SystemExit(f"Missing required template reference '{required_ref}' in {skill}")
              for token in forbidden_refs:
                  if token in text:
                      raise SystemExit(f"Forbidden legacy reference '{token}' in {skill}")

          print("BRD template and skill reference checks passed")
          PYEOF
