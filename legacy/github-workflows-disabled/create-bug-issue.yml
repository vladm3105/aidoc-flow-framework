name: Create Bug Issue

on:
  workflow_call:
    inputs:
      qa_issue:
        description: 'QA issue number that failed'
        required: true
        type: string
      failure_details:
        description: 'JSON string with failure details'
        required: true
        type: string
      iteration:
        description: 'Current iteration number'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      qa_issue:
        description: 'QA issue number that failed'
        required: true
        type: string
      test_file:
        description: 'Test file that failed'
        required: true
        type: string
      test_name:
        description: 'Test name that failed'
        required: true
        type: string
      error_message:
        description: 'Error message'
        required: true
        type: string

permissions:
  contents: read
  issues: write

env:
  GH_HOST: "{GITHUB_HOST}"
  MAX_QA_ITERATIONS: 3

jobs:
  create-bug-issue:
    name: Create Bug Issue
    runs-on: self-hosted
    steps:
      - name: Checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 "https://{GITHUB_HOST}/${REPO}" .
          git checkout "$SHA"

      - name: Get QA issue details
        id: qa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_ISSUE: ${{ inputs.qa_issue }}
        run: |
          ISSUE_DATA=$(GH_HOST={GITHUB_HOST} gh issue view ${QA_ISSUE} --json title,body,labels)
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
          PHASE=$(echo "$ISSUE_DATA" | jq -r '.labels[].name' | grep -oE '^phase:[0-9]+$' | head -1)
          PHASE_NUM=$(echo "$PHASE" | cut -d: -f2)
          DEV_ISSUE=$(echo "$ISSUE_BODY" | grep -oE 'Development Issue \| #[0-9]+' | grep -oE '[0-9]+' | head -1)
          TASK_ID=$(echo "$ISSUE_TITLE" | grep -oE '\[P[0-9]+-[0-9]+\.[0-9a-z]+-QA\]' | sed 's/-QA//' | tr -d '[]' || echo "")
          echo "phase=${PHASE}" >> $GITHUB_OUTPUT
          echo "phase_num=${PHASE_NUM}" >> $GITHUB_OUTPUT
          echo "dev_issue=${DEV_ISSUE}" >> $GITHUB_OUTPUT
          echo "task_id=${TASK_ID}" >> $GITHUB_OUTPUT

      - name: Determine iteration
        id: iteration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE: ${{ steps.qa.outputs.phase }}
          DEV_ISSUE: ${{ steps.qa.outputs.dev_issue }}
          INPUT_ITERATION: ${{ inputs.iteration }}
        run: |
          if [ -n "$INPUT_ITERATION" ]; then
            ITERATION="$INPUT_ITERATION"
          else
            BUG_COUNT=$(GH_HOST={GITHUB_HOST} gh issue list \
              --label "${PHASE}" \
              --label "ai:development" \
              --label "bug" \
              --json number,body \
              --jq "[.[] | select(.body | contains(\"#${DEV_ISSUE}\"))] | length")
            ITERATION=$((BUG_COUNT + 1))
          fi
          echo "number=${ITERATION}" >> $GITHUB_OUTPUT
          if [ "$ITERATION" -gt "${MAX_QA_ITERATIONS}" ]; then
            echo "exceeded=true" >> $GITHUB_OUTPUT
            echo "::warning::Iteration ${ITERATION} exceeds maximum ${MAX_QA_ITERATIONS} - human intervention required"
          else
            echo "exceeded=false" >> $GITHUB_OUTPUT
          fi

      - name: Check iteration limit
        id: limit_check
        env:
          ITERATION: ${{ steps.iteration.outputs.number }}
        run: |
          python3 governance/scripts/workflows/check_iteration_limit.py \
            --iteration "$ITERATION" \
            --max-iterations ${MAX_QA_ITERATIONS} \
            --output-file /tmp/limit_check.json
          ACTION=$(jq -r '.action' /tmp/limit_check.json)
          echo "action=${ACTION}" >> $GITHUB_OUTPUT

      - name: Parse failure details
        id: failure
        env:
          FAILURE_DETAILS: ${{ inputs.failure_details }}
          INPUT_TEST_FILE: ${{ inputs.test_file }}
          INPUT_TEST_NAME: ${{ inputs.test_name }}
          INPUT_ERROR_MESSAGE: ${{ inputs.error_message }}
        run: |
          if [ -n "$FAILURE_DETAILS" ]; then
            printf '%s' "$FAILURE_DETAILS" > /tmp/failure.json
            TEST_FILE=$(jq -r '.test_file' /tmp/failure.json)
            TEST_NAME=$(jq -r '.test_name' /tmp/failure.json)
            ERROR_TYPE=$(jq -r '.error_type' /tmp/failure.json)
            ERROR_MESSAGE=$(jq -r '.error_message' /tmp/failure.json)
            STACK_TRACE=$(jq -r '.stack_trace' /tmp/failure.json)
          else
            TEST_FILE="$INPUT_TEST_FILE"
            TEST_NAME="$INPUT_TEST_NAME"
            ERROR_TYPE="TestFailure"
            ERROR_MESSAGE="$INPUT_ERROR_MESSAGE"
            STACK_TRACE="Not available"
          fi
          echo "test_file=${TEST_FILE}" >> $GITHUB_OUTPUT
          echo "test_name=${TEST_NAME}" >> $GITHUB_OUTPUT
          echo "error_type=${ERROR_TYPE}" >> $GITHUB_OUTPUT
          echo "${ERROR_MESSAGE}" > /tmp/error_message.txt
          echo "${STACK_TRACE}" > /tmp/stack_trace.txt

      - name: Create bug issue (within iteration limit)
        if: steps.limit_check.outputs.action == 'create_bug'
        id: create_bug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE: ${{ steps.qa.outputs.phase }}
          PHASE_NUM: ${{ steps.qa.outputs.phase_num }}
          TASK_ID: ${{ steps.qa.outputs.task_id }}
          DEV_ISSUE: ${{ steps.qa.outputs.dev_issue }}
          QA_ISSUE: ${{ inputs.qa_issue }}
          ITERATION: ${{ steps.iteration.outputs.number }}
          TEST_FILE: ${{ steps.failure.outputs.test_file }}
          TEST_NAME: ${{ steps.failure.outputs.test_name }}
          ERROR_TYPE: ${{ steps.failure.outputs.error_type }}
        run: |
          # Build issue body from template
          cp .github/templates/bug-issue-body.md /tmp/issue_body.md
          sed -i "s|__QA_ISSUE__|${QA_ISSUE}|g" /tmp/issue_body.md
          sed -i "s|__DEV_ISSUE__|${DEV_ISSUE}|g" /tmp/issue_body.md
          sed -i "s|__PHASE_NUM__|${PHASE_NUM}|g" /tmp/issue_body.md
          sed -i "s|__ITERATION__|${ITERATION}|g" /tmp/issue_body.md
          sed -i "s|__TEST_FILE__|${TEST_FILE}|g" /tmp/issue_body.md
          sed -i "s|__TEST_NAME__|${TEST_NAME}|g" /tmp/issue_body.md
          sed -i "s|__ERROR_TYPE__|${ERROR_TYPE}|g" /tmp/issue_body.md
          # Use Python for multiline content replacement
          python3 -c "
          body = open('/tmp/issue_body.md').read()
          err = open('/tmp/error_message.txt').read().strip()
          trace = open('/tmp/stack_trace.txt').read().strip()
          body = body.replace('__ERROR_MESSAGE__', err)
          body = body.replace('__STACK_TRACE__', trace)
          open('/tmp/issue_body.md', 'w').write(body)
          "

          BUG_TITLE="[${TASK_ID}-Bug] Fix: ${TEST_NAME}"
          BUG_ISSUE=$(GH_HOST={GITHUB_HOST} gh issue create \
            --title "${BUG_TITLE}" \
            --body-file /tmp/issue_body.md \
            --label "${PHASE}" \
            --label "ai:development" \
            --label "bug" \
            --label "iteration:${ITERATION}" \
            --label "status:planning" \
            --json number --jq '.number')
          echo "number=${BUG_ISSUE}" >> $GITHUB_OUTPUT
          echo "Created bug issue #${BUG_ISSUE}"

      - name: Link to QA issue
        if: steps.create_bug.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_ISSUE: ${{ inputs.qa_issue }}
          BUG_NUMBER: ${{ steps.create_bug.outputs.number }}
          ITERATION: ${{ steps.iteration.outputs.number }}
        run: |
          MESSAGE="Bug fix issue created: #${BUG_NUMBER} (iteration ${ITERATION})"
          GH_HOST={GITHUB_HOST} gh issue comment ${QA_ISSUE} --body "${MESSAGE}"

      - name: Post to Teams
        if: always()
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          QA_ISSUE: ${{ inputs.qa_issue }}
          ITERATION: ${{ steps.iteration.outputs.number }}
          PHASE_NUM: ${{ steps.qa.outputs.phase_num }}
          BUG_NUMBER: ${{ steps.create_bug.outputs.number }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$BUG_NUMBER" ]; then
            BUG_ISSUE="$BUG_NUMBER"
            COLOR="FFA500"
            TITLE="Bug Issue Created"
            STATUS="Iteration ${ITERATION}/${MAX_QA_ITERATIONS}"
          else
            exit 0
          fi
          ISSUE_URL="${SERVER_URL}/${REPO}/issues/${BUG_ISSUE}"
          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "themeColor": "'${COLOR}'",
            "summary": "'${TITLE}'",
            "sections": [{
              "activityTitle": "'${TITLE}'",
              "facts": [
                {"name": "Phase", "value": "'${PHASE_NUM}'"},
                {"name": "QA Issue", "value": "#'${QA_ISSUE}'"},
                {"name": "Bug Issue", "value": "#'${BUG_ISSUE}'"},
                {"name": "Status", "value": "'${STATUS}'"},
                {"name": "Link", "value": "'${ISSUE_URL}'"}
              ]
            }]
          }' ${TEAMS_WEBHOOK} || true
