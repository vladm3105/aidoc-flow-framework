# Staging Sign-Off Automation
#
# Evaluates staging readiness for production deployment.
#
# References:
#   - plans/ai_governance_automation.md (Item #7)

name: Staging Sign-Off

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase number to evaluate"
        required: true
        type: number
      tracking_issue:
        description: "Issue number to post results to"
        required: false
        type: number

permissions:
  contents: read
  issues: write

jobs:
  staging-signoff:
    name: Evaluate Staging Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            .

      - name: Check staging readiness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHASE="${{ inputs.phase }}"
          TRACKING_ISSUE="${{ inputs.tracking_issue }}"

          ARGS="--phase ${PHASE} --repo ${{ github.repository }}"
          if [ -n "${TRACKING_ISSUE}" ]; then
            ARGS="${ARGS} --post-comment ${TRACKING_ISSUE}"
          fi

          python3 governance/scripts/workflows/check_staging_ready.py ${ARGS}

      - name: Post to Teams (if configured)
        if: always()
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          if [ -z "${TEAMS_WEBHOOK:-}" ]; then
            echo "Teams webhook not configured. Skipping."
            exit 0
          fi

          VERDICT="${{ job.status == 'success' && 'GO' || 'NO-GO' }}"
          COLOR="${{ job.status == 'success' && '00FF00' || 'FF0000' }}"

          curl -sS -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "themeColor": "'"${COLOR}"'",
            "summary": "Staging Sign-Off: '"${VERDICT}"'",
            "sections": [{
              "activityTitle": "Phase '"${{ inputs.phase }}"' Staging Readiness",
              "facts": [
                {"name": "Verdict", "value": "'"${VERDICT}"'"},
                {"name": "Phase", "value": "'"${{ inputs.phase }}"'"}
              ]
            }]
          }' "${TEAMS_WEBHOOK}" || true
