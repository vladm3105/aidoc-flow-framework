# =============================================================================
# Haystack RAG Configuration
# Service 1: Technical & Project Documentation
# =============================================================================

# Embedding configuration
embedding:
  model: "text-embedding-3-small"
  dimensions: 1536
  batch_size: 32

# Document splitting configuration
splitting:
  split_by: "sentence"           # sentence, word, passage, page
  split_length: 10               # sentences per chunk (~200-400 tokens)
  split_overlap: 3               # sentence overlap for context
  split_threshold: 5             # minimum chunk size

# Retrieval configuration
retrieval:
  # Vector search
  vector_top_k: 20               # candidates from vector search

  # BM25 keyword search
  bm25_top_k: 20                 # candidates from BM25
  bm25_algorithm: "BM25Okapi"

  # Reciprocal Rank Fusion
  rrf_k: 60                      # RRF constant

  # Reranking
  reranker: "cohere"             # cohere, jina, or none
  reranker_model: "rerank-english-v3.0"
  reranker_top_k: 5              # final results after reranking

  # Similarity threshold (0-1)
  similarity_threshold: 0.5

# Vector store configuration (PostgreSQL + pgvector)
vector_store:
  schema: "haystack_docs"
  table: "documents"
  recreate_table: false          # preserve data across restarts

  # HNSW index parameters
  hnsw:
    ef_construction: 256         # index build quality (higher = better, slower)
    m: 16                        # connections per node
    ef_search: 100               # search quality (higher = better, slower)

# LLM generation configuration
generation:
  model: "gpt-4o-mini"
  max_tokens: 1024
  temperature: 0.1               # low temperature for factual responses

  # System prompt for RAG
  system_prompt: |
    You are a helpful assistant that answers questions about project documentation.
    Use ONLY the provided context to answer. If the context doesn't contain
    the answer, say "I don't have enough information to answer that."
    Be concise and cite specific documents when possible.

# Metadata configuration
metadata:
  # Fields to extract from documents
  extract_fields:
    - doc_type                   # PRD, BRD, API, ARCH, SPEC, etc.
    - project_name               # Project identifier
    - version                    # Document version
    - date                       # Creation/update date
    - author                     # Document author
    - layer                      # SDD layer (1-12)
    - status                     # draft, review, approved

  # Default filters
  default_filters: {}

  # Supported filter operations
  filter_operations:
    - "$eq"                      # equals
    - "$ne"                      # not equals
    - "$gt"                      # greater than
    - "$gte"                     # greater than or equal
    - "$lt"                      # less than
    - "$lte"                     # less than or equal
    - "$in"                      # in list
    - "$nin"                     # not in list
    - "$and"                     # logical AND
    - "$or"                      # logical OR

# Document cleaning configuration
cleaning:
  remove_empty_lines: true
  remove_extra_whitespace: true
  remove_headers_footers: false  # preserve for context
  remove_page_numbers: true
  normalize_unicode: true

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Server configuration
server:
  host: "0.0.0.0"
  port: 1416
  workers: 4
  timeout: 300                   # 5 minute timeout for large queries
