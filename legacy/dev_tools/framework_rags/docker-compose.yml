version: '3.8'

# =============================================================================
# RAG Services Docker Compose
# =============================================================================
#
# Data Storage: ${PROJECT_ROOT}/tools/data/
#   - postgres/     PostgreSQL data (pgvector)
#   - neo4j/        Neo4j graph database
#   - haystack/     Haystack indexes and pipelines
#   - lightrag/     LightRAG data and inputs
#   - backups/      Backup files
#
# Set PROJECT_ROOT in .env to point to your project directory
# =============================================================================

services:
  # =============================================================================
  # Shared Infrastructure
  # =============================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
    volumes:
      - ${PROJECT_ROOT:-.}/tools/data/postgres:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  neo4j:
    image: neo4j:5-community
    container_name: rag-neo4j
    ports:
      - "7474:7474"   # HTTP Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jpass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - ${PROJECT_ROOT:-.}/tools/data/neo4j/data:/data
      - ${PROJECT_ROOT:-.}/tools/data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # =============================================================================
  # Service 1: Haystack RAG (Project Documentation)
  # =============================================================================

  haystack:
    build:
      context: ./haystack
      dockerfile: Dockerfile
    container_name: rag-haystack
    ports:
      - "1416:1416"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - PG_CONN_STR=postgresql://raguser:${POSTGRES_PASSWORD:-ragpass}@postgres:5432/ragdb
      - HAYHOOKS_HOST=0.0.0.0
      - HAYHOOKS_PORT=1416
      - PYTHONUNBUFFERED=1
    volumes:
      - ./haystack/config:/app/config:ro
      - ./haystack/src:/app/src:ro
      - ${PROJECT_ROOT:-.}/tools/data/haystack/data:/app/data
      - ${PROJECT_ROOT:-.}/tools/data/haystack/pipelines:/app/pipelines
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1416/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - rag-network

  # =============================================================================
  # Service 2: LightRAG (Research & Analysis Knowledge Base)
  # =============================================================================

  lightrag:
    build:
      context: ./lightrag
      dockerfile: Dockerfile
    container_name: rag-lightrag
    ports:
      - "9621:9621"
    env_file:
      - ./lightrag/config/default.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ragpass}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4jpass}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./lightrag/config:/app/config:ro
      - ./lightrag/src:/app/src:ro
      - ${PROJECT_ROOT:-.}/tools/data/lightrag/data:/app/data
      - ${PROJECT_ROOT:-.}/tools/data/lightrag/inputs:/app/inputs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9621/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - rag-network

  # =============================================================================
  # MCP Bridge for LightRAG (daniel-lightrag-mcp)
  # =============================================================================

  lightrag-mcp:
    build:
      context: ./lightrag
      dockerfile: Dockerfile.mcp
    container_name: rag-lightrag-mcp
    environment:
      - LIGHTRAG_BASE_URL=http://lightrag:9621
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY:-lightragsecretkey}
      - LIGHTRAG_TIMEOUT=60
    depends_on:
      lightrag:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

# =============================================================================
# Networks
# =============================================================================

networks:
  rag-network:
    name: rag-network
    driver: bridge
