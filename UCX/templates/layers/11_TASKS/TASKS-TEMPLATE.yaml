# =============================================================================
#  TASKS-TEMPLATE.yaml — Unified AI Implementation Guide Template
# =============================================================================
#  Document Authority: PRIMARY STANDARD (single source of truth)
#  Purpose: AI agent's code-generation guide — bridges SPEC to source code
#  Instance: One TASKS document per SPEC component/feature
#  Orchestrator: IMPLEMENTATION_PLAN_TEMPLATE.md organizes TASKS into phases
#
#  REPLACES: (archived to TASKS_v1_archive/)
#    TASKS-MVP-TEMPLATE.md, TASKS-MVP-TEMPLATE.yaml, TASKS_MVP_SCHEMA.yaml,
#    TASKS_MVP_CREATION_RULES.md, TASKS_MVP_VALIDATION_RULES.md,
#    TASKS_MVP_QUALITY_GATE_VALIDATION.md
#
#  UNIQUE to TASKS (not found in Layers 1-10):
#    - Executable bash commands (Section 4)
#    - Implementation contracts (Section 7)
#    - Session handoff protocol for stateless MCP executor calls
#    - Full 10-layer upstream chain verification before code generation
#    - Development Plan Tracking with pre/post-execution gates
#
#  Convention:
#    _guidance     — authoring instructions, ignored by MCP tools
#    _antipatterns — common mistakes to avoid
#
#  Downstream: Source code + tests (NOT another SDD layer)
#
#  Validation:
#    MCP tool: sdd_validate (mcp_sdd server)
#    Execution-Ready Score: >=90/100 before code generation
# =============================================================================

id: TASKS-NN
title: "[Component/Feature Implementation Plan]"

# =============================================================================
# Template Metadata
# =============================================================================

metadata:
  schema_version: "1.0"
  document_type: "tasks-document"
  layer: 11
  lifecycle: mvp-prod-newmvp
  total_sections: 16  # 2 pre-content + 13 numbered + glossary
  last_updated: "2026-03-30"
  validation:
    tool: sdd_validate
    server: mcp_sdd
    _guidance: |
      Execution-Ready Score: >=90/100 required before code generation.
      Score rubric:
        - All 13 sections present and populated (no placeholders)
        - Implementation plan with phased steps and execution commands
        - Constraints and acceptance criteria specific and verifiable
        - Implementation contracts documented (if applicable)
        - Traceability complete (8-10 cumulative tags)
        - Risk assessment with mitigations
        - Test coverage target >=85%

  c4_level:
    _guidance: |
      TASKS is NOT a C4 level. It bridges Code (SPEC) to source code.

      Code (SPEC)      — implementation-ready specifications
        └─ TSPEC       — test specifications (validates SPEC)
        └─ TASKS       — AI implementation guide (execution bridge)  ← this layer
             └─ Source Code + Tests

  diagram_standard:
    _guidance: "No diagram tags — implementation execution level."

  tags:
    - tasks-document
    - layer-11-artifact
    - shared-architecture

  deliverable_type:
    _guidance: "Inherited from upstream chain (BRD → SPEC → TASKS)."
    value: code

  id_standard:
    _guidance: |
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
      Example: TASKS.01.03.g7k2
      Hash: SHA256 of content, first 4 hex chars.
    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8
    placeholder: "xxxx"

# =============================================================================
# Document Control (pre-content)
# =============================================================================

document_control:
  _guidance: |
    Execution-Ready Score: >=90/100 before code generation handoff.
    One TASKS document per SPEC component/feature.

    MANDATORY FIRST STEP: Before creating ANY TASKS, complete SPEC dependency
    analysis via IMPLEMENTATION_PLAN to determine correct execution order.
    See IMPLEMENTATION_PLAN_TEMPLATE.md for the project orchestrator.
  tasks_id: "TASKS-NN"
  document_name: "[Implementation Plan Document Name]"
  status: Draft  # Draft | Review | Approved | In Progress | Completed | Blocked
  version: "1.0.0"
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Primary Author]"
  assigned_to: "[Primary Developer/AI Agent]"
  priority: P0  # P0 (Critical) | P1 (High) | P2 (Medium) | P3 (Low)
  source_spec: "SPEC-NN"
  estimated_effort_hours: 8
  actual_effort_hours: null
  complexity: 3  # 1=minimal config, 5=architectural changes
  execution_ready_score: "[Score]/100"

  revision_history:
    - version: "1.0.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial implementation plan"

# =============================================================================
# Development Plan Tracking (pre-content)
# =============================================================================

development_plan_tracking:
  _guidance: |
    Machine-parsable YAML block for IMPLEMENTATION_PLAN.md integration.
    Three-phase workflow with mandatory pre/post-execution verification.

    Pre-check includes FULL UPSTREAM CHAIN VERIFICATION — the AI agent
    must verify all 10 upstream layers are complete before generating code:
      BRD → PRD → EARS → BDD → ADR → SYS → REQ → CTR → SPEC → TSPEC

    If any upstream layer is missing or incomplete, implementation MUST NOT proceed.

  workflow:
    pre_check:
      status: NOT_STARTED  # NOT_STARTED → COMPLETED
      checklist:
        verified_brd: false       # BRD business requirements exist and approved
        verified_prd: false       # PRD product features traced to BRD
        verified_ears: false      # EARS formal requirements from PRD
        verified_bdd: false       # BDD scenarios from EARS
        verified_adr: false       # ADR decisions accepted
        verified_sys: false       # SYS system requirements from ADR
        verified_req: false       # REQ atomic requirements from SYS
        verified_ctr: false       # CTR contracts (if applicable)
        verified_spec: false      # SPEC implementation spec ready
        verified_tspec: false     # TSPEC test specs complete
        confirmed_arch: false     # Architecture pattern confirmed
        checked_deps: false       # All dependencies available

    implementation:
      status: NOT_STARTED  # NOT_STARTED → IN_PROGRESS → COMPLETED
      started: null
      completed: null

    post_check:
      status: NOT_STARTED
      checklist:
        tests_passing: false      # All tests pass
        coverage_met: false       # Coverage >=85%
        docs_updated: false       # Documentation updated
        session_logged: false     # Session log entry added
        code_inventory_updated: false  # Files created/modified listed

# =============================================================================
# Section 1: Objective
# =============================================================================

objective:
  _guidance: "What this implementation accomplishes, deliverables, business value."
  statement: |
    [What this TASKS implements — one paragraph]
  deliverables:
    - "[Deliverable 1 — e.g., validation service module]"
    - "[Deliverable 2 — e.g., API endpoint]"
  business_value: |
    [How this connects to business objectives from BRD]

# =============================================================================
# Section 2: Scope
# =============================================================================

scope:
  _guidance: "Clear boundaries. Include concrete examples in exclusion list."
  _antipatterns:
    - "FAIL: 'Build the whole service' — too vague"
    - "FAIL: missing exclusions — enables scope creep"
  inclusions:
    - "[What is included in this implementation]"
  exclusions:
    - "[What is explicitly NOT included]"
  prerequisites:
    - "[What must exist before starting — e.g., TASKS-01 completed]"

# =============================================================================
# Section 3: Implementation Plan
# =============================================================================

implementation_plan:
  _guidance: |
    MANDATORY: Complete SPEC dependency analysis before creating this section.
    Use IMPLEMENTATION_PLAN_TEMPLATE.md for project-level ordering.

    SPEC Dependency Analysis (Creation Rules §0):
      1. Inventory all SPEC files to be implemented
      2. Extract internal dependencies from each SPEC
      3. Build dependency graph (topological sort)
      4. Group into parallelizable phases
      5. This TASKS' phase/order determined by the analysis

    4-phase breakdown pattern:
      Phase 1: Setup and environment (scaffolding, deps)
      Phase 2: Core implementation (domain models, business logic)
      Phase 3: Integration (adapters, API endpoints, contracts)
      Phase 4: Testing and validation (unit, integration, BDD)

  phases:
    - phase: "Phase 1: Setup"
      tasks:
        - id: "TASKS.NN.03.xxxx"
          step: "[Setup task description]"
          status: NOT_STARTED  # NOT_STARTED | IN_PROGRESS | COMPLETED | PARTIAL
          dependencies: []
          deliverable: "[What this step produces]"
          duration: "[Estimated hours]"

    - phase: "Phase 2: Core Implementation"
      tasks:
        - id: "TASKS.NN.03.xxxx"
          step: "[Implementation task]"
          status: NOT_STARTED
          dependencies: ["TASKS.NN.03.xxxx"]
          deliverable: "[What this step produces]"

# =============================================================================
# Section 4: Execution Commands
# =============================================================================

execution_commands:
  _guidance: |
    Runnable bash/shell commands for each implementation phase.
    Unique to TASKS — no other SDD layer has executable commands.

    Three command categories:
      setup: environment preparation (venv, pip install, mkdir)
      implementation: code generation paths (module creation)
      validation: verification (pytest, mypy, flake8)

  _antipatterns:
    - "FAIL: 'Write the code' — must be specific bash commands"
    - "FAIL: missing validation commands — every implementation needs verification"

  setup:
    - "python -m venv .venv && source .venv/bin/activate"
    - "pip install -r requirements.txt"

  implementation:
    - "mkdir -p src/[module]"
    - "# [Specific implementation command or instruction]"

  validation:
    - "python -m pytest tests/ -v --cov=src/[module] --cov-report=term-missing"
    - "python -m mypy src/[module] --strict"
    - "python -m flake8 src/[module]"

# =============================================================================
# Section 5: Constraints
# =============================================================================

constraints:
  technical:
    - "[Technical constraint — e.g., Python 3.11+, FastAPI framework]"
  quality:
    - "[Quality constraint — e.g., test coverage >=85%]"
  performance:
    - "[Performance constraint — e.g., p95 latency <50ms]"

# =============================================================================
# Section 6: Acceptance Criteria
# =============================================================================

acceptance_criteria:
  functional:
    - "[Verifiable functional outcome]"
  quality:
    - "Test coverage >=85%"
    - "No critical/high severity bugs"
  operational:
    - "[Operational criterion — e.g., health endpoint responds]"

# =============================================================================
# Section 7: Implementation Contracts
# =============================================================================

implementation_contracts:
  _guidance: |
    MANDATORY section. Defines interfaces for contract-first parallel development.
    If no contracts: state "No implementation contracts for this TASKS."

    Contract types (embedded in this section):
      - Protocol Interface: typing.Protocol with method signatures
      - Exception Hierarchy: typed exceptions with error codes
      - State Machine: Enum states with valid transitions
      - Data Model: Pydantic/TypedDict schemas
      - DI Interface: ABC classes for dependency injection

  provided:
    _guidance: "Protocols/interfaces THIS TASKS delivers."
    contracts: []

  consumed:
    _guidance: "External APIs/services THIS TASKS depends on."
    dependencies: []

# =============================================================================
# Section 8: Traceability
# =============================================================================

traceability:
  _guidance: |
    TASKS has the MOST cumulative tags of any layer (8-10).
    Upstream: ALL 10 SDD layers. Downstream: actual source files.

  tags:
    - "@tasks: TASKS-NN"

  upstream:
    spec_references:
      - "@spec: SPEC.NN.05.xxxx"
    tspec_references:
      - "@tspec: TSPEC.NN.04.xxxx"
    req_references:
      - "@req: REQ.NN.03.xxxx"
    ctr_references:
      - "@ctr: CTR.NN.05.xxxx"
    sys_references:
      - "@sys: SYS.NN.04.xxxx"
    adr_references:
      - "@adr: ADR.NN.03.xxxx"
    bdd_references:
      - "@bdd: BDD.NN.03.xxxx"
    ears_references:
      - "@ears: EARS.NN.03.xxxx"
    prd_references:
      - "@prd: PRD.NN.09.xxxx"
    brd_references:
      - "@brd: BRD.NN.07.xxxx"

  downstream:
    _guidance: "Unlike other layers, TASKS downstream is source files — not another SDD layer."
    impl_files:
      - "@impl: src/[module]/[component].py"
    code_paths:
      - "@code: src/[module]/"
    test_files:
      - "@tests: tests/unit/test_[component].py"

  cross_links:
    depends:
      - "@depends: TASKS-NN"
    discoverability:
      - "@discoverability: TASKS-NN (short rationale)"

# =============================================================================
# Section 9: Risk & Mitigation
# =============================================================================

risk_mitigation:
  risks:
    - id: "TASKS.NN.09.xxxx"
      description: "[Risk]"
      likelihood: Medium
      impact: High
      mitigation: "[How to mitigate]"

# =============================================================================
# Section 10: Unit Test Results
# =============================================================================

unit_test_results:
  _guidance: "Populated AFTER implementation. Record test run results."
  test_run:
    date: null
    total_tests: null
    passed: null
    failed: null
    coverage: null
    command: "python -m pytest tests/ -v --cov"

# =============================================================================
# Section 11: Implementation Summary
# =============================================================================

implementation_summary:
  _guidance: "Populated AFTER implementation. Summarize what was accomplished."
  accomplishments: []
  issues_encountered: []
  remaining_work: []

# =============================================================================
# Section 12: Session Log
# =============================================================================

session_log:
  _guidance: |
    Per-session progress tracking. Each entry is one AI agent session.

    SESSION HANDOFF PROTOCOL (for stateless MCP executor calls):
    Each CLI agent call is independent. When starting a new session:
      1. Read this session log — identify last session's state
      2. Check development_plan_tracking — verify pre/post-check status
      3. Read implementation_summary — current state
      4. Check code_inventory — verify files exist and tests pass
      5. Read implementation_plan — find next incomplete step (status != COMPLETED)
      6. Continue from that step — do NOT regenerate completed work

    Handoff state markers:
      NOT_STARTED — not begun
      IN_PROGRESS — started but not finished (check partial_work)
      COMPLETED   — fully done and verified
      PARTIAL     — session ended mid-step (resume from partial_work description)

  sessions:
    - date: "YYYY-MM-DD"
      agent: "[Agent name — Claude/Codex/Gemini/etc.]"
      steps_completed: "[Which implementation plan steps]"
      steps_in_progress: "[Step currently being worked on]"
      partial_work: "[Exactly what's incomplete if session ended mid-step]"
      blockers: "[Any blockers encountered]"
      next_session_directive: "[What the next session should do first]"

  code_inventory:
    _guidance: "Files created/modified — enables next session to verify state."
    files:
      - path: "[src/module/file.py]"
        status: "created"  # created | modified | deleted
        verified: false     # true after tests pass

# =============================================================================
# Section 13: Change History
# =============================================================================

change_history:
  entries:
    - version: "1.0.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial implementation plan"

# =============================================================================
# Glossary
# =============================================================================

glossary:
  terms:
    - term: TASKS
      definition: "AI Implementation Guide — bridges SPEC to source code"
    - term: Execution-Ready
      definition: "Score >=90/100 indicating readiness for code generation"
    - term: Session Handoff
      definition: "File-based state transfer between stateless MCP executor calls"
    - term: IMPLEMENTATION_PLAN
      definition: "Project-level orchestrator organizing TASKS into phased execution"
    - term: "[Domain term]"
      definition: "[Definition]"

# =============================================================================
# End of TASKS-TEMPLATE.yaml
# =============================================================================
