[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucx"
version = "2.0.0"
description = "UCX — Unified Context Framework v2, MCP-first agentic document lifecycle management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "UCX Team" }
]
keywords = [
    "documentation",
    "ai",
    "mcp",
    "agentic",
    "specification-driven-development",
    "document-lifecycle",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    # MCP server (primary interface)
    "fastmcp>=0.1",
    # Data models and configuration
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # AI providers (multi-provider via LiteLLM)
    "litellm>=1.40",
    "tiktoken>=0.5",
    # Observability
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
# No CLI entrypoint — MCP server is the primary interface
ucx-mcp = "ucx.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ucx"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Discover all test subdirectories: unit/, smoke/, regression/, mcp/
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Markers used in the test suite
markers = [
    "anyio: async tests via anyio",
    "smoke: end-to-end plumbing tests (no AI calls)",
    "regression: contract stability tests",
    "unit: pure unit tests with no IO",
]
