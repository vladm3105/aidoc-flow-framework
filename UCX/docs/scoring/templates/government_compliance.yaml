# UCX Scoring Template: Government/Defense
# Version: 1.0.0
#
# Industry-specific compliance keywords and weight adjustments
# for government, defense, and aerospace applications.
#
# Usage in project config (docs/UCX/scoring_weights.yaml):
#   extends: government_compliance

