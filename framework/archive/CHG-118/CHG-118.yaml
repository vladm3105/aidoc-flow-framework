# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-118)
# =============================================================================

decision:
  decision_id: "DEC-CHG-118"
  title: "Native SDD Graph Migration for Tier 2 Module Specifications"
  status: "Ratified"
  context: |
    The Dual-Plane CQRS Architecture established in framework/governance/DOC_GOVERNANCE_CORE.md Rule 2 dictates:
    "YAML is the mandatory format and the source of truth... Markdown is optional and descriptive: a rendering
    of the YAML... Where a .md file restates YAML content it is generated, not authored."

    All 10 SDD layers (BRD through EVAL) operate on typed Property Graphs (*-GRAPH-TEMPLATE.yaml) and CNCF
    Serverless Workflows. Furthermore, Tier 1 Initiatives have INITIATIVE-GRAPH-TEMPLATE.yaml (schema_version:
    "2.0-graph") and Tier 3 execution has EXECUTION-GRAPH-TEMPLATE.yaml. However, Tier 2 Modules
    (framework/templates/MODULE-TEMPLATE.md) were authored as raw Markdown documents with frontmatter.

    While SDD_GRAPH_SCHEMA_SPECIFICATION.md and sdd-graph.schema.json already reserve the system_container
    node ontology for MODULE-NN, there was no canonical template, projection adapter, or multi-hop relationship
    wiring in Kùzu to complete the 3-tier continuum (Tier 1 Initiative -> Tier 2 Module -> Tier 3 Execution).
  choice: |
    Execute comprehensive Tier 2 Module graph migration per the verified plan:
    1. Author framework/templates/MODULE-GRAPH-TEMPLATE.yaml adhering strictly to sdd-graph.schema.json,
       capturing Triple-Lens modeling (C4-L2 Container, DFD-L2 Data Movement, Process Choreography).
    2. Enhance sdd_doc_lint/observability_adapter.py with render_module_spec (emitting line 1 '---' frontmatter)
       and Mermaid sequence/DFD diagram renderers.
    3. Update sdd_doc_lint/__main__.py adding sequence and dfd diagram types and auto-dispatching --render-spec.
    4. Harmonize sdd_doc_lint/kuzu_adapter.py with extended system_container DDL, parameterized ingest_graph(),
       and multi-hop decomposes_to and constrains rel tables.
    5. Add CLI entrypoint, GRAPH-CARD-001 invariant check, and extract_slice_subgraph to sdd_doc_lint/graph_engine.py.
    6. Align governance specifications: MODULE_LAYOUT.md, OBSERVABILITY_ADAPTER_CONTRACT.md, DIAGRAM_STANDARDS.md,
       SEED_CONTRACT.md, SEED_TO_MODULE_DECOMPOSITION.md, and seed-to-module-decomposition.sw.yaml.
    7. Extend conformance tests in tests/conformance/test_module_contract.py and test_sdd_graph_schema.py,
       and add unit tests for adapter and Kùzu ingestion.
  consequences: |
    - Completes the 3-tier SDD graph continuum with zero gaps across Tier 1, Tier 2, and Tier 3.
    - Preserves 100% backward compatibility: MODULE-TEMPLATE.md remains the authoritative visual layout standard.
    - Autonomous agents gain native property graph authoring for module subsystems.
    - End-to-end machine-traceable decomposition: seed_intent -> system_container -> component_contract.
    - All existing conformance and acceptance test suites pass with zero regressions.
  alternatives_considered:
    - option: "Retain Markdown authoring for modules and parse frontmatter"
      rationale_rejected: >-
        Rejected because parsing Markdown frontmatter violates Dual-Plane CQRS (DOC_GOVERNANCE_CORE.md Rule 2),
        prevents multi-hop Cypher queries across modules, and blocks topological BTV validation.
    - option: "Introduce separate non-standard YAML format for modules"
      rationale_rejected: >-
        Rejected because sdd-graph.schema.json already defines the unified Native SDD Property Graph schema
        (slice_id: MODULE-NN, system_container), and diverging would fragment the analytical read plane.

# =============================================================================
