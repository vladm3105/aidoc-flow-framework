# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-122)
# =============================================================================

decision:
  decision_id: "DEC-CHG-122"
  title: "Formal Decision: SDD Upstream Quality Assurance, Gate Parity, SDD Assembly Line & Frictionless IPLAN Execution"
  date: "2026-10-19"
  status: Accepted
  context: |
    In the 10-layer SDD framework, Layer 08 (IPLAN) is the code mutation plane. When upstream documents
    contain ambiguities, untestable acceptance criteria, missing interface schemas, or uncompensated test
    fixtures, autonomous coding agents absorb the failure—causing execution timeouts, cyclic remediation retries,
    or execution stalls (ExecutionBlockedTerminal). Furthermore, legacy percentage-based readiness scores in GATE-06
    conflict with SDD-0044 binary topological validation (tdd_ready_status: PASS). In addition, tri-surface gate
    parity across gate definition files, GATE_ERROR_CATALOG.md, and GATE_APPROVAL_FORM.md required synchronization
    for newly ratified IPLAN and SPEC gates, and the overarching manufacturing assembly line concept required
    formal codification in governance.
  choice: |
    Implement upstream quality assurance and frictionless execution enhancements per plans/SDD-UPSTREAM-ASSURANCE-AND-IPLAN-EXECUTION-PLAN.md:
    1. Harden GATE-06 and GATE-08 across tri-surface parity (definition files, error catalog, approval forms in both
       framework/layers/09_CHG/ and framework/governance/chg/):
       - Purge legacy 'score >= 90%' in GATE-06_DESIGN_TEST.md and GATE_APPROVAL_FORM.md; update GATE-06-E001 to binary
         topological validation (tdd_ready_status: PASS).
       - Add GATE-06-E005 (SPEC toolchain ownership) and GATE-06-E006 (TDD fixture saga teardown compensation).
       - Elevate GATE-08-W003 to blocking error GATE-08-E005 (mandatory saga rollback compensation on mutating states),
         and cleanly retire/remove GATE-08-W003 across definitions, catalog, and form.
       - Add GATE-08-E006 (step-execution completeness) and GATE-08-E007 (mutating execution timeouts).
    2. Add explicit toolchain: mapping under component_overview: in SPEC-TEMPLATE.yaml and SPEC-SWF-TEMPLATE.yaml
       (language, runtime_version, package_manager, setup_command, type_check_command, test_runner_command).
    3. Mandate fixture_hermeticity: guidelines with compensatedBy: TeardownFixturesCompensation under test_strategy:
       in TDD-TEMPLATE.yaml and TDD-SWF-TEMPLATE.yaml.
    4. Update EVAL-SWF-TEMPLATE.yaml and eval-verification-run.sw.yaml with verifyReceiptSeal and checkTreeInvariance
       actions in pre-flight state, transitioning through EvaluateReceiptGate switch to ExecutionBlockedTerminal on signature/tree drift.
    5. Author framework/governance/SDD_ASSEMBLY_LINE.md ("The SDD Assembly Line to IPLAN & EVAL"), index it in
       framework/governance/README.md, and register it in EXPECTED_FILES in tests/conformance/test_governance.py.
    6. Add test_gate_06_and_gate_08_execution_shielding_invariants in test_governance.py.
    7. Bump framework/VERSION from 0.96.8 to 0.96.9 per GATE-SPEC-E005, append 0.96.8 to OLD_VERSIONS, and fan out pins.
  consequences: |
    - Upstream specifications (SPEC & TDD) strictly own toolchain and fixture cleanup, shielding IPLAN from developer hallucination.
    - Mutating steps in IPLAN cannot proceed without automated rollback compensation and wall-clock execution timeouts.
    - Tri-surface gate parity across definition, catalog, and form is mathematically preserved.
    - Layer 10 EVAL post-validates Layer 08 execution receipts cryptographically before running test suites.
    - Preserves 100% compatibility with deterministic acceptance fixtures in tests/acceptance/.
    - Requires framework version bump from 0.96.8 to 0.96.9 per GATE-SPEC-E005.
  alternatives_considered:
    - option: "Retain legacy percentage score >= 90% alongside binary topological validation"
      rationale_rejected: >-
        Rejected per SDD-0044: percentage-based readiness scores produce false passes and subjective evaluations;
        deterministic binary topological validation (PASS/FAIL) provides non-ambiguous machine enforcement.
    - option: "Add top-level toolchain and hermeticity sections to SPEC-TEMPLATE.yaml and TDD-TEMPLATE.yaml"
      rationale_rejected: >-
        Rejected to protect frozen golden acceptance fixtures: nesting under existing top-level keys
        (component_overview and test_strategy) ensures 100% backward compatibility with tests/acceptance/deterministic/.

