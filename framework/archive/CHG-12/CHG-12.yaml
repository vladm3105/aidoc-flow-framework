# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Remove every no-CHG/no-IPLAN carve-out for post-seed activity: F2.2 docs-only direct commit, the AGENTS.md (i)/(ii) exceptions, the §3.13 IPLAN-Gate repeat, router step 5, and both CHG-TEMPLATE C1 rows now require a C1 CHG + scoped IPLAN for ALL authors (agents and humans); the sole exception is seed-phase drafting pre-first-BRD (SEED_CONTRACT R1 boundary, seed_scope create). This supersedes the F2-UNIFY-PLAN D2 decision (human-only direct-commit exception retained) — #773's owner-directed rule overrides it. Enforcement vehicle (mandatory deliverable per the #772 plan): reviewer-lens — the PR reviewer verifies every commit rides a CHG+IPLAN, backstopped by branch protection (no direct pushes to dev/main exist); GOV-018 stays a syntactic code-manifest guard with a scope note. MINOR bump 0.62.7 → 0.63.0."
  why: "Untracked changes succeed silently (exit 0, no lint tripwire — GOV-018 fires only on code/script manifests), so the absence of a record is the defect (issues #772, #773 — same class). As an Agent-first framework, every post-seed change must be traced: requester citation, file manifest, verification record, status lifecycle. The carve-outs removed here ARE the current contract, so this is a rule change, not a contradiction fix."
  trigger: "Owner direction 2026-09-28 (Agent-first trackability) + issue #773 (rule) + issue #772 (gap, same files)."
  breaking_change_analysis: "C2 (not C3): no gate/ID/schema/enum removed — `direct` source, GATE-CODE entry, and C1 level all survive; the change ADDS a tracking obligation (C1 CHG + scoped IPLAN, minimal shape keeps trivial edits cheap) rather than removing a capability. Existing CHG/IPLAN records are unaffected; 0.x line. Contract-tightening for consumers relying on direct commit is acknowledged — reviewer may escalate to C3 at PR review, in which case E004 (human approver) applies before merge."
  d2_supersede: "F2-UNIFY-PLAN D2 (retain direct commit as explicit human-only exception, rejected candidate: full removal) is SUPERSEDED by #773: the rejected candidate becomes the adopted rule. New rejected candidate: retain-human-exception (rationale: trivial human typos stay cheap) — rejected because Agent-first trackability requires every post-seed change traced regardless of author; cheapness is preserved by the minimal C1 CHG + scoped IPLAN shape. Recorded here per the router mandate (rejected candidate + one-line rationale)."
  enforcement_decision: "Reviewer-lens (not a new linter emitter). Rationale: chg_lint validates RECORDS, not commits — the absence of a CHG for a commit is invisible to it, and teaching it to scan commit history is out of vehicle scope. Branch protection already forces every change through a PR, so the review gate is total: the PR reviewer checks every commit against the authorizing CHG/IPLAN file manifest. GOV-018/CHG-L013 stay syntactic (code/script manifest + empty lifecycle) with a scope note pointing at this decision."
  scope:
    in:
      - "governance/CHG_REQUEST_FLOWS.md F2.2 rewrite (no direct commit; C1 always CHG + scoped IPLAN, all authors; seed-phase sole exception) + router step 5 + §8(c) (F2 selection always-traced; rejected-candidate record updated) + F2.3/F2.4 wording touch-ups (Version 1.1 → 1.2)"
      - "DOC_GOVERNANCE_CORE.md §3.1.3 F2 row + intro line 176-177 (docs-only direct-commit fix) + §3.13 F2.2 paragraph (Version 1.0 → 1.1)"
      - "CHG-TEMPLATE.yaml both copies: C1 row requires C1 CHG + scoped IPLAN for all authors/all content; sole exception seed-phase drafting pre-first-BRD (identical — no fork widening)"
      - "both 09_CHG READMEs: C1 row + Direct routing row + flows pointer (identical per #770)"
      - "LINT_RULES.md: GOV-018 scope note (reviewer-lens enforcement decision + branch-protection backstop; guard stays syntactic)"
      - "AGENTS.md: Governance Gate exceptions collapse to the single seed-phase exception; IPLAN Gate paragraph same (root working agreement, not an SDD doc — files_modified only, no lifecycle entry, per CHG-07 precedent)"
      - "framework/governance/DECISIONS.md: GD-37 entry (mandatory trackability + D2 supersede)"
      - "plans/F2-UNIFY-PLAN.md: D2 amended (superseded by #773), status updated (plan file, not an SDD doc)"
      - "tests/conformance/test_chg_flows_router.py: agreement rows updated to unified wording (F2.2, C1 rows, router step 5, §8(c))"
      - "MINOR bump 0.62.7 → 0.63.0: VERSION + changelogs + machine-pin fanout (sync-version-refs clean)"
      - "SECURITY_REVIEW W003 assessment recorded in this CHG (verification section)"
    out:
      - "Emergency / Type-R paths — untouched"
      - "Seed versioning / supersede mechanics (SEED_CONTRACT R1 boundary reused, not amended)"
      - "Bugfix vehicle (C1 CHG + bugfix IPLAN) and F2 code-touching C1-direct — already carry both objects, compliant, unchanged"
      - "chg_lint engine changes — no new emitter (reviewer-lens enforcement decided above)"
      - "Other flows (F1/F3/F4 routing), platform code, consumer content"

