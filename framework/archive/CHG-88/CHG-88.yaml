# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-88)
# =============================================================================

decision:
  decision_id: "DEC-CHG-88"
  title: "Universal AI-First 5-Quadrant YAML Index Architecture Across All SDD Layers"
  status: "Accepted"
  context: |
    Following the ratification of Decision GD-74 (modernizing Layer 05 ADR index to YAML with embedded technology
    registry) and the pre-existing Layer 08 YAML index (IPLAN-00_index.TEMPLATE.yaml), the remaining eight SDD
    layers (01_BRD, 02_PRD, 03_EARS, 04_BDD, 06_SPEC, 07_TDD, 09_CHG, 10_EVAL) retained legacy Markdown index
    templates (*-00_index.TEMPLATE.md). In an agentic, AI-first workflow, Markdown tables require brittle regex
    parsing and encourage dual-entry bookkeeping drift. Making machine-readable YAML the sole source of truth across
    all 10 SDD layers enables deterministic AI ingestion, automated cross-layer trace verification, and dynamic
    generation of human-facing documentation on demand.
  choice: |
    1. Modernize all remaining 8 layer index templates from Markdown (*-00_index.TEMPLATE.md) to YAML (*-00_index.TEMPLATE.yaml).
    2. Establish a canonical 5-Quadrant YAML schema across all 10 layers:
       - Quadrant 1: Metadata (schema_version: "1.0", framework_version, document_type, artifact_type: "<LAYER>-INDEX", format_ssot)
       - Quadrant 2: Document Registry (typed collection of active layer instances)
       - Quadrant 3: Backlog (planned, sketch, or proposed future work)
       - Quadrant 4: Layer Intelligence & Cross-Layer Traceability (domain metrics, coverage matrices, quality gates)
       - Quadrant 5: Agent Update Triggers (declarative lifecycle rules for automated index maintenance)
    3. Archive pre-change Markdown templates under framework/archive/CHG-88/templates/.
    4. Synchronize LAYER_REGISTRY.yaml header, layer READMEs, workflow standards, and root README.md.
    5. Ratify Decision GD-75 in DECISIONS.md and advance framework spec version to 0.91.7.
  consequences: |
    - Complete format uniformity across all 10 SDD layer indices (100% YAML).
    - Eliminates documentation drift between machine-readable schemas and human tables.
    - AI agents can parse, validate, and maintain layer registries deterministically.
    - Mutation test test_instance_format_ssot.py drops from 12 to 6 sanctioned index mentions.
  alternatives_considered:
    - option: "Option 1: Retain Markdown index templates for non-technical layers (BRD, PRD)"
      rationale_rejected: "Rejected. Creates asymmetric parsing models where AI agents must maintain Markdown tables in business layers and YAML in technical layers."
    - option: "Option 2: Dual Markdown and YAML files in each layer"
      rationale_rejected: "Rejected. Dual files inevitably drift out of sync. Machine-readable YAML is the single source of truth; human views are rendered on-demand."

