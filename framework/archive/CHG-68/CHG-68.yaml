# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Upstream autonomous execution flow patterns proven in b-local-privy into the framework: embed companion Mermaid stateDiagram-v2 in CHG_REQUEST_FLOWS.md, formalize the Multi-Tier Circuit Breakers Matrix (CB-1..CB-6), introduce testing_plan schema in CHG templates, formalize Layer 10 terminal evaluation gate, author AIDOC-CHG-EXECUTION-FLOW-TEMPLATE.md, update adaptation guidance for Issue #894, and bump framework to 0.87.0."
  what: |
    1. Embed the missing companion Mermaid stateDiagram-v2 in framework/governance/CHG_REQUEST_FLOWS.md representing the normative CNCF Serverless Workflow state machine (chg-request-flow.sw.yaml) per DIAGRAM_STANDARDS.md.
    2. Add the Multi-Tier Circuit Breakers Matrix (CB-1 through CB-6) to framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md, cross-referencing CI_AUTONOMOUS_PR_STANDARD.md and REVIEW_REMEDIATION_FLOW.md.
    3. Add structured testing_plan schema (test_matrix: unit, integration, e2e_api, e2e_ui, static; bdd_mapping; isolation_rules) to both CHG-TEMPLATE.yaml copies (governance and layer 09_CHG) and document in 09_CHG/README.md.
    4. Formalize the Layer 10 terminal evaluation gate in DOC_GOVERNANCE_CORE.md §4.1 and GOVERNANCE_WORKFLOW_STANDARD.md (IPLAN: Completed → Verified, CHG: Implemented → Completed require authentic EVAL report with status: PASS).
    5. Author framework/governance/aidoc/AIDOC-CHG-EXECUTION-FLOW-TEMPLATE.md as the operational blueprint for consumer projects (.aidoc/project/governance/CHG_EXECUTION_FLOW.md).
    6. Update docs/ADAPTATION-GUIDE.md and AIDOC-SCAFFOLD-TEMPLATE.md to resolve Issue #894, establishing concrete .aidoc/project blueprints, automated evaluation ingestion contracts, and client hook integration (hooks.json).
    7. Register AIDOC-CHG-EXECUTION-FLOW-TEMPLATE.md in tests/conformance/test_governance.py EXPECTED_FILES.
    8. Record Decision GD-62 in framework/governance/DECISIONS.md, bump framework/VERSION to 0.87.0, and document release in framework/CHANGELOG.md.
  why: "Synthesizes battle-tested autonomous governance execution, anti-infinite-loop circuit breakers, and concrete adaptation scaffolding into the canonical framework, closing open documentation gaps and resolving Issue #894."
  trigger: "Review of b-local-privy CHG_EXECUTION_FLOW.md, user direction to resolve identified gaps, and Issue #894."
  scope:
    in:
      - "framework/governance/CHG_REQUEST_FLOWS.md: Mermaid stateDiagram-v2 diagram"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: Circuit Breakers Matrix and terminal evaluation gate"
      - "framework/governance/DOC_GOVERNANCE_CORE.md: Layer 10 terminal lifecycle gate"
      - "framework/governance/CI_AUTONOMOUS_PR_STANDARD.md: cross-reference circuit breakers"
      - "framework/governance/chg/CHG-TEMPLATE.yaml & framework/layers/09_CHG/CHG-TEMPLATE.yaml: testing_plan schema"
      - "framework/layers/09_CHG/README.md: document testing_plan schema"
      - "framework/governance/aidoc/AIDOC-CHG-EXECUTION-FLOW-TEMPLATE.md: new scaffold template"
      - "framework/governance/aidoc/AIDOC-SCAFFOLD-TEMPLATE.md: reference execution template"
      - "docs/ADAPTATION-GUIDE.md: concrete blueprint, evaluation ingestion, and hooks.json"
      - "tests/conformance/test_governance.py: register new governance file in EXPECTED_FILES"
      - "framework/governance/DECISIONS.md: record GD-62"
      - "framework/VERSION: bump 0.86.1 → 0.87.0"
      - "framework/CHANGELOG.md: 0.87.0 release notes"
    out:
      - "No runtime project code added to framework/ (engine-agnostic purity preserved per D-0013)"

