# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-137)
# =============================================================================

decision:
  decision_id: "DEC-CHG-137"
  title: "Add non-normative consumer deployment guide; leave AGENTS.md and framework/ untouched"
  status: "Decided"
  date: "2026-10-27"
  context: >-
    Issue #1050: the stack mandates Compose for dev and OpenTofu for
    stage/prod, but this repo offers consumers no deployment guide, and
    AGENTS.md (the agent working agreement) carries no deployment content.
    Placement decided with the operator: new docs/ guide (not an AGENTS.md
    amendment, not a normative framework/ mandate, not another repo).
  choice: >-
    Author docs/CONSUMER-DEPLOYMENT-STANDARD.md as non-normative consumer
    guidance with per-mandate citations to stack specs 11/16/21, preserving
    the precise split (stage services stay Compose per spec 16 §3.2; tofu
    owns Day-0/Day-2, never merged). Index in docs/README.md; one pointer
    line in ADAPTATION-GUIDE.md beside the CI-starter pointer. No version
    bump: no normative files change, so E005 does not trigger.
  consequences:
    positive:
      - Consumers inherit the verified standard instead of rediscovering it;
        guide cites authority per mandate, so stack drift is greppable.
    negative:
      - None; additive docs only, no behavior change anywhere.
    risks:
      - Stack specs evolve and the guide drifts; mitigated by per-mandate
        section citations and stating only what the specs support.

