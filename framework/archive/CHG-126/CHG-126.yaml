# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-126)
# =============================================================================

decision:
  decision_id: "DEC-CHG-126"
  title: "Consolidate AIDOC Workstation Documentation Topology and Formalize doc_lint Parity"
  status: "Decided"
  date: "2026-10-23"
  context: >-
    In AIDOC.md, the high-level tier overview historically referenced a phantom root-level
    chg/ folder, omitted the explicit tier placement of architectural modules (docs/modules/)
    and seeds (docs/seed/), and did not yet reflect the linter modernization from CHG-125
    which introduced doc_lint with sdd_doc_lint backward compatibility.
  choice: >-
    1. Update the 4-tier diagram and table in AIDOC.md to represent the unified docs/
       hierarchy: docs/seed/ (Inputs), docs/modules/ (Domain Architecture), and docs/sdd/
       (Process Chain with 09_CHG governance and pre-change archives).
    2. Clarify atomic seed archiving under docs/sdd/09_CHG/archive/{CHG-ID}/seed/.
    3. Update the Quad-Pillar .aidoc/ tree to reflect doc_lint/ as the canonical structural
       linter with sdd_doc_lint alias support.
    4. Bump framework/VERSION from 0.96.11 to 0.96.12 per GATE-SPEC-E005.
  consequences:
    positive:
      - Removes confusion around non-existent root chg/ directory.
      - Fully aligns AIDOC.md with SEED_CONTRACT.md, MODULE_LAYOUT.md, and CHG-125.
      - Clarifies how seeds, modules, and SDD layers version atomically inside 09_CHG archives.
    negative:
      - None.
    risks:
      - None; purely normative specification clarification without behavioral regressions.

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    AIDOC.md contained outdated tier descriptions citing root-level chg/, lacked clarity
    on seed and module paths, and did not reflect doc_lint naming with sdd_doc_lint compatibility.
  scope:
    - framework/governance/aidoc/AIDOC.md topology and linter nomenclature.
    - framework/VERSION bump to 0.96.12 and sync-version-refs propagation.

