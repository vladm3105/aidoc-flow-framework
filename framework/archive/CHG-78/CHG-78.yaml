# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: |
    Prepare aidoc-flow-framework for new project kickoff by aligning adaptation
    governance, synchronizing operational blueprints, and providing an actionable
    startup handoff:
    (1) ADAPTATION_SURFACE.yaml: Complete cascade_rule by declaring EVAL upstream
        baseline (EVAL=[ears, bdd, tdd, iplan]) and its reduction to [ears, tdd, iplan]
        when BDD is skipped; clarify in comments that layers.mandatory/skippable partition
        the 8 sequential document authoring layers while Layer 09 (CHG) and Layer 10 (EVAL)
        remain mandatory fixtures;
    (2) ADAPTATION.md: Synchronize §2 profile example schema_version to "1.1.0"; update §11
        enforcement table to mandate project-level AGENTS.md instead of retired CLAUDE.md;
        provide a minimal copy-pasteable consuming project AGENTS.md starter skeleton;
    (3) PROFILE-TEMPLATE.yaml: Add # EVAL: 90 to sample audit_threshold block and clarify
        the 10-layer model in active_layers commentary;
    (4) AIDOC-SCAFFOLD-TEMPLATE.md: Add operational blueprints 7 & 8 (Durable Multi-Agent
        Execution Standard and Graph-Based Review Flows) to §"Autonomous Execution & Operational Standards";
    (5) docs/ADAPTATION-GUIDE.md: Bump document version to 0.90.1; establish install.sh and
        BOOTSTRAP.md as the primary automated onboarding path; index blueprints 9 & 10 (Durable
        Execution & Review Workflows); add AGENTS.md project agreement configuration guide;
    (6) docs/STARTUP_HANDOFF.md: Prepend Section 0 (Project Kickoff Quickstart 0.90.1) directing
        new projects to modern onboarding paths while preserving sections 1-5 intact for DECISIONS.md
        historical citation integrity.
  why: "Ensure that teams initiating new projects with version 0.90.1 have complete, accurate, automated, and conflict-free documentation and operational blueprints."
  trigger: "User request to audit onboarding documentation and prepare the framework for new project kickoff."
  scope:
    in:
      - "framework/governance/ADAPTATION_SURFACE.yaml: cascade_rule and layer partition comments"
      - "framework/governance/ADAPTATION.md: schema_version, AGENTS.md enforcement, starter skeleton"
      - "framework/governance/PROFILE-TEMPLATE.yaml: EVAL threshold and active_layers comments"
      - "framework/governance/aidoc/AIDOC-SCAFFOLD-TEMPLATE.md: blueprints 7 & 8"
      - "docs/ADAPTATION-GUIDE.md: automated install.sh path, version bump, blueprints, AGENTS.md guide"
      - "docs/STARTUP_HANDOFF.md: Section 0 Kickoff Quickstart while preserving historical sections"
      - "framework/CHANGELOG.md: 0.90.1 release entry"
    out:
      - "No breaking changes to framework spec (version stays 0.90.1)"
      - "No changes to core linters or test suite assertions"

