change_description:
  summary: "Add a 'Runtime boundary — engine-local' paragraph under the Scope section of framework/governance/SECURITY_REVIEW.md declaring LLM egress allowlists, network-sandbox expectations, and the runtime secret-store interface engine-local (each platform declares and enforces its own; the spec sets no formats and conformance does not check them). Artifact-hygiene rules byte-identical. PATCH cut 0.68.5 (VERSION bump + sweep + both changelogs) per GATE-SPEC E005/E008."
  why: "Issue #847 confirmed live: the framework governs artifact secret hygiene but names no runtime dimension, and worktree isolation reads as isolation full-stop. The smaller defensible close is an explicit engine-local declaration at the point of confusion — a normative runtime subsection would prescribe engine internals the engine-agnostic spec cannot verify."
  trigger: "Issue #847 triage note 2026-10-01 + workflow parent task (smaller defensible shape, CHG-39 vehicle)."
  scope:
    in:
      - "framework/governance/SECURITY_REVIEW.md: one paragraph under Scope (engine-local declaration; rules/checklist/threats untouched)"
      - "framework/archive/CHG-39/CHG-39.yaml + IPLAN-39.yaml (this vehicle)"
      - "framework/VERSION 0.68.4 → 0.68.5 + hooks/sync-version-refs.sh (OLD_VERSIONS gains 0.68.4) + sweep (E005/E006 driver; pin moves only)"
      - "CHANGELOG.md + framework/CHANGELOG.md [0.68.5] sections (E008 driver)"
    out:
      - "Normative runtime subsection (rejected — see header Decision)"
      - "Artifact-hygiene rules, threats T1-T4, review checklist (frozen — byte-identical)"
      - "DECISIONS.md (no prior decision to supersede); TAGGING.md (separate vehicle)"

