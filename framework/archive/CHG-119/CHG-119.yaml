# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-119)
# =============================================================================

decision:
  decision_id: "DEC-CHG-119"
  title: "Formal Decision: Layer 10 (EVAL) Native Graph Completion & Harmonization"
  date: "2026-10-19"
  status: Accepted
  context: |
    Layer 10 (EVAL) property graph slice template EVAL-GRAPH-TEMPLATE.yaml defines
    evaluation_suite nodes with 'verifies' edges pointing to upstream tasks, fixtures,
    and requirements. However, Kùzu's verifies relation table schema lacked bindings
    for evaluation_suite sources, causing ingestion errors. Additionally, EVAL-GRAPH-TEMPLATE.yaml
    contained legacy percentage readiness score references, and SDD_GRAPH_SCHEMA_SPECIFICATION.md
    omitted evaluation_suite from the Section 4 edge ontology diagram and cardinality table.
  choice: |
    Execute comprehensive Layer 10 EVAL graph completion per the verified plan:
    1. Harmonize Kùzu Graph Adapter by extending REL_TABLE_SCHEMAS['verifies'] with
       multi-pair target DDL (FROM evaluation_suite TO task_action, test_fixture, formal_requirement)
       and store eval_track/environment attributes in NODE_TABLE_SCHEMAS['evaluation_suite'].
    2. Clean EVAL-GRAPH-TEMPLATE.yaml by removing legacy evaluation_ready_target.
    3. Formalize GRAPH-CARD-010 (Evaluation Verification Invariant) in SDD_GRAPH_SCHEMA_SPECIFICATION.md
       and enforce it in sdd_doc_lint/graph_engine.py.
    4. Enhance sdd_doc_lint/observability_adapter.py to project eval_track, environment,
       and benchmark_thresholds.
    5. Persist workflow learnings to .aidoc/learning/learnings.md and AGENTS.md.
    6. Bump framework/VERSION to 0.96.6 and synchronize version references repo-wide.
  consequences: |
    - Layer 10 EVAL graphs achieve 100% operational parity with Layers 01–08 and Modules.
    - Kùzu graph database ingestion supports all evaluation verification relationships.
    - BTV topological validation checks evaluation verification coverage (GRAPH-CARD-010).
    - Reusable workflow learnings are recorded in repo-wide documents of record.
    - Requires framework version bump from 0.96.5 to 0.96.6 per GATE-SPEC-E005.
  alternatives_considered:
    - option: "Leave verifies DDL as single-pair and ignore Kùzu EVAL edge failures"
      rationale_rejected: >-
        Rejected because broken Kùzu ingestion prevents querying evaluation coverage via openCypher.
    - option: "Retain evaluation_ready_target percentage score"
      rationale_rejected: >-
        Rejected because percentage readiness scores were retired across all SDD layers in favor of BTV.

