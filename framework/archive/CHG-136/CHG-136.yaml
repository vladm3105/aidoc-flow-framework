# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-136)
# =============================================================================

decision:
  decision_id: "DEC-CHG-136"
  title: "Remediate consumer kickoff/deployment gaps via DIR2C tooling/docs change"
  status: "Decided"
  date: "2026-10-27"
  context: >-
    Kickoff/deployment review filed #1041-1045 (G1 reproduced live on a
    throwaway scaffold; G2/GAP-2/GAP-3/nits verified by file reads; GAP-1
    closed as intended behavior). The defects are tooling/docs scope with
    no product-behavior change, fitting DIR2C C1.
  choice: >-
    Fix under DIR2C: reproduce-first G1 (scaffold-scoped exemption or valid
    seed ADR), root-path reconciliation for stack-policy.yaml (template +
    guides + tests), pre-commit wiring scaffold-or-document decision,
    --canon forwarding through deploy.sh or documented local-canon intent,
    pin-currency reuse, deploy-subtype documentation, and wording nits.
    Bump framework/VERSION 0.96.18 -> 0.96.19 with OLD_VERSIONS + pin
    propagation. Single PR with Closes #1041, Closes #1042, Closes #1043,
    Closes #1044, Closes #1045 (one keyword per reference).
  consequences:
    positive:
      - Fresh scaffolds pass the guide's own verification; template and
        installer agree; consumers receive gate wiring or an explicit
        pointer; no parallel drift machinery.
    negative:
      - None; tooling/docs scope, covering tests updated in the same PR.
    risks:
      - Scaffold-scoped lint exemptions could mask real placeholders;
        mitigated by scoping to scaffold/template paths only.

