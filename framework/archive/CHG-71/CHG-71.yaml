# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Dual-Layer Traversal-Path Graph Nomenclature for LangGraph & Rust Rig"
  author: "Framework Maintainer"
  date_submitted: "2026-10-06T00:00:00Z"
  summary: "Transition framework change request governance from legacy alphanumeric codes (F1-F4, Type-R, Emergency) to an engine-ready Dual-Layer Traversal-Path Graph Nomenclature: (1) Canonical Runtime Identifiers in snake_case (hotfix, code_to_sdd, code_to_code, seed_to_code, iplan_to_code, sdd_to_code) for native zero-friction execution in LangGraph (Python/TypeScript) and Rust Rig (rig-core); (2) Unambiguous Graph Codes in 5-6 character mnemonic tags (HOTFIX, CODE2S, CODE2C, SEED2C, DIR2C, SDD2C) eliminating 3-letter hardware and domain collisions; and synchronize CNCF Serverless Workflows, core governance specs, templates, and static linters."
  rationale: |
    As the framework transitions toward graph-based orchestration with LangGraph and Rust Rig execution engines:
    1. Hyphenated slugs (seed-to-code) or legacy alphanumeric codes (F1..F4) do not map directly to programming language function names, graph channel keys, or Rust enum variants without runtime translation shims.
    2. 3-letter codes (I2C, D2C, S2C, C2C) risk colliding with well-known global standards (hardware I2C bus, direct-to-consumer e-commerce). 5-6 character mnemonic codes (HOTFIX, CODE2S, CODE2C, SEED2C, DIR2C, SDD2C) completely eliminate ambiguity.
    3. F1 was architecturally mislabeled as 'full-cascade-flow' when it only covers the SDD layers; SEED2C is the true full multi-tier chain (Seed -> Module -> SDD -> Code). Traversal paths are now explicitly embedded in the governance taxonomy.

# =============================================================================
# Section 3: Scope & Impact Analysis
# =============================================================================

scope:
