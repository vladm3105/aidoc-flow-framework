    - "framework/governance/DOC_GOVERNANCE_CORE.md: Update §3.1.3 table with Graph Code & Flow and Traversal Scope, and update router sequence prose"
    - "framework/governance/chg/CHG-TEMPLATE.yaml: Add flow and flow_code fields to change_control"
