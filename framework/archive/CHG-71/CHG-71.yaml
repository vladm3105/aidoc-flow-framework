    - "framework/governance/aidoc/AIDOC-CHG-EXECUTION-FLOW-TEMPLATE.md: Update Invariant 13 Approval Authority Matrix mapping C1 to DIR2C/CODE2C and C2 to CODE2S/SEED2C"
    - "sdd_doc_lint/chg_lint.py: Update check_flow_misclassification (CHG-L013) to validate flow and flow_code enums, check parity, and emit traversal-path diagnoses"
    - "tests/conformance/test_chg_flows_router.py: Add DualLayerGraphNomenclatureAgreement test suite and linter parity validation"
    - "framework/governance/DECISIONS.md: Ratify Decision GD-65"
    - "framework/CHANGELOG.md: Document ratification of Dual-Layer Traversal-Path Graph Nomenclature under [0.88.1]"
  backward_compatible: true
