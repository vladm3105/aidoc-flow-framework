# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-83)
# =============================================================================

decision:
  decision_id: "DEC-CHG-83"
  title: "Platform Technology Stack Alignment, Vendor-Agnostic Core Specifications Readiness, and Scaffolding Blueprints"
  status: "Ratified"
  context: |
    The platform has finalized its authoritative technology stack across 10 reference documents (00 through 09):
    Debian 13, Docker CE + gVisor runsc, Traefik v3, Authentik, Infisical, Laya + LiteLLM, Temporal Server,
    LangGraph Core, PostgreSQL 18 + Bytebase AI MCP, ClickHouse, HyperDX, Langfuse, and NATS JetStream.
    The framework (v0.91.2) shares 95% conceptual parity in its 3-tier durable execution model, thin control plane,
    and telemetry attributes, but lacked concrete scaffolding, blueprints, and layer contract readiness for this stack.
    Per Decision D-0013 / GD-13, the core framework must remain strictly engine-agnostic without vendor lock-in.
  choice: |
    1. Preserve strict vendor- and platform-agnosticism across all core framework specifications (layers 01-10)
       while extending Layer 06 SPEC, Layer 07 TDD, Layer 10 EVAL, DURABLE_EXECUTION_STANDARD.md, WORKTREE_FLOW.md,
       and ENGINE_TELEMETRY.md with open standard contract primitives (CloudEvents v1.0, Protobuf IDL, UUIDv7 monotonic
       keys, vector indexing, containerized DB testing, cognitive heartbeat chunking, sandboxed agent execution profile,
       and prompt manifest pinning).
    2. Author a dedicated platform governance guidance document (framework/governance/RECOMMENDED_PLATFORM_STACK.md)
       synthesizing the authoritative ecosystem architecture and providing a complete tool-by-tool mapping to the SDD layers.
    3. Author five operational blueprints in framework/governance/aidoc/ for consumer projects adopting Temporal/LangGraph,
       Bytebase/PostgreSQL 18, NATS CloudEvents, gVisor sandboxing, and Langfuse/HyperDX observability.
  consequences: |
    - Zero vendor lock-in in core specifications (GD-13 / D-0013 intact).
    - Ecosystem projects receive first-class, copy-pasteable operational templates and guidance.
    - Zero breaking changes to existing consumer APIs, directory structures, or linting gates.
  alternatives_considered:
    - option: "Hardcode Temporal, NATS, and Bytebase directly into Layer 06/07/08/10 core templates"
      rationale_rejected: "Violates foundational Decision D-0013 / GD-13 requiring engine-agnostic core specifications."
    - option: "Keep all technology stack guidance outside the framework in external wikis"
      rationale_rejected: "Leads to documentation drift and forces AI coding agents to invent runtime mapping without authoritative governance."

