decision:
  decision_id: "DEC-CHG-129"
  title: "Execute Phase 0 inventory for the governance doc conversion plan"
  status: "Decided"
  date: "2026-10-26"
  context: >-
    The merged plan (plans/GOVERNANCE-DOC-AGENT-FORMAT-PLAN.md, PR #1026)
    requires Phase 0 before any format change: a per-file, per-fact-block
    inventory of the 63 Markdown files under framework/governance/, a
    provenance search for the Principle 2 governance-exemption rationale
    (Claim 3), and background collection of recorded agent failures. No
    framework/ normative file is touched, so no version bump and no
    GATE-SPEC review apply to this vehicle.
  choice: >-
    Execute Phase 0 as DIR2C C1 with GATE-CODE entry: run the inventory,
    record the exemption-rationale search outcome (absent), and store the
    inventory table in IPLAN-129. Terminate here if the plan's Phase 1
    gate is not separately authorized.
  consequences:
    positive:
      - Phase 0 deliverable exists as committed evidence for the Phase 1 benchmark.
      - Exemption-rationale absence is recorded instead of assumed.
    negative:
      - None; read-only work plus two new archive files.
    risks:
      - None; no normative content changes.

