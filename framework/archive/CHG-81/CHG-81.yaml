# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-81)
# =============================================================================

decision:
  decision_id: "DEC-CHG-81"
  title: "Standardization of CHG Flows Terminology and Conceptual Equivalence"
  status: "Ratified"
  context: |
    The framework employs Change Requests (CHGs) as its primary change management and routing mechanism.
    Prior documentation used 'CHG request', 'Change Request', 'CHG flows', and workflow state machines
    without explicitly codifying their conceptual relationships and naming hierarchy.
  choice: |
    1. Codify 'CHG flows' as the standard framework umbrella naming for change management and routing workflows.
    2. Formally declare the conceptual equivalence across complementary architectural facets:
       CHG flow (procedural / lifecycle routing: HOTFIX, CODE2S, CODE2C, SEED2C, DIR2C, SDD2C) ==
       CHG request (governance vehicle and transactional authorization) ==
       CHG graph (declarative state machine / CNCF Serverless Workflow DSL definition and state diagram).
    3. Maintain 'CHG document' / 'Change Record' as the concrete metadata document (CHG-NN.yaml) capturing lifecycle state and decisions.
    4. Update framework/governance/chg/README.md (and its byte-identical mirror framework/layers/09_CHG/README.md),
       framework/governance/ID_NAMING_STANDARDS.md, framework/governance/CHG_REQUEST_FLOWS.md, and related surfaces.
  consequences: |
    - Developers and AI coding agents have unambiguous guidance on terminology: 'CHG flows' is the general framework term.
    - 'CHG flow', 'CHG request', and 'CHG graph' are explicitly recognized as equivalent expressions of the unified change architecture.
    - No breaking changes to existing filenames (e.g., CHG_REQUEST_FLOWS.md, CHG-TEMPLATE.yaml, chg_lint.py) or historical records.
  alternatives_considered:
    - option: "Designate 'CHG request' as a deprecated anti-pattern"
      rationale_rejected: "Overly pedantic; 'CHG request' is widely understood and naturally denotes the transactional governance vehicle."
    - option: "Rename all files containing 'chg_request' across the repository"
      rationale_rejected: "High blast radius and breaking churn with zero functional benefit."

# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Standardization of CHG Flows Terminology and Conceptual Equivalence"
  author: "Framework Maintainer"
  date_submitted: "2026-10-09T00:00:00Z"
  summary: |
    Codify 'CHG flows' as the standard umbrella framework terminology for change control workflows,
    and establish explicit conceptual equivalence between 'CHG flow' (procedural lifecycle), 'CHG request'
    (governance vehicle), and 'CHG graph' (declarative workflow state machine).
  rationale: |
    Eliminates ambiguity in framework documentation, aligns developer and agent mental models,
    and establishes clear naming discipline while preserving complete backward compatibility.

