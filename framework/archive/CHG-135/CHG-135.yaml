# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-135)
# =============================================================================

decision:
  decision_id: "DEC-CHG-135"
  title: "Dock the sdd-* skill dispatch map in SDD_ASSEMBLY_LINE.md §5"
  status: "Decided"
  date: "2026-10-26"
  context: >-
    Issue #1039 (user-placed in SDD_ASSEMBLY_LINE.md, scoped to the 15 sdd-*
    skills): the skills exist and are indexed, but no governance guidance
    maps stations to skills. Each skill reads complete in isolation, so the
    cross-skill dispatch map (which station, which flow, which order) only
    shows as missing when reading the assembly line end to end.
  choice: >-
    Append §5 Skill Dispatch Map to SDD_ASSEMBLY_LINE.md: one table row per
    station (skill, when to dispatch, flow applicability, handoff to the next
    skill), plus the governance/bridge skills that wrap the line (triage
    before entry, CHG authoring at the overlay, gates per station, IPLAN
    before code, EVAL at closeout). Refresh Document Control cells
    (Last Updated, Framework Version 0.96.18). Bump framework/VERSION
    0.96.17 -> 0.96.18 with OLD_VERSIONS + pin propagation. Single PR with
    Closes #1039.
  consequences:
    positive:
      - Agents dispatch skills by station instead of by guess; the map is
        enforced nowhere new (guidance, not gate), so nothing can newly fail.
    negative:
      - None; one doc section + version metadata only.
    risks:
      - Map drift if skills are renamed; mitigated by the registry
        single-owner rule (name == directory).

