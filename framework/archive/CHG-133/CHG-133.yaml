# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-133)
# =============================================================================

decision:
  decision_id: "DEC-CHG-133"
  title: "Ship 13 SDD layer + CHG skills under framework/skills/"
  status: "Decided"
  date: "2026-10-25"
  context: >-
    Issue #1032: framework/skills/ ships 12 process skills but no layer or
    CHG skills, while every SDD layer and the CHG router have templates and
    linters with no dispatchable agent skill. The requested aidoc/skills/
    path resolves through the aidoc -> framework symlink to
    framework/skills/, which already exists, so no folder is created.
    DIR2C/F2 carries the change: docs/tooling, unrelated to any prior IPLAN,
    no product-behavior change; SEED2C/SDD2C rejected (no SDD cascade, no new
    product chain). Skills stay engine-agnostic (<skills-root>, no engine
    names) per framework/skills/README.md; registry remains the single owner
    of the skill list.
  choice: >-
    Add framework/skills/sdd-* (8 layer + 2 bridge + 3 governance, thin
    trigger/inputs/steps/handoff shape), update SKILLS-REGISTRY.yaml and
    README.md in the same PRs, bump framework/VERSION 0.96.14 -> 0.96.15
    (patch, repo practice) with OLD_VERSIONS + pin propagation. Publish in
    two PRs: A (governance + bridge, 5 skills) carrying this CHG + IPLAN,
    then B (8 layer skills) rebased onto merged A.
  consequences:
    positive:
      - Every SDD layer and the CHG surface become dispatchable skills.
      - Registry + readme stay the single indexed record; no second tree.
    negative:
      - None; additive skills + index + version metadata only.
    risks:
      - Skill-name collision with future skills; mitigated by
        check-skill-shadowing.sh in each skills PR.

