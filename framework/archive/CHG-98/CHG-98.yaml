# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-98)
# =============================================================================

decision:
  decision_id: "DEC-CHG-98"
  title: "Implement Minimal Context Slicing Engine in sdd_doc_lint"
  status: "Ratified"
  context: |
    Autonomous agents in multi-tier SDD workflows require access to requirement and design
    contracts (BRD, PRD, EARS, BDD, ADR, SPEC, TDD). Without topological slicing tools,
    agents ingest entire multi-thousand-line documents or massive workspace bundles to locate
    upstream rationale or downstream test criteria. This results in context window saturation,
    elevated token inference costs, and degraded reasoning accuracy.
  choice: |
    1. Implement a lightweight, deterministic slicing engine in sdd_doc_lint (sdd_doc_lint/slice.py).
    2. Provide a flexible CLI interface:
       python3 -m sdd_doc_lint.slice --target <DOC-ID or ELEM-ID> [--direction upstream|downstream|both] [--depth N] [--format yaml|markdown|json] [--docs-root <path>]
    3. Leverage trace_graph.py primitives to locate documents and parse @-tag references.
    4. Implement cycle-safe BFS/DFS topological extraction that isolates the causal chain and
       prunes unrelated sibling nodes.
    5. Support JSON, YAML, and Markdown output formats for programmatic tooling and agent prompt injection.
    6. Author unit tests in tests/test_slice.py verifying traversal correctness, formatting, and edge cases.
  consequences: |
    - Coding agents can inject targeted, concise context subgraphs rather than entire documents.
    - Drastically lowers token overhead and eliminates hallucinated contracts during implementation.
    - Standardizes DAG traversal tooling across the aidoc-flow framework.
  alternatives_considered:
    - option: "Ad-hoc manual file grep by agents"
      rationale_rejected: >-
        Agents doing grep miss transitive upstream contracts or ingest excessive surrounding text,
        failing to isolate exact topological dependencies.

