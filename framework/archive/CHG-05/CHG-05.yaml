# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  what: |
    Implement plans/IPLAN-TERMINAL-DEFECT-PLAN.md: a scoped bugfix IPLAN
    subtype for post-completion defects (parented on the closed plan, parent
    immutable); Completed-vs-Verified terminal semantics; "active IPLAN"
    definition for the §3.13 exception; post-merge VERIFY-obligation rule;
    TMP-promise repair (real tmp/ contract or reference removal); migration
    VERIFY fresh-rebuild + live-DB dry-run requirement; GOV-013 carve-out +
    new bugfix lint checks with LINT_RULES catalog rows; new conformance test
    test_iplan_bugfix_lifecycle.py. Ship the MINOR bump 0.55.0 → 0.56.0 with
    mechanical fanout. Rejects from #656's shape: both-terminal, mandatory
    detection_gap, Related-IPLAN bypass, revision_history-on-IPLAN.
  why: |
    #656 is a real-but-narrow gap (lifecycle-completeness + broken tmp/
    reference + validation-completeness): a code-only repair to closed output
    has no proportionate ceremony, so consumers invent off-framework
    paperwork. #657's vehicle (maintainer direction posted) is the adopted
    fix; the annotation-only shape is superseded by its own author's
    concession.
  trigger: |
    plans/IPLAN-TERMINAL-DEFECT-PLAN.md reached FINAL (Pass 2 zero-gap) and
    merged via PR #660; maintainer direction posted on #657; triage posted
    on #656.

