# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-109)
# =============================================================================

decision:
  decision_id: "DEC-CHG-109"
  title: "Layer-Specific SDD Graph Templates Parity Architecture"
  status: "Ratified"
  context: |
    While CHG-108 successfully codified the Native Property Graph Schema and Observability
    Adapter Contract, the single starter template (INITIATIVE-GRAPH-TEMPLATE.yaml) provided only
    a 1-node-per-layer toy demonstration. In enterprise production projects, each SDD layer
    possesses distinct domain entities, governance rules, and functional scopes:
    - Layer 01 (BRD): Requires strategic goals, business capabilities, quality expectations, and acceptance criteria.
    - Layer 02 (PRD): Requires personas, user journeys, functional product capabilities, and SLA bounds.
    - Layer 03 (EARS): Requires formal requirements mapped across all 5 canonical EARS patterns.
    - Layer 04 (BDD): Requires executable Given/When/Then scenarios with edge-case vectors.
    - Layer 05 (ADR): Requires multi-candidate trade-offs and decision consequences.
    - Layer 06 (SPEC): Requires component interfaces, gRPC/OpenAPI schemas, and CloudEvent envelopes.
    - Layer 07 (TDD): Requires concrete unit, integration, and security test proof fixtures.
    - Layer 08 (IPLAN): Requires atomic code mutation tasks with 1:1 mandatory saga rollback compensation.
    - Layer 09 (CHG): Requires change request envelopes, gate checklists, and blast radius links.
    - Layer 10 (EVAL): Requires evaluation suites, quality gate scoring, and regression benchmarks.
  choice: |
    Establish 10 Layer-Specific SDD Graph Templates (<LAYER>-GRAPH-TEMPLATE.yaml) co-located
    within framework/layers/01_BRD through framework/layers/10_EVAL with 100% content and
    functional parity:
    1. Schema & Engine Expansion: Update sdd-graph.schema.json and graph_engine.py to natively
       support evaluation_suite (Layer 10) and layer slice prefixes in slice_id.
    2. Modularity & Slicing: Enable multi-file authoring under docs/sdd/graph/ where each layer
       is authored independently without cross-role git merge conflicts.
    3. Retain Cross-Layer Starter: Retain INITIATIVE-GRAPH-TEMPLATE.yaml in framework/templates/
       as a single-file spike/micro-initiative starter.
  consequences: |
    - Complete parity achieved between graph templates and legacy SWF/static templates.
    - Specialized AI agents (Product Owner, Requirements Specialist, QA SDET, Architect, Developer)
      can author dedicated layer graph slices with full domain guidance.
    - Zero breaking changes to existing templates or conformance suites.
  alternatives_considered:
    - option: "Expand INITIATIVE-GRAPH-TEMPLATE.yaml into a single monolithic 1,000-line template"
      rationale_rejected: >-
        Reintroduces token bloat and multi-agent merge conflicts. Layer-specific modular slices
        co-located with layer definitions match real-world role separation.

