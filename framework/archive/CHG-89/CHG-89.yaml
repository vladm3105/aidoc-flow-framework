# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-89)
# =============================================================================

decision:
  decision_id: "DEC-CHG-89"
  title: "Permanent Retirement of Legacy MVP Template Tombstones & Conformance Anti-Resurrection Guard"
  status: "Accepted"
  context: |
    In CHG-08 (#666), the framework unified around single canonical templates (*-TEMPLATE.yaml)
    across all SDD layers, leaving 11-line pointer tombstones (*-MVP-TEMPLATE.yaml) in layers 01 through 08.
    Following the completion of the universal YAML index modernization (CHG-87, CHG-88), these legacy
    tombstone files serve no active runtime or spec function. However, conformance test suites in
    test_seed_contract.py and test_iplan_carrier.py retained positive assertions verifying their existence as tombstones.
    This change permanently removes all 8 legacy MVP template tombstones, archives historical snapshots
    for audit continuity, and converts conformance tests into ironclad anti-resurrection guards.
  choice: |
    1. Permanently remove all 8 legacy *-MVP-TEMPLATE.yaml tombstone files from framework/layers/01_BRD/ through 08_IPLAN/.
    2. Archive historical snapshots of the retired tombstones under framework/archive/CHG-89/templates/ for audit continuity.
    3. Modernize conformance test suites:
       - Update test_seed_contract.py: convert test_mvp_skeleton_is_tombstone to test_mvp_template_not_resurrected (assert False).
       - Update test_iplan_carrier.py: convert test_mvp_skeleton_is_tombstone to test_mvp_template_not_resurrected (assert False).
       - Update test_layers.py: add test_no_mvp_templates_exist to assert that zero *-MVP-TEMPLATE.* files exist across any layer folder.
    4. Ratify Decision GD-76 in framework/governance/DECISIONS.md.
    5. Advance framework spec version to 0.91.8 and propagate version references.
  consequences: |
    - Zero legacy MVP template tombstone files remain in framework/layers/.
    - Conformance test suites actively enforce that MVP templates cannot be resurrected.
    - Preserves single source of truth across canonical templates (*-TEMPLATE.yaml).
    - Full historical audit trail preserved under framework/archive/CHG-89/.
  alternatives_considered:
    - option: "Retain tombstones indefinitely"
      rationale_rejected: "Leaves 8 dead pointer files cluttering layer directories; confuses new contributors."
    - option: "Delete tombstones without anti-resurrection tests"
      rationale_rejected: "Weakens conformance protection by leaving open the possibility of accidental template resurrection."

