# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Retire the Tier-1 consumer-project feedback tier (no operator since platforms archived and examples/ removed; Tier-2 GH-issue capture proven by ~40 closed issues stays as the single surface); delete the unshipped scaffold template; purge examples-corpus language and dead tags; close the AGENTS.md quick-path exception so WORKTREE_FLOW.md §1-§3.7 (per-task worktree, post-merge cleanup) is unconditional. MINOR bump 0.66.0 → 0.67.0."
  why: "Tier 1 prescribes a log no consumer keeps, Tier-2 sources cite a deleted corpus, three entry tags point at deleted scripts/corpus/archived platforms — and the AGENTS.md quick-path exception contradicts WORKTREE_FLOW.md invariants 1-2 (exercised by CHG-22, which shipped branch-in-main-checkout against the worktree rule). Stale governance that no session follows teaches sessions to ignore governance."
  trigger: "User directive 2026-09-30 (eliminate the empirical feedback loop; worktree-for-changes + cleanup codified) + live verification 2026-09-30 (Tier-2 healthy, Tier-1 operatorless, examples/ refs stale)."
  scope:
    in:
      - "DOC_GOVERNANCE_CORE.md Principle 9 rewrite (Tier-1 half + examples-as-SUT out; issue-tracker capture stays)"
      - "FRAMEWORK_FEEDBACK_LOG.md rewrite to tracker-only (filing discipline + open-items surface retained for SELF_LEARNING §7.4)"
      - "framework/templates/framework-feedback-log.template.md DELETE + framework/README.md + framework/governance/README.md index updates"
      - "AGENTS.md: quick-path exception removed; unconditional worktree + post-merge cleanup (order guard) pointer"
      - "framework/governance/DECISIONS.md: new GD entry for both rulings"
      - "MINOR bump 0.66.0 → 0.67.0 + pin fanout + changelogs (E005/E008)"
    out:
      - "Frozen framework/archive/** (never rewritten); historical records (TAGGING, past CHANGELOG/GD entries, plans/*, deprecated CLAUDE.md)"
      - "SELF_LEARNING.md (no edit — §7.4 surface retained, refs stay valid)"
      - "Any consumer-artifact layer change (governance-only vehicle)"

