# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-108)
# =============================================================================

decision:
  decision_id: "DEC-CHG-108"
  title: "Native SDD Graph Schema Specification and Observability Adapter Contract"
  status: "Ratified"
  context: |
    As the framework transitions toward autonomous multi-agent development pipelines where AI
    agents (Planner, Architect, SDET, Developer, Reviewer) and automated linters author, mutate,
    and review artifacts, traditional document-oriented formats (hierarchical sections, paragraphs,
    and word-count targets) create significant friction:
    1. Token Overhead: AI agents consume tens of thousands of tokens loading template prose,
       headings, and narrative mockups (e.g. BRD-TEMPLATE at 1,181 lines / 53 KB).
    2. Brittle Reverse-Engineering: Traceability DAGs are implicit in text, requiring ~3,400 lines
       of complex regex in sdd_doc_lint to extract headings and @-citation tags.
    3. Review Hallucination Risks: Reviewer agents evaluating entire 1,000-line YAML documents
       suffer context drift rather than evaluating precise requirement deltas.
    4. Dual-Template Drift: Maintaining parallel companion declarative templates alongside
       CNCF Serverless Workflow hybrid templates across 10 layers causes synchronicity drift.
  choice: |
    Adopt the Dual-Plane CQRS Architecture:
    1. Write Plane (AI Agent SSOT): Codify a Native Typed Property Graph schema (sdd-graph.schema.json)
       covering 10 canonical node types and 6 relational edges with strict cardinality invariants.
    2. Read Plane (Observability Adapter): Codify the Observability Adapter Contract (OBSERVABILITY_ADAPTER_CONTRACT.md)
       with pure-Python text emission projecting graph slices into human-readable Markdown spec sheets,
       Mermaid C4/DFD maps, and CI pull request impact summaries on demand.
    3. Python Graph Engine: Implement mathematical graph verification (networkx) in sdd_doc_lint
       enforcing Binary Topological Validation (BTV), acyclicity, zero dangling edges, and blast radius calculation.
    4. LangGraph Synergy: Map SDD Graph nodes and edges 1:1 into langgraph.graph.StateGraph primitives.
    5. Template Consolidation: Consolidate 20 legacy document templates into two modular graph templates
       (INITIATIVE-GRAPH-TEMPLATE.yaml and EXECUTION-GRAPH-TEMPLATE.yaml).
    6. Conformance Preservation: Preserve the 10-layer canonical count in LAYER_REGISTRY.yaml, governing
       the graph schema as an architectural overlay.
  consequences: |
    - Mathematical verification replaces brittle regex document scraping.
    - AI review context windows are bounded to isolated mutated subgraphs, saving up to 90% tokens.
    - Humans retain complete observability through deterministic, on-demand rendered projections.
    - Full backward compatibility is preserved for existing brownfield consumer repositories.
  alternatives_considered:
    - option: "Retain hierarchical document format and add external graph indexing"
      rationale_rejected: >-
        Preserves token bloat, regex scraping friction, and template drift without solving the core
        agent authoring impedance mismatch.
    - option: "Store entire project in a single monolithic graph file"
      rationale_rejected: >-
        Guarantees git merge collisions across concurrent multi-agent branches; modular slicing
        (docs/sdd/graph/modules/ and docs/sdd/graph/initiatives/) is required.

