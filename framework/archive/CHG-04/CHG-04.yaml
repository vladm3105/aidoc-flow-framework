# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  what: |
    Formalize the Type-R (Reconciliation) change flow as a bounded exception to
    SDD-first: when a verified working codebase temporarily precedes its
    specifications, the change propagates backward Code → reverse-authored
    IPLAN → upstream SDD layers (TDD → SPEC → BDD → EARS), instead of
    fabricating a fictional design-first chronology. Adds one closed
    `change_source` enum value (`reconciliation`, entry GATE-CODE), a Dual
    Lifecycle section, a §3.1.2 core-governance section with preconditions and
    guardrails (green gates before doc propagation, freeze, no new unverified
    code mid-reconciliation, Emergency-qualifying work stays on Emergency),
    GATE-CODE routing notes, GD-30, and the MINOR bump 0.54.0 → 0.55.0 with
    mechanical fanout. Generalized from PR #654 donor text — no donor
    literals (no vendor names, tool commands, `docs/sdd/` paths, index
    ledgers) enter the spec.
  why: |
    The framework defines only the forward flow plus Emergency (fix → deploy
    → document in 48h). Feedback/GATE-CODE bubble-up covers production
    defects, but no formal path exists for non-emergency empirical work where
    code leads docs (integration discovery, browser-authored suites, flakiness
    remediation). Without it, teams either backdate design history (fiction)
    or let docs drift (rot). Type-R makes the honest path the governed path.
  trigger: |
    plans/TYPE-R-RECONCILIATION-PLAN.md reached FINAL (2 passes, Pass 2 clean)
    and authorizes this scope. Donor material reviewed in PR #654 triage;
    GOVERNANCE_RULES.md as a framework file rejected (project-only,
    engine-agnostic violation, EXPECTED_FILES pin).

