# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-128)
# =============================================================================

decision:
  decision_id: "DEC-CHG-128"
  title: "Consolidate Kickoff Docs and Restore seed/ as Canonical Tier 1 Path"
  status: "Decided"
  date: "2026-10-24"
  context: >-
    Issue #1022 (triaged GO, P2/docs/gap) carries 8 kickoff gaps: two inline
    AGENTS.md copies drifting from the template install.sh ships (F4), three
    unreconciled .aidoc/ trees plus stack-policy.yaml misplaced under .aidoc/
    in two diagrams while installer + BOOTSTRAP put it at root (F5), a
    prescribed `onboard` bootstrapper that does not exist (F7), no consumer
    CI starter though .github/ is excluded from the consumer copy (F8), no
    prerequisites / brownfield path / real verification (F9), no docs index
    with 460 lines of 2026-05 history inside the kickoff guide (F10), a
    self-contradicting pin comment (F11), and no day-1 minimal scope (F12).
    Scoping F4/F5 exposed #1024: CHG-53/GD-36 (C2, deliberate) standardize
    <project>/seed/ with docs/seed/ legacy-tolerated across 5 normative
    files, while CHG-126 moved AIDOC.md v2.3 alone to docs/seed/ claiming a
    false alignment with those contracts. The founder decided 2026-10-24:
    uphold seed/ (CHG-126's move was oversight, not reversal).
  choice: >-
    1. F4: delete both inline AGENTS.md copies; point at
       framework/templates/AGENTS-TEMPLATE.md (the file install.sh copies).
    2. F5: state which .aidoc/ tree install.sh scaffolds vs
       consumer-authored/optional parts; move stack-policy.yaml to root in
       both diagrams + tracking table (installer + BOOTSTRAP ground truth).
    3. F7/F12: one-line onboard pointer (planned Tier-1 tool; install.sh is
       the bootstrapper) + day-1 minimal/linter-only scope note.
    4. F8: ship docs/CONSUMER-CI-STARTER.md (self-contained minimal gate:
       profile-lint + sdd_doc_lint + chg_lint) + pointer from the guide.
    5. F9: prerequisites block (git, python >=3.11, task/gh recommended),
       real Step-6 verification, CODE2S (Type-R) brownfield note.
    6. F10: add docs/README.md index; move the 2026-05 brief to
       docs/history/STARTUP-BRIEF-2026-05-20.md; slim the kickoff guide.
    7. F11: correct the PROJECT.md pin comment (value shape preserved for
       the pin sweeper).
    8. #1024: restore seed/ tier in AIDOC.md (v2.4) + Step 5; archive v2.3;
       patch bump 0.96.12 -> 0.96.13 with pin propagation; cut
       framework/v0.96.13 post-merge so the documented --canon pin resolves.
  consequences:
    positive:
      - One AGENTS.md source, one stated .aidoc/ truth, one seed path.
      - New teams get prereqs, a runnable quickstart, CI starter, and index.
      - The documented --canon pin resolves on the day it ships (no tag lag).
    negative:
      - None; restores the established contract, no contract change.
    risks:
      - Release tag framework/v0.96.13 immutable once pushed; mitigated by
        target verification (first-holder merge commit) before push.

