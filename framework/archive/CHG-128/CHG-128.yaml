    - docs/ADAPTATION-GUIDE.md (F4, F5, F8 pointer, F12).
    - docs/PROJECT.md (F5 pointer, F11).
    - docs/AIDOC_WORKSTATION_STANDARD.md (F5, F7, F12).
    - docs/README.md, docs/history/STARTUP-BRIEF-2026-05-20.md (new, F10).
    - docs/CONSUMER-CI-STARTER.md (new, F8).
    - README.md docs list (F10 pointer refresh).
    - framework/governance/aidoc/AIDOC.md v2.4 + v2.3 snapshot (#1024).
