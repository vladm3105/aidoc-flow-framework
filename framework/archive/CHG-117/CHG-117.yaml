# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-117)
# =============================================================================

decision:
  decision_id: "DEC-CHG-117"
  title: "Consumer .aidoc Verification, Parity Alignment, and Deployment Readiness"
  status: "Ratified"
  context: |
    Following the ratification of framework version 0.96.3 (CHG-116), a comprehensive audit was performed
    to ensure that all changes from the framework are completely implemented into the consumer-facing
    .aidoc/ workstation layout and ready for reliable consumer deployments:
    1. In-repo dogfood .aidoc/profile.yaml still pinned framework_version: "0.96.2" and last_updated: "2026-10-17"
       due to hooks/sync-version-refs.sh excluding .aidoc/ from its mechanical sweep.
    2. framework/governance/aidoc/AIDOC.md cited a stale example Git submodule release tag (framework/v0.96.2).
    3. framework/templates/TASKFILE-TEMPLATE.yml lacked canonical task definitions for chg-lint, swf-lint,
       and profile-lint, leaving consumer projects without direct Taskfile shortcuts to execute the newly
       ratified automated linters.
    4. framework/scripts/upgrade.sh lacked a check for Git submodule consumer checkouts (.aidoc/framework/.git),
       which created a hazard where upgrade.sh would execute a directory swap, deleting submodule .git pointers.
    5. docs/AIDOC_WORKSTATION_STANDARD.md Section 8 and framework/templates/AGENTS-TEMPLATE.md needed alignment
       with the expanded task definitions.
  choice: |
    Execute comprehensive parity alignment and verification per the ratified plan:
    1. Bump .aidoc/profile.yaml to framework_version: "0.96.3" and update last_updated to "2026-10-18".
    2. Include "$REPO_ROOT/.aidoc/profile.yaml" in hooks/sync-version-refs.sh to prevent future version lag.
    3. Update framework/governance/aidoc/AIDOC.md:117 example tag to framework/v0.96.3.
    4. Add CHG to the active_layers example in framework/governance/PROFILE-TEMPLATE.yaml.
    5. Expand framework/templates/TASKFILE-TEMPLATE.yml with chg-lint (using Go-Task {{if .CLI_ARGS}} and --sdd-root),
       swf-lint, and profile-lint, and wire profile-lint into the composite check: task.
    6. Synchronize root Taskfile.yml with profile-lint and the updated chg-lint template conditional.
    7. Update docs/AIDOC_WORKSTATION_STANDARD.md and framework/templates/AGENTS-TEMPLATE.md.
    8. Add Git submodule guard check in framework/scripts/upgrade.sh.
    9. Extend tests/conformance/test_consumer_scripts.py to assert the expanded Taskfile tasks.
    10. Perform end-to-end greenfield and brownfield deployment tests.
  consequences: |
    - Zero version lag between framework/VERSION (0.96.3) and consumer .aidoc/ configurations.
    - Consumer projects gain full Taskfile tooling parity with native automated linters (chg-lint, swf-lint, profile-lint).
    - Full SDD Gate (task sdd:check) guarantees profile validity, structural compliance, and review verification.
    - Git submodule consumers are protected against accidental deletion during upgrade scripts.
    - All conformance and unit tests pass with zero regressions.
  alternatives_considered:
    - option: "Rely solely on python3 -m module commands without Taskfile tasks"
      rationale_rejected: >-
        Rejected because docs/AIDOC_WORKSTATION_STANDARD.md establishes Taskfile as the single unified entrypoint
        for autonomous agents and contributors, and omitting tasks forces agents to memorize raw module paths.
    - option: "Exclude .aidoc/profile.yaml from sync-version-refs.sh"
      rationale_rejected: >-
        Rejected because keeping it out caused the exact version lag observed after CHG-116. Automated synchronization
        guarantees that the repository's dogfood profile always reflects current canon.

