change_description:
  summary: "Ship canonical framework/templates/SEED-TEMPLATE.md; standardize <project>/seed/ at project root as the canonical Tier 1 path (reconciling MODULE_LAYOUT.md with README.md and AIDOC.md); reconcile DECISION_WORKFLOW.md lines 43 & 128 to GD-36 (frozen per version); update SEED_CONTRACT.md to document the end-to-end Seed → Module → SDD supersede sequence and Secondary Review Gate grep sweep; update AIDOC-SCAFFOLD-TEMPLATE.md with seed/ bootstrapping; add conformance test in test_seed_contract.py; MINOR bump 0.73.0 → 0.74.0."
  why: "Seed docs are the foundation and true-north reference of a project and version under GD-36. However, the framework shipped no canonical SEED-TEMPLATE.md, exhibited path divergence between MODULE_LAYOUT (docs/seed/) and README/AIDOC (seed/), retained stale 'frozen forever' phrasing in DECISION_WORKFLOW.md, and omitted seed/ bootstrapping in scaffold guidance. Issue #899."
  trigger: "User review 2026-10-05 identifying seed doc tier gaps + issue #899."
  scope:
    in:
      - "framework/templates/SEED-TEMPLATE.md: new canonical template with document_control and standard sections"
      - "framework/governance/MODULE_LAYOUT.md: reconcile directory structure to <project>/seed/ (Tier 1 Inputs, peer to docs/)"
      - "framework/governance/DECISION_WORKFLOW.md: reconcile lines 43 & 128 from 'Frozen after first BRD' to 'Frozen per version (GD-36 / SEED_CONTRACT R1)'"
      - "framework/governance/SEED_CONTRACT.md: document the end-to-end Seed → Module → SDD supersede sequence and Secondary Review Gate grep sweep"
      - "framework/governance/aidoc/AIDOC-SCAFFOLD-TEMPLATE.md: add seed/ tree bootstrapping layout"
      - "framework/governance/DECISIONS.md: add GD-49 recording the canonical template and path reconciliation"
      - "tests/conformance/test_seed_contract.py: add tests asserting SEED-TEMPLATE.md exists and adheres to standards"
      - "hooks/sync-version-refs.sh: add 0.73.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.73.0 → 0.74.0"
      - "framework/CHANGELOG.md: entry for CHG-53 / 0.74.0"
    out:
      - "Runtime code changes (framework has no runtime code)"
      - "Layer 01-10 templates (BRD-TEMPLATE.yaml, etc. already carry correct seed_disposition)"
      - "SEED01 linter logic (already supports both seed/ and docs/seed/)"

