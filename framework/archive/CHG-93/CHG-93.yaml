# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-93)
# =============================================================================

decision:
  decision_id: "DEC-CHG-93"
  title: "Standardize Technology Stack Citations to Canonical GitHub Repository"
  status: "Ratified"
  context: |
    Previous updates cited both the canonical GitHub repository (vladm3105/technology-stack)
    and a local workstation path (/home/ya/devd/technology_stack). Retaining hardcoded local OS
    filesystem paths leaks personal workstation environment details into framework governance
    specifications, violating engine neutrality and portability for autonomous agents operating
    in distributed environments and ephemeral containers.
  choice: |
    1. Update RECOMMENDED_PLATFORM_STACK.md and TECHNOLOGY_STACK_USAGE_GUIDE.md to reference
       the canonical GitHub repository (https://github.com/vladm3105/technology-stack)
       exclusively instead of local OS filesystem paths.
    2. Update git clone instructions to clone into standard local targets without assuming
       personal workstation directories.
  consequences: |
    - Complete portability across local workstations, CI runners, and agent sandboxes.
    - Zero host or personal filesystem leaks in framework governance documentation.
    - Preserves engine neutrality in framework/layers/ per Decision D-0013 / GD-13.
  alternatives_considered:
    - option: "Retain local workstation paths alongside GitHub URLs"
      rationale_rejected: >-
        Leaks environment-specific paths into normative governance documents.

