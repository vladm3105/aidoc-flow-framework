# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-138)
# =============================================================================

decision:
  decision_id: "DEC-CHG-138"
  title: "Add --all-indices option to install.sh and deploy.sh for turnkey SDD layer indices"
  status: "Decided"
  date: "2026-10-27"
  context: >-
    Issue #988: install.sh only scaffolds the Layer 05 ADR index during consumer
    bootstrapping, forcing engineers and agents adopting full SDD lifecycles to
    manually copy and token-replace *-00_index.TEMPLATE.yaml across the other 9
    layers (01_BRD through 04_BDD, 06_SPEC through 10_EVAL).
  choice: >-
    Introduce --all-indices option in framework/scripts/install.sh (and passthrough
    in deploy.sh). When passed, install.sh iterates through all 10 canonical SDD
    layers, scaffolding any missing index file from its canonical template with
    standard [X.Y.Z] -> $VERSION and YYYY-MM-DD -> $TODAY token substitution.
    Default behavior without --all-indices remains strictly backward-compatible,
    scaffolding only Layer 05 ADR index unless --no-adr is given. Existing index
    files are never overwritten without --force.
  consequences:
    positive:
      - Consumers can bootstrap turnkey SDD indices in a single command.
      - Default installations remain backward-compatible without unexpected files.
      - Automated token replacement avoids manual copy errors.
    negative:
      - None; opt-in flag leaves existing bootstrap flows unaffected.
    risks:
      - Minimal canons in test fixtures might omit certain layer templates;
        mitigated by checking template existence before attempting copy.

