# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-85)
# =============================================================================

decision:
  decision_id: "DEC-CHG-85"
  title: "Remediate Pre-Production Review Findings Across Platform Blueprints and Governance Records"
  status: "Ratified"
  context: |
    The 5-lens pre-production review of the 0.91.2 -> 0.91.3 delta returned SHIP-WITH-FIXES, citing concrete
    runtime, security, and documentation defects in the newly added platform blueprints (Temporal ApplicationError
    NameError, OTel JWT regex omission, gVisor CLI noexec omission, invalid file copy instructions, missing
    Postgres schema DDL, and missing release log trace for CHG-84).
  choice: |
    1. Update AIDOC-TEMPORAL-LANGGRAPH-RUNTIME-TEMPLATE.md to import ApplicationError from temporalio.exceptions.
    2. Update AIDOC-LANGFUSE-HYPERDX-OBSERVABILITY-TEMPLATE.md to include period matching in JWT Bearer token regex.
    3. Update AIDOC-GVISOR-SANDBOX-EXECUTION-PROFILE.md to add noexec,nosuid to CLI runner /tmp mount, parameterize environment, and document runc escape valve.
    4. Clarify Section 5 copy instructions and link Decision GD-72 in RECOMMENDED_PLATFORM_STACK.md.
    5. Prepend CREATE SCHEMA IF NOT EXISTS xp; and document UUIDv7 LTS compatibility in AIDOC-BYTEBASE-POSTGRES-SCHEMA-TEMPLATE.md.
    6. Document replicas: 1 fallback and canonical deduplication_key in AIDOC-NATS-CLOUDEVENTS-PROTOBUF-TEMPLATE.md.
    7. Add CHG-84 and CHG-85 entries under version [0.91.3] in framework/CHANGELOG.md.
    8. Update plans/TECHSTACK-ALIGNMENT-PLAN.md and plans/README-RECONCILIATION-PLAN.md to Complete/Shipped.
  consequences: |
    - Runtime blueprints execute without NameError exceptions.
    - JWT bearer tokens are fully redacted in observability collector pipelines.
    - Adoption instructions provide clear, executable guidance without syntax errors.
    - Release changelog preserves 100% paper trail across all commits.
    - Zero breaking changes to core SDD specification.
  alternatives_considered:
    - option: "Ship 0.91.3 release immediately and defer fixes to a subsequent 0.91.4 patch"
      rationale_rejected: "Rejected to prevent premature delivery of known broken imports and security redaction leaks to adopters."

