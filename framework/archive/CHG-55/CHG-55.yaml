# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Author framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md; ship canonical pilot workflows under framework/governance/workflows/ (chg-request-flow.sw.yaml, seed-to-module-decomposition.sw.yaml, worktree-pr-lifecycle.sw.yaml) adopting CNCF Serverless Workflow v0.8 (YAML); update DIAGRAM_STANDARDS.md to formalize governance state graphs; ratify GD-51 in DECISIONS.md; update EXPECTED_FILES in test_governance.py; add conformance test suite in test_governance_workflows.py; MINOR bump 0.75.0 → 0.76.0."
  why: "Transforms human-readable governance prose into machine-executable Directed Acyclic Graphs (DAGs) and state machines using the open, vendor-neutral CNCF Serverless Workflow standard in YAML format. Enables autonomous multi-agent execution (via LangGraph or orchestrators on the fly) while preserving engine agnosticism (D-0013) and single-source-of-truth visual diagram parity. Issue #903."
  trigger: "User review 2026-10-05 approving CNCF Serverless Workflow YAML format for governance flows + issue #903."
  scope:
    in:
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: normative standard defining workflow primitives, rules, and runtime adapter patterns"
      - "framework/governance/workflows/chg-request-flow.sw.yaml: CNCF v0.8 workflow for CHG classification, gate checks, and lifecycle"
      - "framework/governance/workflows/seed-to-module-decomposition.sw.yaml: CNCF v0.8 workflow for 5-step decomposition and Triple-Lens modeling"
      - "framework/governance/workflows/worktree-pr-lifecycle.sw.yaml: CNCF v0.8 workflow for worktree isolation, PR watch, and §3.7 cleanup order guard"
      - "framework/governance/DIAGRAM_STANDARDS.md: link governance state machines to the CNCF workflow standard"
      - "framework/governance/DECISIONS.md: add GD-51 recording the adoption of CNCF Serverless Workflow standard"
      - "tests/conformance/test_governance.py: add new governance files to EXPECTED_FILES"
      - "tests/conformance/test_governance_workflows.py: add tests asserting workflow YAML syntax, schema version, state reachability, and transitions"
      - "hooks/sync-version-refs.sh: add 0.75.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.75.0 → 0.76.0"
      - "framework/CHANGELOG.md: entry for CHG-55 / 0.76.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Layer 01-10 templates (BRD-TEMPLATE.yaml through EVAL remain intact)"

