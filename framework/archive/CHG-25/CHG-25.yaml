  summary: "Fix all three open pre-prod-review issues #811-#813 in one PR: CI supply-chain SHA-pin hardening (#811), auto-merge-by-default decision record (#812), Reserved-rule coverage calibration note (#813)."
  why: "Each issue weakens a guarantee agents rely on: mutable major tags let CI execute unaudited code (#811), the highest-consequence standing permission rests on prose alone (#812), green linters read as full governance coverage while 18 Reserved contracts have no emitter (#813). The triage notes (2026-09-30) carry per-issue evidence; this vehicle executes them as one auditable batch."
  trigger: "Session goal 2026-09-30: 'fill all issues https://github.com/vladm3105/aidoc-flow-framework/issues' + triage notes on #811-#813 + Mode B GO re-validation on dev @ 3e712951."
  scope:
    in:
      - "CI pin hardening (#811): nine uses: pins → SHA pins with version comments in acceptance.yml, chg-gate.yml, conformance.yml, doc-review.yml, pin-currency-reader.yml; CHANGELOG entry under [Unreleased] (root only — no framework/ files touched)"
      - "Decision record (#812): one plans/DECISIONS.md entry authorizing auto-merge-by-default with carve-outs + head/mergeStateStatus re-check rationale"
      - "Calibration note (#813): one docs/ADAPTATION-GUIDE.md-visible note — green linters alone do not equal governed; Reserved rows have no emitter; reviewer-lens backstop"
      - "One new tests/unit covering file (action SHA-pin assertion: fails before fix, passes after)"
      - "framework/archive/CHG-25/CHG-25.yaml + IPLAN-25.yaml (this vehicle)"
    out:
      - "Reusable @ci/v4.0.0 pins (untouched per #811 fix shape)"
      - "ai-review pull_request_target trust-gate design (untouched per #811 fix shape)"
      - "New lint emitters or Reserved-row reclassification (forbidden per #813 fix shape)"
      - "Weakening AGENTS.md carve-outs or re-check discipline (forbidden per #812 fix shape)"
