# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-134)
# =============================================================================

decision:
  decision_id: "DEC-CHG-134"
  title: "Ship Seed + Module skills under framework/skills/"
  status: "Decided"
  date: "2026-10-25"
  context: >-
    Issue #1036: framework/skills/ ships 13 layer/CHG skills (CHG-133) but no
    Seed or Module skill, while seed/module governance is normative and
    CHG-L014/L015 lint lifecycle coverage agents hand-rolling modules will
    trip. DIR2C/F2 carries the change: docs/tooling, unrelated to any prior
    IPLAN, no product-behavior change. Skills stay engine-agnostic
    (<skills-root>, no engine names); registry remains the single owner.
  choice: >-
    Add framework/skills/sdd-seed (seed authoring per SEED_CONTRACT, frozen
    per version, total disposition, AI-attribution) and
    framework/skills/sdd-module (Triple-Lens decomposition per
    SEED_TO_MODULE_DECOMPOSITION.md + MODULE_LAYOUT.md, lifecycle entries
    with author + chg_ref per L014/L015). Update SKILLS-REGISTRY.yaml and
    README.md in the same PR; bump framework/VERSION 0.96.16 -> 0.96.17
    (patch, repo practice) with OLD_VERSIONS + pin propagation.
  consequences:
    positive:
      - Seed and Module surfaces become dispatchable skills; SEED2C authors
        stop hand-rolling against linted contracts.
      - Registry + readme stay the single indexed record.
    negative:
      - None; additive skills + index + version metadata only.
    risks:
      - Skill-name collision with future skills; mitigated by
        check-skill-shadowing.sh in the PR.

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    No Seed or Module skill ships in framework/skills/ (issue #1036).
  scope:
    - framework/skills/sdd-seed/SKILL.md (new).
    - framework/skills/sdd-module/SKILL.md (new).
    - framework/skills/SKILLS-REGISTRY.yaml (2 entries).
    - framework/skills/README.md (2 index rows).
    - framework/VERSION (0.96.16 -> 0.96.17) + pin propagation.
    - framework/archive/CHG-134/CHG-134.yaml (new, this vehicle).
    - framework/archive/CHG-134/IPLAN-134.yaml (new, executing IPLAN).

