# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-92)
# =============================================================================

decision:
  decision_id: "DEC-CHG-92"
  title: "Reference Canonical Technology Stack GitHub Repository (vladm3105/technology-stack)"
  status: "Ratified"
  context: |
    The framework's platform reference architecture document (RECOMMENDED_PLATFORM_STACK.md)
    was synchronized under CHG-91 to cite /home/ya/devd/technology_stack as the enterprise
    standard v2.0. However, consumers, external CI runners, and distributed agents require a public
    upstream repository location to fetch the canonical technology stack specifications (00-19)
    when operating outside the local workstation filesystem.
  choice: |
    1. Update RECOMMENDED_PLATFORM_STACK.md Document Control, Purpose, Specification Directory,
       and Adoption Protocol to cite https://github.com/vladm3105/technology-stack alongside
       the local development path /home/ya/devd/technology_stack.
    2. Document git clone instructions for developers and autonomous agents to obtain the actual
       technology stack.
  consequences: |
    - Clear provenance and accessibility for both local developers and remote agents.
    - Zero broken internal links or engine hygiene regressions.
    - Preserves engine neutrality in framework/layers/ per Decision D-0013 / GD-13.
  alternatives_considered:
    - option: "Only cite local filesystem path"
      rationale_rejected: >-
        Inaccessible to environments and agents without direct access to the local workstation path.

