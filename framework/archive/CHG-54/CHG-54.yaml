change_description:
  summary: "Author framework/governance/SEED_TO_MODULE_DECOMPOSITION.md; ship canonical framework/templates/MODULE-TEMPLATE.md featuring C4-L2, DFD-L2 data sensitivity matrix, and sequence error flows; enhance framework/templates/SEED-TEMPLATE.md with C4-L1 System Context and DFD-L1 data flow boundaries; extend framework/governance/DIAGRAM_STANDARDS.md to formally recognize Seed (C4-L1) and Modules (C4-L2, DFD-L2, Sequence); update MODULE_LAYOUT.md and SEED_CONTRACT.md (Phase 0b); ratify GD-50 in DECISIONS.md; add conformance tests in test_module_contract.py; MINOR bump 0.74.0 → 0.75.0."
  why: "Resolves the abstraction gap between Tier 1 Inputs (Seed) and Tier 2 Modules by establishing the unified C4-L1 and C4-L2 architectural models, the Triple-Lens specification for modules (Structure, Data Sensitivity & Trust Boundaries, Process/Sequence), and the 5-step Seed-to-Module decomposition flow. Issue #901."
  trigger: "User review 2026-10-05 approving C4-L1/L2 modeling and decomposition governance + issue #901."
  scope:
    in:
      - "framework/governance/SEED_TO_MODULE_DECOMPOSITION.md: new normative specification detailing the 5-step decomposition methodology"
      - "framework/templates/MODULE-TEMPLATE.md: new canonical module template with YAML frontmatter, C4-L2, DFD-L2 data sensitivity matrix, and sequence flow"
      - "framework/templates/SEED-TEMPLATE.md: enhance with C4-L1 System Context and DFD-L1 data context Mermaid diagrams"
      - "framework/governance/DIAGRAM_STANDARDS.md: extend ownership model to include Seed (C4-L1) and Modules (C4-L2, DFD-L2, Sequence)"
      - "framework/governance/MODULE_LAYOUT.md: reference MODULE-TEMPLATE.md and SEED_TO_MODULE_DECOMPOSITION.md"
      - "framework/governance/SEED_CONTRACT.md: reference the decomposition flow in Phase 0b Module Synchronization"
      - "framework/governance/DECISIONS.md: add GD-50 recording the Triple-Lens module standard and decomposition flow"
      - "tests/conformance/test_module_contract.py: add tests asserting MODULE-TEMPLATE.md presence, frontmatter schema, and governance references"
      - "hooks/sync-version-refs.sh: add 0.74.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.74.0 → 0.75.0"
      - "framework/CHANGELOG.md: entry for CHG-54 / 0.75.0"
    out:
      - "Runtime code changes (framework has no runtime code)"
      - "Layer 01-10 templates (BRD-TEMPLATE.yaml through EVAL remain intact)"

