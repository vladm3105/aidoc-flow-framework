# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-127)
# =============================================================================

decision:
  decision_id: "DEC-CHG-127"
  title: "Repair Kickoff Quickstarts and Cut the Missing Release Tags"
  status: "Decided"
  date: "2026-10-23"
  context: >-
    A live review of docs/ found the project-kickoff quickstarts unrunnable as
    written: (1) both prescribe `install.sh --canon framework/v0.96.12`, but no
    framework/v0.9x tag above v0.91.2 exists on the remote — 41 assigned
    versions (0.91.3-0.96.12) are untagged, so only `--canon-dir` works;
    (2) STARTUP_HANDOFF.md Step 6 cites a phantom linter path with a doubled
    `framework/` segment; (3) Step 5 scaffolds `<project>/seed/` although
    CHG-126 unified the topology under `docs/seed/`; (4) the submodule option
    pins to the moving `dev` branch instead of a release tag.
  choice: >-
    1. Cut and individually verify the 41 missing annotated release tags
       framework/v0.91.3 through framework/v0.96.12, each on the first commit
       whose framework/VERSION reads that exact version (all on dev, merged
       under branch protection; conformance-green confirmed on sampled
       targets per independent review).
    2. Fix the Step 6 linter path to `.aidoc/framework/sdd_doc_lint/`
       (allowlist + installer shim).
    3. Fix the Step 5 seed scaffold path to `docs/seed/` (CHG-126 topology).
    4. Pin the submodule option to a release tag instead of `-b dev`.
  consequences:
    positive:
      - The documented `--canon framework/v0.96.12` kickoff command works.
      - Every assigned framework version from v0.46.0 through v0.96.12 is cut
        (the pre-0.46.0 backlog stays sanctioned-untagged per TAGGING.md).
      - New teams can follow the quickstart literally with no stale paths.
    negative:
      - None; docs-only plus additive immutable tags.
    risks:
      - Release tags are immutable once pushed; mitigated by per-tag
        target verification (`git show <tag>:framework/VERSION`) before push
        and an independent review of the tag payload.

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    The kickoff quickstarts reference a release tag that was never cut and
    contain stale paths, so a new project team cannot bootstrap by following
    them. The tag backlog (41 versions) is the root cause of finding 1.
  scope:
    - docs/STARTUP_HANDOFF.md kickoff Steps 1, 5, 6.
    - docs/ADAPTATION-GUIDE.md submodule attachment form.
    - Release tags framework/v0.91.3 through framework/v0.96.12 (41 tags).

