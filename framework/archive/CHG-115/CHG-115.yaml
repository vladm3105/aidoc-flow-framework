# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-115)
# =============================================================================

decision:
  decision_id: "DEC-CHG-115"
  title: "Root Taskfile Orchestration, Consumer .aidoc Audit, Script Remediation, and Playbook Alignment"
  status: "Ratified"
  context: |
    Following the transition to modern SDD workstation standards (CHG-106) and the retirement
    of monolithic registers (CHG-94, CHG-95), audits revealed operational lag across tooling,
    playbooks, consumer onboarding templates, and deployment scripts:
    1. The repository lacked a canonical root Taskfile.yml exposing daily development workflows.
    2. The repo dogfood profile (.aidoc/profile.yaml) failed validation under profile_lint.py due to schema 1.0.0 and stale pins.
    3. deploy.sh defaulted to raw filesystem symlinks, directly violating AIDOC_WORKSTATION_STANDARD.md:341.
    4. docs/ADAPTATION-GUIDE.md and PROFILE-TEMPLATE.yaml continued to promote symlinks and omitted Quad-Pillar topology.
    5. framework/templates/TASKFILE-TEMPLATE.yml lacked PYTHONPATH scoping for sdd_doc_lint module resolution.
    6. Playbooks (09_CHG, 10_EVAL, 07_TDD) carried unannotated references to retired DECISIONS.md, omitted Three-Tier templates, or had typos.
  choice: |
    Execute holistic tooling, script, consumer template, and playbook remediation per ratified TASKFILE-AND-PLAYBOOKS-REMEDIATION-PLAN.md:
    1. Root Taskfile: Provide Taskfile.yml with test, lint, chg-lint, swf-lint, pre-push, links, and sync-versions tasks.
    2. Consumer .aidoc & Dogfood: Modernize .aidoc/profile.yaml to schema 1.1.0 (version 0.96.2); scrub DECISIONS.md references;
       update PROFILE-TEMPLATE.yaml, ADAPTATION-GUIDE.md, and framework/governance/aidoc/ guides for Git submodule / pinned-copy attachment;
       configure vars and env PYTHONPATH in TASKFILE-TEMPLATE.yml.
    3. Scripts: Set deploy.sh default kind to pin; emit deprecation warnings for symlink; auto-detect argument pairings for brownfield upgrades;
       point upgrade.sh Step 1 to CHG archives and GitHub Releases; add test_deploy_default_kind_is_pin to test_consumer_scripts.py.
    4. Playbooks: Annotate DECISIONS.md tombstone in 09_CHG/document_control.md; add Three-Tier templates to 10_EVAL/README.md;
       correct gate archive path in 09_CHG/gate_spec_change.md; fix typo in 07_TDD/qa_lead.md.
    5. Governance: Bump framework/VERSION to 0.96.2, append 0.96.1 to OLD_VERSIONS in hooks/sync-version-refs.sh, and run sync.
  consequences: |
    - Root Taskfile gives developers and autonomous agents unified, deterministic command surfaces.
    - Zero violations of workstation standard symlink prohibitions across scripts and adaptation documentation.
    - Dogfood profile and consumer templates are 100% compliant with schema 1.1.0 and pass all structural linters.
    - All playbooks correctly reflect Three-Tier Architecture, immutable CHG archive paths, and tombstone registries.
  alternatives_considered:
    - option: "Retain deploy.sh default as symlink for legacy checkouts"
      rationale_rejected: >-
        Rejected because AIDOC_WORKSTATION_STANDARD.md:341 strictly bans raw filesystem symlinks in version control.
        Auto-detection in brownfield mode preserves non-breaking upgrades without violating the standard on new installs.
    - option: "Inject PYTHONPATH directly in top-level env: in Taskfile template"
      rationale_rejected: >-
        Rejected because Go-Task top-level env: blocks evaluate sprig default filters on undefined variables to an empty string.
        Using vars: with fallback default, referenced by env:, is required for reliable evaluation.

