request:
  title: "Root Taskfile Orchestration, Consumer .aidoc Audit, Script Remediation, and Playbook Alignment"
  description: >-
    Standardize root development tasks via Taskfile.yml, remediate dogfood and consumer .aidoc components,
    align deployment scripts with workstation standards, and correct playbook omissions and references.
  justification: >-
    Eliminates developer friction, unifies agent execution surfaces, enforces workstation symlink bans,
    and maintains absolute consistency between framework specifications and runnable tooling.

