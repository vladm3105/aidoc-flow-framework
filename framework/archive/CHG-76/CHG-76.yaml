# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Durable Multi-Agent Execution Architecture Standard (Durable Workflows + Cognitive Graphs)"
  author: "Framework Maintainer"
  date_submitted: "2026-10-07T00:00:00Z"
  summary: |
    Establish the engine-agnostic 3-tier runtime execution architecture for autonomous SDD multi-agent engineering:
    (1) DURABLE_EXECUTION_STANDARD.md: author comprehensive normative standard establishing the 3-tier model:
        Tier 1 (Durable Workflows - control, SAGA, crash recovery, durable waits, replay determinism),
        Tier 2 (Graph-Based Cognitive Flows - reasoning, exploration, multi-persona auditing, diagnostic loops),
        Tier 3 (Deterministic Effect & Verification Services - isolated worktrees, compilers, linters, tests, git);
    (2) Formalize The Golden Rule: 'Reasoning in Cognitive Graphs, Effects in Deterministic Services, Control in Durable Workflows';
    (3) Unified Role Taxonomy (RoleSpec): kind: graph | executor | service with execution options, quotas, and bounded loops;
    (4) CNCF Serverless Workflow (.sw.yaml) compilation contract to durable workflows and cognitive graph nodes;
    (5) Dual-Path Remediation contract: REV-AUTO (in-band loop <= 3) vs REV-CHG (durable workflow escalation + ReviewReport);
    (6) ADAPTATION.md: introduce Section 12 defining the 3-tier reference runtime execution architecture for consuming projects;
    (7) GOVERNANCE_WORKFLOW_STANDARD.md: index the Durable Execution Standard;
    (8) Conformance & Ratification: update test_governance.py, ratify Decision GD-70, record release notes in CHANGELOG.md, and bump framework specification version to 0.90.0 (C2 MINOR).
  rationale: |
    The framework specifies machine-executable declarative governance via CNCF Serverless Workflows (.sw.yaml),
    but previously lacked an engine-agnostic standard defining how runtime platforms execute these workflows with durable crash recovery,
    saga compensation, cognitive reasoning loops, and deterministic effects without vendor lock-in (e.g. Temporal, LangGraph, Restate, Hatchet).
    This change resolves that gap by establishing the normative 3-tier architecture standard and adaptation blueprint.

