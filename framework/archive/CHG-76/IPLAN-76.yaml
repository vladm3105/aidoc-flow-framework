    description: "Update ADAPTATION.md and GOVERNANCE_WORKFLOW_STANDARD.md"
    tasks:
      - "Add Section 12 to ADAPTATION.md referencing DURABLE_EXECUTION_STANDARD.md"
      - "Update GOVERNANCE_WORKFLOW_STANDARD.md directory index and references"
      - "Update test_governance.py EXPECTED_FILES"
  phase_3_conformance_and_release:
    description: "Update tests, ratify GD-70, sync version refs, bump VERSION to 0.90.0"
    tasks:
      - "Ratify Decision GD-70 in DECISIONS.md"
      - "Update CHANGELOG.md, hooks/sync-version-refs.sh, and framework/VERSION"
      - "Run full conformance and unit suites"

