# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Author framework/layers/07_TDD/TDD_WORKFLOW_STANDARD.md, TDD-SWF-TEMPLATE.yaml, and framework/governance/workflows/tdd-test-execution.sw.yaml; amend 07_TDD/README.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-56 in DECISIONS.md; add test_tdd_workflow.py and update EXPECTED_WORKFLOWS and EXPECTED_FILES; MINOR bump 0.80.0 → 0.81.0."
  what: "Establishes declarative CNCF Serverless Workflow v0.8 state machines for (1) complex, multi-tier, stateful TDD test execution via the Hybrid Envelope Architecture (TDD-SWF-TEMPLATE.yaml), (2) the automated test execution suite lifecycle (tdd-test-execution.sw.yaml), and (3) normative TDD Arrange/Act/Assert-to-state-machine mapping guidelines (TDD_WORKFLOW_STANDARD.md). Aligns companion TDD and governance documentation, ratifying Decision GD-56."
  why: "Enables autonomous AI coding agents and graph orchestrators to execute and trace test suites with native tier dispatch, automated retries with exponential backoff, flaky quarantine, and fixture teardown saga rollback compensation, while preserving full backward compatibility with static YAML test cases and sdd_doc_lint structural validation. Issue #913."
  trigger: "User review 2026-10-05 approving Step 5 of CNCF standardization roadmap + issue #913."
  scope:
    in:
      - "framework/layers/07_TDD/TDD_WORKFLOW_STANDARD.md: normative standard mapping Arrange/Act/Assert to CNCF state machines"
      - "framework/layers/07_TDD/TDD-SWF-TEMPLATE.yaml: canonical hybrid template for stateful TDD workflows"
      - "framework/governance/workflows/tdd-test-execution.sw.yaml: declarative CNCF v0.8 runner for test suite execution"
      - "framework/layers/07_TDD/README.md: update TDD documentation to bind CNCF workflow standard"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register tdd-test-execution in catalog"
      - "framework/governance/DIAGRAM_STANDARDS.md: register TDD execution state machines"
      - "framework/governance/DECISIONS.md: add GD-56 ratifying CNCF Serverless Workflow standard for Layer 07 TDD"
      - "tests/conformance/test_tdd_workflow.py: conformance test suite for TDD workflow templates and runners"
      - "tests/conformance/test_governance_workflows.py: add tdd-test-execution to EXPECTED_WORKFLOWS"
      - "tests/conformance/test_governance.py: add workflow and TDD standard to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.80.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.80.0 → 0.81.0"
      - "framework/CHANGELOG.md: entry for CHG-60 / 0.81.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Deprecation of TDD-TEMPLATE.yaml (retained as standard for atomic/simple test cases)"

