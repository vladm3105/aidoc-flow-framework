# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-96)
# =============================================================================

decision:
  decision_id: "DEC-CHG-96"
  title: "Standardize Layer 04 Terminology from Legacy Gherkin to Executable Behavioral Graphs"
  status: "Ratified"
  context: |
    Layer 04 (BDD) previously modernized its architecture to adopt CNCF Serverless Workflow
    state graphs (v0.8 YAML) and structured YAML scenario trees (BDD_WORKFLOW_STANDARD.md,
    BDD-SWF-TEMPLATE.yaml, GD-52). However, residual documentation in framework/layers/04_BDD/README.md,
    BDD-TEMPLATE.yaml, and framework/playbooks/04_BDD/auditor.md retained legacy "Gherkin" references
    and prose. In agentic SDD, behavioral verification is driven by deterministic state machine
    graphs, transition DAGs, and structured property assertions rather than human conversational
    Gherkin feature narratives.
  choice: |
    1. Update framework/layers/04_BDD/README.md section from "## YAML vs Gherkin" to
       "## Behavioral Graphs & Structured YAML vs Legacy Gherkin", establishing executable
       behavioral graphs (CNCF Serverless Workflow v0.8) and structured YAML scenarios as the
       standard and retiring legacy Gherkin terminology.
    2. Update framework/layers/04_BDD/BDD-TEMPLATE.yaml evaluation criteria from "Gherkin quality"
       to "Behavioral graph quality", and replace Section 5 Glossary entries "Gherkin" and
       "Scenario Outline" with "Behavioral Graph" and "Parameterized Scenario".
    3. Update framework/playbooks/04_BDD/auditor.md to replace legacy Gherkin document wording.
    4. Bump framework/VERSION to 0.91.15 and propagate references via hooks/sync-version-refs.sh.
  consequences: |
    - Standardizes Layer 04 terminology on executable behavioral graphs and structured YAML.
    - Eliminates obsolete Gherkin references from active templates, guides, and playbooks.
    - 100% backward-compatible with sdd_doc_lint and existing test suites.
  alternatives_considered:
    - option: "Retain legacy Gherkin terminology in Layer 04 documentation"
      rationale_rejected: >-
        Creates confusion for AI agents and human contributors by suggesting that legacy
        Gherkin .feature files or narrative text remain a supported paradigm.

