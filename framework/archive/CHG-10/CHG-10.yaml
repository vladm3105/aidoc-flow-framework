# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Give F3 a legal modules-first shape: Phase 0a seed_scope (append-only, affected-only, usually no-change) + Phase 0b module_lifecycle (archive → sync → version, affected modules only); template sections in both CHG-TEMPLATE copies; GOV-020 touch-without-lifecycle guard with fixtures; conformance extension; MINOR bump 0.59.2 → 0.60.0."
  why: "F3 has no legal shape for keeping seed → modules → SDD actual. Authors either rewrite frozen seed in place (SEED_CONTRACT R1 violation, disposition audit goes circular) or version the whole tree per change (cascade explosion against the minimal-regeneration rule). The MODULE-12 pilot proves the middle path: affected-only module sync + verified seed no-change in the same CHG lifecycle."
  trigger: "Owner request 2026-09-23 (pilot modules-first F3 on MODULE-12, then generalize) + pilot evidence at /tmp/chg41-pilot/CHG-41_modules_first_exporter_health.yaml."
  scope:
    in:
      - "governance/CHG_REQUEST_FLOWS.md F3 section: Phase 0a seed_scope + 0b module_lifecycle (affected-only, seed append-only)"
      - "DOC_GOVERNANCE_CORE.md §3.1.1 Phase 0a/0b insert + §3.1.3 kernel F3 row note"
      - "LINT_RULES.md GOV-020 row (seed/module touch without lifecycle entry)"
      - "CHG-TEMPLATE.yaml both copies: module_lifecycle + seed_scope sections (identical — no fork widening)"
      - "chg_lint.py GOV-020 check + green/red fixtures + conformance router-matrix extension"
      - "MINOR bump 0.59.2 → 0.60.0: VERSION + changelogs + machine-pin fanout"
      - "DECISIONS.md GD-35 entry for the modules-first ruling"
      - "both 09_CHG READMEs: Phase 0 0a/0b pointer to the flows doc (identical)"
    out:
      - "b-local-privy CHG-41 pilot landing (separate vehicle, separate repo)"
      - "Other flows (F1/F2/F4/Emergency/Type-R) — untouched; the extension is F3-only"
      - "CHG template canon decision (edits both copies identically)"
      - "STALE remediation or registry shape changes"
      - "New SDD layers"

