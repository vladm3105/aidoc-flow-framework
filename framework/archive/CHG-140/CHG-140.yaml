# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-140)
# =============================================================================

decision:
  decision_id: "DEC-CHG-140"
  title: "Implement deterministic subtype-aware section enforcement in sdd_doc_lint"
  status: "Decided"
  date: "2026-10-27"
  context: >-
    Issue #1046: IPLAN-TEMPLATE.yaml declares subtype-conditional required sections
    via _required_when_subtype, but sdd_doc_lint skipped them deferring to a nonexistent
    audit skill, leaving conditional sections (e.g. rollback_procedure for deploy,
    file_manifest for code_build) unenforced on instance documents.
  choice: >-
    1. Implement deterministic subtype-aware structural validation in sdd_doc_lint
    (_load_section_targets and _check_required_template_sections). When an artifact
    instance provides document_control.subtype, load both unconditional sections and
    conditional sections matching the subtype.
    2. Enforce valid subtype enum (code_build, deploy, combined, workflow, audit_fix,
    bugfix, docs) per IPLAN_WORKFLOW_STANDARD.md:126.
    3. Update the advisory note in framework/governance/IPLAN_WORKFLOW_STANDARD.md
    to reflect deterministic STRUCT01 enforcement.
  consequences:
    positive:
      - "Closes the enforcement gap: IPLAN instances now deterministically validate required sections for their declared subtype."
      - "Eliminates phantom pointer to nonexistent audit skill."
      - "Backward compatibility preserved: documents without subtype only enforce unconditional sections."
    negative:
      - "None; valid golden fixtures already satisfy their subtype section requirements."
    risks:
      - "Broken instances with missing subtype sections will now fail STRUCT01; this is the intended contract enforcement."

