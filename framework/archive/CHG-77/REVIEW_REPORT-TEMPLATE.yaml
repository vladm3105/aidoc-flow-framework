# =============================================================================
#  REVIEW_REPORT-TEMPLATE.yaml — SDD Review Team Unified Report Template
# =============================================================================
#  Authority: framework/governance/REVIEW_WORKFLOW_STANDARD.md
#  Schema: framework/governance/review_report.schema.json
#  Purpose: Authoritative unified review report generated by multi-persona review
#           crews. Encodes deterministic gate floor, advisory readiness score,
#           playbook check findings, and the CHG remediation handover block.
# =============================================================================

report_id: "REV-RPT-NN"
target_artifact_id: "[ARTIFACT-NN]"
layer: "[01_BRD|02_PRD|03_EARS|04_BDD|05_ADR|06_SPEC|07_TDD|08_IPLAN|09_CHG]"
review_mode: "team"                # team | sequential | single_pass
iteration: 1                       # 1-based create->review->revise loop iteration
max_iterations: 3                  # Quality loop cap (quality_loop_max_iterations)
created_at: "YYYY-MM-DDTHH:MM:SSZ"

# -----------------------------------------------------------------------------
# Section 1: Gate Evaluation (Normative Floor + Advisory Score)
# -----------------------------------------------------------------------------

gate:
  structural_pass: true            # true iff sdd_doc_lint exit code == 0
  no_blocking: true               # true iff zero P0 and zero P1 findings exist
  passed: true                    # true iff structural_pass == true AND no_blocking == true

readiness_score: 92.5              # Advisory weighted score (0-100) per REVIEW_CREWS.yaml

# -----------------------------------------------------------------------------
# Section 2: Review Crew Coverage & Confidence
# -----------------------------------------------------------------------------

coverage:
  ran:
    - "[persona_1]"
    - "[persona_2]"
    - "[persona_N]"
  missing: []                      # Personas that timed out or failed to report
  coverage_ratio: 1.0              # fraction of requested crew reporting (min 0.80)
  low_confidence: false            # true if quorum not met or critical specialist missing

# -----------------------------------------------------------------------------
# Section 3: Located Findings & Check Citations
# -----------------------------------------------------------------------------

findings:
  - id: "F-01"
    priority: "P1"                 # P0 | P1 (blocking) vs P2 | P3 (advisory)
    check_ref: "C3"                # Citations from persona playbook (e.g. C1, C3)
    personas:
      - "[persona_name]"
    location: "docs/0N_LAYER/[ARTIFACT-NN].md#L45-L60"
    message: "[Clear description of observed defect or contract violation]"
    recommendation: "[Concrete, localized remediation instruction]"
    suggested_chg_flow: "CODE2C"   # Recommended change router path if CHG needed

# -----------------------------------------------------------------------------
# Section 4: CHG Remediation Handover Envelope
# -----------------------------------------------------------------------------

chg_handover:
  required: false                  # true if findings touch approved/baseline artifacts
  suggested_flow: "CODE2C"         # CODE2C (defect) | DIR2C (doc/tool) | SEED2C (spec change)
  target_chg_ref: "CHG-NN"         # Authorizing CHG document reference
  target_iplan_ref: "IPLAN-NN"     # Scoped fix IPLAN carrying these findings
  remediation_status: "Pending"    # Pending | In-Progress | Remediated | Verified
