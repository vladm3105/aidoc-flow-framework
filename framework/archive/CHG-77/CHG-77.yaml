# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: |
    Remediate framework audit discrepancies found during the 0.90.0 holistic audit:
    (1) REVIEW_REPORT-TEMPLATE.yaml: provide schema-valid sample values (report_id, target_artifact_id, layer, created_at)
        so the template validates against review_report.schema.json while retaining instructional comments;
    (2) pytest.ini: create root test configuration with pythonpath = . to eliminate test collection ModuleNotFoundError;
    (3) tests/conformance/fixtures/review/review_report.schema.json: synchronize fixture with canonical governance schema;
    (4) framework/governance/README.md & framework/README.md: index DURABLE_EXECUTION_STANDARD.md, REVIEW_WORKFLOW_STANDARD.md,
        the 9 review workflows in workflows/review/, and templates in governance README and layout trees;
    (5) AIDOC-QA-PROTOCOL-TEMPLATE.md: replace non-resolving (url) link placeholder with code-formatted tag.
  why: "Ensure 100% schema compliance across templates, test runner portability without environment overrides, and complete documentation indexing of recently added durable multi-agent standards."
  trigger: "Comprehensive repository audit following 0.90.0 durable execution standard and graph review flows release."
  scope:
    in:
      - "framework/governance/templates/REVIEW_REPORT-TEMPLATE.yaml: schema-valid sample values"
      - "pytest.ini: root pytest configuration setting pythonpath = ."
      - "tests/conformance/fixtures/review/review_report.schema.json: fixture schema sync"
      - "framework/governance/README.md: index missing standards, review workflows, templates"
      - "framework/README.md: update governance overview and directory layout"
      - "framework/governance/aidoc/AIDOC-QA-PROTOCOL-TEMPLATE.md: link placeholder fix"
    out:
      - "No breaking changes to framework spec (SemVer keep at 0.90.0)"
      - "No changes to core linters or runtime contracts"

