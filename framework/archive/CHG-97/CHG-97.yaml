# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-97)
# =============================================================================

decision:
  decision_id: "DEC-CHG-97"
  title: "Adopt Binary Topological Validation and Retire Heuristic Percentage Readiness Scoring"
  status: "Ratified"
  context: |
    Layer templates (01_BRD through 07_TDD) and review workflows historically included
    subjective percentage readiness metrics (e.g., "ADR-Ready Score: >=90/100", with
    arbitrary sub-weights like 40% coverage, 25% quality, 20% traceability, 15% edge cases).
    In practice, autonomous LLM agents easily game qualitative text sections to self-report
    compliant percentage cutoffs despite latent structural inconsistencies.
    Meanwhile, the framework's actual structural linter (sdd_doc_lint) operates strictly on
    binary topological graph completeness (COV01, COV02, ELEMENT-COVERAGE-001). The heuristic
    percentage scoring text contradicts the deterministic linter floor and introduces
    hallucination-inducing friction in agent prompts.
  choice: |
    1. Deprecate scalar percentage scoring and weighted heuristic formulas across Layer 01-07
       templates (BRD, PRD, EARS, BDD, ADR, SPEC, TDD) and auditor playbooks.
    2. Establish Binary Topological Validation (BTV) as the sole quality gating standard:
       - Strict DAG Completeness (PASS / FAIL): 100% @-pointer resolution without dangling citations.
       - Strict Oracle Coverage (PASS / FAIL): 100% EARS requirements realized downstream by BDD
         behavioral state graphs, and 100% BDD scenarios realized by failing TDD test fixtures.
    3. Update Section 5 Glossaries in EARS-TEMPLATE.yaml, BDD-TEMPLATE.yaml, ADR-TEMPLATE.yaml,
       and companion SWF templates to redefine *-Ready terms as binary topological verification.
    4. Update review sagas (framework/governance/workflows/review/*.sw.yaml) to replace legacy
       threshold_score: 90.0 payload with topological_pass: true.
    5. Bump framework/VERSION to 0.91.16 and propagate via hooks/sync-version-refs.sh.
  consequences: |
    - Eliminates qualitative percentage hallucinations and prompt confusion for AI agents.
    - Fully synchronizes written template validation guidance with sdd_doc_lint's deterministic floor.
    - 100% backward-compatible with sdd_doc_lint and existing test suites.
  alternatives_considered:
    - option: "Retain >=90% advisory scoring alongside binary gates"
      rationale_rejected: >-
        Retaining dual scoring maintains prompt bloat, confuses coding agents, and creates
        split-brain divergence where an agent passes subjective text review but fails structural linting.

