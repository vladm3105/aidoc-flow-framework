# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Give documentation-only milestones a legal phase: `documentation_sync` joins the allowed step phases for non-code, non-SDD doc/governance work (the F2 docs-only C1 shape). CHG-L003 keeps erroring on `code` / `implementation` / `code_implementation` and on missing phases, but its message no longer misreports doc milestones as code steps; CHG-L005 orders `documentation_sync` in the execution zone (after all `sdd_lifecycle` steps); CHG-L004 still requires an IPLAN reference (a `documentation_sync` step alone does not satisfy it). Template, both READMEs, LINT_RULES catalog rows (L003, GOV-010), governance core §3.4 items 13–14 + E25 + L003 row, and a GD-38 decision record carry the new vocabulary. The triage verdict stands: no IPLAN exemption (CHG-12 always-traced holds — every C1 still needs a C1 CHG + scoped IPLAN). MINOR bump 0.63.0 → 0.64.0."
  why: "Issue #775 (verified live): a zero-code change declaring doc-sync milestones as `phase: implementation` trips CHG-L003, whose message reports the doc step as a code step belonging in IPLAN — misrouting agents into mislabeling workarounds. The framework offers no legal phase for doc milestones (`sdd_lifecycle` is for versioned SDD docs, `iplan_creation` for IPLAN authoring), so the contract is missing, not contradicted."
  trigger: "Issue #775 (consumer Type-D CHG-56) + triage note 2026-09-28 (P1, linter)."
  breaking_change_analysis: "C2 (not C3): additive — one new allowed phase string; no gate/ID/schema/enum removed, no previously-green CHG turns red (nothing in the wild uses the new phase; the narrowed L003 predicate only removes errors on the new phase). Consumers' previously-failing doc CHGs can now pass by relabeling milestones `documentation_sync`. Existing CHG/IPLAN records unaffected; 0.x line. Reviewer may escalate to C3 at PR review, in which case E004 (human approver) applies before merge."
  enforcement_decision: "Linter-emitter (CHG-L003/L005 predicate + message update) plus reviewer-lens for the template-guidance half (canonical F2-C1 doc-sync layout). Rationale: the misroute is machine-emitted text, so the machine text is fixed; the prose layout guidance is verified by the PR reviewer against the template example."
  scope:
    in:
      - "sdd_doc_lint/chg_lint.py: L003 accepts `documentation_sync` (message names the legal phases); L005 treats it as execution-zone (after all `sdd_lifecycle`); L004 unchanged (doc-sync alone satisfies nothing)"
      - "LINT_RULES.md v1.1 → v1.2: L003 + GOV-010 rows gain `documentation_sync`"
      - "DOC_GOVERNANCE_CORE.md v1.1 → v1.2: §3.4 items 13–14, E25, §3.4 table L003 row"
      - "CHG-TEMPLATE.yaml both copies 0.63.0 → 0.64.0: `_allowed_phases` + checklist + canonical F2-C1 doc-sync example (identical — no fork widening)"
      - "both 09_CHG READMEs 0.63.0 → 0.64.0: phase field + Phase 0/1 zone wording (identical per mirror-twin rule)"
      - "DECISIONS.md: GD-38 entry (doc-sync phase + #775 verdict: no IPLAN exemption)"
      - "sdd_doc_lint/tests/test_chg_lint.py: L003/L004/L005 doc-sync coverage"
      - "MINOR bump 0.63.0 → 0.64.0: VERSION + changelogs + machine-pin fanout (sync-version-refs clean)"
      - "SECURITY_REVIEW W003 assessment recorded in this CHG (verification section)"
    out:
      - "IPLAN exemption for doc edits — explicitly NOT granted (CHG-12 always-traced holds)"
      - "Type-D taxonomy / chg_type field — consumer-side, not adopted"
      - "Emergency / Type-R paths, seed/module mechanics, bugfix vehicle — untouched"
      - "EVAL schema, 5-stage lifecycle, other flows (F1/F2/F4 routing) — untouched"
      - "#776 Phase-3 closeout rule — sequenced follow-up, different files"

