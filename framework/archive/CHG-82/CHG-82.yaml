# Section 1B: Formal Decision (DEC-CHG-82)
# =============================================================================

decision:
  decision_id: "DEC-CHG-82"
  title: "Comprehensive Framework Audit Remediation, Tooling Robustness, and Catalog Synchronization"
  status: "Ratified"
  context: |
    Following significant framework evolution (CHG-72 through CHG-81 covering CNCF SWF adoption across all layers,
    durable multi-agent execution standards, and mandatory decision tracking), a comprehensive audit uncovered
    nine latent discrepancies: stale version references across onboarding docs (F-01), hook scope limitation in
    sync-version-refs.sh skipping docs/ (F-02), uncatalogued CNCF SWF linter rules (SWF-L001..SWF-L007) in LINT_RULES.md
    and missing conformance test guards (F-03), skill shadowing fatal failure when USER_CONFIG_ROOT is unset (F-04),
    stale platform/exclude citations in SECURITY.md (F-05), dead umbrella relative links in docs/SUPPORT.md (F-06),
    blueprint numbering misalignment between AIDOC-SCAFFOLD-TEMPLATE.md and ADAPTATION-GUIDE.md (F-07),
    specification structure phrasing in framework/README.md (F-08), and CHG-L018 linter retroactivity over historical
    archived change requests prior to CHG-80 (F-09).
  choice: |
    1. Synchronize and bump framework version to 0.91.2 across framework/VERSION, updating document control tables.
    2. Expand hooks/sync-version-refs.sh sweep to include docs/ (ADAPTATION-GUIDE.md, STARTUP_HANDOFF.md), extend
       OLD_VERSIONS with 0.91.1, and sweep literal forms to eliminate future documentation version drift.
    3. Formally catalog rules SWF-L001 through SWF-L007 in framework/governance/LINT_RULES.md, add swf_lint.py CODES
       registry, add test_swf_codes_catalogued in tests/conformance/test_lint_catalog.py, and document in AGENTS.md.
    4. Harden framework/skills/_shared/scripts/check-skill-shadowing.sh to gracefully exit clean
       with an advisory note when USER_CONFIG_ROOT is unset, preventing agent startup failures.
    5. Update sdd_doc_lint/chg_lint.py so CHG-L018 skips historical pre-CHG-80 archive snapshots without weakening active enforcement.
    6. Modernize SECURITY.md (scoping Bandit to sdd_doc_lint/ and tests/, citing framework/governance/DECISIONS.md),
       sanitize dead relative umbrella paths in docs/SUPPORT.md, harmonize blueprint enumeration in AIDOC-SCAFFOLD-TEMPLATE.md,
       and clarify governance workflow placement in framework/README.md.
  consequences: |
    - All 9 audit findings are remediated in a single, coherent, fully traced change.
    - Automated tooling (hooks, linters, conformance tests) guards all new rules and paths against future regression.
    - Zero breaking changes to existing consumer APIs, directory structures, or workflows.
  alternatives_considered:
    - option: "Split into multiple PRs (tooling vs docs)"
      rationale_rejected: "All 9 findings stem from the same holistic audit baseline and have minimal cross-cutting blast radius."
    - option: "Retain USER_CONFIG_ROOT hard exit in check-skill-shadowing.sh"
      rationale_rejected: "Causes fatal startup blocks for agents whose runtime environments do not pre-export engine config paths."

