# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-112)
# =============================================================================

decision:
  decision_id: "DEC-CHG-112"
  title: "Codify Full Layer Closeout and Downstream Handoff Cycles across Layer SWF Templates"
  status: "Ratified"
  context: |
    While CHG-111 wired author playbooks and review saga invocations into the 10 layer SWF
    templates, the terminal sequence of every layer state machine remained an incomplete stub:
    1. Templates terminated immediately upon emitting element IDs without executing formal
       layer boundary gates (GATE-01 through GATE-CODE).
    2. Review saga failures caused abrupt process termination instead of providing an in-situ
       author remediation loop before escalation.
    3. Document frontmatter and SDD graph node statuses were not sealed to "Baselined".
    4. Templates did not emit standardized CNCF CloudEvents to trigger downstream layers.
  choice: |
    Implement the 5-step closed layer lifecycle per plans/LAYER-SWF-CLOSE-CYCLE-AND-HANDOFF-PLAN.md:
    1. Embed an in-situ author remediation loop (RemediateLayerDraft) in review evaluation switches.
    2. Add formal layer closeout gate verification (VerifyLayerCloseoutGate) enforcing GATE-01..GATE-CODE.
    3. Add baseline sealing operations (SealLayerDocumentBaseline, RegisterSddGraphBaselineNode).
    4. Emit typed downstream CloudEvents (produceEvents / EmitLayerHandoffEvent) across all layers.
    5. Author the Master End-to-End Orchestrator (sdd-layer-orchestration.sw.yaml) modeling parallel
       fork (L4 BDD / L5 ADR) and join (L6 SPEC).
    6. Implement structural linter rule SWF-L009 in sdd_doc_lint/swf_lint.py with unit tests.
  consequences: |
    - Every layer enforces a 100% closed audit, remediation, gate verification, and sealing cycle
      before the next layer can be triggered.
    - Enables fully automated, end-to-end multi-layer pipeline execution via event correlation.
    - Strictly preserves zero-runtime engine neutrality (Decision D-0013 / GD-13).
  alternatives_considered:
    - option: "Leave layer templates as open-ended stubs without handoff events"
      rationale_rejected: >-
        Prevents automated multi-layer pipeline chaining and permits unverified documents to
        cascade downstream.
    - option: "Hardcode next-layer direct workflow invocations inside each template"
      rationale_rejected: >-
        Couples layers together rigidly, destroying independent layer execution and reusability.
        Event-driven choreography via CloudEvents preserves decoupled modularity.

# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Codify Full Layer Closeout and Downstream Handoff Cycles across Layer SWF Templates"
  description: >-
    Upgrade all 10 layer SWF templates, standalone workflows, and standards with the 5-step
    closed layer lifecycle, author master SDD layer orchestrator, and implement rule SWF-L009.
  justification: >-
    Guarantees that each layer document is audited, remediated, verified against its formal gate,
    sealed in the SDD content graph, and emitted as a CloudEvent before downstream layers begin.

