# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Pre-Production Framework Verification, CNCF Workflow Reconciliation, CI Blueprint Hardening, and 0.88.1 Release Cut-Off Preparation"
  author: "Framework Maintainer"
  date_submitted: "2026-10-06T00:00:00Z"
  summary: "Comprehensive remediation of pre-production findings across the 5 review lenses (Security, Correctness, Docs, Portability, Governance) to cut release 0.88.1: fixes fatal CI gate bash loop syntax and missing permissions in AIDOC-CI-SMART-ROUTING-TEMPLATE.md, addresses ADAPTATION-GUIDE.md phantom v1.2 claims and missing blueprints, corrects broken template references in chg-request-flow.sw.yaml, fixes worktree-pr-lifecycle infinite polling loop on merge conflicts, updates governance README workflow inventories, aligns prose diagrams and tables with CNCF state machines in REVIEW_REMEDIATION_FLOW.md and DECISION_WORKFLOW.md, updates WORKTREE_FLOW.md cleanup order and AGENTS.md section references (§3.7 -> §3.8), corrects layer numbering in early SDD workflow standards, standardizes Document Control blocks across all adaptation templates, and reconciles circuit breaker taxonomy in DECISIONS.md and CHANGELOG.md."
  rationale: |
    Rigorous pre-production review of the SDD framework across recent changes (v0.88.0 and preceding CNCF workflow / adaptation additions) identified 10 key categories of defects, inconsistencies, and release blockers:
    1. AIDOC-CI-SMART-ROUTING-TEMPLATE.md had a syntax defect in the aggregate status check step (dropped loop variable, unconditional exit 1) that would fail 100% of CI runs on adopting repositories, plus missing top-level permissions.
    2. docs/ADAPTATION-GUIDE.md was never properly updated on disk (claimed v1.2 in CHANGELOG/DECISIONS, but is v1.1 on disk), omitted all 5 new 0.88.0 blueprints, contained contradictory advice on templates/scripts, and had invalid discovery fallback paths.
    3. chg-request-flow.sw.yaml cited a nonexistent post-mortem template path.
    4. worktree-pr-lifecycle.sw.yaml lacked a transition for .pr.mergeable == 'CONFLICTING', resulting in an infinite polling loop on merge conflicts.
    5. Governance READMEs drifted out of sync with actual workflow files on disk.
    6. REVIEW_REMEDIATION_FLOW.md and DECISION_WORKFLOW.md Mermaid diagrams and prose tables cited phantom states differing from their normative CNCF Serverless Workflow state machines.
    7. WORKTREE_FLOW.md cleanup command order deleted the local branch before checking out and pulling dev, and AGENTS.md cited drifted section §3.7 instead of §3.8.
    8. Early SDD workflow standards (01_BRD, 02_PRD, 03_EARS) had an ASCII layer chain omitting CHG (09) and misnumbering Code as (09).
    9. The 5 new 0.88.0 adaptation blueprints lacked standard Document Control blocks.
    10. Circuit breaker taxonomy in DECISIONS.md and CHANGELOG.md drifted from the ratified table in GOVERNANCE_WORKFLOW_STANDARD.md §6.
    Resolving these items restores complete consistency and prepares the framework for release 0.88.1.

