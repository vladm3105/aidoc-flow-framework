# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-114)
# =============================================================================

decision:
  decision_id: "DEC-CHG-114"
  title: "Remediate Stale Documentation, Retired Gate Requirements, and Catalog Divergence"
  status: "Ratified"
  context: |
    Following the ratification and implementation of Change Requests CHG-94 through CHG-113,
    several fundamental architectural modernizations occurred across aidoc-framework:
    1. Three-Tier Layer Architecture (Tier 1 SWF, Tier 2 GRAPH, Tier 3 MD) superseded the legacy Dual-Template model.
    2. Binary Topological Validation (BTV PASS) replaced heuristic >=90/100 scoring floors.
    3. Monolithic registers (framework/CHANGELOG.md, framework/governance/DECISIONS.md) were retired as frozen tombstones,
       retiring GATE-SPEC-E008.
    4. Closed 5-step layer lifecycles with author remediation loops, baseline sealing, and CloudEvents were standardized.
    5. Raw filesystem symlinks were banned across consumer repositories.
    However, 25+ framework and project documentation files across framework/ and docs/ retained stale references to
    the Dual-Template model, >=90/100 scoring, CHANGELOG.md/DECISIONS.md maintenance duties, symlinks, and outdated catalogs.
  choice: |
    Execute comprehensive documentation remediation per ratified plans/STALE-DOCS-REMEDIATION-PLAN.md:
    1. Core Guides & Quick Reference: Update SPEC_DRIVEN_DEVELOPMENT_GUIDE.md, QUICK_REFERENCE.md, README.md, and
       AI_ASSISTANT_RULES.md with the Three-Tier Model and BTV PASS criteria.
    2. Governance Core & Gates: Scrub retired CHANGELOG.md/DECISIONS.md duties from DOC_GOVERNANCE_CORE.md, governance README.md,
       DEFINITION_OF_DONE.md, GATE-SPEC_FRAMEWORK.md, and gate_spec_change.md. Maintain exact byte identity between
       governance/chg/README.md and layers/09_CHG/README.md.
    3. Layer READMEs: Harmonize layers 02_PRD through 10_EVAL with composite header "Three-Tier Architecture & Dual-Template
       Selection Matrix" (preserving "Dual-template" conformance assertion invariant) and Tier 3 compiled markdown projections.
    4. Workstations & Patterns: Modernize UPGRADE-RUNBOOK.md, STARTUP_HANDOFF.md, FEDERATED_READ_LAKE_PATTERN.md, PROJECT.md,
       and REPO_STRUCTURE.md, scrubbing banned symlinks and workstation-specific paths.
    5. Version bump: Bump framework/VERSION to 0.96.1 and fan out via hooks/sync-version-refs.sh.
  consequences: |
    - Complete alignment between architectural specifications, layer READMEs, and actual repo implementation.
    - Zero misleading guidance for AI agents regarding retired registers, numeric scoring, or forbidden symlinks.
    - All conformance tests and structural linters remain 100% green.
  alternatives_considered:
    - option: "Ad-hoc documentation edits as individual issues arise"
      rationale_rejected: >-
        Rejected because piecemeal updates leave conflicting architectural guidance across layers, confusing AI agents
        and human contributors regarding which contracts are authoritative.
    - option: "Re-introduce CHANGELOG.md and DECISIONS.md monolithic tracking"
      rationale_rejected: >-
        Rejected per CHG-94 and CHG-95. Change tracking is owned by immutable change packages in framework/archive/CHG-*/
        and GitHub releases; centralized monolithic files cause merge conflicts and drift.

