# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-101)
# =============================================================================

decision:
  decision_id: "DEC-CHG-101"
  title: "Remediate Workstation Path Leaks, Stale Decision Guidance, and Governance Catalog Drift"
  status: "Ratified"
  context: |
    A deep review of the whole framework identified three clusters of defects:
    1. Workstation Host Path Leak (#972): Windows/WSL host path /mnt/e/dev/technology_stack lingers
       in 6 live spec files and inside CNCF Serverless Workflow template ADR-SWF-TEMPLATE.yaml,
       causing workflow state machine execution payloads to refer to nonexistent local paths.
    2. Stale Guidance & Anti-Pattern Instruction (#973): Layer 09 and change playbooks still instruct
       agents to "Add GD entry to DECISIONS.md", contradicting GD-71, GD-78, and SURF-001. Other stale
       citations include deleted plans/FRAMEWORK-TODO.md, retired ROADMAP.md, and retired CHANGELOG.md
       gate checklist items (GATE-SPEC-E008).
    3. Catalog Drift & Naming Discrepancies (#974): Newly added SURF-001..004 rules are missing from
       LINT_RULES.md catalog and tests/conformance/test_lint_catalog.py; TDD-SYNC rule citations in
       spec and IPLAN-TEMPLATE.yaml use legacy numeric IDs (001..007) instead of canonical A..E; and
       RECOMMENDED_PLATFORM_STACK.md mislabels Section 4.1 header as "Layer 09 (Code)".
  choice: |
    1. Sanitize all instances of /mnt/e/dev/technology_stack to canonical vladm3105/technology-stack,
       including inside ADR-SWF-TEMPLATE.yaml.
    2. Update framework/governance/chg/README.md, framework/layers/09_CHG/README.md, and gate_spec_change.md
       step 12 to record change decisions in CHG-*.yaml Section 1B per GD-71 and architectural decisions
       in Layer 05 (ADR). Remove step 5 (CHANGELOG.md) and remove FRAMEWORK-TODO / ROADMAP.md citations.
       Synchronize playbook timestamps to current date (2026-10-13).
    3. Add SURF-001 through SURF-004 to framework/governance/LINT_RULES.md, add surface_lint.py to
       tests/conformance/test_lint_catalog.py, reconcile TDD-SYNC-A..E across spec and templates, and
       re-title Layer 09 header in RECOMMENDED_PLATFORM_STACK.md.
    4. Bump framework/VERSION to 0.91.19 and propagate via hooks/sync-version-refs.sh.
  consequences: |
    - Completely eliminates workstation path leaks in specifications and executable workflow templates.
    - Eliminates conflicting guidance that directs autonomous agents to violate SURF-001.
    - Restores bidirectional agreement guard in test_lint_catalog.py for all linter rule families.
    - Maintains normative SDD layer sequencing and nomenclature across the entire repository.
  alternatives_considered:
    - option: "Split into three sequential PRs"
      rationale_rejected: >-
        All three issues are non-breaking hygiene, path sanitization, and catalog synchronization
        fixes identified in the same deep review audit. Unifying them in CHG-101 ensures zero version
        fragmentation and delivers a clean, consistent baseline.

