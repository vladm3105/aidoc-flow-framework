# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Rewrite SELF_LEARNING.md (v1.1 → v2.0) around the Two-Tier Project
    Knowledge Architecture (Tier 1 active invariants by reference, Tier 2
    on-demand .aidoc/learning knowledge; Tier 3 is the existing §7.4 upstream
    feedback contract by reference — no Tier-3 storage and no universal.md
    machinery) with a truthfulness pass over aspirational machinery
    (session.post / learn-inject / trajectories language becomes
    harness-optional, portable terms); decouple
    framework/skills/self-learn/SKILL.md §§1/4.1/Red-flags from MiMoCode
    paths/schemas (port from the hardened .agents copy, keep the framework
    adaptation header); record GD-40 (folder decision + architecture adoption);
    extend test_self_learning.py (decoupling-token absence, Tier markers,
    learning/-folder pins). Folder: KEEP .aidoc/learning/, draft §3 rename
    declined. MINOR 0.65.2 → 0.66.0 with sweep + both CHANGELOGs."
  why: "The framework skill copy breaks on any non-MiMoCode engine (checkpoint §7/§8, history_fts, tool_input are unavailable tools/paths); SELF_LEARNING.md specifies aspirational hooks as live machinery and carries no usable tier model — the remaining ALIVE core of #779 after phase-a."
  trigger: "Issue #779 phase-b + owner folder/scope decisions 2026-09-29."
  breaking_change_analysis: "C3 (not C2): cross-layer (governance doc + skill + decisions log + test) with new requirements (Tier model). Additive in effect — no gate/ID/schema/enum removed; engines that ignored the coupled paths lose nothing; previously-green records stay green. Reviewer may still block at the formal gate."
  enforcement_decision: "Reviewer-lens + conformance pins (not a linter emitter). Rationale: vendor-neutrality and tier-shape are prose properties; the extended test pins them deterministically."
  scope:
    in:
      - "framework/governance/SELF_LEARNING.md v1.1 → v2.0: Tier 1/2/3 section + truthfulness pass (archive → rewrite → supersedes → bump)"
      - "framework/skills/self-learn/SKILL.md: decouple §§1/4.1/Red-flags (port .agents rows; header untouched)"
      - "framework/governance/DECISIONS.md: GD-40 folder + architecture decision"
      - "tests/conformance/test_self_learning.py: decoupling absence + Tier/folder pins"
      - "framework/VERSION 0.65.2 → 0.66.0 + mechanical pin sweep + both CHANGELOGs"
    out:
      - "Tier-1 AGENTS.md/rules changes (declined in scope decision — reference only)"
      - "Folder rename (declined — keep learning/; no AGENTS.md/BOOTSTRAP.md/skill edits owed)"
      - "Universal-tier distribution / fetch-vs-vendor (canon #131, other repo)"
      - "b-local reference port (external, unverified)"
      - "Archive history rewrites; learnings.md content migration"
      - ".agents skill copy (already hardened — untouched)"

