# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Upstream the downstream enterprise CI/autonomous-PR practice as an engine-agnostic framework standard (#815): new CI_AUTONOMOUS_PR_STANDARD.md stating the six invariants (unified harness, latency tiers, conclusive required checks, two-pass review, conflict classes, anti-blind closure), README index row, GD-42 decision entry, census + engine-neutrality guard test, MINOR bump 0.67.1 → 0.68.0."
  why: "SDD layers specify what to build, not how verification stages between workspace and integration branch — adopters re-derive CI topology ad hoc and repeat deadlock, false-green, and review-lockout failures. The proven downstream shape exists only as local overrides, so every new adopter repeats the mistakes."
  trigger: "Issue #815 (feat(governance), P2) + triage note 2026-09-30 + donor-access authorization this session."
  scope:
    in:
      - "framework/governance/CI_AUTONOMOUS_PR_STANDARD.md (NEW, v1.0 — six engine-neutral invariants, CHG mapping, pre/post-merge discipline)"
      - "framework/governance/README.md index row (v1.1 → v1.2)"
      - "framework/governance/DECISIONS.md GD-42 entry (v1.3 → v1.4)"
      - "tests/conformance/test_governance.py EXPECTED_FILES + new test_ci_autonomous_pr_standard.py (presence/control/six-invariants/neutrality/disambiguation)"
      - "MINOR bump 0.67.1 → 0.68.0: VERSION + both CHANGELOGs + machine-pin fanout (hooks/sync-version-refs.sh OLD_VERSIONS gains 0.67.1 per #663)"
      - "framework/archive/CHG-26/CHG-26.yaml + IPLAN-26.yaml (this vehicle) + pre-change snapshots"
    out:
      - "SDD layer templates 01_BRD–10_EVAL (untouched per issue not-broken list)"
      - "chg_lint schemas/rules (no new lint IDs)"
      - "Literal donor-mechanics port (forbidden by triage constraint)"
      - "CHG step numbering (upstream has none)"
      - "Promotion/release gating beyond the integration branch"

