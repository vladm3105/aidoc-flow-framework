# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Review Flow Harmonization, Saga Loop Enablement, and Governance Stale-Info Purge"
  author: "Framework Maintainer"
  date_submitted: "2026-10-07T00:00:00Z"
  summary: |
    Comprehensive harmonization and bugfix overhaul of the review, remediation, and saga governance surfaces:
    (1) REVIEW_CREWS.yaml: purge retired platform agent-brief and skill references; specify crew quorum defaults; document Layer 10 EVAL grading via 10_IPVERIFY; clarify generic drafter/fixer roles;
    (2) REVIEW_REMEDIATION_FLOW.md: harmonize gate pass criteria with deterministic floor (structural_pass + no_blocking); fix iteration cap terminal state from PARTIAL_TIMEOUT to ESCALATED; fix stale script path to hooks/pre_push_check.sh and audit phrase to OPS-0065; include 09_CHG and 10_EVAL in scope; define priority-to-severity mapping;
    (3) REVIEW_SAGA.md: expand transition table to enable the multi-iteration review loop (SYNTHESIZED -> FANOUT_STARTED and ESCALATED); fix relative path references; clarify run-level scope of PARTIAL_TIMEOUT;
    (4) REVIEW_TEAM.md: purge retired platform test claims for agent briefs; update stale playbook file counts to live numbers (69 total, 51 lens playbooks); fix broken section reference; clarify review mode hierarchy; define quorum formula;
    (5) SECURITY_REVIEW.md: correct checklist tagging (map Rule 4 to Scope Boundary / Least Authority; map Rule 5 to T4 Active Content); expand scope to Layer 10 EVAL; modernize terminology to engine runtime code;
    (6) review-remediation-flow.sw.yaml: update GatePassed condition to check structural integrity alongside zero blocking; document dynamic crew injection;
    (7) Harmonize secondary adaptation surfaces (ADAPTATION_SURFACE.yaml, ADAPTATION.md, PROFILE-TEMPLATE.yaml) resolving phantom PARTIAL_TIMEOUT iteration-cap references to ESCALATED;
    (8) GOVERNANCE_WORKFLOW_STANDARD.md: reconcile Circuit Breaker CB-1 arithmetic (Max 2 remediation passes = 3-cycle cap);
    (9) hooks/sync-version-refs.sh and test_sync_version_refs.py: register 0.88.3 in OLD_VERSIONS and bump framework to 0.88.4;
    (10) Conformance & Decisions: update test_saga_lifecycle_parity.py SPEC_TRANSITIONS pin, ratify Decision GD-68, and record release notes.
  rationale: |
    A deep review of the review flow governance documents revealed several latent contradictions, illegal transitions, and stale references:
    - REVIEW_REMEDIATION_FLOW.md claimed reaching the iteration cap transitioned to PARTIAL_TIMEOUT, contradicting its own state diagram, table, and CNCF workflow which transition to ESCALATED.
    - REVIEW_SAGA.md modeled a single-pass fan-in with no legal transition to re-review or escalate from SYNTHESIZED, breaking multi-iteration sagas.
    - REVIEW_TEAM.md cited retired tests for agent briefs (deleted in CLEANUP-001) and stale playbook counts (58/53 vs live 69/51).
    - SECURITY_REVIEW.md mislabeled checklist item 4 with (T4) instead of Rule 4, and omitted Layer 10 EVAL.
    - Script path scripts/pre_push_check.sh and audit code OPS-0069 were stale in REVIEW_REMEDIATION_FLOW.md.
    - Secondary surfaces (ADAPTATION_SURFACE.yaml, ADAPTATION.md, PROFILE-TEMPLATE.yaml) copied the erroneous PARTIAL_TIMEOUT rule.

# =============================================================================
# Section 3: Scope & Impact Analysis
# =============================================================================

scope:
  components:
    - "framework/governance/REVIEW_CREWS.yaml: Purge retired platform brief notes, add quorum contract, document Layer 10 EVAL and drafter/fixer"
    - "framework/governance/REVIEW_REMEDIATION_FLOW.md: Gate floor harmonization, iteration cap to ESCALATED, script path and OPS-0065 fix, priority/severity mapping, scope expansion"
    - "framework/governance/REVIEW_SAGA.md: Transition table multi-iteration loop enablement, relative path fixes, PARTIAL_TIMEOUT disambiguation"
    - "framework/governance/REVIEW_TEAM.md: Purge retired brief test claims, update playbook counts to 69/51, fix section anchor, clarify review_mode and quorum"
    - "framework/governance/SECURITY_REVIEW.md: Fix checklist tag mapping, expand scope to Layer 10 EVAL, modernize to engine runtime"
    - "framework/governance/workflows/review-remediation-flow.sw.yaml: Align GatePassed condition and document crew fan-out"
    - "framework/governance/ADAPTATION_SURFACE.yaml: Fix quality_loop_max_iterations constraint description to ESCALATED"
    - "framework/governance/ADAPTATION.md: Fix quality_loop_max_iterations references to ESCALATED"
    - "framework/governance/PROFILE-TEMPLATE.yaml: Fix quality_loop_max_iterations comment to ESCALATED"
    - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: Reconcile CB-1 2 remediation passes with 3-cycle cap"
    - "hooks/sync-version-refs.sh: Add 0.88.3 to OLD_VERSIONS"
    - "tests/conformance/test_saga_lifecycle_parity.py: Synchronize SPEC_TRANSITIONS pin with revised REVIEW_SAGA.md"
    - "framework/governance/DECISIONS.md: Ratify Decision GD-68"
    - "framework/CHANGELOG.md: Release notes under [0.88.4]"
    - "framework/VERSION: Bump to 0.88.4"
  backward_compatible: true
