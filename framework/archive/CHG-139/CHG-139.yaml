# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-139)
# =============================================================================

decision:
  decision_id: "DEC-CHG-139"
  title: "Add --refresh-blueprints to upgrade.sh and harmonize blueprint drift reporting"
  status: "Decided"
  date: "2026-10-27"
  context: >-
    Issue #1048: upgrade.sh never refreshes installer-scaffolded files (8 blueprints
    in .aidoc/project/governance/ and root .pre-commit-config.yaml), leaving consumers
    on stale blueprints without update mechanism. Furthermore, because blueprint
    markdown files lack YAML framework_version: pins, upgrade.sh reports 8 UNPINNED
    lines on every standard install upgrade.
  choice: >-
    1. Harmonize upgrade.sh stale detector: recognize standard scaffolded governance
    blueprints in .aidoc/project/governance/. If a blueprint matches canon, report OK
    (blueprint up-to-date); if it differs, report DRIFT with explicit guidance to pass
    --refresh-blueprints, silencing false UNPINNED noise.
    2. Add --refresh-blueprints flag to upgrade.sh and deploy.sh: when passed, standard
    blueprints (and missing root .pre-commit-config.yaml) are updated to new canon.
    Consumer edits are safely preserved (only refreshed if matching old canon or if
    --force is specified).
    3. Document the workflow in framework/governance/aidoc/UPGRADE-RUNBOOK.md.
  consequences:
    positive:
      - Consumers can easily keep operational governance blueprints current with upstream.
      - Consumer customizations are safely protected against blind clobbering.
      - Eliminates 8 confusing UNPINNED lines during standard upgrades.
    negative:
      - None; opt-in flag and non-destructive defaults ensure safety.
    risks:
      - Unintended overwrite of consumer customizations; mitigated by comparing
        content against previous canon before overwriting unless --force is given.

