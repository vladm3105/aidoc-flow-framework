# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Batch four docs/deploy gaps in one C2 vehicle: (#784) codify the already-wired judge-then-human pattern at C3/spec gates — mandatory independent second-opinion review BEFORE the human approval surfacing, AI verdict never satisfies the gate (Option A of the issue; Option B bounded AI-approver tier explicitly declined); (#785) fix the root-relative aidoc scaffold cp path (prefix framework/); (#786) add BOOTSTRAP.md checklist (profile copy + knob fill, symlink create, version pin, smoke-verify) wired from the aidoc README; (#787) add UPGRADE-RUNBOOK.md (re-point framework_path, diff project/ overrides, re-run conformance, changelog) wired from GATE-SPEC re-adoption box. PATCH bump 0.65.0 → 0.65.1 with mechanical pin sweep + both CHANGELOGs."
  why: "Each gap verified live on dev: the #785 command fails as written; #784 leaves Step-4 approval ambiguous between judge-as-reviewer and judge-as-approver; #786/#787 state obligations (deploy contract, re-adoption box) with no procedure behind them, proven by silent consumer drift."
  trigger: "Issues #784, #785, #786, #787 (all OPEN, all claims ALIVE 2026-09-29) + owner session direction to fix and group into one PR."
  breaking_change_analysis: "C2 (not C3): additive clarification — no gate/ID/schema/enum removed; #784 narrows nothing previously permitted (human-only C3 approval already the rule; the judge step was already wired in approval-gate); previously-green records stay green. Reviewer may escalate to C3 at PR review."
  enforcement_decision: "Reviewer-lens (not a new linter emitter). Rationale: approval adequacy and runbook completeness are judgement over prose, not syntactic properties of a record; the #785 path is covered by the existing file-presence conformance battery."
  scope:
    in:
      - "framework/governance/chg/README.md v1.2 → v1.3 (+ byte-identical twin framework/layers/09_CHG/README.md): judge-then-human C3 approval rule (#784)"
      - "framework/governance/aidoc/README.md v1.0 → v1.1: cp path fix (#785) + BOOTSTRAP/UPGRADE-RUNBOOK rows"
      - "framework/governance/aidoc/BOOTSTRAP.md v1.0 (new): bootstrap checklist (#786)"
      - "framework/governance/aidoc/UPGRADE-RUNBOOK.md v1.0 (new): consumer upgrade runbook (#787)"
      - "tests/conformance/test_governance.py: EXPECTED_FILES + the two new docs"
      - "framework/VERSION 0.65.0 → 0.65.1 + mechanical pin sweep + both CHANGELOGs"
    out:
      - " bounded AI-approver tier (#784 Option B — explicitly declined, needs SDD scope + IPLAN of its own)"
      - "Upgrade/stale-detector scripts (#786/#787 script halves — not shipped; runbooks are prose-only)"
      - "Issue #779 (self-learn two-tier, P1) — separate F3/C3 vehicle, ships alone"
      - "Any gate/ID/schema/enum change (none)"

