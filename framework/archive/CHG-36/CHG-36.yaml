# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Adopt the verification-binding contract (#842): one engine-agnostic paragraph in DEFINITION_OF_DONE.md — every EVAL verdict MUST reference the content hash of the exact artifact revision evaluated, and the engine trust boundary MUST make forging that binding impossible without modifying the engine itself. Mechanism stays engine-local; no new layer; verdict enum, Completed → Verified flow, and GATE-08 untouched. GD-43 decision entry; MINOR bump 0.68.6 → 0.69.0."
  why: "The EVAL gate records verdict + artifacts but never requires the verdict to be bound to the exact artifact bytes evaluated — any conforming engine may legally pair a PASS with unexamined code. The gap is an absence, so all existing checks pass while the guarantee is missing; it surfaced when an engine's safety case needed a spec rule to conform to and none existed."
  trigger: "Issue #842 (P1, gap; real-use origin: Rust harness spike verifier-contract investigation, 2026-10-01)."
  scope:
    in:
      - "framework/governance/DEFINITION_OF_DONE.md: new `Verification binding (EVAL verdicts)` section (v1.0 → v1.1) + cross-reference row"
      - "framework/governance/DECISIONS.md: new GD-43 entry (v1.4 → v1.5)"
      - "framework/archive/CHG-36/CHG-36.yaml + IPLAN-36.yaml (this vehicle) + pre-change snapshots"
      - "MINOR bump 0.68.6 → 0.69.0: VERSION + framework/CHANGELOG.md + machine-pin fanout (hooks/sync-version-refs.sh OLD_VERSIONS gains 0.68.6)"
    out:
      - "EVAL layer templates 01_BRD–10_EVAL (untouched per issue not-broken list — no schema change)"
      - "Verdict enum, Completed → Verified flow, GATE-08, review-remediation loop (untouched)"
      - "chg_lint schemas/rules (no new lint IDs)"
      - "Engine mechanism specifics (engine-local by contract)"

