# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-94)
# =============================================================================

decision:
  decision_id: "DEC-CHG-94"
  title: "Tombstone framework/CHANGELOG.md and Retire GATE-SPEC-E008"
  status: "Ratified"
  context: |
    Hand-maintaining framework/CHANGELOG.md per-PR introduces recurring friction without
    incremental value: every change to framework/ already authors a machine-readable,
    linted CHG document in framework/archive/CHG-*/ containing metadata, decisions,
    requests, and file manifests. Updating CHANGELOG.md forces agents and developers to
    duplicate the exact same information in prose, burns context tokens, causes persistent
    additive merge conflicts at the top of the file across parallel branches, and triggers
    brittle CI failures under GATE-SPEC-E008. Root CHANGELOG.md was already frozen as a tombstone
    in CHG-40 (#836); framework/CHANGELOG.md carries the exact same defect class.
  choice: |
    1. Freeze framework/CHANGELOG.md as a tombstone (matching root CHANGELOG.md); cease
       per-PR manual maintenance.
    2. Declare framework/archive/CHG-*/ + GitHub releases and PRs as the live change records
       of truth. Human-readable changelogs can be generated from CHG archives on demand
       during formal release cut-offs.
    3. Retire GATE-SPEC-E008 in tests/chg/spec_gate.py, tests/conformance/test_spec_gate.py,
       and governance gate catalogs.
    4. Remove framework/CHANGELOG.md from hooks/check-docs-updated.sh and update AGENTS.md,
       CONTRIBUTING.md, and README.md.
  consequences: |
    - Eliminates token waste and manual duplicate reporting across all future PRs.
    - Permanently resolves merge conflict hotspot on line 16 of framework/CHANGELOG.md.
    - Speeds up autonomous agent execution while preserving complete audit provenance via CHG YAMLs.
  alternatives_considered:
    - option: "Continue hand-maintaining framework/CHANGELOG.md per PR"
      rationale_rejected: >-
        Incurs ongoing token costs, merge conflicts, and duplicates information already in CHG files.
    - option: "Auto-generate framework/CHANGELOG.md on every PR commit"
      rationale_rejected: >-
        Still mutates a shared tracked file per PR, risking race conditions and commit pollution.

