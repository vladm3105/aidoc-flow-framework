# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-90)
# =============================================================================

decision:
  decision_id: "DEC-CHG-90"
  title: "Standardized In-File Dual-Template Selection Guides Across Layers 01–08 and Governance"
  status: "Accepted"
  context: |
    The framework maintains dual-template support across Layers 01–08 and Governance (Layer 09 CHG):
    primary machine-executable CNCF Serverless Workflow templates (*-SWF-TEMPLATE.yaml) and
    companion static declarative templates (*-TEMPLATE.yaml).
    While documented in layer READMEs and governance decisions (GD-61, GD-73), the template files
    themselves lacked in-file selection guidance in their comment headers. Consequently, AI agents
    and engineers inspecting layer folders lacked immediate, in-file guidance on which template
    to choose for a given initiative.
  choice: |
    1. Author explicit, layer-tailored TEMPLATE SELECTION GUIDE comment blocks in the header of all
       primary templates (*-SWF-TEMPLATE.yaml) across Layers 01–08 and Governance (09_CHG).
    2. Author corresponding companion TEMPLATE SELECTION GUIDE comment blocks in the header of all
       companion templates (*-TEMPLATE.yaml) across Layers 01–08 and Governance (09_CHG).
    3. Maintain strict byte-identity between framework/governance/chg/CHG-TEMPLATE.yaml and
       framework/layers/09_CHG/CHG-TEMPLATE.yaml.
    4. Ratify Decision GD-77 in framework/governance/DECISIONS.md.
    5. Advance framework spec version to 0.91.9 and propagate version references.
  consequences: |
    - AI agents and developers authoring new artifacts receive immediate, in-file guidance on template choice.
    - Explicitly affirms *-SWF-TEMPLATE.yaml as the Primary Standard and *-TEMPLATE.yaml as Companion.
    - Zero structural disruption to schema validation (sdd_doc_lint and swf_lint ignore YAML comments).
    - Preserves engine-agnostic purity and dual-template discipline.
  alternatives_considered:
    - option: "Rely solely on layer README.md selection matrices"
      rationale_rejected: "Forces agents to load extra files during generation, leading to accidental selection of static templates when SWF is preferred."
    - option: "Add selection guide only to SWF templates"
      rationale_rejected: "Leaves static companion templates ambiguous without explaining their role or pointing to SWF as primary."

