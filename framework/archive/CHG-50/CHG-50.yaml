change_description:
  summary: "Fix the 13 surviving preprod findings (#878-#890): portable sed fill, --canon-sha pin, rm-before-validate, atomic swap + pre-swap smoke, AUTHOR newline reject (scripts); full-phrase audit grep (hook); ||-join + loud re-stage (sync); knob pointer + step0 + kind reconcile (BOOTSTRAP); dead-ref + step4 cite (RUNBOOK); GD-47 F2.2 qualification + GD-48 (DECISIONS); runbook listing (README); platform tense (PROJECT). MINOR cut 0.73.0."
  why: "Preprod verdict SHIP-WITH-FIXES on the 0.70.3→0.72.2 promotion: the new consumer scripts are broken on macOS, clone by mutable tag, and carry failure windows; the runbooks carry stale pointers. The promotion must not ship these to all consumers."
  trigger: "Issues #878-#890 (preprod lenses 1-5, all Mode B GO 2026-10-02)."
  scope:
    in:
      - "framework/scripts/install.sh (v1.0 → v1.1: portable fill, pre-validate, AUTHOR reject, --canon-sha)"
      - "framework/scripts/upgrade.sh (v1.0 → v1.1: portable re-pin, atomic swap, pre-swap smoke, --canon-sha)"
      - "hooks/pre_push_check.sh (full-phrase audit grep)"
      - "hooks/sync-version-refs.sh (single-| join, loud re-stage warning, OLD_VERSIONS)"
      - "BOOTSTRAP.md (v1.1 → v1.2: knob pointer, step0, kind reconcile, prereqs)"
      - "UPGRADE-RUNBOOK.md (v1.1 → v1.2: dead-ref fix, step4 cite, --canon-sha note)"
      - "DECISIONS.md (v1.9 → v1.10: GD-47 qualification + GD-48)"
      - "framework/README.md (v1.1 → v1.2: aidoc listing)"
      - "docs/PROJECT.md (platform tense; rides cascade, docs/)"
      - "Covering tests (consumer-scripts + hook-stage extends)"
      - "MINOR cut 0.73.0: framework/VERSION + pin sweep + framework/CHANGELOG.md [0.73.0]"
      - "framework/archive/CHG-50/ vehicle + pre-change snapshots"
    out:
      - "Lens findings adjudicated non-defects (see header Out of scope)"
      - "E003 amendment (deeper question stays open; only GD-47's wording is qualified)"
      - "TAGGING.md high-water refresh (done by the promotion step itself)"

