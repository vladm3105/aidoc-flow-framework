# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Close two engine-guidance gaps with normative SHOULD prose (one vehicle, one PR). #845: new framework/governance/ENGINE_TELEMETRY.md — vendor-neutral telemetry guidance (standard span/attribute names for attempt, usage, cost, gate verdict + CHG/IPLAN correlation IDs; backend-agnostic; no vendor SDK mandated; saga journaling untouched). #846: new ADAPTATION.md §5.1 — live policy-update discipline (validate-then-atomically-swap on profile change, schema-versioned policy via the existing schema_version field, never run on a half-parsed policy; engines MAY poll/watch, MUST keep last-good on invalid input; load-time fallback semantics untouched). Pins: test_governance EXPECTED_FILES gains the new doc (intentional spec change, justified here), governance README table gains its row. PATCH cut 0.70.1 (VERSION bump + sweep + framework changelog; root log frozen per CHG-40) per GATE-SPEC E005/E008."
  why: "Engines emitting spans (attempts, token usage, cost, gate verdicts) cannot be mutually intelligible and traces cannot join CHG/IPLAN IDs across engines (#845); a hot-reloading long-lived engine has no live-update contract to conform to — load-time fallback reads as complete config governance while the live dimension is absent (#846)."
  trigger: "Issues #845 and #846 (review origin, Rust harness spike, 2026-10-01)."
  scope:
    in:
      - "NEW framework/governance/ENGINE_TELEMETRY.md (vendor-neutral SHOULD telemetry guidance; no SDK mandated; saga journaling untouched)"
      - "framework/governance/ADAPTATION.md: new §5.1 live policy-update discipline (validate-then-swap, schema-versioned, keep-last-good; load-time fallback untouched; no new knob, no §4 section — knob parity holds)"
      - "framework/governance/README.md: table row for ENGINE_TELEMETRY.md"
      - "tests/conformance/test_governance.py: EXPECTED_FILES gains ENGINE_TELEMETRY.md (intentional spec change, justified here)"
      - "framework/archive/CHG-38/CHG-38.yaml + IPLAN-38.yaml (this vehicle)"
      - "framework/VERSION 0.70.0 → 0.70.1 + hooks/sync-version-refs.sh OLD_VERSIONS + sweep (E005 driver; pin moves only)"
      - "framework/CHANGELOG.md [0.70.1] section (E008 driver; root CHANGELOG.md frozen per CHG-40)"
    out:
      - "Saga journaling (REVIEW_SAGA.md, saga.schema.json untouched)"
      - "Load-time fallback semantics (ADAPTATION_SURFACE.yaml fallback lines + PROFILE-TEMPLATE untouched)"
      - "New adaptation knobs (sibling #843 owns the registry)"
      - "EVAL verdict mechanics, DEFINITION_OF_DONE.md (sibling #842 owns it)"
      - "Any vendor SDK, backend, or platform mandate"
      - "DECISIONS/TAGGING/plans/archive history (frozen record, intact)"

