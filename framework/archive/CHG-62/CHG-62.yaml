# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Author framework/layers/05_ADR/ADR_WORKFLOW_STANDARD.md, ADR-SWF-TEMPLATE.yaml, and framework/governance/workflows/adr-decision-analysis.sw.yaml; amend 05_ADR/README.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-58 in DECISIONS.md; add test_adr_workflow.py and update EXPECTED_WORKFLOWS and EXPECTED_FILES; MINOR bump 0.82.0 → 0.83.0."
  what: "Establishes declarative CNCF Serverless Workflow v0.8 state machines for (1) complex, multi-candidate architectural trade-off evaluations via the Hybrid Envelope Architecture (ADR-SWF-TEMPLATE.yaml), (2) the automated architectural decision analysis workflow (adr-decision-analysis.sw.yaml), and (3) normative ADR decision-analysis-to-state-machine mapping guidelines (ADR_WORKFLOW_STANDARD.md). Aligns companion ADR and governance documentation, ratifying Decision GD-58."
  why: "Enables autonomous AI coding agents and graph orchestrators to evaluate architectural candidate solutions across weighted quality attributes (MCDA), collect stakeholder RFC review signals, validate acceptance thresholds, and handle rejection compensation, while preserving full backward compatibility with static YAML ADRs and sdd_doc_lint structural validation. Issue #917."
  trigger: "User review 2026-10-05 approving Step 7 of CNCF standardization roadmap + issue #917."
  scope:
    in:
      - "framework/layers/05_ADR/ADR_WORKFLOW_STANDARD.md: normative standard mapping architecture decision evaluation to CNCF state machines"
      - "framework/layers/05_ADR/ADR-SWF-TEMPLATE.yaml: canonical hybrid template for complex ADR trade-off workflows"
      - "framework/governance/workflows/adr-decision-analysis.sw.yaml: declarative CNCF v0.8 runner for architectural trade-off and decision evaluation"
      - "framework/layers/05_ADR/README.md: update ADR documentation to bind CNCF workflow standard"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register adr-decision-analysis in catalog"
      - "framework/governance/DIAGRAM_STANDARDS.md: register ADR decision analysis state machines"
      - "framework/governance/DECISIONS.md: add GD-58 ratifying CNCF Serverless Workflow standard for Layer 05 ADR"
      - "tests/conformance/test_adr_workflow.py: conformance test suite for ADR workflow templates and evaluation runners"
      - "tests/conformance/test_governance_workflows.py: add adr-decision-analysis to EXPECTED_WORKFLOWS"
      - "tests/conformance/test_governance.py: add workflow and ADR standard to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.82.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.82.0 → 0.83.0"
      - "framework/CHANGELOG.md: entry for CHG-62 / 0.83.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Deprecation of ADR-TEMPLATE.yaml (retained as standard for atomic/single-candidate decisions)"

