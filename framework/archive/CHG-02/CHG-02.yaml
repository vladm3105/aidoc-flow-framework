# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  what: |
    Redefine the `.aidoc/` directory from "AI provenance tier" to "project
    override layer + profile". The new contract:

    1. `.aidoc/profile.yaml` — adaptation knobs (unchanged)
    2. `.aidoc/framework/` — symlink to shared framework (canonical path)
    3. `.aidoc/project/` — project-specific overrides (same structure as framework/)
    4. Agent discovery: read `.aidoc/project/` first, fall back to `.aidoc/framework/`

    This follows software versioning conventions: projects customize without
    forking, overrides are project-local, and the framework stays untouched.

    Additional work in this CHG:
    - Moved docs/AIDOC.md → governance/aidoc/AIDOC.md (same structure as governance/chg/)
    - Created governance/aidoc/README.md and AIDOC-SCAFFOLD-TEMPLATE.md
    - Updated governance/PROFILE-TEMPLATE.yaml with framework_path field
    - Updated governance/ADAPTATION.md §10 to remove old framework/ symlink reference
  why: |
    The existing .aidoc/ contract defined it as "AI provenance" with audit/,
    review/, remediation/, validation/, security/, quality/ subdirectories.
    In practice, no project uses these subdirectories — they remain empty.
    Projects need a way to override framework templates, rules, and playbooks
    without modifying the shared framework. The new .aidoc/project/ provides
    this mechanism with the same directory structure as framework/, making
    discovery predictable.
  trigger: |
    Projects adopting the framework need project-specific customizations
    (modified templates, additional governance rules, custom playbooks) but
    have no mechanism to override framework defaults without forking. The
    empty audit/review/etc. subdirectories wasted space and confused users.

