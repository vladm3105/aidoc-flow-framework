change_description:
  summary: "Author framework/layers/06_SPEC/SPEC_WORKFLOW_STANDARD.md, SPEC-SWF-TEMPLATE.yaml, and framework/governance/workflows/spec-choreography-contract.sw.yaml; amend 06_SPEC/README.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-57 in DECISIONS.md; add test_spec_workflow.py and update EXPECTED_WORKFLOWS and EXPECTED_FILES; MINOR bump 0.81.0 → 0.82.0."
  what: "Establishes declarative CNCF Serverless Workflow v0.8 state machines for (1) complex, distributed, event-driven component choreography via the Hybrid Envelope Architecture (SPEC-SWF-TEMPLATE.yaml), (2) the distributed service interaction contract workflow (spec-choreography-contract.sw.yaml), and (3) normative SPEC interface-to-state-machine mapping guidelines (SPEC_WORKFLOW_STANDARD.md). Aligns companion SPEC and governance documentation, ratifying Decision GD-57."
  why: "Enables autonomous AI coding agents and graph orchestrators to specify and verify distributed service interactions, event choreography, asynchronous callbacks, and saga rollback compensation, while preserving full backward compatibility with static YAML component specifications and sdd_doc_lint structural validation. Issue #915."
  trigger: "User review 2026-10-05 approving Step 6 of CNCF standardization roadmap + issue #915."
  scope:
    in:
      - "framework/layers/06_SPEC/SPEC_WORKFLOW_STANDARD.md: normative standard mapping interface/event choreography to CNCF state machines"
      - "framework/layers/06_SPEC/SPEC-SWF-TEMPLATE.yaml: canonical hybrid template for distributed SPEC workflows"
      - "framework/governance/workflows/spec-choreography-contract.sw.yaml: declarative CNCF v0.8 runner for distributed service interactions"
      - "framework/layers/06_SPEC/README.md: update SPEC documentation to bind CNCF workflow standard"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register spec-choreography-contract in catalog"
      - "framework/governance/DIAGRAM_STANDARDS.md: register SPEC choreography state machines"
      - "framework/governance/DECISIONS.md: add GD-57 ratifying CNCF Serverless Workflow standard for Layer 06 SPEC"
      - "tests/conformance/test_spec_workflow.py: conformance test suite for SPEC workflow templates and choreography runners"
      - "tests/conformance/test_governance_workflows.py: add spec-choreography-contract to EXPECTED_WORKFLOWS"
      - "tests/conformance/test_governance.py: add workflow and SPEC standard to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.81.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.81.0 → 0.82.0"
      - "framework/CHANGELOG.md: entry for CHG-61 / 0.82.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Deprecation of SPEC-TEMPLATE.yaml (retained as standard for atomic/single-component specifications)"

