# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-102)
# =============================================================================

decision:
  decision_id: "DEC-CHG-102"
  title: "Establish Layer 10 CNCF Serverless Workflow Review Remediation and Standard Parity"
  status: "Ratified"
  context: |
    Issue #975 identified three gaps in Layer 10 (EVAL/IPVERIFY) and plans documentation:
    1. Missing Review Remediation Workflow: While Layers 01 through 09 provide declarative CNCF
       Serverless Workflow state machines in framework/governance/workflows/review/, Layer 10
       was missing its companion eval-review-remediation.sw.yaml.
    2. Missing Workflow Standard and Template: Layers 01 through 08 have dedicated workflow standard
       documents and *-SWF-TEMPLATE.yaml files, but Layer 10 had neither EVAL_WORKFLOW_STANDARD.md
       nor EVAL-SWF-TEMPLATE.yaml.
    3. Broken Relative Markdown Link: plans/ACCEPTANCE-HISTORY.md:196 contained a broken link
       [../tests/README.md](../../tests/README.md) which stepped two levels up and escaped the repo root.
  choice: |
    1. Author framework/governance/workflows/review/eval-review-remediation.sw.yaml adhering to
       CNCF Serverless Workflow DSL v0.8.
    2. Author framework/layers/10_EVAL/EVAL_WORKFLOW_STANDARD.md and EVAL-SWF-TEMPLATE.yaml adhering
       to the Hybrid Envelope Architecture.
    3. Fix the broken link in plans/ACCEPTANCE-HISTORY.md:196 to point to ../tests/README.md.
    4. Update framework/governance/REVIEW_WORKFLOW_STANDARD.md and framework/layers/10_EVAL/README.md
       to reference the new Layer 10 workflow standard, review workflow, and template.
    5. Add conformance test tests/conformance/test_eval_workflow.py to validate Layer 10 workflow
       standard, template, and review remediation graph integrity.
    6. Bump framework/VERSION to 0.91.20 and sweep references via hooks/sync-version-refs.sh.
  consequences: |
    - Completes Layer 10 parity with Layers 01 through 09 across the SDD framework.
    - Enables autonomous AI coding agents to orchestrate automated review remediation sagas for Layer 10.
    - Resolves the dead link in plans/ACCEPTANCE-HISTORY.md.
  alternatives_considered:
    - option: "Rely solely on eval-verification-run.sw.yaml without review remediation"
      rationale_rejected: >-
        eval-verification-run executes test suites, but does not orchestrate the multi-persona review
        saga for the evaluation strategy and report artifacts itself. Parity with other SDD layers
        requires a dedicated review remediation workflow.

