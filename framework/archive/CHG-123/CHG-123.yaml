# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-123)
# =============================================================================

decision:
  decision_id: "DEC-CHG-123"
  title: "Formal Decision: Framework-Wide BTV Workflow Modernization & Stale Docs Reconciliation"
  date: "2026-10-19"
  status: Accepted
  context: |
    Under SDD-0044 and Binary Topological Validation (BTV), quality gates are deterministic, binary, and
    evaluated on structural schema conformance and zero blocking review findings. Following the successful
    piloting in Layer 08 IPLAN (CHG-121) and GATE-06 (CHG-122), an exhaustive framework audit revealed that
    the remaining 9 SDD layer SWF templates, 8 workflow standards, and 10 standalone governance workflows
    still enforced legacy scalar heuristic conditions ('.review_score >= 90'). Furthermore, several declarative
    templates retained percentage placeholders ('[X]%'), 5 SDD-GRAPH templates retained scalar '90/100' targets,
    and docs/REPO_STRUCTURE.md retained stale platform distribution claims.
  choice: |
    Implement framework-wide BTV modernization per plans/SDD-BTV-WORKFLOW-AND-DOCS-RECONCILIATION-PLAN.md:
    1. Modernize review gate transition conditions from '${ .review_score >= 90 and .blocking_findings == 0 and .gate_passed == true }'
       to '${ .blocking_findings == 0 and .gate_passed == true }' across all 9 layer SWF templates (01_BRD through 07_TDD, 09_CHG, 10_EVAL),
       their workflow standards, and all 10 governance workflows in framework/governance/workflows/.
    2. Guard EARS sequential switch states against short-circuiting by requiring '.hasAmbiguity == false' on approval,
       and modernize EARS operation 'readiness#score' to 'readiness#verify' and action 'scoreReadiness' to 'verifyBddReadiness'.
    3. Modernize governance workflow action arguments: threshold_min_score in eval-verification-run.sw.yaml to verify_btv_pass: true,
       readinessScore emission in ears-requirements-validation.sw.yaml to bdd_ready: PASS / FAIL, and score in review-remediation-flow.sw.yaml
       to gate_verdict: PASS.
    4. Standardize declarative readiness indicators to '[PASS | FAIL]' in 03_EARS, 04_BDD, 05_ADR, 06_SPEC, and update
       5 SDD-GRAPH metadata readiness targets from '90/100' to 'PASS'.
    5. Correct stale platform distribution text and dead archive paths in docs/REPO_STRUCTURE.md, and qualify CHANGELOG.md in docs/PROJECT.md.
    6. Lock down 3-way byte parity across all 3 CHG template locations in tests/conformance/test_chg_flows_router.py, and add
       test_no_residual_review_score_in_workflows in test_governance_workflows.py.
    7. Bump framework/VERSION from 0.96.9 to 0.96.10, update hooks/sync-version-refs.sh, and propagate pins.
  consequences: |
    - All 10 SDD layers and governance workflows operate under a uniform, deterministic Binary Topological Validation contract.
    - Zero residual scalar review_score conditions remain in any active state machine or standard.
    - Graph templates and declarative templates present consistent binary readiness semantics.
    - 3-way byte parity across CHG templates is permanently backstopped by automated conformance regression tests.
    - Stale platform distribution claims are eliminated from documentation.

