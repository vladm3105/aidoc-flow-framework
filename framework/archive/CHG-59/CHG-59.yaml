change_description:
  summary: "Author framework/layers/04_BDD/BDD_WORKFLOW_STANDARD.md, BDD-SWF-TEMPLATE.yaml, and framework/governance/workflows/bdd-acceptance-run.sw.yaml; amend 04_BDD/README.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-55 in DECISIONS.md; add test_bdd_workflow.py and update EXPECTED_WORKFLOWS and EXPECTED_FILES; MINOR bump 0.79.0 → 0.80.0."
  what: "Establishes declarative CNCF Serverless Workflow v0.8 state machines for (1) complex, multi-step, stateful BDD scenarios via the Hybrid Envelope Architecture (BDD-SWF-TEMPLATE.yaml), (2) the QA staging BDD acceptance test suite execution lifecycle (bdd-acceptance-run.sw.yaml), and (3) normative BDD Given/When/Then-to-state-machine mapping guidelines (BDD_WORKFLOW_STANDARD.md). Aligns companion BDD and governance documentation, ratifying Decision GD-55."
  why: "Enables autonomous AI coding agents and graph orchestrators to execute and trace complex, stateful user journeys with native branching, event stimuli, and saga rollback compensation, while preserving full backward compatibility with static YAML scenarios and sdd_doc_lint structural validation. Issue #911."
  trigger: "User review 2026-10-05 approving Step 4 of CNCF standardization roadmap + issue #911."
  scope:
    in:
      - "framework/layers/04_BDD/BDD_WORKFLOW_STANDARD.md: normative standard mapping Given/When/Then to CNCF state machines"
      - "framework/layers/04_BDD/BDD-SWF-TEMPLATE.yaml: canonical hybrid template for stateful BDD workflows"
      - "framework/governance/workflows/bdd-acceptance-run.sw.yaml: declarative CNCF v0.8 runner for QA staging scenario execution"
      - "framework/layers/04_BDD/README.md: update BDD documentation to bind CNCF workflow standard"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register bdd-acceptance-run in catalog"
      - "framework/governance/DIAGRAM_STANDARDS.md: register BDD scenario execution state machines"
      - "framework/governance/DECISIONS.md: add GD-55 ratifying CNCF Serverless Workflow standard for Layer 04 BDD"
      - "tests/conformance/test_bdd_workflow.py: conformance test suite for BDD workflow templates and runners"
      - "tests/conformance/test_governance_workflows.py: add bdd-acceptance-run to EXPECTED_WORKFLOWS"
      - "tests/conformance/test_governance.py: add workflow and BDD standard to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.79.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.79.0 → 0.80.0"
      - "framework/CHANGELOG.md: entry for CHG-59 / 0.80.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Deprecation of BDD-TEMPLATE.yaml (retained as standard for atomic/simple scenarios)"

