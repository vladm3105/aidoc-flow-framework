# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-120)
# =============================================================================

decision:
  decision_id: "DEC-CHG-120"
  title: "Formal Decision: Layer 08 (IPLAN) Execution Engine Enhancement & Status Taxonomy Harmonization"
  date: "2026-10-19"
  status: Accepted
  context: |
    Layer 08 (IPLAN) lacked an inner remediation loop in both IPLAN-SWF-TEMPLATE.yaml and
    iplan-execution.sw.yaml, causing immediate destructive saga rollbacks (rm -f tests/ and git checkout)
    upon test failure. The templates also lacked a non-destructive blocked state, retained residual
    review_score >= 90 conditions violating SDD-0044, suffered internal file manifest status drift
    (status: PENDING instead of NOT_STARTED), and lacked structured work orders and failure handling policies.
  choice: |
    Execute comprehensive Layer 08 execution enhancement per verified plan plans/IPLAN-EXECUTION-ENHANCEMENT-PLAN.md:
    1. Harmonize file manifest status across templates and governance docs (PENDING -> NOT_STARTED).
    2. Retire residual review_score >= 90 conditions in IPLAN-SWF-TEMPLATE.yaml, iplan-execution.sw.yaml,
       and IPLAN_WORKFLOW_STANDARD.md.
    3. Introduce InitializeExecutionContext inject state, RemediateImplementationFixes retry loop with
       compensatedBy: RollbackSourceFiles, and non-destructive ExecutionBlockedTerminal in both workflows.
    4. Introduce structured work_orders, typed todos, and failure_handling (_required: false) into IPLAN-TEMPLATE.yaml.
    5. Update IPLAN-GRAPH-TEMPLATE.yaml task_action properties with work_order_id, max_attempts, and failure_handling.
    6. Formalize 4-plane status taxonomy and evidence receipt specifications in IPLAN_WORKFLOW_STANDARD.md.
    7. Bump framework/VERSION to 0.96.7, append 0.96.6 to OLD_VERSIONS, and propagate references repo-wide.
  consequences: |
    - Coding agents gain resilient self-correction loops bounded by max_attempts: 3 before triggering rollbacks.
    - Environmental blockers or requirement ambiguities pause non-destructively without wiping code/tests.
    - Zero breaking changes to acceptance suite test_layer_iplan.py golden fixtures via _required: false.
    - Completely eliminates residual numerical readiness scores in Layer 08 workflows.
    - Requires framework version bump from 0.96.6 to 0.96.7 per GATE-SPEC-E005.
  alternatives_considered:
    - option: "Retain immediate TriggerSagaRollback on first test failure"
      rationale_rejected: >-
        Rejected because autonomous agents iterate; destroying tests on transient failure prevents self-correction.
    - option: "Add mandatory root-level failure_handling in IPLAN-TEMPLATE.yaml"
      rationale_rejected: >-
        Rejected because un-flagged root keys break acceptance test test_layer_iplan.py golden fixture checks.

