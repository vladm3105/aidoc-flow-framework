# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-105)
# =============================================================================

decision:
  decision_id: "DEC-CHG-105"
  title: "Establish .aidoc/ Workstation Directory Standard and Dual-Control Architecture"
  status: "Ratified"
  context: |
    Following ratification of the Quad-Pillar federated ecosystem, consumer repositories (such as
    b-local-privy) demonstrated the necessity of a standardized, multi-tier .aidoc/ workstation layout:
    1. Distinguishing between the Process Canon (vladm3105/aidoc-flow-framework), technical execution
       engines (such as vladm3105/aidoc-flow-langgraph), and consumer application repositories.
    2. Formalizing the Discovery Rule (ENGINE-DISCOV-01) where .aidoc/project/ overrides framework defaults.
    3. Establishing the Quality Gate Floor Invariant (GATE-FLOOR-01) preventing overrides from relaxing checks.
    4. Codifying the Dual-Control Generator-Critic architecture (interactive IDE drafting + LangGraph review).
  choice: |
    1. Author docs/AIDOC_WORKSTATION_STANDARD.md codifying the complete 3-Tier Layering Model,
       standardized .aidoc/ workstation directory topology, Discovery Rule, and Dual-Control workflow.
    2. Cross-reference the new core document in docs/REPO_STRUCTURE.md and docs/PROJECT.md.
  consequences: |
    - Establishes an immutable, unambiguous architectural guide for all consumer project repositories.
    - Prevents divergence between interactive IDE assistants and background LangGraph workers.
    - Guarantees project customization flexibility without forking the shared Process Canon.
  alternatives_considered:
    - option: "Rely only on framework/governance/aidoc/AIDOC.md without a root docs standard"
      rationale_rejected: >-
        AIDOC.md focuses on framework internals, whereas developers and consumers need a top-level
        workstation architecture guide in docs/ explaining multi-pillar and multi-engine federation.

