# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Linter Completeness Hardening, Hook Fixes, and Governance Stale-Info Purge"
  author: "Framework Maintainer"
  date_submitted: "2026-10-06T00:00:00Z"
  summary: |
    Comprehensive quality and consistency hardening across linters, hooks, and governance entry surfaces:
    (1) Fix Issue #895 in sdd_doc_lint/chg_lint.py: enforce per-artifact coverage loop in CHG-L006 so every modified SDD document in artifacts_modified must have an sdd_lifecycle step, excluding non-SDD code files and IPLAN documents; modernize legacy error strings; add regression tests;
    (2) Support Layer 10 EVAL in sdd_doc_lint/trace_graph.py (@eval: tag regex and layer indexing);
    (3) Fix hooks/pre_push_check.sh: add missing em-dash in founder-OK prompt lines 244 & 258 matching line 228 validation; harmonize audit references to OPS-0065; update retired CLAUDE.md URL;
    (4) Purge and harmonize residual legacy flow tokens (F1-F4, Type-R) with primary dual-layer graph nomenclature (HOTFIX, CODE2S, CODE2C, SEED2C, DIR2C, SDD2C) across AGENTS.md, root README.md, framework/README.md, SPEC_DRIVEN_DEVELOPMENT_GUIDE.md, SEED_CONTRACT.md, SEED_TO_MODULE_DECOMPOSITION.md, SEED-TEMPLATE.md, governance README.md, and LINT_RULES.md;
    (5) Clarify cross-repo links in docs/SUPPORT.md for standalone checkouts;
    (6) Bump framework version to 0.88.3, ratify Decision GD-67, and record release notes.
  rationale: |
    Following deep repository review, multiple latent defects and inconsistencies were uncovered:
    1. Issue #895: CHG-L006 only checked if any sdd_lifecycle step existed, allowing partial coverage gaps where modified SDD documents lacked archive/rewrite steps.
    2. hooks/pre_push_check.sh emitted prompt instructions for founder OK that failed its own regex check due to a missing em-dash, and referenced outdated OPS-0069 and dead CLAUDE.md links.
    3. Despite the adoption of the dual-layer traversal-path graph nomenclature in CHG-72, core orientation documents (AGENTS.md, README.md, SPEC_DRIVEN_DEVELOPMENT_GUIDE.md, SEED contracts) still presented legacy shorthand (F1-F4, Type-R) in isolation, risking agent misunderstanding or non-compliant routing.
    4. Trace graph primitives in trace_graph.py omitted Layer 10 EVAL, preventing @eval: references in IPLAN documents from being parsed by the trace regex.

# =============================================================================
# Section 3: Scope & Impact Analysis
# =============================================================================

scope:
  components:
    - "sdd_doc_lint/chg_lint.py: Fix Issue #895 (CHG-L006 per-artifact coverage loop), filter code/IPLAN artifacts, modernize legacy strings to graph nomenclature"
    - "sdd_doc_lint/tests/test_chg_lint.py: Add regression tests for CHG-L006 per-artifact completeness and code-artifact exemptions"
    - "sdd_doc_lint/trace_graph.py: Add EVAL to KNOWN_LAYERS and TAG regex"
    - "hooks/pre_push_check.sh: Fix founder-OK em-dash, harmonize OPS-0065 references, update CLAUDE.md link"
    - "AGENTS.md: Harmonize governance gate rules with dual-layer graph codes (HOTFIX, CODE2S, CODE2C, SEED2C, DIR2C, SDD2C)"
    - "README.md & framework/README.md: Align flow routing sections with 6 graph traversal paths"
    - "framework/SPEC_DRIVEN_DEVELOPMENT_GUIDE.md: Align flow routing overview with graph nomenclature"
    - "framework/governance/SEED_CONTRACT.md & SEED_TO_MODULE_DECOMPOSITION.md & framework/templates/SEED-TEMPLATE.md: Update F1/F3 references to SDD2C/SEED2C"
    - "framework/governance/LINT_RULES.md: Strengthen CHG-L006/GOV-014 contract description and update flow code references"
    - "docs/SUPPORT.md: Add note clarifying cross-repo links in standalone checkouts"
    - "framework/governance/DECISIONS.md: Ratify Decision GD-67"
    - "framework/CHANGELOG.md: Release notes under [0.88.3]"
  backward_compatible: true
  dependencies:
    - "sdd_doc_lint/chg_lint.py"
    - "tests/conformance/test_chg_flows_router.py"

