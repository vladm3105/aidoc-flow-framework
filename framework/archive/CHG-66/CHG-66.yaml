change_description:
  summary: "Update framework/governance/README.md, framework/governance/DOC_GOVERNANCE_CORE.md, framework/AI_ASSISTANT_RULES.md, framework/README.md, and framework/SPEC_DRIVEN_DEVELOPMENT_GUIDE.md to document the completed CNCF Serverless Workflow v0.8 dual-template architecture and workflow catalogs; bump spec version 0.86.0 → 0.86.1 (C2 PATCH)."
  what: "Synchronizes root and governance documentation to reflect the 100% completed adoption of CNCF Serverless Workflow v0.8 across all 10 SDD layers and governance workflows: (1) documents the dual-template architecture ({TYPE}-TEMPLATE.yaml standard vs {TYPE}-SWF-TEMPLATE.yaml workflow) in DOC_GOVERNANCE_CORE.md and AI_ASSISTANT_RULES.md, (2) catalogs GOVERNANCE_WORKFLOW_STANDARD.md, IPLAN_WORKFLOW_STANDARD.md, WORKTREE_FLOW.md, and the 12 workflows in governance/README.md, (3) expands SPEC_DRIVEN_DEVELOPMENT_GUIDE.md and framework/README.md with workflow-driven SDD guidance, (4) verifies AGENTS.md working agreements, and (5) advances spec version 0.86.0 → 0.86.1."
  why: "Eliminates documentation drift following the completion of the 10-milestone CNCF standardization roadmap (GD-51 through GD-61), ensuring AI assistants and human developers have clear, consistent selection criteria and references across all framework documentation surfaces. Issue #925."
  trigger: "User request 2026-10-05 to check and update governance documents and root guides + Issue #925."
  scope:
    in:
      - "framework/governance/README.md: catalog workflow standards and workflows/ state machines"
      - "framework/governance/DOC_GOVERNANCE_CORE.md: document dual-template architecture in Template Policy"
      - "framework/AI_ASSISTANT_RULES.md: document dual-template selection rules and workflow standards"
      - "framework/README.md: update layout and workflow descriptions"
      - "framework/SPEC_DRIVEN_DEVELOPMENT_GUIDE.md: add workflow-driven SDD section"
      - "hooks/sync-version-refs.sh: add 0.86.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.86.0 → 0.86.1"
      - "framework/CHANGELOG.md: entry for CHG-66 / 0.86.1"
    out:
      - "AGENTS.md (checked and verified; working agreement remains accurate, engine-agnostic, and intact without requiring rule modifications)"
      - "layers/ templates (all 10 layers already carry verified dual-templates)"
      - "governance/workflows/*.sw.yaml (all 12 state machines verified and green)"

