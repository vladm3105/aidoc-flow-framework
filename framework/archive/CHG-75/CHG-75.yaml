# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Graph-Based Review Flows, SAGA Workflows, Report Template & swf_lint"
  author: "Framework Maintainer"
  date_submitted: "2026-10-07T00:00:00Z"
  summary: |
    Comprehensive specification, workflow graph implementation, and structural linting for SDD review flows:
    (1) REVIEW_WORKFLOW_STANDARD.md: author dedicated governance standard formalizing graph-based review flows, SAGA mechanics, per-layer crew bindings, and CHG handover;
    (2) REVIEW_REMEDIATION_FLOW.md & REVIEW_SAGA.md: add Refined & Hardened Architectural Blueprints, flow router (REV-PASS, REV-AUTO, REV-CHG, REV-ESC, REV-TO, REV-ROLL), and CHG handover protocol;
    (3) review_report.schema.json & REVIEW_REPORT-TEMPLATE.yaml: graduate and formalize the review report schema and author a canonical template linking review findings directly to authorizing CHG requests;
    (4) REVIEW-SWF-TEMPLATE.yaml & CHG-SWF-TEMPLATE.yaml: author workflow templates for review sagas and change control flows;
    (5) Per-layer review workflows: author declarative CNCF Serverless Workflows (REV-01-BRD through REV-09-CHG) under framework/governance/workflows/review/ matching REVIEW_CREWS.yaml;
    (6) sdd_doc_lint/swf_lint.py: implement standalone deterministic structural linter for CNCF Serverless Workflow graphs and embedded templates;
    (7) hooks/sdd-doc-review.sh: decouple advisory hook from retired plugin slash commands (/aidoc-flow:doc-*-audit) to engine-agnostic guidance;
    (8) Conformance & Ratification: update test suites, ratify Decision GD-69, record release notes in CHANGELOG.md, and bump framework specification version to 0.89.0 (C2 MINOR).
  rationale: |
    While the framework specifies a quality loop and saga states, executable declarative graphs were previously confined to a single exemplar workflow (review-remediation-flow.sw.yaml) with hardcoded branches that did not reflect the layer-specific crews in REVIEW_CREWS.yaml.
    Furthermore, no standalone structural linter validated .sw.yaml workflow graphs outside pytest, no review report template existed to translate failed review findings into authorizing CHG requests, and advisory hooks still referenced retired plugin commands.
    This change resolves these gaps by establishing full graph completeness, structural linting, and formal review-to-CHG handover.

