verification:
  commands:
    - "python3 sdd_doc_lint/chg_lint.py framework/archive/CHG-75/CHG-75.yaml"
    - "python3 -m unittest discover -s sdd_doc_lint/tests -v"
    - "python3 -m sdd_doc_lint.swf_lint framework/governance/workflows/"
    - "python3 -m pytest tests/conformance/"
    - "bash hooks/pre_push_check.sh"
