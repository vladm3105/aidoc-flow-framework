# Section 3: Execution Phases
# =============================================================================

execution_phases:
  phase_1_tooling:
    description: "Implement sdd_doc_lint/swf_lint.py and test_swf_lint.py"
    tasks:
      - "Create sdd_doc_lint/swf_lint.py with SWF-L001..L008 checks"
      - "Create sdd_doc_lint/tests/test_swf_lint.py and verify passes"
  phase_2_governance_and_templates:
    description: "Author REVIEW_WORKFLOW_STANDARD.md, review report schema and templates"
    tasks:
      - "Author framework/governance/REVIEW_WORKFLOW_STANDARD.md"
      - "Promote framework/governance/review_report.schema.json"
      - "Author framework/governance/templates/REVIEW_REPORT-TEMPLATE.yaml"
      - "Author framework/governance/templates/REVIEW-SWF-TEMPLATE.yaml"
      - "Author framework/governance/templates/CHG-SWF-TEMPLATE.yaml"
  phase_3_layer_workflows:
    description: "Author per-layer review workflows under framework/governance/workflows/review/"
    tasks:
      - "Author REV-01-BRD through REV-09-CHG workflows matching REVIEW_CREWS.yaml"
      - "Validate all workflows using swf_lint.py"
  phase_4_governance_hardening:
    description: "Update existing governance documents, diagrams, and hooks"
    tasks:
      - "Update REVIEW_REMEDIATION_FLOW.md with Refined Architectural Blueprints and CHG handover"
      - "Update REVIEW_SAGA.md, GOVERNANCE_WORKFLOW_STANDARD.md, DIAGRAM_STANDARDS.md"
      - "Update hooks/sdd-doc-review.sh"
  phase_5_conformance_and_release:
    description: "Update tests, ratify GD-69, sync version refs, bump VERSION to 0.89.0"
    tasks:
      - "Update test_governance_workflows.py and test_review_report_parity.py"
      - "Ratify Decision GD-69 in DECISIONS.md"
      - "Update CHANGELOG.md, hooks/sync-version-refs.sh, and framework/VERSION"
      - "Run full conformance and unit suites"

