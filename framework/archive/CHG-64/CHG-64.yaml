# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Author framework/layers/02_PRD/PRD_WORKFLOW_STANDARD.md, PRD-SWF-TEMPLATE.yaml, and framework/governance/workflows/prd-feature-decomposition.sw.yaml; amend 02_PRD/README.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-60 in DECISIONS.md; add test_prd_workflow.py and update EXPECTED_WORKFLOWS and EXPECTED_FILES; MINOR bump 0.84.0 → 0.85.0."
  what: "Establishes declarative CNCF Serverless Workflow v0.8 state machines for (1) complex, multi-container product feature decomposition topologies via the Hybrid Envelope Architecture (PRD-SWF-TEMPLATE.yaml), (2) the automated feature prioritization, acceptance threshold validation, and BRD alignment workflow (prd-feature-decomposition.sw.yaml), and (3) normative PRD product-decomposition-to-state-machine mapping guidelines (PRD_WORKFLOW_STANDARD.md). Aligns companion PRD and governance documentation, ratifying Decision GD-60."
  why: "Enables autonomous AI coding agents and graph orchestrators to decompose product initiatives across container boundaries, compute weighted feature priority (RICE), evaluate quantitative SLA thresholds (@threshold:), verify upstream BRD traceability, and execute requirement invalidation compensation, while preserving full backward compatibility with static YAML PRDs and sdd_doc_lint structural validation. Issue #921."
  trigger: "User review 2026-10-05 approving Step 9 of CNCF standardization roadmap + issue #921."
  scope:
    in:
      - "framework/layers/02_PRD/PRD_WORKFLOW_STANDARD.md: normative standard mapping product decomposition and feature prioritization to CNCF state machines"
      - "framework/layers/02_PRD/PRD-SWF-TEMPLATE.yaml: canonical hybrid template for complex PRD product feature workflows"
      - "framework/governance/workflows/prd-feature-decomposition.sw.yaml: declarative CNCF v0.8 runner for product feature decomposition, RICE prioritization, and threshold validation"
      - "framework/layers/02_PRD/README.md: update PRD documentation to bind CNCF workflow standard"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register prd-feature-decomposition in catalog"
      - "framework/governance/DIAGRAM_STANDARDS.md: register PRD feature decomposition state machines"
      - "framework/governance/DECISIONS.md: add GD-60 ratifying CNCF Serverless Workflow standard for Layer 02 PRD"
      - "tests/conformance/test_prd_workflow.py: conformance test suite for PRD workflow templates and decomposition runners"
      - "tests/conformance/test_governance_workflows.py: add prd-feature-decomposition to EXPECTED_WORKFLOWS"
      - "tests/conformance/test_governance.py: add workflow and PRD standard to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.84.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.84.0 → 0.85.0"
      - "framework/CHANGELOG.md: entry for CHG-64 / 0.85.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Deprecation of PRD-TEMPLATE.yaml (retained as standard for atomic/single-container product features)"

