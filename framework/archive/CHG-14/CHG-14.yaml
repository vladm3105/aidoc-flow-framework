# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Codify the per-flow Phase-3 closeout rule (§3.3 + flows verification column): deployable scope (code/scripts, runtime config, migrations — anything the project's deployment procedure installs) mandates live closeout (deploy DEV, smoke suite, authentic Layer-10 EVAL, then Completed); non-deployable scope (docs-only, governance sync, SDD-only, zero runtime/config artifacts) closes via the static battery (chg_lint, scoped-IPLAN checks, self-review, governance PR) with NO deployment and NO EVAL report owed — an empty EVAL must never be fabricated. Mixed scope follows the deployable path; the change's own file manifest decides. Also repairs the stale §1-table F2 change_level cell ('docs-only: no CHG/IPLAN'), which contradicts F2.2 always-traced (CHG-12) and would otherwise misroute readers of the new rule. MINOR bump 0.64.0 → 0.65.0."
  why: "Issue #776 (verified live): §3.3 defines Completed only as 'verification passed' with no per-flow closeout rule, so agents either prematurely complete code changes without deploying or stall doc-only changes fabricating empty deployments/EVALs. The framework already leans this way (per-flow verification column; dev-complete vs deploy-complete split) — the bifurcation needs codifying, not correcting (gap, not bug)."
  trigger: "Issue #776 (consumer CHG-55/CHG-56 closeout ambiguity) + triage note 2026-09-28 (P2, gap)."
  breaking_change_analysis: "C2 (not C3): additive clarification — no gate/ID/schema/enum removed; previously-green records stay green (the rule constrains future closeouts, not past ones). Consumers with stricter closeout practices are unaffected; consumers relying on doc-changes-deploying may drop dead deployment steps. Existing CHG/IPLAN records unaffected; 0.x line. Reviewer may escalate to C3 at PR review, in which case E004 (human approver) applies before merge."
  enforcement_decision: "Reviewer-lens (not a new linter emitter). Rationale: closeout adequacy (was the deploy real? was the EVAL authentic?) is a judgement over evidence, not a syntactic property of the CHG record — chg_lint validates records, and EVAL authenticity already has its own schema/tests. The PR reviewer checks the closeout evidence against the §3.3 rule."
  scope:
    in:
      - "DOC_GOVERNANCE_CORE.md v1.2 → v1.3: §3.3 Phase-3 closeout bifurcation (deployable vs non-deployable, mixed-scope rule, no-fabricated-EVAL)"
      - "CHG_REQUEST_FLOWS.md v1.2 → v1.3: §1 verification column closeout pointers per flow + F2 change_level cell stale repair (always-traced)"
      - "DECISIONS.md: GD-39 entry (closeout bifurcation + F2-cell repair)"
      - "MINOR bump 0.64.0 → 0.65.0: VERSION + changelogs + machine-pin fanout (sync-version-refs clean)"
      - "SECURITY_REVIEW W003 assessment recorded in this CHG (verification section)"
    out:
      - "Linter engine changes — no new emitter (reviewer-lens enforcement decided above)"
      - "EVAL schema, EVAL generation, 5-stage lifecycle — untouched"
      - "Emergency / Type-R / seed / bugfix mechanics — untouched"
      - "Consumer deploy scripts and smoke suites — consumer-side, not specified here (rule names the evidence, not the commands)"

