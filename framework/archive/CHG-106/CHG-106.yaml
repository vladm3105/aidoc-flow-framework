# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-106)
# =============================================================================

decision:
  decision_id: "DEC-CHG-106"
  title: "Operationalize .aidoc/ Workstation Standard and Dual-Control Architecture"
  status: "Ratified"
  context: |
    Following ratification of CHG-105, architectural review identified 5 critical operational gaps:
    1. Pillar 2 (Enterprise Tech Stack policy, stack-policy.yaml) was omitted from the .aidoc/ topology.
    2. Retaining .aidoc/bin/* while projects use Taskfile.yml creates Dual-CLI friction.
    3. Without cryptographic content hashing (reviewed_sha256), approved documents are vulnerable to
       silent post-review mutation and agent hallucination/bypass.
    4. Execution engines required formalization of Atomic File Shadowing and 3 execution modes (live,
       verify-only, mock) to support zero-token air-gapped CI.
    5. In-repo installer scripts (install.sh, upgrade.sh) and AGENTS-TEMPLATE.md must stay in parity with
       the specification standard by scaffolding .aidoc/Taskfile.yml and providing a backward-compatible shim.
  choice: |
    1. Update docs/AIDOC_WORKSTATION_STANDARD.md with Pillar 2, Taskfile CLI orchestration, Atomic File
       Shadowing, Cryptographic Gate Floor (reviewed_sha256 + 4-step canonical normalization algorithm),
       three engine execution modes, and Git tracking policy table.
    2. Update framework/scripts/install.sh, upgrade.sh, and AGENTS-TEMPLATE.md to scaffold .aidoc/Taskfile.yml
       and provide a backward-compatible .aidoc/bin/sdd-lint wrapper during migration.
    3. Update tests/conformance/test_consumer_scripts.py to assert Taskfile and runner compatibility.
  consequences: |
    - Fully operationalizes the Quad-Pillar federated workstation across consumer repositories.
    - Eliminates Dual-CLI conflict for AI coding agents and developers.
    - Cryptographically guarantees review integrity without consuming tokens in headless CI.
  alternatives_considered:
    - option: "Keep .aidoc/bin/* as the primary standard and ignore Taskfile"
      rationale_rejected: >-
        Violates universal repository convention (Taskfile.yml) across aidoc-local-flow-ci and b-local-privy,
        causing agent tool confusion and brittle shell script maintenance.

