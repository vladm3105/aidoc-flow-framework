# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Teach the pre-push audit-trail scan to skip with notice when the push range contains zero commits (post-merge dev push in CI) instead of failing on an absent phrase. PR-branch (non-empty) enforcement byte-identical."
  why: "The Lint / format / security hooks context fails on every post-merge dev push: HEAD == origin/dev collapses the range, zero commits carry the phrase, the hook errors. A permanently red dev check trains everyone to ignore red."
  trigger: "Issue #865 (triaged + re-triaged 2026-10-02, P2 + bug + ci)."
  scope:
    in:
      - "hooks/pre_push_check.sh: range-empty guard + skip notice (additive branch)"
      - "tests/unit/test_hook_stage_coverage.py: executable-code pin for the skip"
    out:
      - "PR-branch phrase enforcement (unchanged — non-empty ranges scan identically)"
      - ".github/workflows/pre-commit.yml (vendored; no event-shape change)"
      - "Any framework/ normative change (none — version keep)"
      - "#867 (SemVer policy) — independent issue"

