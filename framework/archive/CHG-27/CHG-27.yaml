    in:
      - "#817: ci_bindings knob in ADAPTATION_SURFACE.yaml (6 → 7 knobs) + PROFILE-TEMPLATE.yaml override row + knob-count header + ADAPTATION.md §4 title + §4.7 section + pointer guard test"
