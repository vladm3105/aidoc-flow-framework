# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-91)
# =============================================================================

decision:
  decision_id: "DEC-CHG-91"
  title: "Synchronize Recommended Platform Technology Stack with Enterprise Catalog (/home/ya/devd/technology_stack)"
  status: "Ratified"
  context: |
    The framework's platform reference architecture document (RECOMMENDED_PLATFORM_STACK.md)
    was established under CHG-83 and CHG-86 to bridge vendor-agnostic SDD contracts to production
    runtimes. Since then, the enterprise technology stack standard (Standard v2.0 codified across
    Specifications 00-19 in /home/ya/devd/technology_stack/) has formalized the full container-native
    platform architecture: agentd over tmux, Cloudflare Tunnel zero-open-port edge ingress,
    WezTerm + Sunshine/Moonlight remote desktop, Valkey 8 in-memory store, Apache Superset agentic
    BI with Model Context Protocol and Playwright visual critic, two-tier lossless ledger xp.ledger,
    and Debian 13 ephemeral CI hardening.
  choice: |
    1. Update RECOMMENDED_PLATFORM_STACK.md to reference /home/ya/devd/technology_stack as the
       authoritative enterprise standard v2.0.
    2. Expand Section 2 (The Six Architectural Pillars) to incorporate container-native tooling,
       zero host pollution (platform-dev-tools:latest), two-tier lossless ledger (xp.ledger),
       and the five operational tenets.
    3. Modernize Section 3 (Master Platform Technology Matrix) from 18 to 35+ components, adding
       agentd over tmux, Cloudflare Tunnel, WezTerm/Sunshine/Moonlight, Valkey 8, Apache Superset,
       Trivy, ast-grep/ruff, py-spy, k6/nats-bench/toxiproxy, Syft/Steampipe dynamic inventory,
       and Debian 13 self-hosted CI hardening.
    4. Update Section 4 (SDD 10-Layer Execution Mapping) flowchart and layer blueprints to bind
       the updated stack components across Problem Space (01-04), Selection Gate (05 ADR),
       and Solution Space (06-10).
    5. Update Section 5 (Adoption & Operational Blueprints) with the complete directory of
       specifications 00-19.
  consequences: |
    - RECOMMENDED_PLATFORM_STACK.md perfectly mirrors the authoritative enterprise technology stack.
    - Zero architectural drift between framework governance guidance and /home/ya/devd/technology_stack/.
    - Retains 100% engine neutrality in framework/layers/ per Decision D-0013 / GD-13.
    - Preserves engine token hygiene (no raw prohibited tokens in framework/).
  alternatives_considered:
    - option: "Only update the file path from /mnt/e/dev to /home/ya/devd without updating components"
      rationale_rejected: >-
        Leaves the platform reference architecture incomplete and omitting crucial
        platform components like Cloudflare Tunnel, Valkey 8, Superset, and agentd.

