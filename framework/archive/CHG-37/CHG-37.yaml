# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Add 8 optional, bounded exec_* knobs to the closed adaptation registry (7 → 15 knobs): blast-radius limits exec_max_files / exec_max_diff_lines / exec_protected_paths / exec_test_timeout_s (#843) plus execution-attempt budgets exec_max_attempts / exec_token_budget / exec_wall_clock_budget_s with fixed-size exec_failure_summary_lines (#844). Each follows the quality_loop_max_iterations pattern (type, range, default, missing/malformed → default fallback). Three-way parity kept: PROFILE-TEMPLATE.yaml override rows + ADAPTATION.md §§4.8–4.15 rationale (enforced by test_profile_template_covers_surface_knobs). MINOR cut 0.70.0 (VERSION bump + sweep + framework/CHANGELOG.md) + GD-44 per GATE-SPEC E005/E008."
  why: "Without standard knobs each engine invents its own blast-radius limits and profiles are not portable (#843); a conforming engine may retry patch→verify loops unboundedly, blowing up cost/latency/context (#844). The closed registry otherwise reads complete — the gap is an absence."
  trigger: "Issues #843 + #844 (2026-10-01 review findings, Rust harness spike)."
  scope:
    in:
      - "framework/governance/ADAPTATION_SURFACE.yaml: 8 new exec_* knob entries (Knobs (7) → (15))"
      - "framework/governance/PROFILE-TEMPLATE.yaml: 8 commented override rows (header 7 → 15)"
      - "framework/governance/ADAPTATION.md: §4 header count + §§4.8–4.15 rationale"
      - "framework/governance/DECISIONS.md: GD-44 entry (newest-first) + Document Control refresh"
      - "framework/archive/CHG-37/CHG-37.yaml + IPLAN-37.yaml (this vehicle)"
      - "framework/VERSION 0.69.0 → 0.70.0 + hooks/sync-version-refs.sh OLD_VERSIONS + sweep (E005 driver; pin moves only)"
      - "framework/CHANGELOG.md [0.70.0] section (E008 driver; root CHANGELOG.md frozen tombstone per CHG-40 — untouched)"
    out:
      - "REVIEW_SAGA.md / EVAL machinery (review-loop budgets stand unchanged)"
      - "Closed-registry relaxation (unknown keys stay ignored) and existing knob defaults/ranges (frozen)"
      - "archive/** snapshots (immutable); any contract/behavior change beyond additive optional knobs"

