change_description:
  summary: "Make replace_in_file_counted fail closed and atomic: guard the python3 converter exit and install the result via same-dir-temp rename (mode-preserving), so any converter or write failure leaves the target byte-identical and the hook exits nonzero instead of truncating a spec file and reporting success. Success-path output is byte-identical."
  why: "Issue #821 (P1): on any converter failure the unconditional cat truncates the target while the script reports success and git add -u stages the damage; set -e cannot save it (OR-list call sites). Latent today, destructive if triggered."
  trigger: "Triage note on #821 (2026-09-30); session goal 'fix all issues'."
  scope:
    in:
      - "hooks/sync-version-refs.sh: guarded converter in replace_in_file_counted"
      - "tests/unit/test_sync_scripts.py: converter-failure covering test"
      - "framework/archive/CHG-29/CHG-29.yaml + IPLAN-29.yaml (this vehicle)"
    out:
      - "Swept patterns, OLD_VERSIONS list, expected counts"
      - "The #405 counted-substitution + REFUSE guard (kept as-is)"
      - "The archive/ exclusion (kept as-is)"
      - "Trap-based temp cleanup (declined minor: explicit rm covers both return paths)"
      - "VERSION bump / CHANGELOGs (version_action keep — hook-only, no framework/ files)"
      - "Any F3 cascade or SDD rewrite"

