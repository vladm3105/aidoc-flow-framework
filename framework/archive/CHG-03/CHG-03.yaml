# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  what: |
    Port the operational hardening learned in b-local-privy
    .aidoc/project/governance/ (8 files, 1851 lines — frozen snapshot, do NOT
    chase donor HEAD) into the engine-agnostic spec as 17 addons:
    §3.1.1 What-Goes-Where table, §3.13 bootstrap exemption, SDD-sync on IPLAN
    Completed (CHG-L012), DONE/status-gates/realtime-manifest bundle,
    breaking-change block (IPLAN01), layer-registration checklist (REG01),
    §4.1 upstream status propagation, delegation integrity greps, ID red-flags,
    EARS pattern tree, TDD-SYNC A–E advisories, concurrency traps + SKIPPED
    warning + scoped gitignore negation, new WORKTREE_FLOW.md, SELF_LEARNING
    hardening, notices donor deltas, audit_fix IPLAN subtype, schema-verify
    guidance. Ship the MINOR bump 0.53.3 → 0.54.0 with mechanical fanout.
  why: |
    The donor delta is checklists, gates, concurrency traps, and verification
    commands that prevent measured rework (CHG-04 16 gaps, SPEC-09 18 fake IDs,
    CHG-10/CHG-32 clobbers). The framework already owns the concepts; this CHG
    lands the preventive mechanics.
  trigger: |
    plans/FRAMEWORK-0.54.0-DONOR-ADDONS-PLAN.md reached FINAL (3 passes +
    OPS-0065 3-agent review folded) and authorizes this scope.

