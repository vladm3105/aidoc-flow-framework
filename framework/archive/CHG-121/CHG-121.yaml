# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-121)
# =============================================================================

decision:
  decision_id: "DEC-CHG-121"
  title: "Formal Decision: Layer 08 (IPLAN) Distributed Multi-Agent Execution, Cryptographic Attribution & Step Evidence"
  date: "2026-10-19"
  status: Accepted
  context: |
    Layer 08 (IPLAN) in aidoc-flow-framework relied on self-reported string statuses (status: Completed)
    without cryptographic proof of execution, exposing distributed multi-agent workflows to phantom completion,
    cross-worker state drift, and lack of attribution. Furthermore, mutating workflow states lacked state-level
    wall-clock timeouts and step-completeness auditing, creating vulnerabilities to infinite worker loops, hung
    processes, and accidental step omission. Finally, Layer 10 (EVAL) lacked a standardized cryptographic receipt
    bridge to verify Layer 08 execution evidence post-validation without re-running long developer builds.
  choice: |
    Execute comprehensive Layer 08 distributed execution and attestation enhancement per plans/IPLAN-DISTRIBUTED-EXECUTION-ATTESTATION-PLAN.md:
    1. Codify §10 (Cryptographic Agent Attribution & Step Digital Signatures) and §11 (Distributed Worker Handover,
       Timeouts & Completeness) in IPLAN_WORKFLOW_STANDARD.md, and renumber Review Log to §12.
    2. Format Section 9 execution evidence receipts to align natively with iplan-evidence-bundle.schema.json,
       including valid_until TTL, output_tree_sha state invariants, and Layer 10 EVAL ingestion.
    3. Add root-level intake_control with provenance (_required: false) to IPLAN-TEMPLATE.yaml for L1 Assurance intake.
    4. Enrich work_orders.orders[] in IPLAN-TEMPLATE.yaml with attestation and skip_audit structures.
    5. Add attestation properties and pre-flight verification edges (canonical relation: "verifies") in IPLAN-GRAPH-TEMPLATE.yaml.
    6. Enrich Section 2 iplan_context in EVAL-REPORT-TEMPLATE.yaml with iplan_receipt_ref and receipt_seal_hash.
    7. In IPLAN-SWF-TEMPLATE.yaml and iplan-execution.sw.yaml:
       - Declare verifyAttestationReceipt and verifyStepCompleteness functions.
       - Add state and action timeouts (stateExecTimeout: PT15M, actionExecTimeout: PT5M).
       - Insert EvaluatePreFlightGate switch state and VerifyStepExecutionCompleteness state.
       - Add AttestStepCompletion actions under mutating states.
    8. Add conformance tests in test_iplan_workflow.py verifying signatures, _UNSIGNED schema fallback, and completeness.
    9. Bump framework/VERSION from 0.96.7 to 0.96.8 per GATE-SPEC-E005, append 0.96.7 to OLD_VERSIONS, and fan out pins.
  consequences: |
    - Coding agents and distributed runners gain non-repudiable cryptographic proof of execution facts.
    - Downstream workers assert upstream state consistency before execution, preventing state drift.
    - Silent step skipping is mathematically eliminated via the Step-Execution Completeness Gate.
    - Runaway worker loops and hung subprocesses are bounded by native CNCF SWF timeouts.
    - Layer 10 (EVAL) reliably post-validates Layer 08 code mutations using detached evidence receipts.
    - 100% backward compatibility maintained via _required: false on all new template fields.
    - Requires framework version bump from 0.96.7 to 0.96.8 per GATE-SPEC-E005.
  alternatives_considered:
    - option: "Rely exclusively on Git commit hashes without detached digital signatures"
      rationale_rejected: >-
        Rejected because Git commits do not capture command stdout digests, test exit codes, or cryptographic
        attribution to specific agent keypairs registered in Iplanic.
    - option: "Introduce custom verifies_preflight_of edge relation in SDD graph"
      rationale_rejected: >-
        Rejected per Pass 1 review finding: sdd-graph.schema.json restricts relations to 9 canonical enums;
        using canonical 'verifies' with properties.verification_type preserves strict schema validity.

