# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-104)
# =============================================================================

decision:
  decision_id: "DEC-CHG-104"
  title: "Remediate Consumer Installation, Brownfield Upgrades, and Multi-Project Rollout Tooling"
  status: "Ratified"
  context: |
    Comprehensive framework review of consumer onboarding and deployment scripts identified key
    operational defects hindering greenfield rollout and brownfield upgrade to the Quad-Pillar ecosystem:
    1. install.sh failed to uncomment or set metadata.project_name in .aidoc/profile.yaml, causing
       profile_lint.py to immediately fail schema 1.1.0 validation out of the box on fresh projects.
    2. deploy.sh option parsing rejected consumer customization flags (--no-stack-policy, --no-adr,
       --no-agents, --author, --canon-sha) with usage errors instead of forwarding them to install.sh.
    3. upgrade.sh did not inspect or backfill missing metadata.project_name, leaving brownfield adopters
       with failing profiles upon re-adoption.
    4. hooks/ch-gate-check.sh searched only docs/sdd/09-CHG (hyphenated), emitting false-positive
       warnings when consumers created canonical docs/sdd/09_CHG (underscored) change requests.
    5. AGENTS-TEMPLATE.md instructed running python3 -m sdd_doc_lint without setting PYTHONPATH,
       causing ModuleNotFoundError in consumer checkouts.
    6. install.sh did not scaffold stack-policy.yaml or bind tenant_id per MULTI_PROJECT_FEDERATED_STANDARD.md.
  choice: |
    1. Update install.sh to automatically set metadata.project_name: "$proj_name" during profile creation
       and run profile_lint.py in smoke checks.
    2. Update deploy.sh to parse and forward all consumer flags in EXTRA_ARGS.
    3. Update upgrade.sh to detect and backfill missing metadata.project_name during upgrades.
    4. Update hooks/ch-gate-check.sh CHG_DIRS to inspect docs/sdd/09_CHG first.
    5. Update install.sh to scaffold <project>/stack-policy.yaml with tenant_id: "$proj_name" (with
       --no-stack-policy opt-out), and generate an executable runner at .aidoc/bin/sdd-lint.
    6. Update AGENTS-TEMPLATE.md to document .aidoc/bin/sdd-lint and PYTHONPATH=.aidoc/framework.
    7. Synchronize BOOTSTRAP.md Step 5 checklist.
    8. Expand test_consumer_scripts.py to assert all new behaviors.
  consequences: |
    - Guarantees 100% turnkey readiness for newly bootstrapped repositories in the federated ecosystem.
    - Prevents false-positive governance gate warnings and linter import failures for AI agents.
    - Backfills missing project metadata cleanly during brownfield upgrades.
  alternatives_considered:
    - option: "Require manual profile editing after install.sh execution"
      rationale_rejected: >-
        Fails the zero-friction automation standard for autonomous agents and new project onboarding.

