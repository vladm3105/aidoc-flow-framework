# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Promote the seed tier to the SDD lifecycle (archive → rewrite → bump + supersedes, affected files only, frozen-per-version instead of frozen-forever) via a new seed_scope `supersede` decision; pin each BRD `seed_disposition` row to the seed version it was absorbed from (`seed_version:`) with SEED01 failing stale pins (unpinned rows pass as before — pre-contract corpora stay green); add mandatory governance rule GOV-021 (any AI-changed document must carry document_control + metadata, backfilled by the AI agent in the next version when missing); extend GOV-020/SEED01 + CHG-L014 accordingly; MINOR bump 0.60.0 → 0.61.0."
  why: "The seed is the only tier that cannot version (SEED_CONTRACT R1 freezes it outright), so the living chain (modules → SDD → code) slowly cites a stale v1 seed while every F3 re-verifies `seed_scope: no-change` without a lint signal. Issue #684. SDD docs and modules already version affected-only; the seed joins the same lifecycle. The AI-attribution rule closes the second half of the staleness loop: AI agents do the mechanical sync work, so every AI-touched version must say which agent, under which CHG, changed what — otherwise future readers cannot tell curated history from drift."
  trigger: "Owner request 2026-09-24 (review session: version seed + modules like SDD, always-actual chain seed → modules → SDD → code) + issue #684."
  scope:
    in:
      - "governance/SEED_CONTRACT.md R1 rewording (frozen-per-version) + seed document_control schema + AI-backfill rule"
      - "governance/CHG_REQUEST_FLOWS.md F3 Phase 0a: no-change | supersede | create + archive → rewrite → bump ordering (Version 1.0 → 1.1)"
      - "DOC_GOVERNANCE_CORE.md §3.1.1 Phase 0a steps + §3.1.3 kernel F3 row note"
      - "LINT_RULES.md: GOV-020 extended (supersede), SEED01 extended (seed_version pin — stale pins fail, unpinned rows pass as before), GOV-021 new (AI document-control)"
      - "framework/layers/01_BRD/BRD-TEMPLATE.yaml: seed_disposition rows gain optional `seed_version:` pin + guidance + example (additive — carrier stays `_required: false`)"
      - "sdd_doc_lint/__init__.py: SEED01 resolves pinned rows against the corpus seed file's document_control.version (absent seed file or unpinned row → skip, stays green)"
      - "tests/conformance/test_seed_contract.py: pin-match green, stale-pin red, unpinned-row green, absent-seed-file green"
      - "framework/playbooks/01_BRD/business_analyst.md + auditor.md: C8 frozen → frozen-per-version (supersede via CHG Phase 0a, re-point ledger)"
      - "framework/governance/README.md: SEED_CONTRACT row (frozen historical input → versioned input tier, frozen-per-version)"
      - "CHG-TEMPLATE.yaml both copies: seed_scope decision enum `no-change | supersede | create` + `entries[]` (seed, old_version, new_version, archive_path, changes, author) — `supersede` requires non-empty entries; module_lifecycle entries gain `author` + `chg_ref` convention (identical — no fork widening)"
      - "framework/governance/MODULE_LAYOUT.md §7: frozen-separate → versioned-separate (seed versions beside modules, frozen-per-version; modules reference current seed version, never duplicate)"
      - "chg_lint.py: CHG-L014 accepts `supersede` (+ entries presence); new CHG-L015 lifecycle-entry attribution presence (GOV-021 deterministic half)"
      - "sdd_doc_lint/tests/test_chg_lint.py: supersede-green, supersede-without-entries red, unattributed-entry red (L015), boundary passthrough"
      - "tests/conformance/test_chg_flows_router.py: seed-versioning agreement extension"
      - "both 09_CHG READMEs: Phase 0 0a pointer update (identical); 01_BRD README seed-input section (frozen-per-version)"
      - "DECISIONS.md GD-36 entry for the seed-versioning + AI-control ruling (GD-08 stays untouched as historical record — GD-36 records the frozen-forever → frozen-per-version update, newest-first)"
      - "GOV-021 carrier note: `document_control` carriers already exist in all ten layer templates + CHG template (verified 2026-09-24) and in all governance docs (GD-24) — this CHG adds the carrier to the seed tier only; no other template changes required"
      - "MINOR bump 0.60.0 → 0.61.0: VERSION + changelogs + machine-pin fanout"
    out:
      - "Other flows (F1/F2/F4/Emergency/Type-R) — untouched; the extension is F3/spec-only"
      - "seed_disposition ledger shape (absorbed/rejected/deferred) — only the version it points at changes"
      - "SEED01 semantic completeness (auditor lens C8) — stays human judgement by design"
      - "Consumer seed content — framework ships no seed instances; the schema governs consumer projects"
      - "New SDD layers"

