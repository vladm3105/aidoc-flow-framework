tdd_consistency:
  strategy: "Test-first where the suite exists: L014-supersede + L015 + SEED01-pin tests authored against the landed Phase-0 shapes; linter green before fanout; conformance suite is the EVAL equivalent (no product code → no EVAL cycles, per F3/spec vehicle precedent CHG-05/CHG-06/CHG-10)."
  cases:
    - "L014 supersede-green: F3/midstream CHG touching docs/seed with seed_scope decision supersede + non-empty entries passes"
    - "L014 supersede-red: decision supersede with empty/missing entries → error naming Phase 0a"
    - "L014 legacy-green: no-change + create decisions keep passing (backward compatible)"
    - "L015 red: seed/module lifecycle entry without author/chg_ref → error (GOV-021 deterministic half)"
    - "L015 boundary: non-F3 source passes through"
    - "SEED01 pin-match green: absorbed row seed_version equals corpus seed document_control.version"
    - "SEED01 stale-pin red: absorbed row seed_version differs from corpus seed version"
    - "SEED01 unpinned green: rows without seed_version pass as before (pre-contract corpora stay green)"
    - "SEED01 absent-seed green: pinned row with no seed file in corpus skips (cannot judge)"
    - "Router matrix: 0a-supersede markers agree across flows §4, kernel F3 row, both templates, READMEs, GOV-020/021 rows, linter"

