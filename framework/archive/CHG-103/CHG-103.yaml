# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-103)
# =============================================================================

decision:
  decision_id: "DEC-CHG-103"
  title: "Synchronize Binary Topological Validation Across Governance and Catalog 30 CNCF Workflows"
  status: "Ratified"
  context: |
    Comprehensive framework review following PRs #958-#978 identified key gaps and drift across
    governance contracts, catalogs, test coverage, and documentation:
    1. Residual Heuristic Readiness Scoring: Despite CHG-97 formally adopting Binary Topological
       Validation (BTV) and retiring subjective >=90% score thresholds, legacy references remained
       in DOC_GOVERNANCE_CORE.md (Principle 4), TRACEABILITY.md (Layer Readiness Gates table),
       SPEC_DRIVEN_DEVELOPMENT_GUIDE.md, Layer 08 IPLAN README/index, and Layer 03 EARS README/template.
    2. Workflow Catalog Omissions: The framework expanded to 30 CNCF Serverless Workflows (.sw.yaml),
       but framework/governance/README.md and GOVERNANCE_WORKFLOW_STANDARD.md omitted the 5 federated
       workflows, eval-review-remediation.sw.yaml, and iplan-escalation-flow.sw.yaml. In addition,
       test_governance_workflows.py omitted eval-review-remediation from EXPECTED_REVIEW_WORKFLOWS,
       and root README.md still claimed 22 cataloged workflows.
    3. Context Slicing CLI Accessibility: sdd_doc_lint/__main__.py lacked a --slice option to invoke
       sdd_doc_lint.slice directly via the package entrypoint.
    4. Starter Federated Templates: Downstream repositories had no template files for stack-policy.yaml
       and contracts-registry.yaml under framework/templates/.
    5. Broken Markdown Link: docs/audit and suggestions conclusion.md contained an unanchored link
       to framework/layers/04_BDD/BDD_WORKFLOW_STANDARD.md that failed offline Lychee checks.
  choice: |
    1. Replace residual >=90% scoring statements across DOC_GOVERNANCE_CORE.md, TRACEABILITY.md,
       SPEC_DRIVEN_DEVELOPMENT_GUIDE.md, Layer 03 EARS, and Layer 08 IPLAN with Binary Topological
       Validation invariants (strict DAG completeness and oracle realization).
    2. Synchronize all 30 workflows in framework/governance/README.md, GOVERNANCE_WORKFLOW_STANDARD.md,
       and root README.md.
    3. Update tests/conformance/test_governance_workflows.py to register eval-review-remediation and
       add an orphan-workflow guard.
    4. Expose --slice in sdd_doc_lint/__main__.py delegating to sdd_doc_lint.slice.
    5. Add STACK-POLICY-TEMPLATE.yaml and CONTRACTS-REGISTRY-TEMPLATE.yaml to framework/templates/.
    6. Fix the broken relative link in docs/audit and suggestions conclusion.md.
    7. Bump framework/VERSION to 0.91.22 and propagate pins via hooks/sync-version-refs.sh.
  consequences: |
    - Unifies framework-wide governance around Binary Topological Validation, eliminating confusion.
    - Ensures 100% catalog and conformance parity across all 30 CNCF Serverless Workflows.
    - Improves agent usability with package-level context slicing CLI.
    - Provides standardized template assets for multi-project federated adopters.
  alternatives_considered:
    - option: "Retain legacy >=90% tables as historical reference in TRACEABILITY.md"
      rationale_rejected: >-
        Retaining contradictory readiness scoring alongside BTV creates split-brain guidance
        for autonomous coding agents and human reviewers.

