# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-100)
# =============================================================================

decision:
  decision_id: "DEC-CHG-100"
  title: "Scaffold Layer 05 ADR Index, Guard Governance Surfaces, and Provide Consumer AGENTS.md Template"
  status: "Ratified"
  context: |
    When autonomous AI agents boot up in newly initialized consumer repositories adopting the
    framework, they frequently fall back to generic open-source habits and attempt to generate
    monolithic markdown registers (CHANGELOG.md, ROADMAP.md, docs/DECISIONS.md, docs/HANDOFF.md).
    These files are retired anti-patterns per framework decisions CHG-40, CHG-80, CHG-94, CHG-95,
    GD-71, and GD-78. This friction occurs because:
    1. Scaffolding templates (AIDOC-SCAFFOLD-TEMPLATE.md, BOOTSTRAP.md, ADAPTATION-GUIDE.md) document
       the internal 4-tier model but do not explicitly proscribe root governance anti-patterns.
    2. Consumer repositories lack a ready-to-use AGENTS.md template declaring non-adoption of these surfaces.
    3. Tooling (sdd_doc_lint) verifies internal layer syntax but provides no sanity check for loose
       monolithic files at the project root.
    4. The installer script (install.sh) scaffolds .aidoc/ but leaves docs/sdd/ completely uninitialized,
       depriving engineers and agents of a structured Layer 05 ADR home on Day 0.
  choice: |
    1. Update AIDOC-SCAFFOLD-TEMPLATE.md, BOOTSTRAP.md, and docs/ADAPTATION-GUIDE.md to add an explicit
       'Sanctioned Surfaces & Deprecated Anti-Patterns' section.
    2. Author a turnkey starter template framework/templates/AGENTS-TEMPLATE.md providing the canonical
       'Where state lives' table for consumer repositories to adopt in their root AGENTS.md.
    3. Implement sdd_doc_lint/surface_lint.py (rules SURF-001 through SURF-004) to detect loose
       DECISIONS.md, ROADMAP.md, CHANGELOG.md, and HANDOFF.md, exposing it via CLI `--check-surfaces`.
    4. Enhance framework/scripts/install.sh to scaffold <project>/docs/sdd/05_ADR/ and copy
       ADR-00_index.TEMPLATE.yaml to ADR-00_index.yaml with populated metadata (idempotent; preserving existing).
  consequences: |
    - Eliminates agent convention fallback and prevents repository pollution with monolithic files.
    - Day-0 architecture decisions are immediately anchored in structured Layer 05 YAMLs.
    - Provides deterministic verification via surface linting for CI and pre-commit checks.
  alternatives_considered:
    - option: "Advisory documentation only without installer and linter updates"
      rationale_rejected: >-
        Documentation alone is routinely missed by agents during automated scaffolding. Machine-enforced
        linter checks and turnkey installer defaults are required to maintain architectural consistency.

