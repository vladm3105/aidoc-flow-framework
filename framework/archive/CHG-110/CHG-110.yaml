# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-110)
# =============================================================================

decision:
  decision_id: "DEC-CHG-110"
  title: "Embedded Kùzu Acceleration Adapter and Central Federated Read Lake Exporter"
  status: "Ratified"
  context: |
    Following the codification of the Native SDD Graph Schema (CHG-108) and 10 Layer Graph
    Templates (CHG-109), multi-repository fleet scaling requires balancing local hermetic isolation
    with enterprise-wide cross-project lineage:
    1. Local Query Performance: Autonomous AI agents require expressive openCypher query capabilities
       for multi-hop traversal, cycle detection, and unverified requirement queries. Pure-Python
       in-memory traversal lacks a declarative query language and indexed join performance.
    2. Zero-Daemon CI Invariant: Client-server graph engines (Neo4j, Dgraph) cannot run in ephemeral,
       air-gapped CI runners or concurrent git worktrees due to file lock and port collisions.
    3. Global Blast Radius: Evaluating system-wide impact of contract changes across sibling repos
       requires projecting local edge graphs into a central federated lake.
  choice: |
    Implement Pattern PAT-GRAPH-001 (docs/FEDERATED_READ_LAKE_PATTERN.md):
    1. Tier 1 Edge Acceleration (Embedded Kùzu): Implement sdd_doc_lint/kuzu_adapter.py providing
       in-process openCypher execution backed by Kùzu.
    2. Engine Neutrality Guard (Decision D-0013): Preserve pure-Python fallback (SddGraph) when
       kuzu is not installed; kuzu remains an optional acceleration dependency.
    3. Tier 2 Central Lake Exporter: Implement sdd_doc_lint/lake_exporter.py projecting local graph
       slices into openCypher DDL/DML batches for Memgraph (devd:7687) and PostgreSQL 18 + Apache AGE.
    4. Workstation Integration: Expose task sdd:graph-cypher and task sdd:lake-export in Taskfile.
  consequences: |
    - Sub-millisecond openCypher queries locally without background daemons.
    - Zero breaking changes to pure-Python CI pipelines or existing document linters.
    - Full interoperability with Memgraph and PostgreSQL 18 + Apache AGE central graph lakes.
  alternatives_considered:
    - option: "Mandate Neo4j client-server for all local and central operations"
      rationale_rejected: >-
        Breaks zero-daemon CI invariant, consumes excessive RAM (>1GB JVM), and causes port
        collisions across parallel git worktrees.
    - option: "Rely solely on pure-Python traversal without openCypher"
      rationale_rejected: >-
        Forces complex multi-hop path and variable-length pattern matching into brittle custom
        Python code rather than standard declarative graph queries.

