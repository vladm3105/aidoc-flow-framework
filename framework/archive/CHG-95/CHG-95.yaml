# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-95)
# =============================================================================

decision:
  decision_id: "DEC-CHG-95"
  title: "Retire and Tombstone framework/governance/DECISIONS.md"
  status: "Ratified"
  context: |
    framework/governance/DECISIONS.md historically served a dual purpose: (1) capturing
    active governance rules and architectural invariants, and (2) logging historical change
    records. This conflation created a 3,200-line monolithic markdown ledger that burned
    AI agent context tokens, introduced split-brain divergence against declarative workflow
    graphs (*.sw.yaml), and duplicated information already captured in structured Change
    Requests (CHG-NN.yaml Section 1B). Following the deprecation of plans/DECISIONS.md in
    CHG-80 (GD-71) and the tombstoning of framework/CHANGELOG.md in CHG-94 (GD-78), maintaining
    a monolithic markdown decision register is an obsolete anti-pattern.
  choice: |
    1. Freeze framework/governance/DECISIONS.md as a read-only historical tombstone at
       GD-77 (Document Control v1.38). Preserve entries GD-01 through GD-77 for permalink
       integrity and conformance test backward compatibility.
    2. Migrate active governance rules and invariants to executable CNCF Serverless Workflows
       (framework/governance/workflows/*.sw.yaml) and governance standards.
    3. Migrate operational change decisions exclusively to structured Change Requests
       (framework/archive/CHG-*/CHG-*.yaml Section 1B decision: block) enforced by CHG-L018.
    4. Ratify new CNCF Serverless Workflow framework/governance/workflows/decision-migration-flow.sw.yaml
       and embed companion Mermaid diagrams in DECISION_WORKFLOW.md.
    5. Modernize framework/governance/workflows/decision-ratification-flow.sw.yaml State 7 to lock
       decisions in CHG-NN.yaml and dispatch workflow graph sync rather than appending to markdown registers.
  consequences: |
    - Eliminates 3,200 lines / 258 KB of token overhead across AI agent interactions.
    - Establishes single source of truth for governance rules in declarative .sw.yaml graphs
      and for change rationale in CHG-NN.yaml.
    - Conformance tests asserting historical GD citations remain 100% green without modification.
  alternatives_considered:
    - option: "Continue maintaining framework/governance/DECISIONS.md as a manual append ledger"
      rationale_rejected: >-
        Burns significant context tokens per session, creates split-brain risks against
        active .sw.yaml workflows, and duplicates CHG archives.
    - option: "Delete framework/governance/DECISIONS.md completely"
      rationale_rejected: >-
        Breaks existing conformance test assertions (e.g. test_module_contract.py, test_seed_contract.py)
        and invalidates permanent historical git citations.

