# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Upstream Enterprise Hybrid CI Invariants, Autonomous PR Conflict Resolution, 2-Stage Review Loop, Tripartite Engineering Architecture, and Consumer Adaptation Scaffolding"
  author: "Framework Maintainer"
  date_submitted: "2026-10-06T00:00:00Z"
  summary: "Upstream comprehensive production governance and CI invariants from b-local-privy into the framework core and consumer scaffolding: Anti-Deadlock Invariant for required status checks, Autonomous PR Conflict Resolution Protocol, 2-Stage Review Loop with 4-Lens Rubric, Tripartite Engineering Role Architecture with Strict QA Non-Code-Modifying Hard Block, Subagent Prompt ID Grounding Invariant, Test Failure Taxonomy (infra_error vs failed), and 5 turnkey .aidoc/project governance scaffolding templates."
  rationale: |
    Production experience in b-local-privy identified key operational patterns and failure modes:
    1. Top-level path filtering on required GitHub status checks causes permanent auto-merge deadlocks on non-matching PRs.
    2. Concurrent PRs require standing agent authority to resolve deterministic conflicts with zero force-pushes, preserving auto-merge.
    3. Platform self-review lockouts require a formal 2-stage review loop and 4-lens rubric separating technical verification from fiduciary authority.
    4. Autonomous QA agents require a strict non-code-modifying hard block to prevent tests from mutating into uncoordinated code repairs.
    5. Spawning parallel subagents without explicit upstream element IDs causes reference hallucinations.
    6. Testing harnesses require distinguishing infrastructure drops (infra_error) from code regressions (failed).
    Upstreaming these standards and providing turnkey scaffolding templates enables new consumer projects to launch immediately with production-proven governance.

