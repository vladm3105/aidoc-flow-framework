# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Author framework/layers/01_BRD/BRD_WORKFLOW_STANDARD.md, BRD-SWF-TEMPLATE.yaml, and framework/governance/workflows/brd-business-validation.sw.yaml; amend 01_BRD/README.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-61 in DECISIONS.md; add test_brd_workflow.py and update EXPECTED_WORKFLOWS and EXPECTED_FILES; MINOR bump 0.85.0 → 0.86.0."
  what: "Establishes declarative CNCF Serverless Workflow v0.8 state machines for (1) complex strategic initiatives and value stream topologies via the Hybrid Envelope Architecture (BRD-SWF-TEMPLATE.yaml), (2) the automated business requirements validation, ROI scoring, steering committee approval callback, and strategic initiative compensation workflow (brd-business-validation.sw.yaml), and (3) normative BRD business-validation-to-state-machine mapping guidelines (BRD_WORKFLOW_STANDARD.md). Aligns companion BRD and governance documentation, ratifying Decision GD-61."
  why: "Enables autonomous AI coding agents and enterprise orchestration engines to validate business objectives (SMART), map value stream operational capabilities, evaluate quantitative ROI and financial feasibility thresholds, orchestrate executive consensus callbacks, and execute strategic initiative cancellation compensation, while preserving full backward compatibility with static YAML BRDs and sdd_doc_lint structural validation. Issue #923."
  trigger: "User review 2026-10-05 approving Step 10 (Final Step) of CNCF standardization roadmap + issue #923."
  scope:
    in:
      - "framework/layers/01_BRD/BRD_WORKFLOW_STANDARD.md: normative standard mapping business validation and value streams to CNCF state machines"
      - "framework/layers/01_BRD/BRD-SWF-TEMPLATE.yaml: canonical hybrid template for complex BRD business requirement workflows"
      - "framework/governance/workflows/brd-business-validation.sw.yaml: declarative CNCF v0.8 runner for business requirements validation, ROI evaluation, and strategic gating"
      - "framework/layers/01_BRD/README.md: update BRD documentation to bind CNCF workflow standard"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register brd-business-validation in catalog"
      - "framework/governance/DIAGRAM_STANDARDS.md: register BRD business validation state machines"
      - "framework/governance/DECISIONS.md: add GD-61 ratifying CNCF Serverless Workflow standard for Layer 01 BRD"
      - "tests/conformance/test_brd_workflow.py: conformance test suite for BRD workflow templates and validation runners"
      - "tests/conformance/test_governance_workflows.py: add brd-business-validation to EXPECTED_WORKFLOWS"
      - "tests/conformance/test_governance.py: add workflow and BRD standard to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.85.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.85.0 → 0.86.0"
      - "framework/CHANGELOG.md: entry for CHG-65 / 0.86.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Deprecation of BRD-TEMPLATE.yaml (retained as standard for atomic/single-capability business requirements)"

