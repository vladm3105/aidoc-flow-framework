# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Framework-Wide Naming Standards & IPLAN Multi-Topology Graph Alignment"
  author: "Framework Maintainer"
  date_submitted: "2026-10-06T00:00:00Z"
  summary: "Complete the clean-break transition to the dual-layer traversal-path graph nomenclature (HOTFIX, CODE2S, CODE2C, SEED2C, DIR2C, SDD2C) across all remaining governance, standard, and template surfaces: (1) ID_NAMING_STANDARDS.md: add graph flow identifiers, graph codes, serverless workflow files (*.sw.yaml), and workflow state/action naming rules; (2) IPLAN_WORKFLOW_STANDARD.md: break the monolithic sdd_to_code assumption, codify DAG topologies for all 6 traversal paths, relax @spec/@tdd for DIR2C, and add flow/flow_code to the Hybrid Envelope; (3) IPLAN templates: sync document_control with flow and flow_code fields; (4) chg-request-flow.sw.yaml: purge residual legacy string in line 6; (5) framework/governance/chg/ and framework/layers/09_CHG/: purge all retired alphanumeric tokens (F1-F4, Type-R), expand README with 6-path topologies, align GATE-CODE and GATE-08 routing, add Flow/Flow Code to GATE_APPROVAL_FORM, and embed Mermaid sequence diagram in GATE_INTERACTION_DIAGRAM."
  rationale: |
    Following Decision GD-65, CHG classification was modernized to graph traversal nomenclature. However, naming standards and Layer 08 execution planning remained unaligned:
    1. ID_NAMING_STANDARDS.md lacked formal rules for graph flow identifiers and workflow state/action names.
    2. IPLAN_WORKFLOW_STANDARD.md enforced an overly strict requirement that all implementation plans must bridge from SPEC/TDD to code, which broke direct-to-code (DIR2C) changes and mischaracterized bugfix repairs (CODE2C) and backward reconciliation (CODE2S).
    3. Comments and guides across the CHG ecosystem still retained retired legacy alphanumeric tokens (F1-F4, Type-R), violating the framework's clean-break policy.

# =============================================================================
# Section 3: Scope & Impact Analysis
# =============================================================================

scope:
  components:
    - "framework/governance/ID_NAMING_STANDARDS.md: Add Graph Flow & Code Naming Standards, update File Naming table with *.sw.yaml, and define workflow state/action conventions"
    - "framework/governance/IPLAN_WORKFLOW_STANDARD.md: Define universal Layer 08 execution across all 6 graph flows, relax @spec/@tdd for DIR2C, add flow/flow_code to Hybrid Envelope, and update LangGraph adapter pattern"
    - "framework/layers/08_IPLAN/IPLAN-SWF-TEMPLATE.yaml & IPLAN-TEMPLATE.yaml: Add flow and flow_code fields to document_control"
    - "framework/governance/workflows/chg-request-flow.sw.yaml: Purge residual (Emergency, Type-R, F1-F4) in line 6 description"
    - "framework/governance/chg/ & framework/layers/09_CHG/: Cleanse comments of legacy tokens in CHG-TEMPLATE.yaml, expand README to document the 6 traversal-path graph lifecycles, align GATE-CODE and GATE-08 routing, update GATE_APPROVAL_FORM with Flow/Flow Code, and add Mermaid diagram to GATE_INTERACTION_DIAGRAM"
    - "framework/governance/DECISIONS.md: Ratify Decision GD-66"
    - "framework/CHANGELOG.md: Release notes under [0.88.2]"
  backward_compatible: true
  dependencies:
    - "sdd_doc_lint/chg_lint.py"
    - "tests/conformance/test_chg_flows_router.py"

