# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-99)
# =============================================================================

decision:
  decision_id: "DEC-CHG-99"
  title: "Implement Invariant Guarding (CHG-L019) and Bottom-Up Escalation Flow"
  status: "Ratified"
  context: |
    Autonomous agents in multi-tier SDD environments encounter two systemic failure modes:
    1. Contract Erosion via Fast-Path Abuse: An agent repeatedly applies "hotfixes" or
       direct code changes (HOTFIX, CODE2C, DIR2C) that subtly alter public contracts or behavior
       without updating upstream SPEC or BDD files.
    2. Bottom-Up Feedback Lag: Execution failures in iplan-runner (such as third-party library
       limitations or missing platform capabilities) require out-of-band manual intervention,
       leaving the agent trapped in local retry loops instead of cleanly escalating an
       architectural blocker back to ADR or SPEC.
  choice: |
    1. Implement CHG-L019 in sdd_doc_lint/chg_lint.py to enforce fast-path boundaries: any
       fast-path change (HOTFIX, CODE2C, DIR2C) attempting to touch contract-bearing layers
       (03_EARS, 04_BDD, 05_ADR, 06_SPEC) without an authorized SDD lifecycle update is rejected.
    2. Document CHG-L019 in framework/governance/LINT_RULES.md and add test coverage in tests/chg/test_chg_lint.py.
    3. Implement a declarative CNCF Serverless Workflow state machine in
       framework/governance/workflows/iplan-escalation-flow.sw.yaml defining the bottom-up
       architectural feedback saga:
       - DetectExecutionBlocker -> ClassifyBlocker -> EscalateToArchitecture -> GenerateRemediationDraft.
    4. Validate workflow with swf_lint.py.
  consequences: |
    - Prevents contract erosion by deterministically blocking fast-path modifications to public contracts.
    - Provides autonomous AI agents with a standard, declarative workflow for halting fruitless local
      retries and escalating architectural blockers back to ADR/SPEC.
  alternatives_considered:
    - option: "Advisory warnings on contract touches"
      rationale_rejected: >-
        Advisory warnings are routinely ignored by autonomous LLM agents in automated pipelines,
        allowing contract drift to accumulate undetected.

