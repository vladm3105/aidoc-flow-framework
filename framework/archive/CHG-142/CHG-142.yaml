# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-142)
# =============================================================================

decision:
  decision_id: "DEC-CHG-142"
  title: "Automate Continuous SDD Knowledge Ingestion into Engramory Core"
  status: "Decided"
  date: "2026-11-03"
  context: >-
    Issue #1057: Establish the architectural CQRS contract between AIDoc Framework
    (write authority / ground truth) and Engramory (read authority / graph & vector core).
    Provide automated CI workflows, Taskfile recipes, and agent MCP configurations for
    seamless ecosystem ingestion.
  choice: >-
    1. Implement sync-engramory in Taskfile.yml and framework/templates/TASKFILE-TEMPLATE.yml.
    2. Add continuous synchronization GitHub Action .github/workflows/engramory-sync.yml.
    3. Provide standard agent MCP definitions in .cursor/mcp.json and framework templates.
    4. Author docs/ENGRAMORY_KNOWLEDGE_SYNC_ARCHITECTURE.md codifying the CQRS model.
  consequences:
    positive:
      - "Downstream repositories can continuously ingest 10-layer SDD corpora on push/merge."
      - "Coding agents receive minimal ancestor closures (~1,500 tokens) via Engramory MCP."
      - "Preserves Markdown files in Git as the immutable write authority."
    negative:
      - "None; synchronization is non-blocking and gracefully skipped if Engramory CLI is absent."
    risks:
      - "Network connectivity to staging Engramory instances is required for remote sync."

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    AIDoc Framework lacked standardized recipes, workflows, and agent profiles to
    continuously push 10-layer SDD documentation into Engramory core (issue #1057).
  scope:
    - "framework/archive/CHG-142/CHG-142.yaml (new, this vehicle)."
    - "framework/archive/CHG-142/IPLAN-142.yaml (new, executing IPLAN)."
    - "docs/ENGRAMORY_KNOWLEDGE_SYNC_ARCHITECTURE.md (new, CQRS architecture)."
    - "Taskfile.yml (add sync-engramory task)."
    - "framework/templates/TASKFILE-TEMPLATE.yml (add sync-engramory task template)."
    - ".github/workflows/engramory-sync.yml (new, CI sync workflow)."
    - "framework/governance/workflows/engramory-sync.yml (new, workflow template)."
    - ".cursor/mcp.json (new, agent MCP configuration)."
    - "framework/templates/CURSOR-MCP-TEMPLATE.json (new, agent MCP template)."

