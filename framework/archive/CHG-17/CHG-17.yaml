# =============================================================================

change_description:
  summary: "Remove the solo-project direct-write exemption from SELF_LEARNING.md (v1.0 → v1.1): governance-rule promotion and Prevention Rule 2 route EVERY governance write — solo or multi-contributor — through the owning repo's authorizing CHG and an In-Progress IPLAN (always-traced, CHG-12); solo projects use self-approved C3 (owner as Technical Lead, per framework/governance/chg/README.md), never silent direct write. Additive/cited/small constraints kept. Stale direct-write sentences purged (no other sections rewritten). PATCH bump 0.65.1 → 0.65.2 with mechanical pin sweep + both CHANGELOGs."
  why: "Agents following the skill are misrouted today: SELF_LEARNING.md tells solo projects to skip the CHG record and write governance docs directly, contradicting the always-traced invariant — the highest-value finding in #779 (owner triage, verified live)."
  trigger: "Issue #779 phase-a per the owner triage split + session direction to start #779 with CHG + SDD cascade."
  breaking_change_analysis: "C2 (not C3): single-doc refinement — no gate/ID/schema/enum removed; tightens (never loosens) the authorization rule; previously-green records stay green. Solo agents that relied on silent direct-write now file a (possibly self-approved C3) CHG instead. Reviewer may escalate to C3 at PR review."
  enforcement_decision: "Reviewer-lens + new conformance test (not a linter emitter). Rationale: exemption-absence is a prose property of one doc; the covering test pins it deterministically (IPLAN-17), and chg_lint validates records, not prose."
  scope:
    in:
      - "framework/governance/SELF_LEARNING.md v1.0 → v1.1: promotion section + Rule 2 exemption removal (archive → rewrite → supersedes → bump)"
      - "tests/conformance/test_self_learning.py (new): exemption-absence + authorization-presence assertions"
      - "framework/VERSION 0.65.1 → 0.65.2 + mechanical pin sweep + both CHANGELOGs"
    out:
      - "Two-tier architecture rewrite (CHG-18 C3 later — see Phase-2 scope below)"
      - "knowledge/ vs learning/ folder decision + BOOTSTRAP.md ruling reconciliation (CHG-18 — this CHG touches no folder language)"
      - "MiMoCode decoupling of the framework skill copy (CHG-18; the .agents copy stays as-is)"
      - "Universal tier / fetch-vs-vendor (canon #131, other repo)"
      - "Stale docs/governance/* path convention + learn-inject/session.post aspirational machinery (CHG-18 truthfulness pass)"
      - "Archive history rewrites; learnings.md content migration"

