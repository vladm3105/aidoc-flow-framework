# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-80)
# =============================================================================

decision:
  decision_id: "DEC-CHG-80"
  title: "Mandatory Decision Tracking in Change Requests and Retirement of plans/DECISIONS.md"
  status: "Ratified"
  context: |
    Decisions were previously fragmented across three surfaces (plans/DECISIONS.md for repo-process,
    framework/governance/DECISIONS.md for spec governance, and sdd/05_ADR for project architecture).
    Because change requests (CHGs) lacked a mandatory decision block, decisions were disconnected from
    the change management flow, plans/DECISIONS.md suffered drift, and reviewers could not inspect
    decision rationale directly in the change vehicle.
  choice: |
    1. Make the `decision:` block mandatory in CHG-TEMPLATE.yaml and its Layer 09 mirror for all change requests.
    2. Enforce presence and non-emptiness of decision_id, title, choice, and consequences via linter rule CHG-L018.
    3. Retire plans/DECISIONS.md as a frozen tombstone, preserving historical records D-0065..D-0086 for permalink integrity.
    4. Modernize framework/governance/DECISION_WORKFLOW.md to codify the unified decision model and threshold matrix.
    5. Register GD-71 / DEC-CHG-80 in framework/governance/DECISIONS.md.
  consequences: |
    - Every future change request (C1, C2, C3, Emergency) MUST articulate a formal decision.
    - Automated linter (sdd_doc_lint/chg_lint.py) rejects any CHG missing a decision block.
    - plans/DECISIONS.md accepts no new entries; decisions live in CHGs and graduate to framework/governance/DECISIONS.md.
  alternatives_considered:
    - option: "Keep plans/DECISIONS.md as a live log and manually update it on every PR"
      rationale_rejected: "Prone to drift and human error; repeatedly forgotten in recent releases."
    - option: "Make decision block optional in CHG-TEMPLATE.yaml"
      rationale_rejected: "Fails to guarantee that every change request records its architectural or procedural rationale."

# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Mandatory Decision Tracking in Change Requests, Deprecation of plans/DECISIONS.md, and CHG Linter Guard"
  author: "Framework Maintainer"
  date_submitted: "2026-10-07T00:00:00Z"
  summary: |
    Integrate decision-making directly into the change management flow:
    (1) CHG-TEMPLATE.yaml: Add mandatory `decision:` block with decision_id, title, status, context, choice, consequences, and alternatives_considered;
    (2) Layer 09 Mirror: Synchronize framework/layers/09_CHG/CHG-TEMPLATE.yaml to maintain 100% byte-parity;
    (3) plans/DECISIONS.md: Retire file as a frozen tombstone with prominent deprecation banner and pointer to CHGs;
    (4) DECISION_WORKFLOW.md: Modernize governance standard to document the 4-tier decision model, CHG decision lifecycle, threshold matrix, and retirement of plans/DECISIONS.md;
    (5) Linter Guard (CHG-L018): Implement automated check in sdd_doc_lint/chg_lint.py ensuring decision block is populated;
    (6) Conformance & Rules: Update framework/governance/LINT_RULES.md, tests/conformance/test_lint_catalog.py, and unit tests;
    (7) AGENTS.md: Update Working Agreement 'Where state lives' and Governance PRs definitions;
    (8) Ratify Decision GD-71 (DEC-CHG-80) in framework/governance/DECISIONS.md, bump framework version to 0.91.0, and record release notes.
  rationale: |
    Eliminates split-brain decision records, guarantees complete auditability of every change request,
    and provides developers and AI agents with a single, governed mechanism to track all decisions.

