# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-111)
# =============================================================================

decision:
  decision_id: "DEC-CHG-111"
  title: "Wire Playbook Authoring & Review Saga Subflows into Layer SWF Templates"
  status: "Ratified"
  context: |
    While the framework defines 58 persona playbooks across layers 01_BRD through 10_EVAL
    and standalone review saga workflows (framework/governance/workflows/review/), the 10 layer
    authoring workflow templates (*-SWF-TEMPLATE.yaml) were previously decoupled from the review loop:
    1. Authoring templates transitioned from evaluation gates directly to ratification without
       invoking the layer review saga.
    2. Authoring templates did not declare author_persona or author_playbook in their metadata,
       forcing agents to deduce their authoring rubric from REVIEW_CREWS.yaml.
    3. Structural workflow linting lacked a rule (SWF-L008) validating review saga invocations
       and author playbook existence.
  choice: |
    Implement the closed dual-flow loop per plans/LAYER-SWF-PLAYBOOK-INTEGRATION-PLAN.md:
    1. Explicitly declare author_persona and author_playbook in metadata of all 10 workflow templates
       (9 in framework/layers/, 1 in framework/governance/templates/CHG-SWF-TEMPLATE.yaml).
    2. Wire review saga subflow invocations into the ratification gates of all 10 templates and
       their standalone workflow counterparts under framework/governance/workflows/.
    3. Harmonize all 10 layer workflow standards (*_WORKFLOW_STANDARD.md) documenting the dual-flow loop.
    4. Implement SWF-L008 in sdd_doc_lint/swf_lint.py with unit tests.
  consequences: |
    - Closed quality loop: authoring agents follow their assigned playbook rubric and cannot ratify
      specifications without passing the layer review saga (review_score >= 90, 0 blocking findings).
    - Preserves engine neutrality (Decision D-0013): pure YAML specifications using CNCF Serverless
      Workflow DSL v0.8.
    - Zero breaking changes to standalone review sagas or static companion templates.
  alternatives_considered:
    - option: "Leave authoring and review sagas disconnected"
      rationale_rejected: >-
        Permits autonomous agents to author and ratify documents without enforcing the multi-agent
        review crew and playbook check constraints.
    - option: "Merge review saga logic directly into authoring templates"
      rationale_rejected: >-
        Creates massive, bloated templates that violate separation of concerns between authoring
        control planes and adversarial review sagas.

