change_description:
  summary: "Author framework/governance/workflows/eval-verification-run.sw.yaml; amend framework/layers/10_EVAL/README.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-53 in DECISIONS.md; update EXPECTED_WORKFLOWS in test_governance_workflows.py and EXPECTED_FILES in test_governance.py; MINOR bump 0.77.0 → 0.78.0."
  what: "Establishes the declarative CNCF Serverless Workflow v0.8 state machine (eval-verification-run.sw.yaml) governing Layer 10 (EVAL & IPVERIFY) multi-tier test suite execution (unit, acceptance, conformance, security SAST), automated quality gate scoring, immutable report emission (EVAL-REPORT-TEMPLATE.yaml), and defect remediation dispatch (REVIEW_REMEDIATION_FLOW.md). Aligns governance standards, diagram standards, and ratifies Decision GD-53."
  why: "Replaces conceptual text and ASCII diagrams with a machine-executable Directed Acyclic Graph (DAG) state machine using the vendor-neutral CNCF Serverless Workflow v0.8 standard in YAML. Retains byte-faithfulness and STRUCT01 compatibility for EVAL-TEMPLATE.yaml and EVAL-REPORT-TEMPLATE.yaml while giving autonomous AI agents deterministic test sequencing, automated quality gate evaluation, and standardized remediation dispatch. Issue #907."
  trigger: "User review 2026-10-05 approving CNCF standardization for Layer 10 (EVAL) + issue #907."
  scope:
    in:
      - "framework/governance/workflows/eval-verification-run.sw.yaml: declarative CNCF v0.8 state machine for Layer 10 evaluation execution"
      - "framework/layers/10_EVAL/README.md: document executable evaluation state machine and workflow bindings"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register eval-verification-run.sw.yaml under governance workflows"
      - "framework/governance/DIAGRAM_STANDARDS.md: register evaluation execution state machines under diagram standards"
      - "framework/governance/DECISIONS.md: add GD-53 ratifying Layer 10 evaluation runner CNCF workflow adoption"
      - "tests/conformance/test_governance_workflows.py: add eval-verification-run.sw.yaml to EXPECTED_WORKFLOWS and verify integrity"
      - "tests/conformance/test_governance.py: add workflows/eval-verification-run.sw.yaml to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.77.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.77.0 → 0.78.0"
      - "framework/CHANGELOG.md: entry for CHG-57 / 0.78.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Existing EVAL-TEMPLATE.yaml and EVAL-REPORT-TEMPLATE.yaml schemas remain unchanged"

