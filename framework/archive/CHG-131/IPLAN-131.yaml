# =============================================================================
# Syntax note (first deliverable per plan §Phase 2a.1 — normative for this CHG)
# =============================================================================

syntax_note:
  front_matter:
    keys_allowed: [doc_id, bucket, authority, consumers]
    keys_forbidden: [status, version, last_updated]
    rationale: >-
      status/version/last_updated would duplicate the Document Control
      table and trigger FM01 consistency obligations
      (sdd_doc_lint/__init__.py AS8). doc_id values are GOV-<STEM>.
    consumers_rule: >-
      machine-consumed candidates carry [authoring, audit, traceability];
      normative prose carries [authoring, audit].
    existing_blocks: >-
      DIAGRAM_STANDARDS.md and THRESHOLD_NAMING_RULES.md already carry
      front-matter; the four keys were merged into their blocks without
      reformatting (verified: no key collisions).
  section_ids:
    form: "## Heading {#sec-slug}"
    slug_rule: >-
      GitHub-compatible: lowercase, strip HTML, drop non [a-z0-9 _-],
      spaces to hyphens; first occurrence plain, repeats get -1, -2.
      Rationale: identical to GitHub auto-anchors wherever GitHub's own
      punctuation-stripping agrees, so existing fragment links keep resolving;
      the full offline link check verifies.
    scope: "## through #### headings outside fenced code blocks only"
  doc_versions: >-
    Each rewritten doc keeps its Document Control table with a minor
    version bump and Last Updated 2026-10-26 (CHG-74 precedent).

