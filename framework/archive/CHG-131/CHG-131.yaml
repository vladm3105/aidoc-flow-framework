# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-131)
# =============================================================================

decision:
  decision_id: "DEC-CHG-131"
  title: "Execute Phase 2a structured Markdown + slicer governance admission"
  status: "Decided"
  date: "2026-10-26"
  context: >-
    The Phase 1 benchmark (CHG-130) failed its gate unanimously: 100% accuracy
    in all three arms, ~3.4% YAML token saving vs the 30% bar. Per the plan's
    pre-registered rule the conversion ends after Phase 2a: structured
    Markdown for normative-prose and candidate docs, plus the certain slicer
    extension work. The Phase 0 inventory (CHG-129) classified 29 prose and
    7 candidate docs for this treatment; tombstone, aidoc, and workflow-form
    docs are untouched. GATE-SPEC human sign-off is required before merge.
  choice: >-
    Rewrite 36 governance docs with Phase 2a syntax (front-matter
    doc_id/bucket/authority/consumers; GitHub-compatible stable section
    IDs; per-doc minor version bump + date), archive each original under
    framework/archive/CHG-131/, extend sdd_doc_lint/slice.py with the GOV
    admission rule and section-anchor parsing plus a focused test, and bump
    framework/VERSION 0.96.13 -> 0.96.14 with pin propagation.
  consequences:
    positive:
      - Every governance prose/candidate doc becomes section-addressable.
      - The slicer serves governance sections for future context slicing.
      - No fact is converted to YAML; Markdown remains the human surface.
    negative:
      - 36 Document Control versions bumped for a metadata-only change.
    risks:
      - Custom heading IDs replace GitHub auto-anchors; mitigated by
        GitHub-compatible slug generation and the full offline link check.

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    Governance prose is not section-addressable by agents today: the slicer
    only accepts TYPE.NN.SS.hex element headings in TYPE-NN documents, so
    governance files are dropped. Phase 2a fixes that without converting
    any fact to YAML.
  scope:
    - "36 governance docs (29 normative prose + 7 machine-consumed candidates)."
    - "sdd_doc_lint/slice.py (GOV admission + section anchors) + focused test."
    - "framework/VERSION 0.96.14 + pin propagation."
    - "framework/layers/09_CHG/README.md (byte-identical mirror re-synced from the governance canon, guard-prescribed)."
    - "Out of scope: DECISIONS.md tombstone, aidoc/ docs, gates/templates forms."

