change_description:
  summary: "Author framework/governance/workflows/review-remediation-flow.sw.yaml and decision-ratification-flow.sw.yaml; amend REVIEW_REMEDIATION_FLOW.md, REVIEW_SAGA.md, DECISION_WORKFLOW.md, GOVERNANCE_WORKFLOW_STANDARD.md, and DIAGRAM_STANDARDS.md; ratify GD-54 in DECISIONS.md; update EXPECTED_WORKFLOWS in test_governance_workflows.py and EXPECTED_FILES in test_governance.py; MINOR bump 0.78.0 → 0.79.0."
  what: "Establishes declarative CNCF Serverless Workflow v0.8 state machines for (1) the multi-agent quality loop, 3-strike remediation saga, and break-circuit timeout guards (review-remediation-flow.sw.yaml), and (2) architecture decision proposal, review consensus, founder approval callback, and ratification locking (decision-ratification-flow.sw.yaml). Aligns companion governance documentation and ratifies Decision GD-54."
  why: "Replaces narrative prose descriptions of the review saga and decision lifecycle with deterministic, vendor-neutral CNCF state machines in YAML. Provides autonomous AI agent orchestrators with exact execution graphs, saga compensation rollback hooks (compensatedBy), and human-in-the-loop callback gates. Issue #909."
  trigger: "User review 2026-10-05 approving Step 3 of CNCF standardization roadmap + issue #909."
  scope:
    in:
      - "framework/governance/workflows/review-remediation-flow.sw.yaml: declarative CNCF v0.8 state machine for review remediation saga"
      - "framework/governance/workflows/decision-ratification-flow.sw.yaml: declarative CNCF v0.8 state machine for decision ratification"
      - "framework/governance/REVIEW_REMEDIATION_FLOW.md: register executable state machine and Mermaid parity"
      - "framework/governance/REVIEW_SAGA.md: register CNCF workflow mapping"
      - "framework/governance/DECISION_WORKFLOW.md: register executable state machine and Mermaid parity"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: register both new workflows in catalog"
      - "framework/governance/DIAGRAM_STANDARDS.md: register review remediation and decision ratification state machines"
      - "framework/governance/DECISIONS.md: add GD-54 ratifying review remediation and decision ratification workflows"
      - "tests/conformance/test_governance_workflows.py: add workflows to EXPECTED_WORKFLOWS and verify integrity"
      - "tests/conformance/test_governance.py: add workflows to EXPECTED_FILES"
      - "hooks/sync-version-refs.sh: add 0.78.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.78.0 → 0.79.0"
      - "framework/CHANGELOG.md: entry for CHG-58 / 0.79.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"

