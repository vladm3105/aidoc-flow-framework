# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-84)
# =============================================================================

decision:
  decision_id: "DEC-CHG-84"
  title: "Reconcile Root README.md with Framework v0.91.3 and Codify Automated Conformance Guard"
  status: "Ratified"
  context: |
    Following Change Request CHG-83 which aligned the framework with the platform technology stack and
    bumped the framework version to 0.91.3 per GATE-SPEC-E005, deep repository auditing revealed that
    root README.md remained cited at 0.91.2. Root README.md is intentionally excluded from automated
    regex string replacement in hooks/sync-version-refs.sh to prevent prose clobbering, but lacked an
    automated conformance test to detect version drift. Furthermore, TECHSTACK-ALIGNMENT-PLAN.md carried
    a 0.91.2 header pin.
  choice: |
    1. Reconcile root README.md to framework version 0.91.3, highlight the completed platform technology
       stack reference architecture (RECOMMENDED_PLATFORM_STACK.md) and 5 operational blueprints (aidoc/),
       and update declarative workflow counts (22 total: 13 core lifecycle + 9 review-remediation).
    2. Reconcile plans/TECHSTACK-ALIGNMENT-PLAN.md Document Control header to 0.91.3.
    3. Add automated test guard test_root_readme_spec_version_matches to tests/conformance/test_sync_version_refs.py
       asserting that README.md tracking framework spec citation matches framework/VERSION.
  consequences: |
    - Root README.md accurately reflects the live framework state and platform technology stack capabilities.
    - Future framework version bumps will fail conformance if root README.md tracking spec citation is not updated.
    - Zero breaking changes to specs or APIs.
  alternatives_considered:
    - option: "Add root README.md to automated regex sweep in hooks/sync-version-refs.sh"
      rationale_rejected: "Rejected per issue #927 decision to keep root README.md prose protected from mechanical regex clobbering."

