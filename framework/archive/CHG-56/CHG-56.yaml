change_description:
  summary: "Author framework/governance/IPLAN_WORKFLOW_STANDARD.md; ship canonical framework/layers/08_IPLAN/IPLAN-SWF-TEMPLATE.yaml with the Hybrid Envelope Architecture adopting CNCF Serverless Workflow v0.8 (YAML); update GOVERNANCE_WORKFLOW_STANDARD.md, DIAGRAM_STANDARDS.md, PLAN_STANDARD.md, and README.md; ratify GD-52 in DECISIONS.md; update EXPECTED_FILES in test_governance.py; add conformance test suite in test_iplan_workflow.py; MINOR bump 0.76.0 → 0.77.0."
  why: "Transforms static Layer 08 implementation checklists into machine-executable Directed Acyclic Graphs (DAGs) using the CNCF Serverless Workflow v0.8 standard in YAML format. Preserves the outer SDD document envelope for STRUCT01 and TAG01 compatibility while giving autonomous AI agents deterministic task execution, automated verification switch gates, and native saga rollback compensation (compensatedBy). Issue #905."
  trigger: "User review 2026-10-05 approving CNCF Serverless Workflow standard for Layer 08 (IPLAN) + issue #905."
  scope:
    in:
      - "framework/governance/IPLAN_WORKFLOW_STANDARD.md: core normative standard defining Layer 08 CNCF workflow adoption, rules, and runtime adapter"
      - "framework/layers/08_IPLAN/IPLAN-SWF-TEMPLATE.yaml: canonical template for executable implementation plans"
      - "framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md: clarify separation between governance workflows and implementation workflows"
      - "framework/governance/DIAGRAM_STANDARDS.md: link IPLAN execution state machines to diagram standards"
      - "framework/governance/DECISIONS.md: add GD-52 ratifying Layer 08 CNCF Serverless Workflow adoption"
      - "framework/layers/08_IPLAN/PLAN_STANDARD.md: document subtype workflow"
      - "framework/layers/08_IPLAN/README.md: document IPLAN-SWF-TEMPLATE.yaml"
      - "tests/conformance/test_governance.py: add IPLAN_WORKFLOW_STANDARD.md to EXPECTED_FILES"
      - "tests/conformance/test_iplan_workflow.py: add tests asserting IPLAN workflow YAML syntax, schema version, state reachability, compensation, and tags"
      - "hooks/sync-version-refs.sh: add 0.76.0 to OLD_VERSIONS"
      - "framework/VERSION: bump 0.76.0 → 0.77.0"
      - "framework/CHANGELOG.md: entry for CHG-56 / 0.77.0"
    out:
      - "Runtime code changes or execution engine bundling (framework remains pure specification per D-0013)"
      - "Existing IPLAN subtypes (code_build, deploy, combined, docs, bugfix, audit_fix remain intact)"

