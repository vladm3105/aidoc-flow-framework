tdd_consistency:
  strategy: "New executable surface: covering CONFORMANCE tests (fixture repos asserting end-state: files landed, pins recorded, refuses honored), not unit tests of shell internals. Parity test pins allowlist.txt identical to the §7.1 prose list (the #741 guard). Full battery as regression."
