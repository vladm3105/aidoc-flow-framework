# =============================================================================
# Section 5: Implementation Contracts
# =============================================================================
implementation_contracts:
  - "Manifest-closed: only listed files touched"
  - "CLI surface: install.sh <project> --canon <tag> [--kind pin|symlink] [--shared <path>] [--canon-dir <dir>] [--author NAME] [--dry-run] [--force] [--yes]; upgrade.sh <project> --to <tag> [--kind pin|symlink] [--shared <path>] [--canon-dir <dir>] [--conformance-cmd CMD] [--dry-run] [--force] [--yes]; exit 0 ok / 1 failed / 2 usage-or-refused"
  - "Input tree: pin flows clone the canon to scratch (--depth 1 at the explicit tag, never main, no magic default); symlink flows read the persistent --shared checkout (scratch clones are never linked); --canon-dir uses a local tree instead of cloning (air-gapped installs). Install reads scaffold + profile + allowlist from the canon tree; upgrade additionally reads the installed tree for the current pin + kind"
  - "Kind handling: install defaults to pin, --kind symlink requires --shared; upgrade auto-detects (symlink at .aidoc/framework → retarget; directory → stage-then-rename); --kind overrides detection and errors on mismatch (no silent conversion)"
  - "set -euo pipefail; no eval except the operator's own --conformance-cmd string (never built from repo/override content); target args resolved + prefix-contained; rm confined to the resolved target"
  - "Clone at explicit framework/vX.Y.Z tag, --depth 1, never main"
  - "Destructive ops print the op summary and require --yes or a TTY confirm (never silent); install --force and the upgrade re-point both gate this way"
  - "Scripts executable bit set (100755); no CRLF; shfmt-clean"
  - "allowlist.txt is the ONLY copy-set owner in code; §7.1 prose stays the human source; parity test binds them"
  - "Runbook/BOOTSTRAP procedure steps untouched (headers + one-line pointers; runbook 'Minimal automation' follow-up closed — stale detector ships inside upgrade.sh as DRIFT:/OK:/UNPINNED:); doc Versions bumped 1.0 → 1.1 (runbooks), 1.6 → 1.7 (DECISIONS)"
  - "Sweep is pin moves only outside the manifest; root CHANGELOG.md frozen, untouched"
  - "Never weaken tests/conformance to pass"

