    - "Manifest≡§7.1 parity: allowlist.txt copy set == §7.1 brace set, prune line == §7.1 rm path"
    - "install.sh --dry-run changes nothing (fixture repo byte-identical before/after)"
    - "install.sh refuses existing .aidoc/ without --force (exit 2); --force proceeds only with --yes or a TTY confirm"
    - "install.sh records framework_version pin == invoked VERSION"
    - "upgrade.sh stages-then-renames (lingered-file fixture proves replacement, not overlay; never half-copied)"
    - "upgrade.sh verifies VERSION vs pin after; mismatch exits 1"
    - "Both consumer kinds covered (symlink retarget + pinned-copy replace fixtures)"
    - "shellcheck clean on both scripts (pre-push gate runs it)"
    - "sync-version-refs.sh second run: zero replacements (idempotent)"
    - "tests/unit green; tests/conformance green; sdd_doc_lint/tests green"
    - "PR checks green on the branch"

