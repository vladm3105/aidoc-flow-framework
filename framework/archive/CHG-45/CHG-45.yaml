# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  summary: "Ship consumer install + upgrade shell scripts (both consumer kinds) driven by a single allowlist manifest pinned to §7.1 by conformance, with --dry-run, traversal-safe args, tag-pinned clone, and pin verification; add GD-45; point runbook/BOOTSTRAP/§7 at the scripts. MINOR 0.70.3 → 0.71.0."
  why: "Adoption and re-adoption are manual copy procedures; every manual copy risks missed files and stale-tree re-infection, and nothing executable enforces the copy set. #741 proves hardcoded second lists die — hence manifest + conformance pin."
  trigger: "Issue #870 (P2 feature, founder-requested 2026-10-02) with decided scope: both scripts, both consumer kinds, shell."
  scope:
    in:
      - "framework/scripts/install.sh + upgrade.sh + allowlist.txt (new, shell, --dry-run, both consumer kinds; stale detector inside upgrade.sh)"
      - "tests/conformance/test_consumer_scripts.py (parity, dry-run, pin-verify, refuse-nonempty, both kinds via fixtures)"
      - "Governance doc amends: UPGRADE-RUNBOOK.md + BOOTSTRAP.md (script headers, v1.0 → v1.1) + DECISIONS.md (GD-45, v1.6 → v1.7)"
      - "docs/PROJECT.md §7 headers pointing at the scripts (rides cascade; docs/, not SDD layer)"
      - "MINOR cut 0.71.0: framework/VERSION + OLD_VERSIONS + pin sweep + framework/CHANGELOG.md [0.71.0]"
      - "framework/archive/CHG-45/ vehicle + pre-change snapshots"
    out:
      - "Windows-native runners (manual procedures stay the portable fallback)"
      - "verified-planning installer; repo-local hooks/ (unchanged surfaces)"
      - "#865 (CI) + #867 (SemVer policy) — independent issues"

