# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-130)
# =============================================================================

decision:
  decision_id: "DEC-CHG-130"
  title: "Execute Phase 1 frozen benchmark for the governance doc conversion plan"
  status: "Decided"
  date: "2026-10-26"
  context: >-
    The merged plan (plans/GOVERNANCE-DOC-AGENT-FORMAT-PLAN.md, PR #1026)
    and the Phase 0 inventory (CHG-129/IPLAN-129) require a frozen,
    pre-registered benchmark before any YAML conversion: 30 tasks, three
    isolated arms, one named model, majority vote over 3 repeats, with a
    percentage-point gate and a 90% floor on both arms.
  choice: >-
    Run the benchmark exactly as frozen in
    framework/archive/CHG-130/benchmark-tasks.md: 24 classification tasks
    (4 per flow, including the spec → GATE-SPEC route as T15/T16) plus 6
    retrieval tasks, across arm-a-current.md, arm-b-structured.md, and
    arm-c-yaml.yaml. Record raw results in benchmark-results.md, compute
    the gate, and record the verdict in IPLAN-130. If the gate fails or
    the run is inconclusive, the plan ends after Phase 2a.
  consequences:
    positive:
      - The YAML-vs-structured-Markdown decision becomes measured evidence.
      - All raw results are committed and auditable.
    negative:
      - None; prototype arms live outside framework/, no normative edits.
    risks:
      - Ambiguity in T15/T16 flow ground truth (SEED2C by change_source
        column vs DIR2C by trigger) is document ambiguity, equal across
        arms; analyzed, not re-frozen, in the results.

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    Whether YAML beats structured Markdown on agent classification tasks is
    unmeasured (Claim 7 of the plan, blocking Phase 2b). Only a frozen
    benchmark with a pre-registered gate can settle it.
  scope:
    - framework/archive/CHG-130/CHG-130.yaml (new, this vehicle).
    - framework/archive/CHG-130/IPLAN-130.yaml (new, executing IPLAN + verdict).
    - framework/archive/CHG-130/benchmark-tasks.md (new, frozen task set + ground truth).
    - framework/archive/CHG-130/benchmark-results.md (new, raw results + gate computation).
    - framework/archive/CHG-130/arm-a-current.md (new, prototype arm, non-normative).
    - framework/archive/CHG-130/arm-b-structured.md (new, prototype arm, non-normative).
    - framework/archive/CHG-130/arm-c-yaml.yaml (new, prototype arm, non-normative).

