# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-124)
# =============================================================================

decision:
  decision_id: "DEC-CHG-124"
  title: "Mandate Authoritative Technology Stack Adherence, Insecure Options Prohibition, and Missing Tools Governance"
  status: "Decided"
  date: "2026-10-19"
  context: >-
    The organization has established an Authoritative Platform Technology Stack codified in
    /home/ya/devd/technology_stack (specifications 00 through 23). To prevent architectural drift,
    insecure configurations, and unauthorized tool adoption, AI agents must strictly adhere to this
    stack, never offer or use insecure options, and explicitly escalate missing tools to the operator.
  choice: >-
    1. Bind AGENTS.md, governance documents, skills, and templates to /home/ya/devd/technology_stack.
    2. Prohibit offering or using insecure options (plaintext secrets, disabled sandboxing, relaxed permissions).
    3. Codify the Missing Tools Operator Escalation Protocol: if a required tool is missing from the tech stack,
       the AI agent must explicitly inform the operator and get instructions on what tools or software to use.
    4. Modernize governance docs (RECOMMENDED_PLATFORM_STACK.md, TECHNOLOGY_STACK_USAGE_GUIDE.md,
       AIDOC-GVISOR-SANDBOX-EXECUTION-PROFILE.md) to reflect Two-Tier Secrets (OCI Vault + OpenBao) and Hybrid S3.
    5. Update templates (STACK-POLICY-TEMPLATE, MODULE-TEMPLATE, ADR/SPEC/TDD/IPLAN templates) and skills.
  consequences:
    positive:
      - Absolute consistency with canonical platform stack across all projects.
      - Zero tolerance for insecure workarounds, plaintext secrets, or relaxed sandboxing.
      - Clear, deterministic protocol for handling tools not currently present in the tech stack.
    negative:
      - Agents cannot autonomously introduce unvetted third-party libraries or databases without operator instruction.
    risks:
      - None; preserves all SDD layer invariants and BTV binary validation.

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    AI coding agents and templates previously lacked an explicit operational constraint binding
    them strictly to /home/ya/devd/technology_stack. Without explicit rules, agents could propose
    insecure options or guess unvetted tools when a needed utility was missing from documentation.
  scope:
    - Update AGENTS.md and AGENTS-TEMPLATE.md with platform standards, insecure options ban, and missing tools protocol.
    - Update RECOMMENDED_PLATFORM_STACK.md, TECHNOLOGY_STACK_USAGE_GUIDE.md, AI_ASSISTANT_RULES.md, DOC_GOVERNANCE_CORE.md.
    - Update skills (approval-gate, verified-planning, preprod-review, start-session, aidoc-triage).
    - Audit and update templates (STACK-POLICY-TEMPLATE.yaml, MODULE-TEMPLATE.md, ADR, SPEC, TDD, IPLAN templates).
    - Bump framework version to 0.96.11 and sync version references.

