# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-107)
# =============================================================================

decision:
  decision_id: "DEC-CHG-107"
  title: "Consumer Deployment Parity and In-Repo .aidoc Modernization"
  status: "Ratified"
  context: |
    Following ratification of CHG-106 and the codification of the .aidoc/ Workstation Standard
    (docs/AIDOC_WORKSTATION_STANDARD.md), an audit of the framework repository revealed four
    operational gaps and contradictions:
    1. Symlink Contradiction: The ratified standard bans cross-repository symlinks for CI portability,
       while framework/governance/aidoc/AIDOC.md, BOOTSTRAP.md, AIDOC-SCAFFOLD-TEMPLATE.md, and
       ADAPTATION.md still mandate the legacy symlink model (framework -> .aidoc/framework).
    2. Outdated Topology: Core governance files omitted .aidoc/Taskfile.yml, stack-policy.yaml,
       engine/engine.yaml, and contracts/ from the .aidoc/ directory structure.
    3. Installer Script Drift: framework/scripts/install.sh and upgrade.sh scaffolded .aidoc/bin/sdd-lint
       instead of .aidoc/Taskfile.yml and engine/engine.yaml.
    4. Missing Templates & Agent Guidance: framework/templates/ lacked TASKFILE-TEMPLATE.yml and
       ENGINE-CONFIG-TEMPLATE.yaml, while AGENTS-TEMPLATE.md instructed running .aidoc/bin/sdd-lint
       instead of unified Taskfile commands (task sdd:lint, task sdd:check).
  choice: |
    1. Update framework/governance/aidoc/AIDOC.md, BOOTSTRAP.md, and AIDOC-SCAFFOLD-TEMPLATE.md to
       retire the symlink convention, codify Git Submodule / Dynamic Clone distribution, and reflect
       the complete Quad-Pillar .aidoc/ topology.
    2. Update framework/governance/ADAPTATION.md to align distribution rules and starter agent guidance.
    3. Add framework/templates/TASKFILE-TEMPLATE.yml and ENGINE-CONFIG-TEMPLATE.yaml.
    4. Update framework/scripts/install.sh and upgrade.sh to scaffold .aidoc/Taskfile.yml and
       engine/engine.yaml while providing .aidoc/bin/sdd-lint as a backward-compatible shim.
    5. Update framework/templates/AGENTS-TEMPLATE.md to instruct task sdd:lint and task sdd:check.
    6. Update tests/conformance/test_consumer_scripts.py to assert Taskfile and runner compatibility.
    7. Bump framework/VERSION to 0.91.24 per GATE-SPEC-E005.
  consequences: |
    - Ensures complete parity between in-repo framework files and the ratified Workstation Standard.
    - Eliminates conflicting symlink guidance across governance documentation.
    - Enables clean consumer bootstrapping with unified Taskfile orchestration and backward-compatible shims.
  alternatives_considered:
    - option: "Rely solely on external aidoc-project-onboarding repository"
      rationale_rejected: >-
        Leaves aidoc-flow-framework internally inconsistent and broken for consumers bootstrapping
        via in-repo install.sh or reading core governance specifications.

