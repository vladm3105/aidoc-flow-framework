# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-113)
# =============================================================================

decision:
  decision_id: "DEC-CHG-113"
  title: "Integrate SDD-GRAPH v2.0 Templates, Kùzu Graph Engine Guidance, and Modernized Workstation Standard"
  status: "Ratified"
  context: |
    Audits of the framework across layers 01_BRD through 10_EVAL revealed that while single-document
    declarative specifications (*-TEMPLATE.yaml) and workflow execution state machines (*-SWF-TEMPLATE.yaml)
    exist, the canonical SDD-GRAPH v2.0 Data Plane (*-GRAPH-TEMPLATE.yaml) is missing from layer template
    directories. Furthermore:
    1. Layer READMEs do not declare the Three-Tier Architecture (Tier 1 Execution Flow, Tier 2 Canonical Data
       Plane DAG, Tier 3 Compiled Presentation).
    2. Framework specifications lack explicit guidance defining when and how AI agents should use the
       Kùzu OLAP graph engine versus pure-Python fallbacks.
    3. The Workstation Standard (docs/AIDOC_WORKSTATION_STANDARD.md) and installation automation do not
       standardize the graph directory (docs/sdd/graph/) or provide turnkey graph management tasks.
  choice: |
    Execute the modernization per the ratified roadmap:
    1. Author *-GRAPH-TEMPLATE.yaml (schema v2.0) across all 10 layers (01_BRD through 10_EVAL).
    2. Update layer READMEs (01_BRD through 10_EVAL) and framework/layers/README.md with the Three-Tier
       architectural model.
    3. Codify Kùzu graph engine guidance in framework/AI_ASSISTANT_RULES.md, specifying when to use Kùzu
       (agent prompt slicing, PR blast radius calculation, ad-hoc openCypher queries) and how to use it
       via Pillar 4 (aidoc-context-tools) while preserving zero-runtime engine neutrality (D-0013 / GD-13).
    4. Update docs/AIDOC_WORKSTATION_STANDARD.md, BOOTSTRAP.md, framework/scripts/install.sh, and
       TASKFILE-TEMPLATE.yml to codify docs/sdd/graph/ and turnkey graph automation tasks.
  consequences: |
    - Consumer repositories gain first-class declarative graph slices across all 10 SDD layers.
    - AI coding agents can slice context and query dependencies in sub-millisecond openCypher via FastMCP.
    - Consumer git repositories remain 100% clean and free of binary database bloat.
    - Preserves Decision D-0013 / GD-13 (zero-runtime framework neutrality).
  alternatives_considered:
    - option: "Vendor Kùzu binary files directly inside consumer .aidoc/ git repositories"
      rationale_rejected: >-
        Rejected per Decision D-0013 and GD-13. Distributing native C++ binaries inside git-tracked repos
        causes 150MB+ repo bloat, cross-compilation failures across architectures, and breaks platform neutrality.
    - option: "Rely solely on pure-Python DFS AST scanning without Kùzu"
      rationale_rejected: >-
        Rejected because recursive AST traversal becomes a latency bottleneck in repositories with hundreds
        of layered contracts and lacks openCypher variable-length path matching.

# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Integrate SDD-GRAPH v2.0 Templates, Kùzu Graph Engine Guidance, and Modernized Workstation Standard"
  description: >-
    Author SDD-GRAPH v2.0 templates across all 10 layers, document the Three-Tier architecture in layer READMEs,
    codify Kùzu engine operational rules in AI assistant rules, and modernize the workstation standard with
    graph directory layout and Taskfile automation.
  justification: >-
    Equips autonomous AI agents with high-density, sub-millisecond graph slicing and openCypher queries
    while maintaining zero binary bloat and full engine neutrality.

