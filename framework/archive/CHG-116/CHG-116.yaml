# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-116)
# =============================================================================

decision:
  decision_id: "DEC-CHG-116"
  title: "Comprehensive Remediation of Stale Framework Information and Artifact Inconsistencies"
  status: "Ratified"
  context: |
    A deep review of the aidoc-flow-framework repository following historical migrations (Hermes MCP
    and Claude Code plugin retirement, monolithic CHANGELOG/DECISIONS freezing, BTV adoption in CHG-97,
    and Three-Tier Architecture introduction) revealed residual staleness and drift:
    1. Lingering heuristic readiness scores (target_score: ">=90/100", *_ready_score: "[Score]/100",
       and numeric workflow conditions) in layer templates and SWF workflows that contradict BTV standards.
    2. Missing Layer 09 CHG templates in layers/09_CHG and governance/chg (CHG-SWF-TEMPLATE.yaml and
       CHG-GRAPH-TEMPLATE.yaml), drift in rationale lines, and missing Three-Tier sections in 09_CHG README.
    3. Mentions of deleted examples/url-shortener/ and root archive/ in docs/REPO_STRUCTURE.md,
       ID_NAMING_STANDARDS.md, and TRACEABILITY.md.
    4. Contradictory statements regarding CHANGELOG.md (active vs frozen tombstone) in root README.md,
       framework/README.md (GATE-SPEC update requirement), and THRESHOLD_NAMING_RULES.md.
    5. Inaccurate claims in DOC_GOVERNANCE_CORE.md regarding MVP templates surviving as tombstones.
    6. Stale linter bounds and rule catalogs in AGENTS.md (omitted CHG-L019, bounded SWF at L007).
  choice: |
    Execute comprehensive remediation per ratified deep_framework_stale_info_review_plan.md:
    1. Purge all residual readiness score fields from 01_BRD through 06_SPEC, 08_IPLAN, and 10_EVAL
       templates and SWF workflows, adopting deterministic BTV PASS (target_status: "PASS").
       Preserve software test coverage metrics (coverage_target: ">=90%") and product SLAs (threshold: ">=90%").
    2. Canonicalize CHG templates: home CHG-SWF-TEMPLATE.yaml and CHG-GRAPH-TEMPLATE.yaml in layers/09_CHG/,
       mirror them to governance/chg/, align governance/templates/CHG-GRAPH-TEMPLATE.yaml rationale,
       update 09_CHG/README.md and governance/chg/README.md with Three-Tier sections, and update test_governance.py.
    3. Rephrase historical examples/url-shortener/ references into generic historical acceptance fixture notes
       and prune deleted trees from REPO_STRUCTURE.md.
    4. Clarify CHANGELOG.md frozen status across root README.md, framework/README.md, THRESHOLD_NAMING_RULES.md,
       and PROJECT.md.
    5. Correct MVP tombstone commentary in DOC_GOVERNANCE_CORE.md to document permanent deletion in CHG-89.
    6. Update AGENTS.md linter rules to include CHG-L019 and SWF-L001..L009.
    7. Bump framework/VERSION to 0.96.3, update sync-version-refs.sh, and run full test suites.
  consequences: |
    - Complete alignment with BTV deterministic binary verification across all templates and workflows.
    - Absolute template parity across all 10 layers with Three-Tier Architecture documentation in every layer README.
    - Zero dead links or citations to deleted example directories or active monolithic changelogs.
    - Full conformance across 613+ tests and 100+ unit tests without weakening checks.
  alternatives_considered:
    - option: "Retain advisory heuristic scores alongside BTV PASS"
      rationale_rejected: >-
        Rejected because dual scoring models create semantic ambiguity for autonomous agents and contradict
        the framework's ratified transition to Binary Topological Validation (BTV).
    - option: "Leave CHG-SWF-TEMPLATE only in framework/governance/templates/"
      rationale_rejected: >-
        Rejected because Layer 09 README already claimed the template existed in layers/09_CHG, and
        consistency requires that all 10 layers provide complete template sets.

