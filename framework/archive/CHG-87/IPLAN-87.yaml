    purpose: "Reference ADR-00_index.yaml as the canonical project-level technology stack registry"
  - path: "framework/governance/DECISIONS.md"
    action: "modify"
    purpose: "Ratify Decision GD-74 (DEC-CHG-87)"
  - path: "framework/VERSION"
