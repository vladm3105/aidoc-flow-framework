# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-87)
# =============================================================================

decision:
  decision_id: "DEC-CHG-87"
  title: "Modernization of Layer 05 ADR Index to YAML with Embedded Project Technology Stack & Security Registry"
  status: "Accepted"
  context: |
    Under Decision GD-73, Layer 05 (05_ADR) was ratified as the formal Technology Selection Gate where abstract
    behavioral requirements meet concrete technological implementations. However, projects lacked a canonical,
    agent-readable registry recording all active technologies used in the project for automated security monitoring
    (SCA, CVE scanning, SBOM) and automated tool updates (Dependabot, Renovate). Maintaining duplicate human-readable
    Markdown tables and machine-readable manifests causes documentation drift. Modernizing ADR-00_index to a single,
    canonical YAML template (ADR-00_index.TEMPLATE.yaml) mirrors the pattern established in Layer 08
    (IPLAN-00_index.TEMPLATE.yaml) and provides an unambiguous source of truth from which AI agents can generate any
    human report on-demand.
  choice: |
    1. Retire ADR-00_index.TEMPLATE.md and author ADR-00_index.TEMPLATE.yaml as the canonical Layer 05 index specification.
    2. Embed the Project Technology Stack & Security Monitoring Registry within ADR-00_index.TEMPLATE.yaml with PURL, CPE,
       scanner thresholds, and automated update policies.
    3. Update Layer 05 README, ADR_WORKFLOW_STANDARD.md, and TECHNOLOGY_STACK_USAGE_GUIDE.md to cite the unified YAML index.
    4. Ratify Decision GD-74 in DECISIONS.md and bump framework version to 0.91.6.
  consequences: |
    - Eliminates dual-entry bookkeeping and documentation drift.
    - Enables automated CI ingestion for security vulnerability scanning and dependency updates.
    - AI agents can generate human-facing architecture and tech stack reports dynamically on demand.
  alternatives_considered:
    - option: "Option 1: Freeform Markdown table in ADR-00_index.TEMPLATE.md"
      rationale_rejected: "Rejected. Markdown tables cannot be programmatically parsed by CI vulnerability scanners and update bots without brittle regexes."
    - option: "Option 2: Standalone TECHNOLOGY_REGISTRY.yaml outside Layer 05"
      rationale_rejected: "Rejected. Separating the technology inventory from the ADR layer creates a second uncoordinated artifact that drifts from decision records."

