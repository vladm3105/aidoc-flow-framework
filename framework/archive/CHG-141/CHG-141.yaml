# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-141)
# =============================================================================

decision:
  decision_id: "DEC-CHG-141"
  title: "Streamline BRD companion template and relocate mockups to layer examples"
  status: "Decided"
  date: "2026-10-27"
  context: >-
    Issue #987: BRD-TEMPLATE.yaml was an extreme outlier at 1,180 lines (~53 KB),
    bloated with multi-page narrative mockups, hypothetical business scenarios,
    and verbose antipattern commentary, which imposed high token overhead on LLM
    agent context windows and conflicted with Principle 7 of DOC_GOVERNANCE_CORE.md.
  choice: >-
    1. Streamline BRD-TEMPLATE.yaml into a concise, token-efficient template schema
    (< 300 lines) preserving all 17 canonical top-level section keys, _size_target
    budgets, element-ID contracts, and STRUCT01/COV01/SEED01 validation markers.
    2. Relocate the complete illustrative scenario mockup and verbose examples to
    framework/layers/01_BRD/examples/BRD-EXAMPLE.yaml for authors requiring reference prose.
    3. Retain complete compatibility with sdd_doc_lint and acceptance test harnesses.
  consequences:
    positive:
      - "Reduces BRD-TEMPLATE.yaml token footprint by ~75% (~1,180 lines down to ~270 lines)."
      - "Satisfies DOC_GOVERNANCE_CORE.md Principle 7 (token-efficient authoring)."
      - "Preserves full reference mockup fidelity in dedicated layer example file."
      - "All structural linter and conformance tests continue to pass identically."
    negative:
      - "None; downstream consumers parsing top-level keys and _size_target are unaffected."
    risks:
      - "Authors relying solely on inline template comments for examples can consult the dedicated layer example file."

