# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  what: |
    Add `document_control:` blocks (version, status, last_updated, author,
    framework_version) to all framework governance documents, layer READMEs,
    root-level reference docs, gate definitions, and YAML files that currently
    lack them. This brings every framework document under the same document
    lifecycle tracking that SDD layer templates already use.
  why: |
    The framework's own governance docs have no version tracking, status, or
    authorship metadata. This violates the principle that the framework should
    model the governance it prescribes. Without document_control, there is no
    audit trail for when governance rules were last updated, who authored them,
    or which framework version they were written against.
  trigger: |
    Self-governance gap identified during framework review. The 09_CHG rules
    require document lifecycle management, but governance docs themselves lack
    the mechanism.

