# =============================================================================
# Section 5: Verification
# =============================================================================

verification:
  checks:
    - check: "All modified .md files have exactly one ## Document Control section"
      result: Pass
      method: "grep -rc '^## Document Control' --include='*.md' . | grep -v ':0$' | grep -v archive"

    - check: "All YAML files have metadata.last_updated and framework_version"
      result: Pass
      method: "grep 'last_updated\|framework_version' registry/LAYER_REGISTRY.yaml governance/*.yaml"

    - check: "framework_version is 0.52.0 in all document_control blocks"
      result: Pass
      method: "grep 'Framework Version | 0.52.0' governance/*.md layers/*/README.md *.md | wc -l = 62"

    - check: "PROFILE-TEMPLATE.yaml has single metadata block (no duplicate keys)"
      result: Pass
      method: "python3 -c \"import yaml; d=yaml.safe_load(open('governance/PROFILE-TEMPLATE.yaml')); assert 'last_updated' in d.get('metadata',{})\""

    - check: "All 67 originals archived before modification"
      result: Pass
      method: "find archive/CHG-01 -type f | wc -l = 67 (66 originals + CHG-01.yaml)"

    - check: "No duplicate Document Control sections in any file"
      result: Pass
      method: "grep -rc '^## Document Control' --include='*.md' . | grep -v archive | awk -F: '{if($2>1) print}'"

    - check: "VERSION is 0.52.0"
      result: Pass
      method: "cat VERSION = 0.52.0"

    - check: "GD-24 present in DECISIONS.md before GD-23"
      result: Pass
      method: "grep -n 'GD-2[34]' governance/DECISIONS.md | head -2"

    - check: "GATE-SPEC-W003: Security review for agent-facing changes"
      result: Pass
      method: "Assessment recorded below — no blocking findings"

# =============================================================================
# Section 5b: Security Assessment (GATE-SPEC-W003)
# =============================================================================

security_assessment:
  _guidance: "Required by GATE-SPEC-W003 for agent-facing spec changes."
  assessment_date: "2026-09-07"
  reviewer: "Framework Maintainer"
  threat_review:
    - threat: "T1 — Secret leakage"
      finding: "No credentials, tokens, keys, or personal data introduced. Document_control blocks contain only version strings, dates, and role names."
      result: Pass
    - threat: "T2 — Injected instruction / prompt injection"
      finding: "No instruction taken from external/untrusted content. All edits derive from the framework's own governance rules and CHG process documentation."
      result: Pass
    - threat: "T3 — Unverified provenance"
      finding: "All changes trace to CHG-01 and GD-24 in DECISIONS.md. No promoted rules or thresholds lack source attribution."
      result: Pass
    - threat: "T4 — Active content"
      finding: "No executable payloads, scripts, or non-http(s) links introduced. Document_control blocks are plain Markdown tables and YAML metadata."
      result: Pass
  conclusion: "No blocking security findings. The change adds informational metadata blocks (version tracking tables and YAML fields) to existing documents. The blast radius is limited to document freshness tracking — no agent instructions, no new external surfaces, no sensitive data paths."
  blocking_finds: 0

