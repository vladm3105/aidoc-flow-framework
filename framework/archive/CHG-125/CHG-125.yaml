# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-125)
# =============================================================================

decision:
  decision_id: "DEC-CHG-125"
  title: "Modernize SDD Structural Linter to doc_lint with Dual Naming & Toolchain Parity"
  status: "Decided"
  date: "2026-10-21"
  context: >-
    Following the successful unified monorepo consolidation in aiops-developer, aidoc-framework
    must be modernized to serve as an ideal, future-proof base for other projects.
    The structural linter was historically a loose directory of scripts named sdd_doc_lint
    requiring manual PYTHONPATH configuration. Standardizing to doc_lint with symlink aliases,
    standard pyproject.toml packaging, hermetic mise toolchain pins, and fast composite Taskfile
    targets establishes modern ergonomics while guaranteeing 100% backward compatibility.
  choice: >-
    1. Rename sdd_doc_lint/ to doc_lint/ and track symlink sdd_doc_lint -> doc_lint in git.
    2. Add pyproject.toml inside doc_lint/ exposing console script entrypoints (doc-lint, sdd-lint).
    3. Add in-memory module identity alias in doc_lint/__init__.py to prevent class identity drift.
    4. Create root symlink aidoc -> framework for path resolution symmetry with aiops-developer.
    5. Add mise.toml pinning Python 3.12, uv, task, lychee, yamllint, and gitleaks.
    6. Add composite targets task check (<15s) and task ci (<45s) in Taskfile.yml.
    7. Add docs/ADAPTATION-GUIDE.md and synchronize linter/test allowlists across repository.
  consequences:
    positive:
      - 100% backward compatibility: existing CI, scripts, and imports referencing sdd_doc_lint work unmodified.
      - Seamless installation: linter can be installed via uv or pip without manual PYTHONPATH wrangling.
      - Full architectural symmetry between aidoc-framework and aiops-developer.
      - Hermetic, reproducible environment for developers and AI agents via mise install.
    negative:
      - Repository now tracks symbolic links, requiring POSIX symlink support in contributor environments.
    risks:
      - None; verified with comprehensive test suites and allowlist checks.

# =============================================================================
# Section 2: Problem Statement & Scope
# =============================================================================

problem_statement:
  summary: >-
    aidoc-framework lacked standard Python packaging for its structural linter, lacked hermetic
    toolchain pinning, had loose task definitions in Taskfile.yml, and lacked cross-repo naming
    parity with aiops-developer.
  scope:
    - doc_lint/ packaging and sdd_doc_lint symlink alias.
    - Root aidoc -> framework symlink.
    - mise.toml, Taskfile.yml, .gitignore, .pre-commit-config.yaml, ruff.toml updates.
    - docs/ADAPTATION-GUIDE.md and test_consumer_manifest.py allowlist alignment.

