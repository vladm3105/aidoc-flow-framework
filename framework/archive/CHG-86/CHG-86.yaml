# =============================================================================
# Section 1B: Formal Decision (DEC-CHG-86)
# =============================================================================

decision:
  decision_id: "DEC-CHG-86"
  title: "Approved Technology Stack Integration, Multi-Tier Selection Governance, and SWF Template Modernization"
  status: "Accepted"
  context: |
    While CHG-83 / GD-72 established recommended platform blueprints (RECOMMENDED_PLATFORM_STACK.md), projects lacked
    a unified governance framework dictating how and when the enterprise technology stack (/mnt/e/dev/technology_stack)
    is applied. Specifically, developers and AI agents need clarity on whether technology selection requires an 11th layer
    (rejected: technology selection is an architectural decision belonging in Layer 05 ADR), where in the lifecycle
    selection occurs (after BDD and before SPEC), how primary CNCF Serverless Workflow (SWF) templates reflect recommended
    technologies, and how variance requests are governed without compromising engine-agnostic purity.
  choice: |
    1. Author framework/governance/TECHNOLOGY_STACK_USAGE_GUIDE.md formalizing the multi-tier progressive refinement model
       (Tier 0 Enterprise Stack, Tier 1 Seed Invariants, Tier 2 Module Containers, Layers 01-04 Problem Space, Layer 05 ADR
       Selection Gate, Layers 06-10 Solution Space) and stack variance procedures.
    2. Update architectural diagrams and visual state machines in RECOMMENDED_PLATFORM_STACK.md, DECISION_WORKFLOW.md,
       SEED_TO_MODULE_DECOMPOSITION.md, SPEC_DRIVEN_DEVELOPMENT_GUIDE.md, and Layer 05 README to reflect the selection gate.
    3. Update primary CNCF Serverless Workflow templates (BRD, PRD, EARS, BDD, ADR, SPEC, TDD, IPLAN SWF templates) and companion
       static templates with recommended platform selections while preserving pinned section counts (EXPECTED).
    4. Modernize normative workflow standards (*_WORKFLOW_STANDARD.md across Layers 01-08 and Governance) to specify
       candidate evaluation, testcontainer verification, and schema contract generation primitives.
    5. Enhance REVIEW_CREWS.yaml to enforce technology stack alignment checks during Architect and Operator reviews.
    6. Graduate specification decision to framework/governance/DECISIONS.md as Decision GD-73 under GATE-SPEC.
  consequences: |
    - Clear, deterministic placement of technology decisions at Layer 05 (ADR) immediately after BDD scenarios.
    - Zero pipeline bloat: preserved 10-layer SDD contract without introducing a redundant TDR layer.
    - Full conformance with test_spec_hygiene.py: zero engine-token leakage in core framework.
    - Full synchronization between primary SWF templates and companion static templates without altering pinned section counts.
  alternatives_considered:
    - option: "Introduce an 11th SDD Layer: Technology Decision Records (TDR)"
      rationale_rejected: "Rejected because technology choices are inherently architectural decisions. Creating a separate layer causes pipeline bloat, breaks the 10-layer model, and introduces an artificial separation between architecture and technology."
    - option: "Perform technology selection during PRD authoring"
      rationale_rejected: "Rejected because product requirements must remain technology-agnostic. Choosing technologies before BDD bypasses critical behavioral failure scenarios and latency constraints."

# =============================================================================
# Section 2: Request Summary
# =============================================================================

request:
  title: "Approved Technology Stack Integration & Selection Governance"
  author: "Framework Maintainer"
  date_submitted: "2026-10-11T00:00:00Z"
  summary: |
    Integrate our enterprise technology stack (/mnt/e/dev/technology_stack) into the framework across all tiers
    and layers, update visual flows and CNCF state machines, modernize primary SWF templates and workflow standards,
    and formalize the technology selection gate at Layer 05 (ADR) after BDD.
  rationale: |
    Eliminates architectural ambiguity, unifies multi-project tooling around approved open-source standards,
    and provides clear execution templates for autonomous AI coding agents.

