  summary: "Cut PATCH release 0.68.3: repair UPGRADE-RUNBOOK.md §2 pinned-copy bullet to the §7.1 allowlist (the E005 driver); bump framework/VERSION, extend OLD_VERSIONS with 0.68.2, run the pin sweep, cut [0.68.3] sections in both CHANGELOGs. Rides #834 docs repair + manifest guard + CLAUDE.md retirement (disclosed, no bump on their own). Tag + TAGGING refresh + promotion follow as sequenced follow-ups, not this diff."
  why: "Issue #834 (real-use): new projects ship canon-dev internals through the §7.1 denylist, and the upgrade runbook would reintroduce them on every re-adoption. The runbook repair is normative, so it must ride a versioned cut."
  trigger: "Human requests 2026-10-01: fix the new-project file leak (#834), check UPGRADE-RUNBOOK for the same leak, commit and push with a PR."
  scope:
    in:
      - "framework/governance/aidoc/UPGRADE-RUNBOOK.md: §2 pinned-copy bullet → §7.1 allowlist reference (normative repair, E005 driver)"
      - "framework/VERSION: 0.68.2 → 0.68.3"
      - "hooks/sync-version-refs.sh: OLD_VERSIONS gains 0.68.2 (sweep source for the bump)"
      - "Swept pins 0.68.2 → 0.68.3 via the hook (mechanically produced, verified by diff)"
      - "framework/CHANGELOG.md: new [0.68.3] section"
      - "CHANGELOG.md: new [0.68.3] section mirroring (Scope #687)"
      - ".aidoc/profile.yaml: declared framework_version follows the bump"
      - "Riding (disclosed): docs/PROJECT.md §7 + §7.2, docs/ADAPTATION-GUIDE.md §2, tests/conformance/test_consumer_manifest.py (#834)"
      - "Riding (disclosed): CLAUDE.md retirement into AGENTS.md + pointer sync (CODEOWNERS, labeler, PR template, codeql/pin-currency comments, check-docs-updated.sh, test_phantom_paths.py)"
      - "framework/archive/CHG-33/CHG-33.yaml + IPLAN-33.yaml (this vehicle)"
    out:
      - "Tag cut/push (post-merge, pre-push verified — sequenced follow-up)"
      - "TAGGING.md refresh (post-tag micro-vehicle, #822 precedent)"
      - "Promotion PR release/0.68.3 → main (founder-merged, #825 precedent)"
      - "#835 (§4 mirror-list staleness — separate issue, separate fix)"
      - "Normative spec edits beyond the runbook bullet; MINOR/MAJOR bump; GitHub Release object"

