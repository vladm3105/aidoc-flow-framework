# =============================================================================
#  REVIEW-SWF-TEMPLATE.yaml — CNCF Serverless Workflow Template for Review Sagas
# =============================================================================
#  Standard: CNCF Serverless Workflow DSL v0.8 (YAML)
#  Authority: framework/governance/REVIEW_WORKFLOW_STANDARD.md
#  Governs: framework/governance/REVIEW_REMEDIATION_FLOW.md, REVIEW_SAGA.md
#  Purpose: Canonical template for configuring and instantiating review sagas
#           with layer-specific crews, deterministic gate floor evaluation,
#           and rollback compensation.
# =============================================================================

id: "[layer-code]-review-remediation-flow"
name: "[Layer Name] Review Remediation Saga"
version: "1.0.0"
specVersion: "0.8"
description: >-
  Configurable review saga workflow: parallel persona fan-out, wall-clock
  break-circuit checkpointing, finding synthesis, deterministic gate floor check,
  and mutating remediation cycle with rollback compensation.

metadata:
  framework_version: "0.91.2"
  governed_layer: "[01_BRD|02_PRD|03_EARS|04_BDD|05_ADR|06_SPEC|07_TDD|08_IPLAN|09_CHG]"
  workflow_type: "governance-review-saga"

start: PrepareReviewCrew

states:
  # -----------------------------------------------------------------------------
  # State 1: Prepare Review Run Metadata
  # -----------------------------------------------------------------------------
  - name: PrepareReviewCrew
    type: inject
    data:
      status: "PREPARED"
      iteration: 1
      max_iterations: 3
      threshold_score: 90.0
      structural_pass: false
      soft_deadline_seconds: 600
    transition: DispatchReviewCrew

  # -----------------------------------------------------------------------------
  # State 2: Parallel Crew Fan-Out (Configured per REVIEW_CREWS.yaml)
  # -----------------------------------------------------------------------------
  - name: DispatchReviewCrew
    type: parallel
    completionType: allOf
    branches:
      - name: PrimaryLensBranch
        actions:
          - name: ExecutePrimaryLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "[primary_persona]"
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/[layer]/[primary_persona].md"
      - name: SpecialistLensBranch
        actions:
          - name: ExecuteSpecialistLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "[specialist_persona]"
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/[layer]/[specialist_persona].md"
      - name: ChaosLensBranch
        actions:
          - name: ExecuteChaosLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "chaos_engineer"
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/[layer]/chaos_engineer.md"
      - name: SecurityLensBranch
        actions:
          - name: ExecuteSecurityLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "security_engineer"
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/[layer]/security_engineer.md"
    transition: CheckBreakCircuit

  # -----------------------------------------------------------------------------
  # State 3: Wall-Clock Break-Circuit Checkpoint
  # -----------------------------------------------------------------------------
  - name: CheckBreakCircuit
    type: switch
    dataConditions:
      - name: TimeoutExceeded
        condition: "${ .elapsed_seconds >= .soft_deadline_seconds }"
        transition: EmitPartialTimeoutCheckpoint
    defaultCondition:
      transition: SynthesizeFindingsAndScore

  # -----------------------------------------------------------------------------
  # State 4: Synthesize Findings, Score & Categorization (Reduce)
  # -----------------------------------------------------------------------------
  - name: SynthesizeFindingsAndScore
    type: operation
    actions:
      - name: ReduceCrewFindings
        functionRef:
          refName: reduceFindingsAndCalculateScore
          arguments:
            branches: "${ .branches }"
            artifact_id: "${ .artifact_id }"
            report_template: "framework/governance/templates/REVIEW_REPORT-TEMPLATE.yaml"
    transition: EvaluateQualityGate

  # -----------------------------------------------------------------------------
  # State 5: Quality Gate & Iteration Cap Switch
  # -----------------------------------------------------------------------------
  - name: EvaluateQualityGate
    type: switch
    dataConditions:
      - name: GatePassed
        condition: "${ .structural_pass == true and .blocking_findings == 0 }"
        transition: ApproveArtifact
      - name: IterationCapReached
        condition: "${ .iteration >= .max_iterations }"
        transition: EscalateToFounder
    defaultCondition:
      transition: EnterRemediationCycle

  # -----------------------------------------------------------------------------
  # State 6: Remediation Fixer Phase (Compensated by Rollback)
  # -----------------------------------------------------------------------------
  - name: EnterRemediationCycle
    type: operation
    compensatedBy: RollbackRemediationPatch
    actions:
      - name: ApplyRemediationPatches
        functionRef:
          refName: remediateFindings
          arguments:
            author: "[layer_author_persona]"
            findings: "${ .unresolved_findings }"
            iteration: "${ .iteration }"
      - name: IncrementIterationCounter
        functionRef:
          refName: incrementCounter
          arguments:
            counter: "${ .iteration }"
    transition: VerifyRemediationPatch

  # -----------------------------------------------------------------------------
  # State 7: Verify Patch Integrity Before Re-Review
  # -----------------------------------------------------------------------------
  - name: VerifyRemediationPatch
    type: operation
    actions:
      - name: RunStructuralLinter
        functionRef:
          refName: validateStructuralIntegrity
          arguments:
            artifact_id: "${ .artifact_id }"
    transition: DispatchReviewCrew

  # -----------------------------------------------------------------------------
  # State 8: Saga Compensation Handler (Rollback Dirty Fixes)
  # -----------------------------------------------------------------------------
  - name: RollbackRemediationPatch
    type: operation
    actions:
      - name: RevertDirtyChanges
        functionRef:
          refName: revertPatches
          arguments:
            artifact_id: "${ .artifact_id }"
            iteration: "${ .iteration }"
    transition: EscalateToFounder

  # -----------------------------------------------------------------------------
  # Terminal State A: Artifact Approved (Clean Pass)
  # -----------------------------------------------------------------------------
  - name: ApproveArtifact
    type: operation
    actions:
      - name: SealReviewJournal
        functionRef:
          refName: sealJournalClosed
          arguments:
            status: "CLOSED"
    end: true

  # -----------------------------------------------------------------------------
  # Terminal State B: Escalation to Founder / Human Maintainer
  # -----------------------------------------------------------------------------
  - name: EscalateToFounder
    type: operation
    actions:
      - name: RecordEscalationJournal
        functionRef:
          refName: recordEscalation
          arguments:
            status: "ESCALATED"
    end:
      terminate: true

  # -----------------------------------------------------------------------------
  # Terminal State C: Partial Timeout Soft-Deadline Checkpoint
  # -----------------------------------------------------------------------------
  - name: EmitPartialTimeoutCheckpoint
    type: operation
    actions:
      - name: PersistPartialCheckpoint
        functionRef:
          refName: persistCheckpointJournal
          arguments:
            status: "PARTIAL_TIMEOUT"
    end: true
