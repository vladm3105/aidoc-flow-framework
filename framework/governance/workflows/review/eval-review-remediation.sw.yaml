# =============================================================================
#  REV-10-EVAL: Evaluation & Verification Review & Remediation Workflow
# =============================================================================
#  Standard: CNCF Serverless Workflow DSL v0.8 (YAML)
#  Authority: framework/governance/REVIEW_WORKFLOW_STANDARD.md
#  Governs: Layer 10 (EVAL) Review Saga per REVIEW_CREWS.yaml & 10_IPVERIFY
# =============================================================================

id: eval-review-remediation-flow
name: EVAL Review and Remediation Quality Loop
version: "1.0.0"
specVersion: "0.8"
description: >-
  Layer 10 (EVAL) review remediation saga orchestrating evaluation verification
  lenses (evaluator, validator, verifier, report_generator, auditor), deterministic
  gate floor evaluation, and author remediation.

metadata:
  framework_version: "0.96.4"
  governed_layer: "10_EVAL"
  workflow_type: "governance-review-saga"
  flow_code: "REV-10-EVAL"

start: PrepareReviewCrew

states:
  # -----------------------------------------------------------------------------
  # State 1: Prepare Review Run Context
  # -----------------------------------------------------------------------------
  - name: PrepareReviewCrew
    type: inject
    data:
      status: "PREPARED"
      iteration: 1
      max_iterations: 3
      topological_pass: false
      structural_pass: false
      soft_deadline_seconds: 600
      layer: "10_EVAL"
      author: "qa_lead"
    transition: DispatchReviewCrew

  # -----------------------------------------------------------------------------
  # State 2: Multi-Persona Lens Fan-Out (10_IPVERIFY & Layer 10 Verification)
  # -----------------------------------------------------------------------------
  - name: DispatchReviewCrew
    type: parallel
    completionType: allOf
    branches:
      - name: EvaluatorLensBranch
        actions:
          - name: ExecuteEvaluatorLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "evaluator"
                weight: 35
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/10_IPVERIFY/evaluator.md"
      - name: ValidatorLensBranch
        actions:
          - name: ExecuteValidatorLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "validator"
                weight: 25
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/10_IPVERIFY/validator.md"
      - name: VerifierLensBranch
        actions:
          - name: ExecuteVerifierLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "verifier"
                weight: 20
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/10_IPVERIFY/verifier.md"
      - name: ReportGeneratorLensBranch
        actions:
          - name: ExecuteReportGeneratorLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "report_generator"
                weight: 10
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/10_IPVERIFY/report_generator.md"
      - name: AuditorLensBranch
        actions:
          - name: ExecuteAuditorLens
            functionRef:
              refName: evaluateLensPlaybook
              arguments:
                persona: "auditor"
                weight: 10
                artifact_id: "${ .artifact_id }"
                playbook_ref: "framework/playbooks/08_IPLAN/auditor.md"
    transition: CheckBreakCircuit

  # -----------------------------------------------------------------------------
  # State 3: Wall-Clock Break-Circuit Checkpoint
  # -----------------------------------------------------------------------------
  - name: CheckBreakCircuit
    type: switch
    dataConditions:
      - name: TimeoutExceeded
        condition: "${ .elapsed_seconds >= .soft_deadline_seconds }"
        transition: EmitPartialTimeoutCheckpoint
    defaultCondition:
      transition: SynthesizeFindingsAndScore

  # -----------------------------------------------------------------------------
  # State 4: Synthesize Findings & Compute Score
  # -----------------------------------------------------------------------------
  - name: SynthesizeFindingsAndScore
    type: operation
    actions:
      - name: ReduceCrewFindings
        functionRef:
          refName: reduceFindingsAndCalculateScore
          arguments:
            branches: "${ .branches }"
            artifact_id: "${ .artifact_id }"
            layer: "10_EVAL"
    transition: EvaluateQualityGate

  # -----------------------------------------------------------------------------
  # State 5: Evaluate Quality Gate Floor
  # -----------------------------------------------------------------------------
  - name: EvaluateQualityGate
    type: switch
    dataConditions:
      - name: GatePassed
        condition: "${ .structural_pass == true and .blocking_findings == 0 }"
        transition: ApproveArtifact
      - name: IterationCapReached
        condition: "${ .iteration >= .max_iterations }"
        transition: EscalateToFounder
    defaultCondition:
      transition: EnterRemediationCycle

  # -----------------------------------------------------------------------------
  # State 6: Remediation by Author (qa_lead)
  # -----------------------------------------------------------------------------
  - name: EnterRemediationCycle
    type: operation
    compensatedBy: RollbackRemediationPatch
    actions:
      - name: ApplyRemediationPatches
        functionRef:
          refName: remediateFindings
          arguments:
            author: "qa_lead"
            findings: "${ .unresolved_findings }"
            iteration: "${ .iteration }"
      - name: IncrementIterationCounter
        functionRef:
          refName: incrementCounter
          arguments:
            counter: "${ .iteration }"
    transition: VerifyRemediationPatch

  # -----------------------------------------------------------------------------
  # State 7: Verify Patch Structural Integrity
  # -----------------------------------------------------------------------------
  - name: VerifyRemediationPatch
    type: operation
    actions:
      - name: RunStructuralLinter
        functionRef:
          refName: validateStructuralIntegrity
          arguments:
            artifact_id: "${ .artifact_id }"
    transition: DispatchReviewCrew

  # -----------------------------------------------------------------------------
  # State 8: Saga Compensation Handler
  # -----------------------------------------------------------------------------
  - name: RollbackRemediationPatch
    type: operation
    actions:
      - name: RevertDirtyChanges
        functionRef:
          refName: revertPatches
          arguments:
            artifact_id: "${ .artifact_id }"
            iteration: "${ .iteration }"
    transition: EscalateToFounder

  # -----------------------------------------------------------------------------
  # Terminal States
  # -----------------------------------------------------------------------------
  - name: ApproveArtifact
    type: operation
    actions:
      - name: SealReviewJournal
        functionRef:
          refName: sealJournalClosed
          arguments:
            status: "CLOSED"
    end: true

  - name: EscalateToFounder
    type: operation
    actions:
      - name: RecordEscalationJournal
        functionRef:
          refName: recordEscalation
          arguments:
            status: "ESCALATED"
    end:
      terminate: true

  - name: EmitPartialTimeoutCheckpoint
    type: operation
    actions:
      - name: PersistPartialCheckpoint
        functionRef:
          refName: persistCheckpointJournal
          arguments:
            status: "PARTIAL_TIMEOUT"
    end: true
