# =============================================================================
#  eval-verification-run.sw.yaml — CNCF Serverless Workflow State Machine
# =============================================================================
#  Standard: CNCF Serverless Workflow Specification v0.8 (YAML)
#  Authority: framework/governance/GOVERNANCE_WORKFLOW_STANDARD.md
#  Domain: Evaluation Execution & Quality Verification Lifecycle (Layer 10)
# =============================================================================

id: eval-verification-run
name: Evaluation and Verification Runner State Machine
version: "1.0.0"
specVersion: "0.8"
description: >-
  Declarative Directed Acyclic Graph (DAG) state machine orchestrating multi-tier
  test suite execution (unit, acceptance, conformance, security SAST), automated
  quality gate evaluation, static EVAL-REPORT receipt generation, and remediation loops.

metadata:
  framework_version: "0.96.5"
  workflow_type: "governance-evaluation-execution"
  governed_layer: "10_EVAL"
  traceability_tags:
    - "@layer: 10_EVAL"
    - "@gate: GATE-08"
    - "@standard: CNCF-Serverless-Workflow-0.8"

start: IngestEvaluationTrigger

events:
  - name: EvalVerificationClosedEvent
    type: org.aidoc.sdd.layer10.eval.closed
    source: /layers/10_eval

functions:
  - name: invokeReviewSaga
    type: custom
    operation: "urn:aidoc:workflows:review-saga#invoke"
  - name: remediateLayerFindings
    type: custom
    operation: "urn:aidoc:functions:remediator#remediate"
  - name: verifyLayerBoundaryGate
    type: custom
    operation: "urn:aidoc:governance:gate#verify"
  - name: sealDocumentBaseline
    type: custom
    operation: "urn:aidoc:governance:document#seal"
  - name: registerGraphBaselineNode
    type: custom
    operation: "urn:aidoc:governance:graph#registerNode"
  - name: emitCloudEvent
    type: custom
    operation: "urn:aidoc:governance:event#emit"

states:
  # ---------------------------------------------------------------------------
  # State 1: Ingest Evaluation Trigger & Load Strategy
  # ---------------------------------------------------------------------------
  - name: IngestEvaluationTrigger
    type: operation
    actions:
      - name: ValidateTriggerContext
        functionRef:
          refName: validateTriggerFn
          arguments:
            trigger_types:
              - initial_eval
              - bug_fix_verification
              - chg_verification
              - scheduled
              - pre_deploy
      - name: LoadEvaluationStrategy
        functionRef:
          refName: loadEvalStrategyFn
          arguments:
            eval_strategy_path: "docs/sdd/10_EVAL/EVAL-{NN}/EVAL-{NN}.yaml"
            threshold_min_score: 90
    transition: ExecuteParallelTestSuites

  # ---------------------------------------------------------------------------
  # State 2: Parallel Test Suite Execution (All-Of)
  # ---------------------------------------------------------------------------
  - name: ExecuteParallelTestSuites
    type: parallel
    completionType: allOf
    branches:
      - name: UnitSuiteBranch
        actions:
          - name: RunUnitTests
            functionRef:
              refName: runCommandFn
              arguments:
                command: "python3 -m unittest discover -s tests/unit"
                suite: "unit"
      - name: AcceptanceSuiteBranch
        actions:
          - name: RunAcceptanceTests
            functionRef:
              refName: runCommandFn
              arguments:
                command: "pytest tests/acceptance/"
                suite: "acceptance"
      - name: ConformanceSuiteBranch
        actions:
          - name: RunConformanceTests
            functionRef:
              refName: runCommandFn
              arguments:
                command: "pytest tests/conformance/"
                suite: "conformance"
      - name: SecurityAuditBranch
        actions:
          - name: RunSecurityScan
            functionRef:
              refName: runCommandFn
              arguments:
                command: "bandit -r framework/ sdd_doc_lint/"
                suite: "security-sast"
    transition: EvaluateQualityGates

  # ---------------------------------------------------------------------------
  # State 3: Evaluate Scorecard and Quality Gates
  # ---------------------------------------------------------------------------
  - name: EvaluateQualityGates
    type: operation
    actions:
      - name: CalculateScorecardMetrics
        functionRef:
          refName: computeScorecardFn
          arguments:
            coverage_weight: 0.40
            traceability_weight: 0.25
            threshold_weight: 0.20
            readiness_weight: 0.15
    transition: CheckQualityGateDecision

  # ---------------------------------------------------------------------------
  # State 4: Decision Switch (Pass vs Fail)
  # ---------------------------------------------------------------------------
  - name: CheckQualityGateDecision
    type: switch
    dataConditions:
      - name: EvaluationPassed
        condition: "${ .gate_passed == true and .blocker_count == 0 and .critical_count == 0 }"
        transition: InvokeReviewSagaGate
      - name: EvaluationFailed
        condition: "${ .gate_passed == false or .blocker_count > 0 or .critical_count > 0 }"
        transition: HandleEvaluationFailure
    defaultCondition:
      transition: HandleEvaluationFailure

  - name: InvokeReviewSagaGate
    type: operation
    actions:
      - name: runLayerReviewSagaAction
        functionRef:
          refName: invokeReviewSaga
          arguments:
            workflowId: "eval-review-remediation-flow"
            artifactId: "${ .eval_id }"
    transition: EvaluateReviewSagaResult

  - name: EvaluateReviewSagaResult
    type: switch
    dataConditions:
      - name: ReviewGateApproved
        condition: "${ .review_score >= 90 and .blocking_findings == 0 and .gate_passed == true }"
        transition: EmitPassingReportReceipt
      - name: ReviewRequiresRemediation
        condition: "${ .blocking_findings > 0 and .iteration < 3 }"
        transition: RemediateLayerDraft
      - name: ReviewRequiresDefectHandling
        condition: "${ .blocking_findings > 0 or .iteration >= 3 }"
        transition: HandleEvaluationFailure
    defaultCondition:
      transition: HandleEvaluationFailure

  - name: RemediateLayerDraft
    type: operation
    actionMode: sequential
    actions:
      - name: applyRemediationFixes
        functionRef:
          refName: remediateLayerFindings
          arguments:
            author: "eval_lead"
            findings: "${ .unresolved_findings }"
            iteration: "${ .iteration }"
    transition: InvokeReviewSagaGate

  # ---------------------------------------------------------------------------
  # State 5: Terminal Success Path (Emit Report & Mark Verified)
  # ---------------------------------------------------------------------------
  - name: EmitPassingReportReceipt
    type: operation
    actions:
      - name: WriteReportReceipt
        functionRef:
          refName: writeReportReceiptFn
          arguments:
            verdict: "PASS"
            report_template: "framework/layers/10_EVAL/EVAL-REPORT-TEMPLATE.yaml"
            output_path: "docs/sdd/10_EVAL/EVAL-{NN}/reports/EVAL-{NN}-RPT-{NNN}.yaml"
      - name: UpdateIplanStatusVerified
        functionRef:
          refName: updateDocumentStatusFn
          arguments:
            target_document: "IPLAN-{NN}"
            new_status: "Verified"
    transition: VerifyLayerCloseoutGate

  - name: VerifyLayerCloseoutGate
    type: operation
    actionMode: sequential
    actions:
      - name: runLayerGateChecklist
        functionRef:
          refName: verifyLayerBoundaryGate
          arguments:
            gateId: "GATE-CODE"
            layer: "10_EVAL"
            documentId: "${ .eval_id }"
    transition: SealLayerDocumentBaseline

  - name: SealLayerDocumentBaseline
    type: operation
    actionMode: sequential
    actions:
      - name: sealFrontmatterStatus
        functionRef:
          refName: sealDocumentBaseline
          arguments:
            documentId: "${ .eval_id }"
            layer: "10_EVAL"
            targetStatus: "Baselined"
            checksumAlgorithm: "SHA-256"
    transition: RegisterSddGraphBaselineNode

  - name: RegisterSddGraphBaselineNode
    type: operation
    actionMode: sequential
    actions:
      - name: updateGraphNode
        functionRef:
          refName: registerGraphBaselineNode
          arguments:
            nodeType: "EvalNode"
            nodeId: "${ .eval_id }"
            status: "Baselined"
            lockIncomingEdges: true
    transition: EmitLayerHandoffEvent

  - name: EmitLayerHandoffEvent
    type: operation
    actionMode: sequential
    actions:
      - name: publishCompletionEvent
        functionRef:
          refName: emitCloudEvent
          arguments:
            event: "EvalVerificationClosedEvent"
            eval_id: "${ .eval_id }"
            receipt_path: "docs/sdd/10_EVAL/EVAL-{NN}/reports/EVAL-{NN}-RPT-{NNN}.yaml"
            verdict: "PASS"
    produceEvents:
      - eventRef: EvalVerificationClosedEvent
    end: true

  # ---------------------------------------------------------------------------
  # State 6: Evaluation Failure Handling
  # ---------------------------------------------------------------------------
  - name: HandleEvaluationFailure
    type: operation
    actions:
      - name: WriteFailingReportReceipt
        functionRef:
          refName: writeReportReceiptFn
          arguments:
            verdict: "FAIL"
            report_template: "framework/layers/10_EVAL/EVAL-REPORT-TEMPLATE.yaml"
            output_path: "docs/sdd/10_EVAL/EVAL-{NN}/reports/EVAL-{NN}-RPT-{NNN}.yaml"
      - name: LogDefectFindings
        functionRef:
          refName: logFindingsFn
          arguments:
            track_findings: true
            finding_prefix: "F-"
    transition: TriggerRemediationLoop

  # ---------------------------------------------------------------------------
  # State 7: Terminal Failure / Remediation Dispatch Sink
  # ---------------------------------------------------------------------------
  - name: TriggerRemediationLoop
    type: operation
    actions:
      - name: DispatchBugfixVehicle
        functionRef:
          refName: dispatchBugfixFn
          arguments:
            flow: "REVIEW_REMEDIATION_FLOW.md"
            action: "Create C1 CHG + scoped IPLAN"
    end: true
