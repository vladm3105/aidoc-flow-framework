# =============================================================================
#  CNCF Serverless Workflow: Layer 07 (TDD) Automated Test Execution Suite
#  Spec Version: 0.8 (YAML)
#  Standard: framework/layers/07_TDD/TDD_WORKFLOW_STANDARD.md
# =============================================================================

id: tdd-test-execution
name: "Layer 07 TDD Automated Test Execution & Fixture Rollback Saga"
version: "1.0"
specVersion: "0.8"
description: >-
  Orchestrates the execution of multi-tier TDD test suites (unit, integration,
  contract, mutation) with hermetic test fixture provisioning, deterministic
  teardown compensation, automated retry policies for flaky test isolation,
  quality threshold evaluation, and test receipt emission.

start: ProvisionTestFixtures

events:
  - name: TddSuitesClosedEvent
    type: org.aidoc.sdd.layer07.tdd.closed
    source: /layers/07_tdd

functions:
  - name: invokeReviewSaga
    type: custom
    operation: "urn:aidoc:workflows:review-saga#invoke"
  - name: remediateLayerFindings
    type: custom
    operation: "urn:aidoc:functions:remediator#remediate"
  - name: verifyLayerBoundaryGate
    type: custom
    operation: "urn:aidoc:governance:gate#verify"
  - name: sealDocumentBaseline
    type: custom
    operation: "urn:aidoc:governance:document#seal"
  - name: registerGraphBaselineNode
    type: custom
    operation: "urn:aidoc:governance:graph#registerNode"
  - name: emitCloudEvent
    type: custom
    operation: "urn:aidoc:governance:event#emit"

states:
  # ---------------------------------------------------------------------------
  # State 1: Fixture Setup (Compensable)
  # ---------------------------------------------------------------------------
  - name: ProvisionTestFixtures
    type: operation
    description: "Allocates isolated test containers, databases, and mock dependencies"
    compensatedBy: TeardownTestFixtures
    actions:
      - name: provisionTestEnvironment
        functionRef:
          refName: testEnvProvisioner
          arguments:
            targetComponent: "${ .component }"
            isolationLevel: "hermetic"
            mockExternalServices: true
    transition: InitializeTestRun

  # ---------------------------------------------------------------------------
  # Compensation State: Teardown Fixtures
  # ---------------------------------------------------------------------------
  - name: TeardownTestFixtures
    type: operation
    description: "Cleans up allocated test resources, containers, and temporary fixtures"
    actions:
      - name: cleanupTestEnvironment
        functionRef:
          refName: testEnvCleaner
          arguments:
            targetComponent: "${ .component }"
            forceCleanup: true
    end: true

  # ---------------------------------------------------------------------------
  # State 2: Initialize Run Metrics
  # ---------------------------------------------------------------------------
  - name: InitializeTestRun
    type: inject
    description: "Initializes execution counters and threshold targets"
    data:
      retry_count: 0
      max_retries: 3
      results:
        unit: { passed: 0, failed: 0, total: 0 }
        integration: { passed: 0, failed: 0, total: 0 }
        contract: { passed: 0, failed: 0, total: 0 }
        mutation: { passed: 0, failed: 0, total: 0 }
        flaky_detected: false
        total_failed: 0
    transition: DispatchTestMatrix

  # ---------------------------------------------------------------------------
  # State 3: Parallel Execution Across Test Tiers
  # ---------------------------------------------------------------------------
  - name: DispatchTestMatrix
    type: parallel
    description: "Executes test tiers concurrently across isolated test runners"
    completionType: allOf
    branches:
      - name: UnitTestsBranch
        actions:
          - name: runUnitTests
            functionRef:
              refName: unitTestRunner
              arguments:
                suite: "unit"
                failFast: false

      - name: IntegrationTestsBranch
        actions:
          - name: runIntegrationTests
            functionRef:
              refName: integrationTestRunner
              arguments:
                suite: "integration"
                fixtureEnv: "${ .component }"

      - name: ContractTestsBranch
        actions:
          - name: runContractTests
            functionRef:
              refName: contractTestRunner
              arguments:
                suite: "contract"
                specRef: "${ .spec_ref }"

      - name: MutationTestsBranch
        actions:
          - name: runMutationTests
            functionRef:
              refName: mutationTestRunner
              arguments:
                suite: "mutation"
                targetThreshold: "${ .thresholds.mutation_score }"
    transition: AggregateTestResults

  # ---------------------------------------------------------------------------
  # State 4: Scorecard Aggregation & Metrics Assessment
  # ---------------------------------------------------------------------------
  - name: AggregateTestResults
    type: operation
    description: "Aggregates test outcomes, calculates coverage, and identifies flaky tests"
    actions:
      - name: computeTestMetrics
        functionRef:
          refName: testMetricsAggregator
          arguments:
            unitResults: "${ .unitResults }"
            integrationResults: "${ .integrationResults }"
            contractResults: "${ .contractResults }"
            mutationResults: "${ .mutationResults }"
    transition: EvaluateQualityGate

  # ---------------------------------------------------------------------------
  # State 5: Quality Gate Evaluation
  # ---------------------------------------------------------------------------
  - name: EvaluateQualityGate
    type: switch
    description: "Evaluates test pass rates, coverage thresholds, and flaky test conditions"
    dataConditions:
      - name: AllTestsPassed
        condition: "${ .results.total_failed == 0 and .results.coverage >= .thresholds.coverage_target and .results.mutation_score >= .thresholds.mutation_score }"
        transition: EmitTestReport

      - name: FlakyTestDetectedWithinRetryBudget
        condition: "${ .results.flaky_detected == true and .retry_count < .max_retries }"
        transition: ApplyFlakyRetryBackoff

    defaultCondition:
      transition: QuarantineAndCompensate

  # ---------------------------------------------------------------------------
  # State 6: Flaky Test Retry Backoff
  # ---------------------------------------------------------------------------
  - name: ApplyFlakyRetryBackoff
    type: operation
    description: "Increments retry count and applies jittered backoff before re-executing flaky tests"
    actions:
      - name: executeRetryBackoff
        functionRef:
          refName: retryHandler
          arguments:
            currentAttempt: "${ .retry_count }"
            backoffStrategy: "exponential-jitter"
    transition: DispatchTestMatrix

  # ---------------------------------------------------------------------------
  # State 7: Failure Quarantine & Saga Rollback
  # ---------------------------------------------------------------------------
  - name: QuarantineAndCompensate
    type: operation
    description: "Logs defect findings, quarantines broken tests, and triggers fixture compensation"
    actions:
      - name: logTestDefects
        functionRef:
          refName: defectLogger
          arguments:
            failureSummary: "${ .results }"
            component: "${ .component }"
            quarantineTag: "quarantine-flaky"
    transition: TestExecutionFailed

  # ---------------------------------------------------------------------------
  # State 8: Emit Test Receipt
  # ---------------------------------------------------------------------------
  - name: EmitTestReport
    type: operation
    description: "Emits immutable test execution receipt compliant with Layer 10 EVAL standards"
    actions:
      - name: generateTestReceipt
        functionRef:
          refName: receiptEmitter
          arguments:
            scorecard: "${ .results }"
            status: "PASSED"
    transition: ExecuteFixtureTeardown

  # ---------------------------------------------------------------------------
  # State 9: Normal Cleanup
  # ---------------------------------------------------------------------------
  - name: ExecuteFixtureTeardown
    type: operation
    description: "Executes normal fixture teardown upon successful test completion"
    actions:
      - name: cleanFixtures
        functionRef:
          refName: testEnvCleaner
          arguments:
            targetComponent: "${ .component }"
    transition: InvokeReviewSagaGate

  # ---------------------------------------------------------------------------
  # State: Invoke Review Saga Gate
  # ---------------------------------------------------------------------------
  - name: InvokeReviewSagaGate
    type: operation
    actions:
      - name: runLayerReviewSagaAction
        functionRef:
          refName: invokeReviewSaga
          arguments:
            workflowId: "tdd-review-remediation-flow"
            artifactId: "${ .component }"
    transition: EvaluateReviewSagaResult

  # ---------------------------------------------------------------------------
  # State: Evaluate Review Saga Result
  # ---------------------------------------------------------------------------
  - name: EvaluateReviewSagaResult
    type: switch
    dataConditions:
      - name: ReviewGateApproved
        condition: "${ .blocking_findings == 0 and .gate_passed == true }"
        transition: TestExecutionSuccess
      - name: ReviewRequiresRemediation
        condition: "${ .blocking_findings > 0 and .iteration < 3 }"
        transition: RemediateLayerDraft
      - name: ReviewRequiresQuarantine
        condition: "${ .blocking_findings > 0 or .iteration >= 3 }"
        transition: QuarantineAndCompensate
    defaultCondition:
      transition: QuarantineAndCompensate

  - name: RemediateLayerDraft
    type: operation
    actionMode: sequential
    actions:
      - name: applyRemediationFixes
        functionRef:
          refName: remediateLayerFindings
          arguments:
            author: "test_engineer"
            findings: "${ .unresolved_findings }"
            iteration: "${ .iteration }"
    transition: InvokeReviewSagaGate

  # ---------------------------------------------------------------------------
  # Terminal States
  # ---------------------------------------------------------------------------
  - name: TestExecutionSuccess
    type: inject
    description: "Terminal success state: all test tiers passed and quality gates satisfied"
    data:
      status: "COMPLETED"
      verdict: "PASSED"
    transition: VerifyLayerCloseoutGate

  - name: VerifyLayerCloseoutGate
    type: operation
    actionMode: sequential
    actions:
      - name: runLayerGateChecklist
        functionRef:
          refName: verifyLayerBoundaryGate
          arguments:
            gateId: "GATE-06"
            layer: "07_TDD"
            documentId: "${ .component }"
    transition: SealLayerDocumentBaseline

  - name: SealLayerDocumentBaseline
    type: operation
    actionMode: sequential
    actions:
      - name: sealFrontmatterStatus
        functionRef:
          refName: sealDocumentBaseline
          arguments:
            documentId: "${ .component }"
            layer: "07_TDD"
            targetStatus: "Baselined"
            checksumAlgorithm: "SHA-256"
    transition: RegisterSddGraphBaselineNode

  - name: RegisterSddGraphBaselineNode
    type: operation
    actionMode: sequential
    actions:
      - name: updateGraphNode
        functionRef:
          refName: registerGraphBaselineNode
          arguments:
            nodeType: "TddNode"
            nodeId: "${ .component }"
            status: "Baselined"
            lockIncomingEdges: true
    transition: EmitLayerHandoffEvent

  - name: EmitLayerHandoffEvent
    type: operation
    actionMode: sequential
    actions:
      - name: publishCompletionEvent
        functionRef:
          refName: emitCloudEvent
          arguments:
            event: "TddSuitesClosedEvent"
            documentId: "${ .component }"
            test_suites: "${ .test_suites }"
            coverage_target: "${ .coverage_target }"
    produceEvents:
      - eventRef: TddSuitesClosedEvent
    end: true

  - name: TestExecutionFailed
    type: inject
    description: "Terminal failure state: test failure or unmet quality threshold after retries"
    data:
      status: "FAILED"
      verdict: "DEFECT_QUARANTINED"
    end:
      terminate: true
