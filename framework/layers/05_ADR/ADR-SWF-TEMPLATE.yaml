# =============================================================================
#  ADR-SWF-TEMPLATE.yaml — Architecture Decision Record Workflow (SDD)
# =============================================================================
#  Document Authority: PRIMARY STANDARD (Hybrid Envelope Architecture)
#  Purpose: Machine-executable CNCF Serverless Workflow state machine embedded
#           within a structurally conformant Layer 05 ADR envelope.
#  Lifecycle: MVP → PROD → NEW MVP
#
#  Convention:
#    _guidance     — authoring instructions, ignored by validators
#    _antipatterns — common mistakes to avoid
#    _note         — contextual clarification
#    _example      — sample values for reference
#  Downstream: SPEC (Layer 6)
#  Upstream: EARS (L3), BDD (L4)
#
#  TWO-GRAPH ARCHITECTURE (Process DAG vs. Content Graph):
#  Layer 05 artifact generation operates via two complementary graph models:
#    1. Process DAG (Control Plane) — This template (ADR-SWF-TEMPLATE.yaml):
#       Defines the execution flow of HOW to evaluate, score, and ratify decisions.
#       Orchestrates candidate evaluation fan-out, MCDA scoring, RFC callbacks,
#       and rejection archival compensation.
#    2. Content Graph (Data Plane) — SDD-GRAPH v2.0 (ADR-GRAPH-TEMPLATE.yaml):
#       Defines WHAT content, entities, properties, and relationships must be presented
#       in the document (candidate options, decision topics, evaluation criteria, trade-offs).
#    Both graphs work together to generate a document: the Process DAG drives evaluation
#    and validation, populates the Content Graph, executes BTV verification, and projects
#    the validated specification into the human-readable document (ADR-TEMPLATE.yaml view).
#
#  TEMPLATE SELECTION GUIDE:
#  Use the Two-Graph approach (ADR-SWF-TEMPLATE.yaml + ADR-GRAPH-TEMPLATE.yaml) when:
#    - Modeling multi-candidate architectural trade-off analysis with concurrent evaluation fan-out
#    - Orchestrating automated Multi-Criteria Decision Analysis (MCDA) utility scoring and consensus switch gates
#    - Incorporating stakeholder RFC review callbacks, external feedback events, or timeouts
#    - Requiring automated compensation (archiving rejected proposals and cleaning evaluation contexts)
#    - Targeting autonomous AI agent execution or workflow orchestrators (LangGraph/Temporal)
#  Use the companion template (ADR-TEMPLATE.yaml — COMPANION STANDARD) directly when:
#    - Documenting straightforward, single-candidate architectural decisions, direct technology binds, or localized choices
#    - State machine orchestration, asynchronous callbacks, and automated compensations are not needed
# =============================================================================

id: ADR-NN
doc_id: ADR-NN
title: "[Architecture Decision Title - CNCF Workflow Model]"

# =============================================================================
# Template Metadata (not a content section — template configuration only)
# =============================================================================

metadata:
  schema_version: "1.0"
  framework_version: "[X.Y.Z]"  # framework/VERSION at document creation; see §Version Bumping
  document_type: "adr-document"
  layer: 5
  subtype: "workflow"
  workflow_spec: "CNCF-Serverless-Workflow-v0.8"
  author_persona: "architect"
  author_playbook: "framework/playbooks/05_ADR/architect.md"
  workflow_engine: "cncf-serverless-workflow"
  lifecycle: mvp-prod-newmvp
  total_sections: 10
  last_updated: "2026-10-05"
  validation:
    _guidance: |
      Validation is performed by the platform's conformance tooling and sdd_doc_lint.
      SPEC-Ready: BTV PASS is the deterministic quality gate.
  c4_level:
    value: none
  diagram_standard:
    _guidance: |
      ADR uses architecture decision diagrams and embedded CNCF workflow state machines:
        - REQUIRED: a decision/interaction `sequenceDiagram` with `@diagram: sequence-*` tag.
        - REQUIRED: an embedded CNCF Serverless Workflow state machine under `architecture_flow.decision_workflow`.
  tags:
    - adr-document
    - layer-5-artifact
    - shared-architecture
    - cncf-workflow
  deliverable_type:
    value: code
  id_standard:
    state: canonical
    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  _size_target: 100
  _guidance: |
    ADR uses a distinct status lifecycle:
      Proposed → Accepted → Deprecated → Superseded
  status: Proposed
  date: "YYYY-MM-DD"
  decision_makers:
    - "[Architect Name]"
    - "[Tech Lead Name]"
  author: "[Author Name]"
  version: "1.0"
  spec_ready_status: "PASS"
  revision_history:
    - version: "1.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial ADR workflow proposal"

# =============================================================================
# Section 2: Context
# =============================================================================

context:
  _size_target: 300
  problem_statement: |
    [What architectural problem or opportunity requires a decision?
    Reference the originating BRD topic and PRD elaboration.]
  business_driver: |
    [Why does the business need this decision? Link to BRD objectives.]
  key_constraints:
    - "[Constraint 1 — budget, latency budget, scalability targets]"
    - "[Constraint 2 — regulatory, compliance, operational isolation]"
  technical_context: |
    [Current system state, existing architecture, integration requirements.
    Reference EARS timing constraints and BDD failure scenarios that
    inform this decision.]

# =============================================================================
# Section 3: Decision
# =============================================================================

decision:
  _size_target: 300
  chosen_solution:
    id: "ADR.NN.03.xxxx"
    title: "[Chosen Solution Name]"
    description: |
      [Clear description of the selected approach and why it was chosen
      over alternatives via the multi-criteria evaluation workflow.]
  key_components:
    - name: "[Component 1]"
      role: "[What it does in the architecture]"
    - name: "[Component 2]"
      role: "[What it does]"
  implementation_approach:
    mvp_scope: |
      [What is implemented in the current MVP cycle]
    next_cycle_scope: |
      [What is deferred to the next cycle]

# =============================================================================
# Section 4: Alternatives Considered
# =============================================================================

alternatives:
  _size_target: 200
  _guidance: |
    Evaluate 2-3 candidate alternatives drawn from the approved platform stack (vladm3105/technology-stack)
    per TECHNOLOGY_STACK_USAGE_GUIDE.md. If a candidate is outside the approved stack, an architectural
    variance must be documented and submitted to the review crew.
  considered:
    - id: "ADR.NN.04.xxxx"
      name: "[Option A: Approved Platform Stack (e.g. PostgreSQL 18 with xp.ledger)]"
      selected: true
      source: "@seed: ARCH-NN"
      decision: "Selected — [highest MCDA utility score and full platform stack alignment]"
    - id: "ADR.NN.04.xxxx"
      name: "[Alternative B: Alternative Approved Platform Component (e.g. ClickHouse OLAP)]"
      selected: false
      source: "@seed: ARCH-NN"
      decision: "Rejected — [failed transactional consistency threshold]"
    - id: "ADR.NN.04.xxxx"
      name: "[Alternative C: Architectural Variance (if applicable)]"
      selected: false
      source: "@seed: ARCH-NN"
      decision: "Rejected — [operational overhead exceeds benefit; standard stack sufficient]"

# =============================================================================
# Section 5: Consequences
# =============================================================================

consequences:
  _size_target: 300
  positive_outcomes:
    - id: "ADR.NN.05.xxxx"
      outcome: "[Positive outcome 1 — satisfies 99.9th percentile SLA]"
    - id: "ADR.NN.05.xxxx"
      outcome: "[Positive outcome 2 — zero-lock-in modularity]"
  tradeoffs_and_risks:
    - id: "ADR.NN.05.xxxx"
      tradeoff: "[Trade-off or operational overhead]"
      impact: Medium
      mitigation: "[Automated canary rollout and metrics alerts]"
  cost_estimate:
    mvp_cost: "$[X,XXX]"
    ongoing_monthly: "$[X,XXX]/month"
    notes: "[Infrastructure and maintenance projections]"

# =============================================================================
# Section 6: Architecture Flow (Embedded CNCF Serverless Workflow DSL)
# =============================================================================

architecture_flow:
  _size_target: 200
  decision_sequence:
    intent:
      diagram_type: sequence
      scope_boundary: "[decision interaction boundary]"
      upstream_refs: "[BDD/PRD refs driving the decision]"
      downstream_refs: "[SPEC components affected]"
    tag: "@diagram: sequence-sync"
    diagram:
      type: sequenceDiagram
      content: |
        sequenceDiagram
            participant Evaluator as Decision Engine
            participant CandidateA as Candidate Option A
            participant CandidateB as Candidate Option B
            participant RFC as Stakeholder Crew
            Evaluator->>CandidateA: Evaluate Quality Attributes
            Evaluator->>CandidateB: Evaluate Quality Attributes
            Evaluator->>RFC: Request Review & Feedback
            RFC-->>Evaluator: Consensus Ratified

  # Embedded CNCF Serverless Workflow (v0.8 YAML)
  decision_workflow:
    id: adr-decision-analysis-workflow
    name: Architectural Decision Evaluation State Machine
    version: "1.0"
    specVersion: "0.8"
    description: >-
      CNCF Serverless Workflow orchestrating candidate evaluation, utility scoring,
      and stakeholder ratification callbacks for this ADR.
    start: IngestDecisionContext
    events:
      - name: StakeholderFeedbackEvent
        type: org.aidoc.sdd.adr.stakeholder_feedback
        source: /aidoc/governance/rfc
        kind: consumed
        correlation:
          - attribute: proposalId
      - name: AdrDecisionsClosedEvent
        type: org.aidoc.sdd.layer05.adr.closed
        source: /layers/05_adr
    functions:
      - name: invokeReviewSaga
        operation: "urn:aidoc:workflows:review-saga#invoke"
        type: custom
      - name: remediateLayerFindings
        operation: "urn:aidoc:functions:remediator#remediate"
        type: custom
      - name: verifyLayerBoundaryGate
        operation: "urn:aidoc:governance:gate#verify"
        type: custom
      - name: sealDocumentBaseline
        operation: "urn:aidoc:governance:document#seal"
        type: custom
      - name: registerGraphBaselineNode
        operation: "urn:aidoc:governance:graph#registerNode"
        type: custom
      - name: emitCloudEvent
        operation: "urn:aidoc:governance:event#emit"
        type: custom
    states:
      - name: IngestDecisionContext
        type: operation
        actions:
          - name: IngestConstraints
            functionRef:
              refName: aidoc:sdd:adr:ingestContext
              arguments:
                adr_id: "ADR-NN"
                quality_attributes: ["latency", "throughput", "cost", "security"]
                approved_stack_baseline: "vladm3105/technology-stack"
        transition: EvaluateCandidatesConcurrently

      - name: EvaluateCandidatesConcurrently
        type: parallel
        completionType: allOf
        branches:
          - name: EvaluateCandidateA
            actions:
              - name: ScoreOptionA
                functionRef:
                  refName: aidoc:sdd:adr:evaluateOption
                  arguments:
                    candidate_id: "OPT-A"
          - name: EvaluateCandidateB
            actions:
              - name: ScoreOptionB
                functionRef:
                  refName: aidoc:sdd:adr:evaluateOption
                  arguments:
                    candidate_id: "OPT-B"
        transition: ComputeUtilityScores

      - name: ComputeUtilityScores
        type: operation
        actions:
          - name: CalculateMCDAMatrix
            functionRef:
              refName: aidoc:sdd:adr:computeMCDA
              arguments:
                threshold_score: 80.0
        transition: EvaluateViabilitySwitch

      - name: EvaluateViabilitySwitch
        type: switch
        dataConditions:
          - name: ViableCandidateSelected
            condition: "${ .selected_candidate.utility_score >= 80.0 }"
            transition: SolicitStakeholderRFC
        defaultCondition:
          transition: RejectAndArchive

      - name: SolicitStakeholderRFC
        type: callback
        action:
          name: SolicitRFC
          functionRef:
            refName: aidoc:sdd:adr:publishRFC
            arguments:
              proposalId: "ADR-NN"
        eventRef: StakeholderFeedbackEvent
        timeouts:
          eventTimeout: "PT48H"
        transition: EvaluateRFCFeedback

      - name: EvaluateRFCFeedback
        type: switch
        dataConditions:
          - name: ConsensusApproved
            condition: "${ .feedback.status == \"APPROVED\" }"
            transition: InvokeReviewSagaGate
        defaultCondition:
          transition: RejectAndArchive

      - name: InvokeReviewSagaGate
        type: operation
        actions:
          - name: runLayerReviewSagaAction
            functionRef:
              refName: invokeReviewSaga
              arguments:
                workflowId: "adr-review-remediation-flow"
                artifactId: "ADR-NN"
        transition: EvaluateReviewSagaResult

      - name: EvaluateReviewSagaResult
        type: switch
        dataConditions:
          - name: ReviewGateApproved
            condition: "${ .blocking_findings == 0 and .gate_passed == true }"
            transition: RatifyDecision
          - name: ReviewRequiresRemediation
            condition: "${ .blocking_findings > 0 and .iteration < 3 }"
            transition: RemediateLayerDraft
          - name: ReviewRequiresRFC
            condition: "${ .requiresRFC == true or .iteration >= 3 }"
            transition: SolicitStakeholderRFC
        defaultCondition:
          transition: RejectAndArchive

      - name: RemediateLayerDraft
        type: operation
        actionMode: sequential
        actions:
          - name: applyRemediationFixes
            functionRef:
              refName: remediateLayerFindings
              arguments:
                author: "solutions_architect"
                findings: "${ .unresolved_findings }"
                iteration: "${ .iteration }"
        transition: InvokeReviewSagaGate

      - name: RatifyDecision
        type: operation
        actions:
          - name: SealDecision
            functionRef:
              refName: aidoc:sdd:adr:sealDecision
              arguments:
                adr_id: "ADR-NN"
                status: "Accepted"
        transition: VerifyLayerCloseoutGate

      - name: VerifyLayerCloseoutGate
        type: operation
        actionMode: sequential
        actions:
          - name: runLayerGateChecklist
            functionRef:
              refName: verifyLayerBoundaryGate
              arguments:
                gateId: "GATE-03"
                layer: "05_ADR"
                documentId: "ADR-NN"
        transition: SealLayerDocumentBaseline

      - name: SealLayerDocumentBaseline
        type: operation
        actionMode: sequential
        actions:
          - name: sealFrontmatterStatus
            functionRef:
              refName: sealDocumentBaseline
              arguments:
                documentId: "ADR-NN"
                layer: "05_ADR"
                targetStatus: "Baselined"
                checksumAlgorithm: "SHA-256"
        transition: RegisterSddGraphBaselineNode

      - name: RegisterSddGraphBaselineNode
        type: operation
        actionMode: sequential
        actions:
          - name: updateGraphNode
            functionRef:
              refName: registerGraphBaselineNode
              arguments:
                nodeType: "AdrNode"
                nodeId: "ADR-NN"
                status: "Baselined"
                lockIncomingEdges: true
        transition: EmitLayerHandoffEvent

      - name: EmitLayerHandoffEvent
        type: operation
        actionMode: sequential
        actions:
          - name: publishCompletionEvent
            functionRef:
              refName: emitCloudEvent
              arguments:
                event: "AdrDecisionsClosedEvent"
                documentId: "ADR-NN"
                decisions: "${ .decisions }"
                tech_registry: "${ .tech_registry }"
        produceEvents:
          - eventRef: AdrDecisionsClosedEvent
        end: true

      - name: RejectAndArchive
        type: operation
        compensatedBy: ArchiveRejection
        actions:
          - name: RecordRejection
            functionRef:
              refName: aidoc:sdd:adr:archiveProposal
              arguments:
                adr_id: "ADR-NN"
                status: "Rejected"
        end: true

      - name: ArchiveRejection
        type: operation
        usedForCompensation: true
        actions:
          - name: CleanupContext
            functionRef:
              refName: aidoc:sdd:adr:cleanupContext

  integration_points:
    - system: "[System/Service]"
      integration_type: "[REST | gRPC | Async | Event]"
      purpose: "[Data flow description]"

# =============================================================================
# Section 7: Implementation Assessment
# =============================================================================

implementation_assessment:
  _size_target: 300
  mvp_phases:
    - phase: "Phase 1 - Candidate Prototyping"
      scope: "Benchmark candidate options in test sandbox"
      risk: "Synthetic load may differ from production traffic"
  rollback_plan:
    strategy: "Revert component binding to predecessor architecture"
    trigger: "P99 latency > 200ms in staging canary"
    estimated_effort: "1 sprint"
  monitoring_baseline:
    - metric: "Service Latency P99"
      target: "< 50ms"
      alert_threshold: "> 100ms for 5m"

# =============================================================================
# Section 8: Verification
# =============================================================================

verification:
  _size_target: 200
  success_criteria:
    - criterion: "Selected architecture satisfies SLA under 2x peak load"
      measurement: "Load testing in staging environment"
  bdd_scenario_refs:
    scenarios:
      - "@bdd: BDD.NN.03.xxxx"
      - "@bdd: BDD.NN.03.yyyy"

# =============================================================================
# Section 9: Traceability
# =============================================================================

traceability:
  _size_target: 100
  tags:
    - "@adr: ADR-NN"
  upstream:
    bdd_references:
      - "@bdd: BDD.NN.03.xxxx"
    ears_references:
      - "@ears: EARS.NN.03.xxxx"
  downstream_expected:
    - type: SPEC
      layer: 6
      description: "Technical specification implementing this architecture decision"
  cross_links:
    depends:
      - "@depends: ADR-NN"
    discoverability:
      - "@discoverability: ADR-NN (workflow architecture decision)"
    chg:
      - "@chg: CHG-NN"
  health_score:
    spec_ready: "PASS"
    target_status: "PASS"

# =============================================================================
# Section 10: Related Decisions
# =============================================================================

related_decisions:
  _size_target: 100
  dependencies:
    - adr: "ADR-01"
      relationship: "Extends"
      rationale: "Inherits base infrastructure deployment profile"
  supersedes:
    items: []

# =============================================================================
# Glossary
# =============================================================================

glossary:
  _size_target: 100
  terms:
    - term: ADR
      definition: "Architecture Decision Record"
    - term: MCDA
      definition: "Multi-Criteria Decision Analysis"
    - term: SPEC-Ready
      definition: "Binary topological verification confirming 100% DAG completeness and downstream SPEC realization"

# =============================================================================
# Appendix: MVP Lifecycle
# =============================================================================

appendix:
  _size_target: 100
  lifecycle:
    _guidance: |
      Each ADR represents ONE architecture decision in the MVP → PROD → NEW MVP cycle.
      Workflow-subtype ADRs embed an executable CNCF Serverless Workflow state machine
      for automated candidate evaluation and decision verification.
