# =============================================================================
#  BRD-TEMPLATE.yaml — Business Requirements Document (SDD Layer 01)
# =============================================================================
#  Document Authority: COMPANION STANDARD (Static Declarative)
#  Purpose: AI-consumable + human-reviewable BRD template for linear business requirements
#  Lifecycle: MVP → PROD → NEW MVP
#
#  TEMPLATE SELECTION GUIDE:
#  Use this template (BRD-TEMPLATE.yaml — COMPANION STANDARD) when:
#    - Documenting single-capability business requirements, direct business processes, or focused enhancements
#    - Specifying straightforward, linear requirements where state machine orchestration is unnecessary overhead
#  Use the primary template (BRD-SWF-TEMPLATE.yaml — PRIMARY STANDARD) instead when:
#    - Modeling multi-stream value flows, cross-department handoffs, or customer journeys
#    - Orchestrating automated ROI feasibility evaluation and quantitative cost-benefit gates
#    - Incorporating executive steering committee callbacks, formal sign-off events, or timeouts
#
#  Reference Example:
#    A fully populated reference instance is available at:
#    framework/layers/01_BRD/examples/BRD-EXAMPLE.yaml
#
#  Downstream: PRD (Layer 2)
# =============================================================================

id: BRD-NN
doc_id: BRD-NN
title: "[Business Requirements Title]"

metadata:
  schema_version: "1.0"
  framework_version: "[X.Y.Z]"  # framework/VERSION at document creation; see §Version Bumping
  document_type: "brd-document"
  layer: 1
  lifecycle: mvp-prod-newmvp
  total_sections: 16
  last_updated: "2026-03-29"
  validation:
    _guidance: "Validation is performed by sdd_doc_lint. Gating is binary (PASS / FAIL) based on topological graph completeness."
  c4_level:
    _guidance: "BRD is Context level (C4-L1). Content describes business environment, actors, and boundaries."
    value: context
  diagram_standard:
    _guidance: "BRD uses C4-L1 system context, DFD-L1 data flow, or happy-path business journey diagrams."
    tags:
      - "@diagram: c4-l1"
      - "@diagram: dfd-l1"
  tags:
    - brd-document
    - layer-1-artifact
    - shared-architecture
  deliverable_type:
    _guidance: "Identifies deliverable category (code | document | ux | risk | process). Inherited downstream."
    value: code
  brd_type:
    _guidance: "platform (foundational tech stack, ADR decided early) | feature (business features, standard flow)"
    value: feature
  file_organization:
    _guidance: |
      Filename: BRD-NN_{slug}.yaml. Split into new document (BRD-02) when >5 FRs or >50,000 tokens.
      Link sibling documents in BRD-00 index; use @depends: only for hard prerequisites.
      Index: Maintain BRD-00_index.md as the authoritative source of planned/active BRDs.
  id_standard:
    state: canonical  # provisional | canonical (PROVISIONAL-IDS-001)
    _guidance: |
      All element IDs use content-derived hashes per governance/ID_NAMING_STANDARDS.md.
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Project identification and tracking. PRD-Ready gate requires deterministic BTV PASS."
  project_name: "[Project Name]"
  version: "1.0"
  status: Draft  # Draft | In Review | Approved
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Primary Author]"
  prepared_by: "[Business Analyst]"
  mvp_target_launch: "[Target date]"
  prd_ready_status: "PASS"  # deterministic BTV gate status

  revision_history:
    entries:
      - version: "1.0"
        date: "YYYY-MM-DDTHH:MM:SS"
        author: "[Name]"
        changes: "Initial MVP draft"
        approver: ""

# =============================================================================
# Section 2: Executive Summary (Optional human-readable rollup)
# =============================================================================

executive_summary:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  required: false
  _guidance: "OPTIONAL — derived rollup for stakeholder review. Generated from objectives and scope."
  overview: |
    [High-level summary: business context, solution overview, and anticipated impact.]
  target_users:
    primary:
      - segment: "[Primary user segment]"
        need: "[Core business need]"
        size: "[Estimated market/user size]"
    secondary:
      - segment: "[Secondary user segment]"
        need: "[Secondary need]"

# =============================================================================
# Diagrams Registry
# =============================================================================

diagrams:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  id: "{doc_type}.{doc_id}.xxxx"
  directory: "diagrams/"
  format: "SVG rendered from Mermaid sources (.mmd)"
  items: []  # Populated with id, title, file, source, scope

# =============================================================================
# Section 3: Introduction
# =============================================================================

introduction:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Business context and document scope. Technical implementation belongs downstream."
  business_context: |
    [Brief situational context — market environment or business trigger motivating this MVP.]
  purpose: |
    [Purpose of this BRD — defines minimum viable requirements to validate business hypothesis.]
  document_scope:
    in_scope:
      - "[Core business capability 1 (at most 5 functional requirements per document)]"
      - "[Core business capability 2]"
    out_of_scope:
      - "[Deferred feature or secondary integration — PRD/next cycle owns these]"

# =============================================================================
# Section 4: Business Objectives
# =============================================================================

business_objectives:
  _size_target: 500  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "SMART objectives with quantitative baselines and target metrics."
  hypothesis:
    statement: "[Core hypothesis this MVP validates]"
    validation_questions:
      - "[Validation question 1 — measurable user behavior or adoption signal]"
      - "[Validation question 2 — operational feasibility or conversion metric]"
  problem_statement:
    problem: "[Concise description of the business problem]"
    impact: "[Quantifiable business impact — cost, delay, or revenue opportunity]"
    mvp_solution: "[Minimal solution addressing core problem]"
  goals:
    - id: "BRD.NN.04.xxxx"
      statement: "[Primary business goal]"
      baseline: "[Current state baseline or 'N/A — new capability']"
      target: "[Quantitative target with timeframe]"
  success_metrics:
    - id: "BRD.NN.04.xxxx"
      objective: "[Linked objective statement]"
      metric: "[Quantitative metric]"
      target: "[Target threshold]"
      period: "90 days post-launch"
  expected_benefits:
    quantifiable:
      - "[Measurable business outcome — revenue, efficiency, acquisition]"
    qualitative:
      - "[Strategic value — partner validation, market positioning]"
  cost_benefit:
    development_costs:
      team: "[Team size] x [Weeks] = $[Estimate]"
      infrastructure: "$[Cost]/month"
      third_party: "$[Cost]/month"
    total_mvp_investment: "$[Total investment]"
    roi_hypothesis: "[Expected ROI or validation threshold]"

# =============================================================================
# Section 5: Project Scope
# =============================================================================

project_scope:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Minimum feature set delivering value. Keep technical stack in ADR topics (Section 8)."
  scope_statement: |
    [Define the minimum set of features needed to deliver value and validate the hypothesis.]
  core_features:
    p1_must_have:
      - "[P1 core capability 1]"
      - "[P1 core capability 2]"
    p2_should_have:
      - "[P2 nice-to-have capability]"
  out_of_scope:
    items:
      - "[Feature deferred to subsequent cycle]"
    rationale: "[Business rationale for MVP exclusion]"
  workflow:
    diagram:
      type: sequenceDiagram
      content: |
        participant Actor
        participant BusinessSystem
        participant ExternalPartner
        Actor->>BusinessSystem: Business action
        BusinessSystem->>ExternalPartner: Dispatch request
        ExternalPartner-->>BusinessSystem: Confirm outcome
        BusinessSystem-->>Actor: Completion response
    happy_path:
      - "[Step 1 — Business action and outcome]"
      - "[Step 2 — Business action and outcome]"

# =============================================================================
# Section 6: Stakeholders
# =============================================================================

stakeholders:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Minimal decision-making and approval group for MVP cycle."
  decision_makers:
    - role: "Executive Sponsor"
      name: "[Name/Title]"
      authority: "Final approval authority"
    - role: "Product Owner"
      name: "[Name/Title]"
      authority: "Feature prioritization"
    - role: "Technical Lead"
      name: "[Name/Title]"
      authority: "Architecture decisions"
  key_contributors:
    - role: "Compliance / Legal"
      name: "[Department/Name]"
      responsibility: "Regulatory oversight (if applicable)"

# =============================================================================
# Section 7: Functional Requirements
# =============================================================================

functional_requirements:
  _size_target: 500  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Business-level capabilities, NOT technical implementation details.
    SIZE: At most 5 functional requirements per document (ceil(N/5) document floor).
  priority_definitions:
    P1: "Must Have — essential for MVP launch; blocks go-live if missing"
    P2: "Should Have — important but workarounds exist for MVP"
    Future: "Next MVP cycle enhancements based on user feedback"

  _authored_form:
    _guidance: |
      Render Section 7 so each functional requirement carries its phase band,
      followed by the literal label line bounding acceptance criteria:

        ## 7. Functional Requirements

        - **<ID> — <Title>** (P1|P2|Future[, realized_by: <LAYER>]): <capability>
        - ...

        Acceptance criteria:

        - **<ID> — <Title>**: <measurable criterion>

  requirements:
    - id: "BRD.NN.07.xxxx"
      title: "[MVP Core Feature 1 — Business Capability Name]"
      capability: "[One-sentence description of business capability]"
      priority: P1
      realized_by: null  # <LAYER> | null (optional off-SPEC realization escape)
      complexity:
        rating: "[1-5]/5"
        rationale: "[Partner chain; regulatory scope; business constraints]"
      business_needs:
        - "[Business need 1 — what must be accomplished]"
        - "[Business need 2 — compliance or partner requirement]"
      business_rules:
        - "[Policy constraint 1 — governing business rule]"
      acceptance_criteria:
        items:
          - id: "BRD.NN.07.xxxx"
            criterion: "[Measurable pass/fail criterion]"
            target: "[Quantitative target threshold]"
      related_requirements:
        references:
          - "[Cross-reference to sibling BRD or section]"

# =============================================================================
# Section 8: Architecture Decision Topics
# =============================================================================

adr_topics:
  _size_target: 500  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Identify decisions needed without resolving them (ADR Layer 5 decides).
    Mandatory topic categories: Infrastructure, Data Architecture, Integration,
    Security, Observability, AI/ML, Technology Selection. Do not cite ADR numbers.
  topics:
    - id: "BRD.NN.08.xxxx"
      category: Infrastructure
      title: "Hosting & Deployment Platform"
      status: Pending  # Selected | Pending | N/A
      business_driver: "[Why the business needs this capability]"
      budget_constraint: "$[Budget]/month"
      compliance_requirements: null
      team_constraints: null
      recommended_selection: "[Candidate technology or Pending]"
      prd_requirements: "[What PRD must detail]"

    - id: "BRD.NN.08.xxxx"
      category: Data Architecture
      title: "Database & Storage"
      status: Pending
      business_driver: "[Data integrity and storage needs]"
      budget_constraint: null
      compliance_requirements: null
      team_constraints: null
      recommended_selection: "[Candidate technology or Pending]"
      prd_requirements: "[What PRD must detail]"

    - id: "BRD.NN.08.xxxx"
      category: Integration
      title: "External Services & Gateways"
      status: Pending
      business_driver: "[External partner integration requirements]"
      budget_constraint: null
      compliance_requirements: null
      team_constraints: null
      recommended_selection: "[Candidate technology or Pending]"
      prd_requirements: "[What PRD must detail]"

    - id: "BRD.NN.08.xxxx"
      category: Security
      title: "Authentication & Data Protection"
      status: Pending
      business_driver: "[Security and compliance requirements]"
      budget_constraint: null
      compliance_requirements: "[e.g. GDPR, SOC 2, encryption]"
      team_constraints: null
      recommended_selection: "[Candidate technology or Pending]"
      prd_requirements: "[What PRD must detail]"

    - id: "BRD.NN.08.xxxx"
      category: Observability
      title: "Monitoring & Audit Logging"
      status: Pending
      business_driver: "[Operational error tracking and metrics]"
      budget_constraint: null
      compliance_requirements: null
      team_constraints: null
      recommended_selection: "[Candidate technology or Pending]"
      prd_requirements: "[What PRD must detail]"

    - id: "BRD.NN.08.xxxx"
      category: AI/ML
      title: "Intelligent Processing (If Applicable)"
      status: N/A
      business_driver: "[Why N/A or capability needed]"
      budget_constraint: null
      compliance_requirements: null
      team_constraints: null
      recommended_selection: null
      prd_requirements: null

    - id: "BRD.NN.08.xxxx"
      category: Technology Selection
      title: "Core Service Architecture"
      status: Pending
      business_driver: "[Core stack performance and maintainability rationale]"
      budget_constraint: null
      compliance_requirements: null
      team_constraints: "[Team proficiencies]"
      recommended_selection: "[Candidate technology or Pending]"
      prd_requirements: "[Detailed stack requirements]"

# =============================================================================
# Section 9: Quality Expectations
# =============================================================================

quality_expectations:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Business-level quality expectations categorized for downstream SPEC routing."
  expectations:
    - category: performance
      expectation: "[User-facing performance expectation, e.g. response < 2s]"
    - category: reliability
      expectation: "[System uptime and availability expectation]"
    - category: security
      expectation: "[Core security baseline, e.g. TLS 1.3, encrypted at rest]"
    - category: observability
      expectation: "[Structured logging and error alerting expectation]"

# =============================================================================
# Section 10: Constraints and Assumptions
# =============================================================================

constraints_and_assumptions:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  constraints:
    items:
      - id: "BRD.NN.10.xxxx"
        category: Budget
        description: "[Financial constraint or resource ceiling]"
        impact: "[Impact on scope or delivery]"
      - id: "BRD.NN.10.xxxx"
        category: Timeline
        description: "[Target delivery milestone]"
        impact: "[Prioritization impact]"
  assumptions:
    items:
      - id: "BRD.NN.10.xxxx"
        assumption: "[Critical operational or business assumption]"
        validation_method: "[How assumption is validated]"
        impact_if_false: "[Mitigation plan]"

# =============================================================================
# Section 11: Acceptance Criteria and Success Validation
# =============================================================================

acceptance_criteria:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Launch gates and post-launch evaluation criteria."
  launch_gates:
    must_have:
      - "All P1 functional requirements implemented and tested"
      - "Deterministic BTV gate status evaluated as PASS"
      - "Security and regulatory baseline confirmed"
    should_have:
      - "All P2 functional requirements validated"
      - "Automated regression test coverage verified"
  post_launch_validation:
    thirty_day_metrics:
      - "[30-day user adoption or transaction volume metric]"
      - "[30-day reliability or error rate threshold]"
    ninety_day_decision_gate:
      continue: "Start next MVP cycle if targets met"
      pivot: "Re-evaluate product direction if adoption lags"
      maintain: "Operate current baseline if stable without expansion"
      shutdown: "Discontinue initiative if core hypothesis invalidated"

# =============================================================================
# Section 12: Business Risk Management
# =============================================================================

risk_management:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Top business, user experience, and regulatory risks with mitigations."
  risks:
    - id: "BRD.NN.12.xxxx"
      description: "[Primary business risk]"
      likelihood: Medium  # High | Medium | Low
      impact: High      # High | Medium | Low
      mitigation: "[Mitigation strategy]"
      owner: "[Responsible role]"

# =============================================================================
# Section 13: Approval
# =============================================================================

approval:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Minimal approval chain for MVP initiation and sign-off."
  approvers:
    - role: "Executive Sponsor"
      name: "[Name]"
      title: "[Title]"
      date: "[Pending]"
    - role: "Product Owner"
      name: "[Name]"
      title: "[Title]"
      date: "[Pending]"
    - role: "Technical Lead"
      name: "[Name]"
      title: "[Title]"
      date: "[Pending]"
  criteria:
    - "All P1 requirements defined and estimated"
    - "Architecture decision topics registered"
    - "Budget and feasibility confirmed"

# =============================================================================
# Section 14: Traceability
# =============================================================================

traceability:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Cross-linking tags and upstream/downstream lineage."
  tags:
    - "@brd: BRD-NN"
  cross_links:
    depends: []
    discoverability:
      - "@discoverability: BRD-NN (short rationale)"
    chg:
      - "@chg: CHG-NN"
  objectives_to_requirements:
    - objective_id: "BRD.NN.04.xxxx"
      objective: "[Objective statement]"
      related_frs:
        - "BRD.NN.07.xxxx"
      coverage: Complete  # Complete | Partial | Planned
  upstream:
    artifacts:
      - type: "[Stakeholder Requirements / Seed]"
        reference: "[Document or seed path]"
        relevance: "[How it informs this BRD]"
  downstream_expected:
    - type: PRD
      layer: 2
      description: "Product Requirements Document (PRD) — user stories and container specs"
  cross_brd_dependencies: []
  health_score:
    bo_fr_coverage: "[X]%"
    cross_brd_validated: "[X]%"
    target_status: "PASS"

# =============================================================================
# Section 15: Glossary
# =============================================================================

glossary:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  terms:
    - term: MVP
      definition: "Minimum Viable Product"
    - term: BRD
      definition: "Business Requirements Document"
    - term: PRD
      definition: "Product Requirements Document"
    - term: "[Domain Term]"
      definition: "[Definition]"

# =============================================================================
# Section 16: Seed Disposition (GD-08 — the seed contract)
# =============================================================================

seed_disposition:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _required: false
  _guidance: |
    The seed→SDD absorption ledger (governance/SEED_CONTRACT.md).
    Every claim from seed/ receives exactly one disposition: absorbed, rejected, or deferred.
  _example:
    - claim: "Every issued short code must be unique."
      disposition: absorbed
      brd_elements: ["BRD.01.07.be48"]
      seed_file: seed/architecture/auth.md
      seed_version: "2.0"
    - claim: "Visitors follow links without creating an account."
      disposition: absorbed
      brd_elements: ["BRD.01.07.15e1", "BRD.01.07.6c3f"]
      seed_file: seed/architecture/auth.md
      seed_version: "2.0"
    - claim: "Per-user vanity/custom short codes."
      disposition: rejected
      rationale: "Not a business objective for this MVP cycle; no owner."
    - claim: "Rate-limiting / abuse protection on the shorten endpoint."
      disposition: deferred
      rationale: "Out of MVP scope; needs an abuse-model BRD first."
      target_cycle: "BRD-02"

# =============================================================================
# Appendix: Lifecycle Reference
# =============================================================================

appendix:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  lifecycle:
    principles:
      - "Each MVP is a complete cycle: BRD defines scope, development delivers, production validates"
      - "New capabilities expand into subsequent BRDs (BRD-02, BRD-03)"
      - "Cross-BRD dependencies in traceability maintain inter-cycle lineage"
    when_to_start_new_cycle:
      - "Current MVP deployed to production and stable (30+ days)"
      - "User feedback collected and analyzed"
      - "New feature requirements identified and approved"
      - "Resources allocated for next cycle"
