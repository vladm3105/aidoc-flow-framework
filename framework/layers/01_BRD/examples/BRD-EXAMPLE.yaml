# =============================================================================
# Section 7: Functional Requirements
# =============================================================================

functional_requirements:
  _size_target: 500
  priority_definitions:
    P1: "Must Have — essential for MVP launch; blocks go-live if missing"
    P2: "Should Have — important but workarounds exist for MVP"
    Future: "Next MVP cycle enhancements based on user feedback"

  _authored_form:
    _guidance: |
      ## 7. Functional Requirements

      - **BRD.01.07.10a1 — Sender Onboarding and Verification** (P1): System must enable US customers to register and complete tier-1 identity verification.
      - **BRD.01.07.20b2 — Guaranteed Exchange Rate Lock** (P1): System must provide guaranteed real-time FX quotes locked for up to 10 minutes.
      - **BRD.01.07.30c3 — Payout Settlement via SPEI** (P1): System must disburse funds into verified Mexican bank accounts via local banking network.

      Acceptance criteria:

      - **BRD.01.07.10a1 — Sender Onboarding**: Identity verification completed in < 60 seconds for 90% of applicants.
      - **BRD.01.07.20b2 — Exchange Rate Lock**: Quote honored without slippage if accepted within 10 minutes.
      - **BRD.01.07.30c3 — Payout Settlement**: Payout confirmed by receiving bank in < 15 minutes.

  requirements:
    - id: "BRD.01.07.10a1"
      title: "Sender Onboarding and Verification"
      capability: "Enable new customers to register and pass tier-1 KYC compliance."
      priority: P1
      realized_by: null
      complexity:
        rating: "3/5"
        rationale: "Requires external KYC identity validation service and OFAC screening."
      business_needs:
        - "Comply with FinCEN customer identification program regulations."
        - "Collect verified sender name, address, and government identification."
      business_rules:
        - "Senders must be at least 18 years old and US residents."
        - "Users flagged on sanctions lists must be rejected immediately."
      acceptance_criteria:
        items:
          - id: "BRD.01.07.10a1"
            criterion: "Automated KYC pass rate for clean applicants >= 85%"
            target: "85%"
      related_requirements:
        references:
          - "BRD-01 (Introduction, Section 3)"

    - id: "BRD.01.07.20b2"
      title: "Guaranteed Exchange Rate Lock"
      capability: "Provide real-time FX rate quotation locked for a 10-minute transaction window."
      priority: P1
      realized_by: null
      complexity:
        rating: "2/5"
        rationale: "Requires FX liquidity provider integration with rate cache."
      business_needs:
        - "Ensure complete transparency of currency conversion rates before commitment."
        - "Protect sender from mid-transaction market fluctuations."
      business_rules:
        - "Quote expires after 600 seconds; expired quotes require re-calculation."
        - "Spread fee must remain fixed as published during active quote."
      acceptance_criteria:
        items:
          - id: "BRD.01.07.20b2"
            criterion: "Rate lock maintained without variance during 10-minute window"
            target: "100%"
      related_requirements:
        references:
          - "BRD-01 (Project Scope, Section 5)"

    - id: "BRD.01.07.30c3"
      title: "Payout Settlement via SPEI"
      capability: "Disburse Mexican Peso funds directly into recipient bank accounts via SPEI."
      priority: P1
      realized_by: null
      complexity:
        rating: "3/5"
        rationale: "Interacts with Mexican clearinghouse and banking partner APIs."
      business_needs:
        - "Enable direct bank credit without recipient branch visits."
        - "Confirm settlement receipt with bank transaction reference."
      business_rules:
        - "Recipient CLABE number must be 18 digits with valid checksum."
        - "Daily transfer limit per unverified recipient capped at $1,000 USD equivalent."
      acceptance_criteria:
        items:
          - id: "BRD.01.07.30c3"
            criterion: "Settlement delivered in < 15 minutes for 95% of transactions"
            target: "95%"
      related_requirements:
        references:
          - "BRD-01 (Business Objectives, Section 4)"

