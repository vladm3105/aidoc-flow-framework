# =============================================================================
# Section 2: Executive Summary (Optional human-readable rollup)
# =============================================================================

executive_summary:
  _size_target: 200
  required: false
  overview: >-
    Cross-border remittance corridors from North America to Latin America currently
    suffer from 24-48 hour settlement delays and high aggregate fees (7-10%). This MVP
    validates the hypothesis that retail remitters will adopt a digital self-service
    transfer solution if end-to-end delivery is completed in under 15 minutes at a
    transparent fee structure under 3%.
  target_users:
    primary:
      - segment: "Cross-border retail senders (US to Mexico corridor)"
        need: "Fast, reliable, low-fee remittance with transparent delivery status"
        size: "Estimated 250,000 active sender demographic"
    secondary:
      - segment: "Recipients with local bank accounts"
        need: "Immediate fund availability without in-person pickup delays"

# =============================================================================
# Diagrams Registry
# =============================================================================

diagrams:
  _size_target: 100
  id: "BRD.01.00.d7a1"
  directory: "diagrams/"
  format: "SVG rendered from Mermaid sources (.mmd)"
  items:
    - id: "BRD.01.00.d7a1"
      title: "End-to-End User Transfer Journey"
      file: "diagrams/user_journey.mmd"
      source: "Mermaid sequenceDiagram"
      scope: "Core happy-path remittance workflow"

# =============================================================================
# Section 3: Introduction
# =============================================================================

introduction:
  _size_target: 200
  business_context: >-
    Migrant workers and international families require fast, predictable fund transfers.
    Traditional money transfer operators impose substantial physical overhead and opaque
    foreign exchange markups.
  purpose: >-
    This BRD defines business requirements for the Cross-Border Transfer MVP, covering
    the minimal capability set required to validate market adoption and transaction
    conversion along the US-to-Mexico primary corridor.
  document_scope:
    in_scope:
      - "Sender onboarding, tier-1 KYC verification, and digital fund transfer"
      - "Real-time foreign exchange quotation and fee transparency"
      - "Direct payout into verified Mexican bank accounts via SPEI"
      - "Status notifications and transaction receipts"
    out_of_scope:
      - "Physical cash collection or agent distribution network"
      - "Multi-currency corridors outside US to Mexico"
      - "Corporate or multi-user business accounts"

# =============================================================================
# Section 4: Business Objectives
# =============================================================================

business_objectives:
  _size_target: 500
  hypothesis:
    statement: "Users will adopt instant digital remittances if settlement occurs in <15 minutes at <3% fee."
    validation_questions:
      - "Will first-time users complete digital onboarding in under 5 minutes?"
      - "Will the platform achieve >= 90% transfer completion rate on initial submission?"
      - "Will customer satisfaction score achieve >= 4.2 out of 5 across the pilot corridor?"

  problem_statement:
    problem: "Cross-border transfers are slow, expensive, and opaque for retail consumers."
    impact: "Consumers lose 7-10% of principal value to hidden spreads and wait days for funds."
    mvp_solution: "Provide direct digital remittance with real-time rate locks and SPEI payout."

  goals:
    - id: "BRD.01.04.10a1"
      statement: "Validate consumer demand in US-to-Mexico corridor"
      baseline: "N/A — new capability"
      target: "5,000 completed transactions in first 90 days post-launch"
    - id: "BRD.01.04.20b2"
      statement: "Prove operational settlement speed"
      baseline: "Traditional wire: 24 to 48 hours"
      target: "95% of transactions settled in < 15 minutes"

  success_metrics:
    - id: "BRD.01.04.30c3"
      objective: "Achieve commercial transaction reliability"
      metric: "Successful settlement completion rate"
      target: ">= 95%"
      period: "90 days post-launch"
    - id: "BRD.01.04.40d4"
      objective: "Customer acquisition and retention"
      metric: "90-day repeat transfer rate"
      target: ">= 40%"
      period: "90 days post-launch"

  expected_benefits:
    quantifiable:
      - "User acquisition: 2,500 onboarded senders in first quarter"
      - "Transfer volume: $1.5M aggregate transacted principal"
    qualitative:
      - "Validation of regulatory licensing and banking partner readiness"
      - "Customer feedback baseline for subsequent product expansion"

  cost_benefit:
    development_costs:
      team: "Cross-functional team of 4 engineers, 1 PM, 1 Designer over 12 weeks"
      infrastructure: "$2,500/month cloud resources"
      third_party: "$1,500/month compliance & identity verification SaaS"
    total_mvp_investment: "$180,000"
    roi_hypothesis: "Positive unit economics per transfer after reaching 10,000 monthly transactions"

# =============================================================================
# Section 5: Project Scope
# =============================================================================

project_scope:
  _size_target: 300
  scope_statement: >-
    Deliver a web and mobile-responsive digital portal enabling identity-verified US
    senders to fund remittances via debit card and disburse directly into Mexican bank
    accounts.

  core_features:
    p1_must_have:
      - "Sender registration and lightweight identity verification"
      - "Guaranteed FX exchange rate lock for 10 minutes"
      - "Debit card payment collection"
      - "Automated SPEI payout dispatch"
      - "Email and SMS transfer confirmation"
    p2_should_have:
      - "Saved recipient address book"
      - "Recurring transfer reminders"

  out_of_scope:
    items:
      - "Cash payout networks in Mexico"
      - "ACH bank pull payment funding"
      - "Corridors beyond US to Mexico"
    rationale: "MVP prioritizes validating core transaction flow with lowest settlement risk."

  workflow:
    diagram:
      type: sequenceDiagram
      content: |
        participant Sender
        participant WebApp
        participant PaymentGateway
        participant SpeiPartner
        participant Recipient

        Sender->>WebApp: Enter amount & recipient CLABE
        WebApp->>Sender: Display locked quote & fees
        Sender->>WebApp: Submit debit card payment
        WebApp->>PaymentGateway: Authorize payment
        PaymentGateway-->>WebApp: Payment confirmed
        WebApp->>SpeiPartner: Dispatch SPEI transfer
        SpeiPartner-->>Recipient: Credit bank account
        SpeiPartner-->>WebApp: Settlement confirmed
        WebApp->>Sender: Notification: Transfer completed

    happy_path:
      - "Sender inputs recipient details and desired transfer amount in USD."
      - "System displays guaranteed exchange rate and total fee."
      - "Sender submits debit card payment and approves quote."
      - "Payment gateway authorizes card transaction."
      - "System initiates SPEI payout to recipient bank account."
      - "Recipient bank confirms deposit; sender receives completion receipt."

