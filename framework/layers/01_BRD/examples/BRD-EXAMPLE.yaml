# =============================================================================
# Section 15: Glossary
# =============================================================================

glossary:
  _size_target: 100
  terms:
    - term: CLABE
      definition: "Clave Bancaria Estandarizada — 18-digit Mexican banking standard for account deposit"
    - term: SPEI
      definition: "Sistema de Pagos Electrónicos Interbancarios — electronic funds transfer system run by Bank of Mexico"
    - term: KYC
      definition: "Know Your Customer — identity verification requirements under banking regulations"
    - term: OFAC
      definition: "Office of Foreign Assets Control — US Treasury agency enforcing economic sanctions"

