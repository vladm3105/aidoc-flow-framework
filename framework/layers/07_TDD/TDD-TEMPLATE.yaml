# TDD-TEMPLATE.yaml — Test-Driven Development Guide
# SDD Layer 7 — Test case definitions from SPEC component contracts
# Upstream: EARS (Layer 3), BDD (Layer 4), ADR (Layer 5), SPEC (Layer 6)
# Downstream: IPLAN (Layer 8)

metadata:
  schema_version: "1.0"
  document_type: "tdd-document"
  layer: 7
  total_sections: 7
  last_updated: "2026-04-29"
  deliverable_type: code
  tags:
    - tdd-document
    - layer-7-artifact
    - shared-architecture

  c4_level:
    _guidance: |
      TDD is NOT a C4 level. It defines test cases that validate SPEC
      (C4-L3 Component) contracts through test execution. C4-L4 (Code)
      ownership belongs to the Code layer, referenced by IPLAN.
    value: none

  id_standard:
    state: canonical  # provisional | canonical (PROVISIONAL-IDS-001)
    _guidance: |
      Two ID forms (see framework/registry/LAYER_REGISTRY.yaml id_patterns):
      document DOC-NN, element DOC.NN.SS.xxxx. TDD validates a single SPEC
      *component*, so its @spec ref is document-level (SPEC-NN) by design;
      traces to specific upstream elements (@adr/@bdd) use the element form.

      All element IDs use content-derived hashes scoped to TDD content.
      NOTE: this is the canonicalization TARGET, not a verified property — LLM engines emit stable opaque strings, unverified until `rehash --check` (PROVISIONAL-IDS-002; shipped for BRD §7 only — byte-exact field extraction for this layer is Phase 2+). See `governance/ID_NAMING_STANDARDS.md`.
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
      Example: TDD.01.04.f19c
      Section segment: test cases live in Section 4, so authored test-case IDs
      carry `04` as the {section_id}.

      Hash algorithm (SHA256, 4-char hex) — the byte-exact input assembly and
      the title/description normalization transform are the SINGLE SOURCE in
      `governance/ID_NAMING_STANDARDS.md` ("Hash algorithm" section,
      PROVISIONAL-IDS-002). Do NOT re-specify the normalization here — cross-ref
      the authority so the verifier (`rehash --check`), any future generator,
      and hand authors converge on one contract.
        Shape: hashlib.sha256("{doc_id}:{section_id}:{norm(title)}:{norm(description)}").hexdigest()[:4]
        Scope: from TDD content, NOT upstream SPEC/ADR/BDD content.
        Collision: extend 4 -> 8 chars if duplicate detected.
        Field extraction: defined for BRD §7 only (PROVISIONAL-IDS-002 Phase 1).
          A TDD test case declares `name` / `spec_ref` / `target` / `test_file` /
          `test_function` and carries no `title` or `description` field, so which
          case field supplies each hash input is deliberately NOT defined here —
          naming one would be a new normative contract, not a drift fix. Until
          Phase 2+ defines it, a TDD element ID is a stable opaque string of the
          shape above, not a recomputable hash.

    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8

# =============================================================================
# Section 1: Document Control
# =============================================================================
document_control:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  status: Draft
  version: "1.0"
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Author]"
  component: "[Component Name]"
  iplan_ready_score: "[Score]/100"  # advisory — auditor-lens score; blank is NOT incomplete (the sdd_doc_lint floor is the gate)
  _guidance: |
    IPLAN-Ready Score: >=90/100 is the advisory readability target (auditor-lens computed, never hand-authored) — NOT a merge gate; the deterministic sdd_doc_lint floor is the actual gate.
    Upstream: SPEC (Layer 6) defines the component contract.
    TDD defines test cases that validate SPEC compliance.

# =============================================================================
# Section 2: Test Pyramid
# =============================================================================
test_pyramid:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Define distribution of test effort across types.
    Percentages are targets, not strict quotas.
  distribution:
    unit: 70
    integration: 20
    e2e: 10
  diagram: |
    flowchart TD
        subgraph "70% Unit Tests"
            UT[Test individual functions/methods in isolation]
        end
        subgraph "20% Integration Tests"
            IT[Test component interactions and contracts]
        end
        subgraph "10% E2E Tests"
            E2E[Test full user workflows from BDD scenarios]
        end
        UT --> IT --> E2E

# =============================================================================
# Section 3: BDD Scenario to Test Mapping
# =============================================================================
test_mapping:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Each BDD scenario maps to one or more test types.
    Test file paths declare where tests will be written.
    TDD ORDER: test files must exist before implementation files
    (enforced by the AI when generating code from this document).

    ACCEPTANCE PAIRING (normative — GD-08): every BDD scenario MUST be named
    here in a `bdd_scenario` mapping entry or an e2e-case `bdd_ref` field (in a
    rendered Markdown TDD, the equivalent §3 mapping row or §4 e2e line carrying
    the test-case id). A scenario that appears only in the §7 traceability block
    is NOT paired and fires `ACC01` (governance/LINT_RULES.md; warning in build,
    error in gate-code). Do NOT try to satisfy the gate by listing scenarios in
    the traceability block — pair each to a real test case.
  scenarios:
    - bdd_scenario: "@bdd: BDD.NN.03.xxxx"
      description: "[Scenario name from BDD]"
      tests:
        - type: unit
          file: "tests/unit/test_[module].py"
          function: "test_[scenario_slug]"
          status: pending
        - type: integration
          file: "tests/integration/test_[module].py"
          function: "test_[scenario_slug]_integration"
          status: pending
        - type: e2e
          file: "tests/e2e/test_[workflow].py"
          function: "test_[scenario_slug]_e2e"
          status: pending

  coverage_table:
    columns: [BDD Scenario, Unit, Integration, E2E, Total]
    rows: []

# =============================================================================
# Section 4: Test Case Definitions
# =============================================================================
test_cases:
  _size_target: 500  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Detailed test case specifications derived from SPEC interfaces,
    data models, and behavior contracts. Each test case defines inputs,
    expected outputs, and edge case coverage.

    Test cases are organized by SPEC component contract:
    - Unit tests validate individual interfaces and data models (SPEC Sections 3-4)
    - Integration tests validate component interactions and behavior (SPEC Section 5)
    - E2E tests validate full workflows mapped from BDD scenarios

  unit_tests:
    _guidance: "Validate individual functions, methods, and data model constraints from SPEC Sections 3-4."
    cases:
      - id: "TDD.NN.04.xxxx"
        name: "[Descriptive test name]"
        spec_ref: "@spec: SPEC-NN"
        target: "[function_name | ClassName.method_name]"
        test_file: "tests/unit/test_[module].py"
        test_function: "test_[description]"
        inputs:
          - name: "[param_name]"
            type: "[Type]"
            value: "[concrete test value]"
        expected_output:
          type: "[ReturnType | ExceptionType]"
          value: "[concrete expected value]"
        edge_cases:
          - condition: "[boundary/null/empty condition]"
            expected: "[expected behavior]"

  integration_tests:
    _guidance: "Validate component interactions, state transitions, and error handling from SPEC Section 5."
    cases:
      - id: "TDD.NN.04.xxxx"
        name: "[Descriptive test name]"
        spec_ref: "@spec: SPEC-NN"
        contract: "[interface or behavior contract from SPEC]"
        test_file: "tests/integration/test_[module].py"
        test_function: "test_[description]_integration"
        setup:
          - "[dependency or mock setup]"
        action:
          description: "[what triggers the interaction]"
        expected_state:
          - "[expected system state after interaction]"
        error_paths:
          - condition: "[error condition]"
            expected_error: "[ErrorType]"

  e2e_tests:
    _guidance: "Validate full workflows mapped from BDD scenarios."
    cases:
      - id: "TDD.NN.04.xxxx"
        name: "[Descriptive test name]"
        bdd_ref: "@bdd: BDD.NN.03.xxxx"
        spec_ref: "@spec: SPEC-NN"
        test_file: "tests/e2e/test_[workflow].py"
        test_function: "test_[description]_e2e"
        workflow:
          - step: 1
            action: "[user/system action]"
            expected: "[visible result]"
          - step: 2
            action: "[next action]"
            expected: "[next result]"
        timeout_seconds: 30
        cleanup: "[cleanup actions after test]"

  security_tests:
    _guidance: "Optional — include only if SPEC or ADR mandates security testing."
    cases:
      - id: "TDD.NN.04.xxxx"
        name: "[Security test name]"
        spec_ref: "@spec: SPEC-NN"
        threat: "[OWASP category or threat model ref]"
        test_file: "tests/security/test_[module].py"
        test_function: "test_[description]_security"
        inputs:
          - name: "[input name]"
            type: "[Type]"
            value: "[malicious/edge test value]"
        expected_result:
          type: "rejection | sanitization | error"
          value: "[expected secure behavior]"

# =============================================================================
# Section 5: Test Thresholds
# =============================================================================
thresholds:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Quality gates per test type. CI must enforce these.
  unit:
    coverage_target: ">=90%"
    pass_criteria:
      - "All unit tests pass"
      - "No skipped tests"
    fail_action: "Block merge; fix or document exception"
  integration:
    coverage_target: ">=85%"
    pass_criteria:
      - "All integration tests pass"
      - "Contract validation passes"
    fail_action: "Block merge"
  e2e:
    coverage_target: ">=75% of happy paths"
    timeout_budget: "<=300s"
    pass_criteria:
      - "All critical path scenarios pass"
      - "No regression failures"
    fail_action: "Block deploy to staging"
  security:
    _note: "Optional — include only if SPEC or ADR mandates security testing"
    coverage_target: "All authentication/authorization paths"
    pass_criteria:
      - "No OWASP Top 10 vulnerabilities detected"
    fail_action: "Block deploy"

# =============================================================================
# Section 6: TDD Execution Order
# =============================================================================
tdd_order:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Declares the order AI must follow when generating code.
    Test files are generated FIRST, implementation files SECOND.
    This is the enforcement mechanism for test-driven development.
  phases:
    - phase: 1
      name: "Write Tests"
      action: "Generate all test files from Sections 3-4 test mappings and cases"
      output: "Test files at declared paths"
    - phase: 2
      name: "Run Tests (Red)"
      action: "Execute tests; confirm they fail (no implementation yet)"
      output: "Test failure report"
    - phase: 3
      name: "Implement"
      action: "Generate implementation files; make tests pass"
      output: "Implementation files"
    - phase: 4
      name: "Verify (Green)"
      action: "Run tests; confirm all pass"
      output: "Test pass report"
    - phase: 5
      name: "Refactor"
      action: "Clean up code; tests remain green"
      output: "Refactored code"

# =============================================================================
# Section 7: Traceability
# =============================================================================
traceability:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  tags:
    - "@tdd: TDD-NN"
  upstream:
    spec_references:
      - "@spec: SPEC-NN"
    adr_references:
      - "@adr: ADR.NN.03.xxxx"
    bdd_references:
      - "@bdd: BDD.NN.03.xxxx"
    ears_references:
      - "@ears: EARS.NN.03.xxxx"
  downstream:
    - type: IPLAN
      layer: 8
      description: "Implementation plan — test-first file generation order enforced"
  cross_links:
    depends:
      - "@depends: TDD-NN"
    discoverability:
      - "@discoverability: TDD-NN (short rationale)"
    chg:
      - "@chg: CHG-NN"
  health_score:
    iplan_ready: "[X]%"
    target_score: ">=90/100"  # advisory readability target, not a merge gate
    _note: "Scores are advisory — computed by the auditor review lens, not hand-authored. The deterministic sdd_doc_lint floor is the real gate; a blank score is NOT incomplete."
