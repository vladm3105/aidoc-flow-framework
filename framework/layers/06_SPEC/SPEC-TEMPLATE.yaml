# =============================================================================
#  SPEC-TEMPLATE.yaml — Unified Technical Specification (SDD Layer 06)
#  Document Authority: COMPANION STANDARD (Static Declarative)
#  Purpose: Implementation-ready technical specification for atomic/monolithic components
#  Upstream: EARS (Layer 3), BDD (Layer 4), ADR (Layer 5)
#  Downstream: TDD (Layer 7)
#
#  TEMPLATE SELECTION GUIDE:
#  Use this template (SPEC-TEMPLATE.yaml — COMPANION STANDARD) when:
#    - Specifying atomic, in-process monolithic components, synchronous APIs, or pure algorithmic modules
#    - Documenting data schemas, interface signatures, and algorithms without state machine orchestration
#  Use the primary template (SPEC-SWF-TEMPLATE.yaml — PRIMARY STANDARD) instead when:
#    - Specifying distributed service interaction, event-driven choreography, or CloudEvent schemas
#    - Orchestrating asynchronous webhook callbacks, concurrent service dispatches, or latency SLA checks
#    - Requiring automated distributed saga compensation (backward recovery on downstream service failure)
#    - Targeting autonomous AI agent execution or workflow orchestrators (LangGraph/Temporal)
# =============================================================================

doc_id: SPEC-NN
title: "[Technical Specification Title]"
metadata:
  schema_version: "1.0"
  framework_version: "[X.Y.Z]"  # framework/VERSION at document creation; see §Version Bumping
  document_type: "spec-document"
  layer: 6
  total_sections: 8
  last_updated: "2026-04-29"
  deliverable_type: code
  tags:
    - spec-document
    - layer-6-artifact
    - shared-architecture

  c4_level:
    _guidance: |
      SDD C4 map (10 layers):
        C4-L1 Context   — BRD: business environment, actors, boundaries
        C4-L2 Container — PRD: product features, functional blocks
        Bridge           — EARS→BDD→ADR: formalize, specify acceptance, decide
        C4-L3 Component — SPEC: component interfaces, data, behavior ← this layer
        Bridge           — TDD→IPLAN: define tests, plan execution
        C4-L4 Code       — source code implementation

      SPEC is Component level (C4-L3). Content must describe component
      interfaces, data models, and behavior contracts — not architecture
      decisions (ADR) or code implementation (Code).
    value: component

  diagram_standard:
    _guidance: |
      SPEC is Component level (C4-L3):
        - Component diagram: internal components, their interfaces and relationships
        - Data flow (DFD-L3): data movement between components
        - Sequence diagrams: MUST include alt/else for error paths
        - MUST reference downstream TDD where C4-L4 ownership is implemented
        - MUST NOT embed C4-L4 code/class diagrams — belongs in Code layer

      Diagram rules:
        - Show component interactions, not code implementation details
        - PASS: "AuthService", "PaymentGateway", "UserRepository", "NotificationQueue"
        - FAIL: "auth_service.py", "async def validate_token()", "PostgreSQL table"
        - FAIL: "Redis cache key format", "Kubernetes pod configuration"
    tags:
      - "@diagram: c4-l3"
      - "@diagram: dfd-l3"

  id_standard:
    state: canonical  # provisional | canonical (PROVISIONAL-IDS-001)
    _guidance: |
      Two ID forms (see framework/registry/LAYER_REGISTRY.yaml id_patterns):
        document  DOC-NN          (e.g. SPEC-01) — references a whole artifact
        element   DOC.NN.SS.xxxx  (e.g. ADR.01.03.a1b2) — references one element
      Section-8 upstream traces reference ELEMENTS → use the element form (as in
      layers 1-5). The document's own id (@spec: SPEC-NN) uses the document form.

_antipatterns:
  - "FAIL: embedding C4-L4 code/class diagrams — belongs in the Code layer, not SPEC"
  - "FAIL: restating ADR decisions instead of specifying component contracts"
  - "FAIL: SQL/ORM schemas in data_models — define typed contracts, not storage"
  - "FAIL: documenting one interface when the component exports several — list all"
  - "FAIL: document-level upstream traces (ADR-NN) where an element (ADR.NN.SS.xxxx) is meant"

# =============================================================================
# Section 1: Document Control
# =============================================================================
document_control:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  status: Draft
  version: "1.0"
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Author]"
  component: "[Component Name]"
  tdd_ready_status: "PASS"  # deterministic BTV gate status

# =============================================================================
# Section 2: Component Overview
# =============================================================================
component_overview:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    One paragraph describing what this component does and its role
    in the system architecture (from ADR decisions).
  description: "[Component purpose and role]"
  architecture_decision: "@adr: ADR.NN.SS.xxxx"  # element-level (GD-03)
  diagram:
    _guidance: "C4-L3 component diagram (Mermaid). Show components + interfaces, not code."
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Caller --> Component
        Component --> Dependency
  language: "[Python | TypeScript | Go | Java | ...]"
  toolchain:
    _required: false
    _guidance: |
      SPEC owns the toolchain conventions for downstream implementation and testing.
      IPLAN execution_commands and TDD test runner conventions derive directly from these declarations.
    runtime_version: "[Version pin, e.g. 3.13, Node 22, Go 1.24]"
    package_manager: "[pip | poetry | npm | pnpm | cargo]"
    setup_command: "[Command to provision virtualenv / install dependencies]"
    type_check_command: "[Command to verify types, e.g. mypy --strict]"
    test_runner_command: "[Command to execute test suite, e.g. pytest tests/unit/ -v]"
  dependencies:
    - name: "[Dependency Package]"
      version: "[>=X.Y.Z]"
      purpose: "[Why needed]"

# =============================================================================
# Section 3: Interfaces
# =============================================================================
interfaces:
  _size_target: 500  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Define the public API of this component: classes, functions, method signatures.
    Use type annotations. No implementation — this is the contract.
    Element-ID exemption: §3 Protocol/method specs MAY omit `SPEC.NN.SS.xxxx`
    element IDs — lineage comes from `@ears`/`@bdd`/`@adr` citations + the method
    names. Do NOT over-assign IDs here. See `governance/ID_NAMING_STANDARDS.md`
    §"Element-ID exemptions".
    List EVERY public export (don't stop at one); for a versioned interface, note
    the version and its backward-compatibility contract.
  exports:
    - name: "[ClassName | function_name]"
      type: "[class | function | async function]"
      signature: "[def name(param: Type) -> ReturnType:]"
      description: "[What it does]"
      errors:
        - "[ErrorType]: [When raised]"

  # Optional: Asynchronous Event Contracts (CloudEvents, Protobuf, Avro, JSON Schema)
  event_contracts:
    _guidance: |
      For asynchronous event-driven interfaces. Specifies the event envelope
      (e.g., CloudEvents v1.0), wire format schema (Protobuf, Avro, or JSON Schema),
      and idempotency/deduplication requirements.
    events:
      - name: "[EventName]"
        type: "[domain.entity.action]"
        envelope_standard: "CloudEvents v1.0"
        schema_format: "[Protobuf v3 | JSON Schema | Avro]"
        schema_definition: "[path/to/contract.proto or inline IDL]"
        deduplication_key: "[field_name (e.g. id, msg_id)]"

# =============================================================================
# Section 4: Data Models
# =============================================================================
data_models:
  _size_target: 400  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Define data structures passed through component interfaces.
    Use typed field definitions, not SQL/ORM.
    For persistent or database entities, declare monotonic time-ordered primary keys
    (e.g. UUIDv7 standard), vector embedding dimensions/metrics, and declarative
    schema migration requirements where applicable.
  models:
    - name: "[ModelName]"
      type: "[dataclass | TypedDict | Pydantic BaseModel]"
      fields:
        - name: "[field_name]"
          type: "[Type]"
          required: true
          description: "[Field purpose]"

# =============================================================================
# Section 5: Behavior
# =============================================================================
behavior:
  _size_target: 500  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Describe component logic: validation rules, state transitions,
    business rules inherited from EARS/BDD. No implementation code —
    this is specification, not source.
    Element-ID exemption: §5 fail-closed rules MAY omit `SPEC.NN.SS.xxxx`
    element IDs (lineage via `@ears`/`@bdd`/`@adr` citations). Do NOT over-assign
    IDs. See `governance/ID_NAMING_STANDARDS.md` §"Element-ID exemptions".
  validation_rules:
    - rule: "[Validation condition]"
      source: "@ears: EARS.NN.03.xxxx"
  state_transitions:
    - from: "[State]"
      to: "[State]"
      trigger: "[Event/Condition]"
      source: "@bdd: BDD.NN.03.xxxx"
  error_handling:
    - condition: "[Error condition]"
      response: "[How handled]"
      source: "@bdd: BDD.NN.03.xxxx"

# =============================================================================
# Section 6: Implementation Notes
# =============================================================================
implementation_notes:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Constraints, patterns, and considerations for implementation.
    NOT implementation code — guidance for the AI/coder.
  constraints:
    - "[Constraint — e.g., Must be stateless]"
  patterns:
    - "[Pattern — e.g., Repository pattern for data access]"
  performance_considerations:
    - "[Consideration — e.g., LRU cache for frequent reads]"
  platform_stack_alignment:
    _guidance: |
      Ground component implementation in the approved technology stack (Layer 05 ADR selection).
      Specify concrete driver bindings (e.g. asyncpg/PostgreSQL 18, NATS JetStream client,
      Temporal workflow activities, LiteLLM proxy) while maintaining engine neutrality.
    driver_bindings:
      - "[Driver / SDK name and version pin]"

# =============================================================================
# Section 7: Downstream TDD Contracts
# =============================================================================
tdd_contracts:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Reference the TDD document that will define test cases for this SPEC component.
    TDD (Layer 7) defines test inputs, expected outputs, edge cases, and thresholds.

    Test-file paths follow the conventions of the language and framework declared
    in this document's own `language:` field (SPEC owns the toolchain). Do NOT
    re-pin a language here — write the path in the form the project's own
    toolchain uses.
  tdd_document: "@tdd: TDD-NN"
  test_files:
    - path: "<unit test path, per the language: declared above>"
      covers: "[Functions/classes tested]"
    - path: "<integration test path, per the language: declared above>"
      covers: "[Integration points tested]"
    - path: "<end-to-end test path, per the language: declared above>"
      covers: "[BDD scenarios tested]"

# =============================================================================
# Section 8: Traceability
# =============================================================================
traceability:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  tags:
    - "@spec: SPEC-NN"
  upstream:
    adr_references:
      - "@adr: ADR.NN.03.xxxx"
    bdd_references:
      - "@bdd: BDD.NN.03.xxxx"
    ears_references:
      - "@ears: EARS.NN.03.xxxx"
  downstream:
    - type: TDD
      layer: 7
      description: "Test case definitions validating SPEC contracts"
    - type: IPLAN
      layer: 8
      description: "Implementation plan — bridges TDD to Code"
    - type: CODE
      description: "Source code implementation"
  cross_links:
    depends:
      - "@depends: SPEC-NN"
    discoverability:
      - "@discoverability: SPEC-NN (short rationale)"
    chg:
      - "@chg: CHG-NN"

  threshold_references:
    _guidance: "Use the @threshold: convention. Do NOT reference PRD or ADR section numbers."
    items:
      - tag: "@threshold: PRD.NN.perf.category.key"
        category: "Timing"
        value: "[NN]ms"
  health_score:
    tdd_ready: "[X]%"
    target_status: "PASS"  # deterministic binary topological gate
    _note: "Gate status is deterministic — computed by structural and topological linters. BTV PASS is required for downstream progression."
