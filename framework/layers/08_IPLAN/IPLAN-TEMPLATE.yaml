# IPLAN-TEMPLATE.yaml — Implementation Plan
# SDD Layer 8 — Mandatory execution bridge from SPEC to source code
# One IPLAN per SPEC component.
#
# All IPLANs go through CHG (§3.0 unified flow).
# Registry: IPLAN-00_index.yaml tracks all plans.
#
# IPLAN is the Layer 8 execution bridge from SPEC/TDD to code.

doc_id: IPLAN-NN
title: "[Implementation Plan Title]"
metadata:
  schema_version: "1.0"
  framework_version: "[X.Y.Z]"  # framework/VERSION at document creation; see §Version Bumping
  document_type: "iplan-document"
  layer: 8
  # Counts the NUMBERED sections only. STRUCT01's required set is derived
  # separately (top-level keys carrying `_size_target`) and is 2 here — FEWER,
  # not more. IPLAN is the one layer that diverges DOWNWARD: 9 of its 11
  # `_size_target` keys are `_required: false` or `_required_when_subtype:`, so
  # the derivation subtracts where BRD/ADR/EARS add required unnumbered
  # backmatter. Do NOT read the generalisation "differs => has backmatter" here;
  # it gets IPLAN exactly backwards. The two numbers differing is correct, not a
  # defect — see governance/LINT_RULES.md §"What STRUCT01 requires".
  total_sections: 6
  last_updated: "2026-04-29"
  tags:
    - iplan-document
    - layer-8-artifact
    - shared-architecture

  c4_level:
    _guidance: |
      IPLAN is NOT a C4 level. It is the execution bridge between TDD
      and Code. C4-L4 (Code) diagrams belong to the source code layer,
      not to IPLAN documents.
    value: none

  id_standard:
    state: canonical  # provisional | canonical (PROVISIONAL-IDS-001)
    _guidance: |
      IPLAN bridges a single SPEC *component* (one IPLAN per component), so its
      @spec references are document-level (SPEC-NN) by design — SPEC is one of the
      two element-ID-exempt layers. @tdd is element-declaring: cite it element-level
      (@tdd: TDD.NN.SS.xxxx) per GD-03, including in the necessary-upstream tag.
      See framework/registry/LAYER_REGISTRY.yaml id_patterns.

# =============================================================================
# Section 1: Document Control
# =============================================================================
document_control:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    One IPLAN per SPEC component. Created when TDD reaches
    IPLAN-Ready >=90/100.

    `subtype` selects which sections this IPLAN must carry. Values
    (CLEANUP-PR-E; `audit_fix` added 0.54.0):
      - code_build: file_manifest, execution_commands,
        implementation_contracts, session_handoff, traceability
        required; rollback/smoke/canary/observability NOT required.
      - deploy: rollback_procedure, smoke_tests, canary_metrics,
        observability_hooks, runbook_reference, traceability
        required; file_manifest + execution_commands NOT required.
      - combined (default): both sets required.
      - audit_fix: fixes audit findings ordered by severity (P0→P1→P2),
        not SPEC components. `source_spec` names the audit findings
        reference; `file_manifest[].tdd_ref` is not used; each entry
        carries a `severity:` (P0/P1/P2/P3) instead. Upstream is the
        audit, so `traceability.upstream` cites `audit_references`
        rather than `spec_references`/`tdd_references`.

    A future `devops` direction (infrastructure + cutover under one
    umbrella) is noted but NOT adopted — `deploy` stays, and `combined`
    stays the backward-compat default (pre-0.19.1 IPLANs carry no
    subtype). Removing `combined` would be a breaking instance-format
    change, out of scope for a hardening release.

    `_required_when_subtype:` markers on individual sections below
    declare which subtype set the section belongs to. The
    IPLAN audit engine reads `subtype` from authored
    `document_control` and selects the section set. Missing subtype
    defaults to `combined` (backward compat for pre-0.19.1 IPLANs).
  iplan_id: "IPLAN-NN"
  subtype: combined  # code_build | deploy | combined | audit_fix
  source_spec: "@spec: SPEC-NN"  # audit_fix: audit findings reference instead
  status: Draft  # Draft | Approved | In Progress | Completed | Verified
  # Status lifecycle (each transition is a blocking gate — never start work on
  # the next phase without first updating status to that phase):
  #   Draft       — IPLAN created, not yet approved (planning NOT authorized)
  #   Approved    — IPLAN authorized to proceed (code NOT authorized)
  #   In Progress — Implementation underway
  #   Completed   — Implementation done, awaiting validation
  #   Verified    — Validation passed, FINAL/FINITE status (immutable)
  #
  # Two failure modes (for reference): planning on a Draft IPLAN skips the
  # authorization gate; implementing on an Approved IPLAN without the
  # In Progress transition skips the implementation gate.
  completion_gates:
    _guidance: |
      Checked BEFORE flipping document_control.status to Completed. Every gate
      MUST pass; a gate that cannot pass blocks the flip, not the work.
      Advisory (lint rule: none yet — auditor-lens prose until a check exists).
    spec_tdd_sync_checked: false  # SPEC/TDD version check ran in the same change
    manifest_all_done: false  # every file_manifest entry DONE or SKIPPED+note
    chg_tracks_completion: false  # authorizing CHG advanced to Implemented/Completed
  completion_spec_sync:
    _guidance: |
      Machine-checkable half of the SDD-sync-on-completion rule
      (DOC_GOVERNANCE_CORE.md §IPLAN Lifecycle): when this IPLAN flips to
      Completed, the corresponding SPEC and TDD MUST be checked against what
      was actually built. If implementation diverged, a CHG rewrites them as a
      new version in the same change. Validated by CHG-L012 (warning).
    spec_checked: false
    tdd_checked: false
    diverged: false  # true → name the follow-up CHG in chg_ref
    chg_ref: null
  #
  # Verified IPLANs CANNOT be changed. To modify a Verified IPLAN:
  #   1. Create a CHG record documenting the need for changes
  #   2. Create a NEW IPLAN (IPLAN-NN+1) that references the original
  #   3. The original IPLAN remains in Verified status as historical record
  version: "1.0"
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Author]"
  complexity: 3  # 1=1 file, 5=architectural changes
  estimated_files: 0
  session_count: 0  # Incremented per session

# =============================================================================
# Section 2: File Manifest
# =============================================================================
file_manifest:
  _size_target: 400  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Declared file creation order. Tests first (TDD principle).
    Each file tracked with status marker for session handoff.
    One IPLAN per SPEC component — all files belong to the same component.
    Element-ID exemption: §2 file-manifest entries MAY omit `IPLAN.NN.SS.xxxx`
    element IDs — lineage comes from `@spec`/`@tdd` citations. Do NOT over-assign
    IDs. See `governance/ID_NAMING_STANDARDS.md` §"Element-ID exemptions".
    Paths follow the conventions of the LANGUAGE + dependencies declared upstream
    in `@spec: SPEC-NN` (SPEC owns `language:`/`dependencies:`); do NOT re-pin a
    language here. Replace the `<…>` placeholders with concrete paths in that
    toolchain. Example (Python): `tests/unit/test_auth.py`, `src/auth/service.py`,
    `tests/integration/test_auth.py`.

    TDD-CASE CARRIER (`tdd_ref`). An entry MAY name the TDD test cases it builds.
    The value is the tag itself and MUST be quoted — YAML treats a leading `@` as
    a reserved indicator, so an unquoted value fails to parse. Several cases may
    share one scalar, pipe-delimited. Structurally this mirrors the TDD layer's own
    `bdd_scenario:` / `bdd_ref:` carriers: a downstream check reads the key and the
    tag from ONE line, so a citation listed only in the traceability block is not a
    build record. Optional per entry — a package initialiser or a config file
    legitimately realizes no test case; completeness is judged from the TDD side.

    STATUS IS A WRITE TARGET, NOT A REPORT FIELD. `status` and `verified` on each
    entry record what has actually been built. Whatever executes an IPLAN MUST
    write them back into THIS FILE as it goes — not only into a handoff narrative,
    a session report or a registry. A file created on disk whose entry still reads
    `NOT_STARTED` is a defect in the executor, not a documentation lag: this
    manifest is what a later stateless session reads to decide what to do next
    (§5 `session_handoff`, "Session startup protocol"), so a stale entry causes
    repeated or skipped work. Update each entry from `NOT_STARTED` as work
    progresses — never batch-update at the end; an entry left `NOT_STARTED`
    after its file is built misstates progress.

    A `DONE` entry MUST name a file that exists on disk and contains a real
    implementation — not a stub or mock. Spot-check DONE files for stub markers
    before flipping document_control.status to Completed.

    Transitions, using the four values declared on the `status:` key below:
    `NOT_STARTED` -> `IN_PROGRESS` when work begins; `PARTIAL` when the file
    exists but does not yet satisfy its declared `tdd_ref` cases; `DONE` when it
    does. `DONE` and `verified` are not the same claim and the stricter one is
    `verified` — §8 `code_inventory` defines it as **tests pass + lint clean**,
    so a file may be `DONE` and not yet `verified`. Set `verified: true` only when
    that check has actually been run; "the file exists" establishes neither.

    `document_control.status` is a DOCUMENT-level field and every entry reaching
    `DONE` is necessary but NOT sufficient for `Completed` — see
    `framework/AI_ASSISTANT_RULES.md` §"Development Completion Rule", which is the
    authority and additionally requires tests pass, lint clean, SPEC/TDD sync,
    and completion gate checks (DOC_GOVERNANCE_CORE.md §3.7) BEFORE the flip.

    VALIDATION WORKFLOW (Completed → Verified):
      1. All file_manifest entries reach DONE + verified: true
      2. Document status flips to "Completed"
      3. Run unit tests from file_manifest (tdd_ref cases)
      4. Run integration tests from execution_commands.validation
      5. Create validation report using IPLAN-VERIFY-TEMPLATE
      6. If findings exist:
         a. Create IPLAN-VERIFY to fix P0/P1 issues
         b. Fix all critical findings
         c. Re-run validation
      7. When all findings resolved:
         a. Mark original IPLAN as "Verified" (FINAL/FINITE)
         b. Close validation IPLAN as "Completed"

    VERIFIED STATUS RULES:
      - Verified IPLANs are IMMUTABLE — no fields may be modified
      - To change a Verified IPLAN, create a CHG + new IPLAN
      - The original remains in Verified status as historical record

    A registry (`IPLAN-00_index`) legitimately owns statuses that have no per-file
    origin — `BACKLOG` and `ABANDONED` exist only there. What it must never own is
    a DERIVED AGGREGATE presented as evidence for the facts it aggregates: an index
    showing `files_done == files_declared` over stale per-file entries hides the
    drift rather than surfacing it.

    ⚠️ THREE further carriers restate per-file state and are NOT reconciled here.
    §5 `session_handoff.sessions[].files_touched[].status` takes the same four
    values as this manifest. §5 `...files_touched[].action` takes
    `created | modified` and is deliberately NOT extended with `planned` — a
    session that touched a file created or modified it. §6
    `traceability.code_inventory.files[].status` (a different vocabulary —
    `planned | created | modified` — with its own `verified:`) is seeded `planned`
    at Draft and then written per session. This manifest is the one an executor
    writes as it goes; §5 is a per-session audit trail.

    §6's vocabulary appears in THREE places in this file — its `status:` key, its
    `_guidance` lifecycle list, and this passage. All three MUST name the same
    values; `tests/conformance/test_iplan_code_inventory_lifecycle.py` holds them
    together, and the contradiction it exists to prevent has already shipped once.
    (GD-25; regressed and restored by CLEANUP-001.)
  files:
    - path: "<unit test for the component, per the @spec language>"
      description: "<what this file is for, in one line>"
      order: 1
      status: NOT_STARTED  # NOT_STARTED | IN_PROGRESS | DONE | PARTIAL
      session: null
      verified: false
      tdd_ref: "@tdd: TDD.NN.04.xxxx | @tdd: TDD.NN.04.yyyy"
    - path: "<implementation file, per the @spec language>"
      description: "<what this file is for, in one line>"
      order: 2
      status: NOT_STARTED
      session: null
      verified: false
      tdd_ref: "@tdd: TDD.NN.04.xxxx"
    - path: "<integration test for the component, per the @spec language>"
      description: "<what this file is for, in one line>"
      order: 3
      status: NOT_STARTED
      session: null
      verified: false

# =============================================================================
# Section 2b: TDD↔IPLAN Consistency Tracking (DOC_GOVERNANCE_CORE.md §6.10)
# =============================================================================
tdd_consistency:
  _size_target: 200  # words
  _guidance: |
    Tracks TDD↔IPLAN cross-layer consistency. Required for code_build and
    combined subtypes. Prevents the 5 governance bugs found during the
    TDD↔IPLAN status sync investigation (2026-10-05).

    Rules (DOC_GOVERNANCE_CORE.md §6.10):
    - Rule A: IPLAN DONE + verified: true → update TDD pending → implemented
    - Rule B: Every TDD test file MUST be in owning IPLAN's file_manifest
    - Rule C: Function names in code MUST match TDD-specified names
    - Rule D: TDDs and IPLANs MUST reference same language
    - Rule E: TDD-00_index and IPLAN-00_index MUST show consistent statuses

    Enforcement: Lint rules TDD-SYNC-001 through TDD-SYNC-007.
  status: not_started  # not_started | in_progress | verified
  last_verified: null
  verification_results:
    function_name_match: null  # percentage or null
    file_ownership_complete: null  # boolean or null
    language_consistent: null  # boolean or null
    index_synchronized: null  # boolean or null
  issues: []
    # - rule: "TDD-SYNC-003"
    #   description: "Status not propagated"
    #   file: "path/to/file"
    #   severity: warning

# =============================================================================
# Section 3: Execution Commands
# =============================================================================
execution_commands:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Runnable commands. The actual bridge from specification to code.
    Three categories matching the implementation workflow (keys are a validated
    contract — keep `setup`/`implementation`/`validation`, each a non-empty list).
    Concrete commands depend on the LANGUAGE + dependencies declared upstream in
    `@spec: SPEC-NN` (SPEC owns the toolchain); express each phase in THAT
    toolchain. Do NOT re-pin a language here. The `# example (Python):` lines
    below are illustrative only — replace them with your `@spec` toolchain's
    equivalents (e.g. Node: `npm ci` / `npm test`; Go: `go mod download` /
    `go test ./...`).
  setup:
    - "# Provision the toolchain + dependencies from @spec (env, package install, scaffold dirs)"
    - "# example (Python): python -m venv .venv && source .venv/bin/activate && pip install -r requirements.txt"
  implementation:
    - "# Author each file in @spec-language order — test first (TDD), then implementation"
    - "# example (Python): create tests/unit/test_auth.py first, then src/auth/service.py"
  breaking_change:
    _guidance: |
      Optional. REQUIRED on any step that modifies an exported function or
      constructor signature. Document all four: (1) the current signature,
      (2) the new signature, (3) that it is a breaking change, and (4) which
      callers must be updated. Omitting this causes compilation failures
      during implementation. Advisory (lint rule: IPLAN01, advisory).
      Verify declared queries against the upstream-declared schema artifact
      before marking steps ready — plausible but nonexistent column names
      fail at runtime, not at authoring time.
    steps: []
    # - step: "[Step description]"
    #   current_signature: "[Current exported signature]"
    #   new_signature: "[New exported signature]"
    #   breaking: true
    #   callers_to_update:
    #     - "[Caller path + symbol]"
  validation:
    - "# Run the @spec toolchain's test + type-check + lint gates"
    - "# example (Python): python -m pytest tests/ -v --cov && python -m mypy --strict && python -m ruff check"

# =============================================================================
# Section 4: Implementation Contracts
# =============================================================================
implementation_contracts:
  _size_target: 400  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Optional. Required when 3+ files depend on shared interfaces.
    Contract types: Protocol Interface, Exception Hierarchy, State Machine,
    Data Model, DI Interface.
    State "No implementation contracts" if not applicable.
    Element-ID exemption: §4 implementation contracts MAY omit `IPLAN.NN.SS.xxxx`
    element IDs — lineage via `@spec`/`@tdd` citations + the contract type names.
    Do NOT over-assign IDs. See `governance/ID_NAMING_STANDARDS.md`
    §"Element-ID exemptions".
  _antipatterns:
    - "FAIL: contracts present but file count <3 — unnecessary overhead"
    - "FAIL: contracts missing but file manifest has 5+ files — guaranteed integration failures"
  provided:
    contracts: []
  consumed:
    dependencies: []

# =============================================================================
# Section 5: Session Handoff
# =============================================================================
session_handoff:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Critical for stateless executor calls. Each AI agent session is
    independent — no memory across invocations. This section is the bridge.

    Session startup protocol:
      1. Read this session_handoff — identify last session's state
      2. Check file_manifest — find next NOT_STARTED or PARTIAL file
      3. Read partial_work description if resuming a PARTIAL step
      4. Continue from that point — do NOT regenerate completed work

    Handoff markers:
      NOT_STARTED — file not yet begun
      IN_PROGRESS — session actively working on this file
      DONE — file complete and verified (tests pass)
      PARTIAL — session ended mid-file (resume from partial_work)

    EMPTY AT DRAFT. `sessions:` is a RETROSPECTIVE audit trail: an entry is
    APPENDED by a session as that session ends. A Draft IPLAN has had no
    session, so it carries `sessions: []`. Do NOT write a session entry while
    authoring — one naming a date, an agent and `action: created` asserts work
    that has not happened. (GD-26; regressed and restored by CLEANUP-001.)

    THIS IS NOT §6's RULE, AND THE DIFFERENCE IS THE REASON FOR IT. §6
    `traceability.code_inventory` IS seeded at Draft — one `planned` entry per
    §2 `file_manifest` path — because that seed is DERIVED from a set already
    known when the IPLAN is written. A session seed has no such source: nobody
    knows the future sessions, so seeding one FABRICATES rather than derives.
    Without this reason, a later reader "repairs" §5 into §6's seeded shape
    and reintroduces #601.

    SHAPE A SESSION APPENDS — an example of the append, NEVER a Draft value:
      - date: "YYYY-MM-DD"
        agent: "[AI agent / session identifier]"
        files_touched:
          - path: "<implementation file, per the @spec language>"
            action: created  # created | modified
            status: IN_PROGRESS  # NOT_STARTED | IN_PROGRESS | DONE | PARTIAL
        partial_work: "[Exactly what's incomplete if session ended mid-step]"
        blockers: "[Any blockers preventing next session]"
        next_session_directive: "[What the next session should do first — cite file + step]"
  sessions: []

# =============================================================================
# Section 6: Traceability
# =============================================================================
traceability:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  upstream:
    spec_references:
      - "@spec: SPEC-NN"
    tdd_references:
      - "@tdd: TDD.NN.SS.xxxx"  # element-level (GD-03); pipe-delimit several
  downstream:
    code_paths:
      - "@code: <source path(s), per the @spec language>"
    test_paths:
      - "@tests: <test path(s), per the @spec language>"
    eval_references:
      - "@eval: EVAL-NN  # governance layer that validates test coverage"
  cross_links:
    depends:
      - "@depends: IPLAN-NN"
    discoverability:
      - "@discoverability: IPLAN-NN (short rationale)"
    chg:
      - "@chg: CHG-NN"
  code_inventory:
    _guidance: |
      Audit trail: every file planned, created or modified during implementation.

      Status lifecycle (this list, the `status:` key below and §2's carrier note
      MUST name the same three values):
        planned  — declared in §2 `file_manifest`, not yet on disk
        created  — brought into existence during `session:`
        modified — already existed, changed during `session:`

      SEEDED AT DRAFT. A Draft IPLAN of subtype `code_build` or `combined`
      carries one entry per §2 `file_manifest` path, in manifest order, every one
      of them `status: planned`, `session: null`, `verified: false` — so a
      stateless executor reading this block alone sees that nothing has been
      built. An empty `code_inventory` is NOT the Draft state: it is
      indistinguishable from an IPLAN whose executor never wrote its entries
      back. A `deploy` IPLAN carries no `file_manifest` (see
      `document_control.subtype`) and so seeds no entries; it records a file here
      only when a cutover step creates or modifies one. (GD-25; regressed and
      restored by CLEANUP-001.)

      WRITTEN PER SESSION. Each session sets the entries it touched to `created`
      or `modified` and records its own session number, and APPENDS an entry for
      any file it creates or modifies that §2 does not declare. `planned` MUST
      NOT survive a session that touched the file. Copying a `created` example
      verbatim into a Draft claims a file exists that does not — the defect this
      lifecycle exists to prevent.

      Set `verified: true` only after tests pass and lint is clean for that file.
      `created` does not imply it.
    files:
      - path: "<unit test for the component, per the @spec language>"
        status: planned  # planned | created | modified
        session: null
        verified: false  # true after tests pass + lint clean
      - path: "<implementation file, per the @spec language>"
        status: planned
        session: null
        verified: false  # true after tests pass + lint clean
      - path: "<integration test for the component, per the @spec language>"
        status: planned
        session: null
        verified: false  # true after tests pass + lint clean

# =============================================================================
# Section 8: Rollback Procedure (deploy / combined)
# CLEANUP-PR-E item 17 — IPLAN sub-types
# =============================================================================
rollback_procedure:
  _size_target: 300  # words
  _required_when_subtype: [deploy, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Step-by-step rollback for the cutover this IPLAN executes. Each
    step has a documented reversal: what was applied, the inverse
    operation, and the verification step. Cite the SPEC-named
    one-way decisions (ADR commitments) that constrain the rollback
    surface — e.g., schema migrations that cannot be reversed must
    name a forward-only mitigation instead.
  steps:
    - step: "[Step description]"
      forward_action: "[Operation applied during cutover]"
      reverse_action: "[Operation to undo]"
      verification: "[How to confirm reversal succeeded]"
      reversible: true  # true | false (forward-only)

# =============================================================================
# Section 9: Smoke Tests (deploy / combined)
# =============================================================================
smoke_tests:
  _size_target: 250  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Post-cutover smoke tests with named pass criteria. Each cutover
    step has at least one smoke check that runs immediately after the
    step lands. Pass criteria reference SPEC-named NFR bounds where
    applicable.
  tests:
    - name: "[Smoke test name]"
      runs_after: "[Cutover step name]"
      pass_criterion: "[Named threshold / behavior]"
      timeout_seconds: 60

# =============================================================================
# Section 10: Canary Metrics (deploy / combined)
# =============================================================================
canary_metrics:
  _size_target: 250  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Canary metrics with explicit thresholds (latency, error rate,
    saturation). The canary window's pass condition is "all metrics
    within bounds for N consecutive minutes."
  metrics:
    - name: "[Metric name]"
      threshold: "[Numeric bound]"
      window_minutes: 10
      action_on_breach: "[Rollback | Pause | Alert]"

# =============================================================================
# Section 11: Observability Hooks (deploy / combined)
# =============================================================================
observability_hooks:
  _size_target: 200  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Deploy events emit named signals (logs, metrics, traces) with
    version-pinned identifiers. Dashboards / alert routes name the
    on-call playbook entry that reads them.
  hooks:
    - event: "[Deploy event name]"
      signal_type: log  # log | metric | trace
      signal_name: "[Named signal]"
      dashboard_url: "[Dashboard URL]"

# =============================================================================
# Section 12: Runbook Reference (deploy / combined)
# =============================================================================
runbook_reference:
  _size_target: 150  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Pointer to the on-call runbook updated for this deploy. Names the
    new failure-mode entries this deploy adds + the dashboard URL
    on-call uses to verify post-cutover health.
  runbook_url: "[Runbook URL]"
  new_failure_modes:
    - mode: "[Failure mode name]"
      detection: "[Signal pattern]"
      response: "[Operator action]"
