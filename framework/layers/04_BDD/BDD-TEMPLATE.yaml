# =============================================================================
#  BDD-TEMPLATE.yaml — BDD Scenarios (SDD)
# =============================================================================
#  Document Authority: PRIMARY STANDARD
#  Purpose: AI-consumable + human-reviewable BDD template
#  Lifecycle: MVP → PROD → NEW MVP
#
#  Convention:
#    _guidance     — authoring instructions, ignored by validators
#    _antipatterns — common mistakes to avoid
#    _note         — contextual clarification
#    _example      — sample values for reference
#
#  Downstream: ADR (Layer 5), TDD (Layer 7 via BDD scenario mapping)
#  Upstream: BRD (Layer 1), PRD (Layer 2), EARS (Layer 3)
# =============================================================================

id: BDD-NN
title: "[Feature/Component Under Test]"

# =============================================================================
# Template Metadata (not a content section — template configuration only)
# =============================================================================

metadata:
  schema_version: "1.0"
  document_type: "bdd-document"
  layer: 4
  lifecycle: mvp-prod-newmvp
  total_sections: 5
  last_updated: "2026-03-29"
  validation:
    _guidance: |
      Validation is performed by the platform's conformance tooling.
      It covers a structural check, a readiness score (quality gate), a
      preflight check, and cross-document consistency.
      ADR-Ready Score: >=90/100 required before downstream ADR generation.

      ADR-Ready scoring criteria:
        Scenario coverage (40%): all EARS requirements have scenarios
        Gherkin quality (25%): valid syntax, atomic scenarios, executable
        Traceability (20%): necessary-upstream tag (@ears) present + resolves
        Edge case coverage (15%): error, recovery, parameterized scenarios

      Execution environment: QA STAGING ONLY — do NOT run in CI pipeline.
      Use UTEST/ITEST for CI. BDD validates user acceptance criteria.

  c4_level:
    _guidance: |
      BDD is NOT a C4 level. It is a refinement step that formalizes
      the transition from Context (BRD) to Container (PRD), alongside EARS.

      SDD C4 map (8 layers):
        Context (BRD)    — business environment, actors, boundaries
        Container (PRD)  — product features, functional blocks
        EARS              — formalize Context→Container transition
        BDD               — executable acceptance scenarios         ← this layer
        ADR               — architecture decisions
        SPEC              — implementation-ready specifications
        TDD               — test case definitions from SPEC contracts
        IPLAN             — execution plan bridging TDD to Code
        Code              — source code implementation

      BDD translates EARS formal requirements into executable Given-When-Then
      scenarios. Content must be precise, executable Gherkin — not narrative.
    value: none

  diagram_standard:
    _guidance: |
      BDD uses sequence diagrams for scenario flow visualization.
      Not C4 diagrams — BDD operates at the scenario/test level.

  tags:
    - bdd-document
    - layer-4-artifact
    - shared-architecture

  deliverable_type:
    _guidance: |
      Inherited from upstream PRD (which inherits from BRD).
    value: code  # code | document | ux | risk | process

  id_standard:
    state: canonical  # provisional | canonical (PROVISIONAL-IDS-001)
    _guidance: |
      All element IDs use content-derived hashes scoped to BDD content.
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
      Example: BDD.01.03.d7a2

      Hash algorithm (SHA256, 4-char hex):
        1. Build input: "{doc_id}:{section_id}:{title}:{description}"
           - from BDD content, NOT upstream EARS/PRD/BRD content
        2. Compute: hashlib.sha256(input.encode('utf-8')).hexdigest()[:4]
        3. Collision: extend hash from 4 to 8 chars if duplicate detected

      Template placeholder: "0000" represents the hash suffix.

    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8
    placeholder: "0000"

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    ADR-Ready Score: >=90/100 required before ADR generation.
    Source Document: link to upstream EARS using hash-based IDs.
    Necessary-upstream: BDD (Layer 4) requires @ears (its `required_tags`); PRD/BRD are transitive.

    Pre-generation checks:
      - Verify all upstream EARS requirements exist
      - Confirm PRD features are stable (no pending changes)
      - Validate threshold references resolve to valid PRD keys
  version: "1.0"
  status: Draft  # Draft | In Review | Approved
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[QA Engineer]"
  priority: P1  # P1 (Critical) | P2 (High) | P3 (Medium) | P4 (Low)
  # No ears/prd/brd reference rows — upstream trace lives on each scenario's
  # element-level `ears:` list (YAML-BDD-SCHEMA D-3); the feature's coverage is
  # the computed union of its scenarios' `ears`.
  adr_ready_score: "[Score]/100"  # advisory — auditor-lens score; blank is NOT incomplete (the sdd_doc_lint floor is the gate)

  revision_history:
    - version: "1.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial BDD scenarios"

# =============================================================================
# Section 2: Feature Definition
# =============================================================================

feature_definition:
  _size_target: 200  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Define the feature under test as a `feature:` YAML block (rendered inside a
    ```yaml fence in §2 of the produced BDD-NN.md). The feature is a CONTAINER —
    it carries NO `ears` field; its EARS coverage is the computed union of its
    scenarios' element-level `ears` lists (YAML-BDD-SCHEMA D-3). Upstream trace
    lives on each scenario, NOT as `@`-tags on the feature.

    File size rules:
      - Single BDD document per module (default), monolithic up to 50,000 tokens
      - If >50,000 tokens: create a new BDD document with its own scope
      - Keep scenarios atomic (one behavior per scenario)

  _example: |
    ```yaml
    feature:
      name: URL Shortener acceptance behaviour
      description: |
        As a Link Submitter
        I want to shorten public URLs
        So that long links become compact
      background:
        steps:
          - "the system is in a ready state"
          - 'the current time is "09:30:00" in "America/New_York"'
    # no ears field — coverage = union(scenarios[].ears)
    ```

  feature:
    name: "[Feature Name matching the EARS requirement]"
    description: |
      [As a {role}, I want {capability}, So that {benefit}]
    background:
      _guidance: |
        Background runs before each scenario. Store BARE step text (the optional
        YAML→Gherkin emitter adds the Given/And keyword). Include system state +
        timezone (IANA, default America/New_York).
      steps:
        - "the system is in a ready state"
        - 'the current time is "HH:MM:SS" in "America/New_York"'

# =============================================================================
# Section 3: Scenario Structure
# =============================================================================

scenario_structure:
  _size_target: 800  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Scenarios are a FLAT YAML list under `scenarios:`, each discriminated by a
    `type:` field (YAML-BDD-SCHEMA D-1/D-2) — no Gherkin `@`-tags. Required
    fields per scenario:
      - id:       element id BDD.NN.03.xxxx (on migration, COPIED VERBATIM from
                  the source @scenario-id — never recomputed; keeps downstream
                  @bdd citations stable)
      - name:     scenario title
      - type:     success | error | recovery | parameterized | optional
      - priority: p0-critical | p1-high | p2-medium | p3-low
      - ears:     element-level list [EARS.NN.SS.xxxx, ...] (>=1). REFGRAN01
                  rejects doc-form (EARS-NN). The feature's coverage is the
                  union of all scenarios' ears (computed; no feature-level tag).
      - given / when / then: phase lists; multiple entries = And continuations.
                  Thresholds are written INLINE in the step prose as
                  `@threshold:PRD.NN.cat.key` (any phase, any count).
    Optional: spec_trace (list), notes (list — rationale), and for a
    parameterized scenario `outline: true` + `examples: {headers, rows}`.

    Minimum coverage: >=1 success per EARS requirement; >=1 error per error
    condition; recovery per circuit-breaker; parameterized for multi-value.
    BDD-SCHEMA-001 flags a missing required field / invalid type|priority.

  _example: |
    ```yaml
    scenarios:
      - id: BDD.01.03.ccd6
        name: Shorten a valid public URL
        type: success
        priority: p0-critical
        ears: [EARS.01.03.5066, EARS.01.03.bca8]
        spec_trace: ["SPEC §3 (Interfaces)", "SPEC §5 (Behavior)"]
        given:
          - 'a Link Submitter with the URL "https://example.com/page"'
        when:
          - 'the submitter posts the URL to the Shorten/Redirect API'
        then:
          - 'the API SHALL return a short code WITHIN @threshold:PRD.01.perf.screeningdeadline'
          - 'the API SHALL present "Your short link is ready."'
      - id: BDD.01.03.abcd
        name: Validation accepts valid input
        type: parameterized
        priority: p2-medium
        ears: [EARS.01.03.4400]
        outline: true
        given: ['a valid <input_type> value "<value>"']
        when: ['the value is validated']
        then: ['validation SHALL pass']
        examples:
          headers: [input_type, value]
          rows:
            - [email, "user@example.com"]
            - [phone, "+1-555-123-4567"]
    ```

  _antipatterns:
    - "FAIL: doc-level ears ('ears: [EARS-01]') — must be element-level (REFGRAN01)"
    - "FAIL: an 'ears' field on the feature — coverage is the union of scenarios"
    - "FAIL: missing a required scenario field (id/name/type/priority/ears/given/when/then) — BDD-SCHEMA-001"
    - "FAIL: recomputing a scenario id on migration — copy @scenario-id verbatim"
    - "FAIL: vague 'then' (e.g. 'it works') — must be specific and testable"
    - "FAIL: compound scenario (tests multiple things) — split into atomic scenarios"
    - "FAIL: running BDD in CI pipeline — QA staging only"

  scenarios:
    - id: "BDD.NN.03.xxxx"
      name: "[Primary success path]"
      type: success
      priority: p0-critical
      ears: ["EARS.NN.SS.xxxx"]
      spec_trace:
        - "[SPEC section — e.g., 3 (Interfaces), 5 (Behavior)]"
      given:
        - "[Precondition from the EARS WHEN clause]"
      when:
        - "[Action from the EARS trigger]"
      then:
        - "[Outcome from the EARS SHALL clause; inline @threshold: if timed]"
    - id: "BDD.NN.03.xxxx"
      name: "[Error condition results in expected behavior]"
      type: error
      priority: p1-high
      ears: ["EARS.NN.SS.xxxx"]
      spec_trace:
        - "[SPEC section — e.g., 5 (Behavior — error_handling)]"
      given:
        - "[Error precondition from the EARS IF clause]"
      when:
        - "[Action that triggers the error]"
      then:
        - "[System SHALL NOT … / error response]"

# =============================================================================
# Section 4: Traceability
# =============================================================================

traceability:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    Necessary-upstream tagging — Layer 4 requires @ears (its `required_tags`).
    Upstream: REQUIRED — every BDD must reference its EARS element; PRD/BRD are
    reached transitively (cite them only as optional provenance).
    Downstream: OPTIONAL — only add links to artifacts that exist.

    Gherkin tag format (NO spaces after colon):
      @brd:BRD.NN.07.xxxx
      @prd:PRD.NN.09.xxxx
      @ears:EARS.NN.03.xxxx

    Tags appear on separate lines BEFORE Feature: keyword.

  tags:
    - "@bdd: BDD-NN"

  upstream:
    ears_references:
      - "@ears: EARS.NN.03.xxxx"

  downstream_expected:
    - type: ADR
      layer: 5
      description: "Architecture decisions informed by BDD scenario coverage (the registry `downstream` for BDD)"
    - type: TDD
      layer: 7
      description: "Cross-reference (not a registry downstream): TDD maps BDD scenarios to test cases via SPEC contracts"

  cross_links:
    depends:
      - "@depends: BDD-NN"
    discoverability:
      - "@discoverability: BDD-NN (short rationale)"

  health_score:
    adr_ready: "[X]%"
    ears_coverage: "[X]%"
    target_score: ">=90/100"  # advisory readability target, not a merge gate
    _note: "Scores are advisory — computed by the auditor review lens, not hand-authored. The deterministic sdd_doc_lint floor is the real gate; a blank score is NOT incomplete."

# =============================================================================
# Section 5: Glossary
# =============================================================================

glossary:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: "Flat list of project-specific terms. Keep concise."

  terms:
    - term: BDD
      definition: "Behavior-Driven Development"
    - term: Gherkin
      definition: "Structured syntax for executable test scenarios (Given-When-Then)"
    - term: ADR-Ready
      definition: "Score measuring BDD maturity for ADR transition (>=90%)"
    - term: Scenario Outline
      definition: "Parameterized Gherkin scenario with Examples table"
    - term: "[Domain term]"
      definition: "[Definition]"

# =============================================================================
# End of BDD-TEMPLATE.yaml
# =============================================================================
