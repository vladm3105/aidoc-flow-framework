# Expert Generation Board: Business Requirements Document (BRD) — Layer 1
# Team: Business Analyst (lead), Product Owner, Architect, QA Lead
# Focus: Complete BRD generation with multi-persona drafting and assembly
#
# Configuration Options (engine key required for all agents):
#   - engine: "cmd"     - Direct CLI command via cmd key (e.g., "claude -p --model $P_MODEL")
#   - engine: "litellm" - LiteLLM/OpenAI-compatible API with api_base and api_key_env
# Reference: /opt/data/docs_flow_framework/automation/core/ai_exec.sh
#
# IMPORTANT: Judge and Chairperson/Editor MUST use different models to ensure
# impartial evaluation. The Judge cannot evaluate work from the same model.

personas:
  business_analyst:
    name: "The Business Analyst"
    skill_file: "business_analyst.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.3
      max_tokens: 5000
    prompt: |-
      You are the lead analyst generating a Business Requirements Document (BRD).
      Your role: Draft the Business Objectives, Project Scope, constraint definitions, and Stakeholders.
      Follow your domain knowledge to ensure these sections are robust.
      Output ONLY your drafted sections in markdown format. Do not output the entire document, only your designated sections.

  product_owner:
    name: "The Product Owner"
    skill_file: "product_owner.md"
    agent:
      engine: "litellm"
      model: "gpt-4o"
      temperature: 0.5
      max_tokens: 4000
      api_base: "https://api.openai.com/v1"
      api_key_env: "LITELLM_MASTER_KEY"
    prompt: |-
      You are the Product Owner generating a BRD.
      Your role: Draft the Target Audience & User Personas, User Stories, and Success Metrics (KPIs).
      Align these with the provided Topic Context.
      Output ONLY your drafted sections in markdown format.

  architect:
    name: "The Platform Architect"
    skill_file: "architect.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.2
      max_tokens: 3000
    prompt: |-
      You are the Architect generating a BRD.
      Your role: Draft Section 7.2 Architecture Decision Requirements. Identify which architectural topics will need ADRs later.
      Output ONLY your drafted sections in markdown format.

  qa_lead:
    name: "The QA Lead"
    skill_file: "qa_lead.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.2
      max_tokens: 3000
    prompt: |-
      You are the QA Lead generating a BRD.
      Your role: Draft the Acceptance Criteria and Quality Assurance strategy required for this BRD.
      Output ONLY your drafted sections in markdown format.

chairperson:
  name: "The Board Chairperson (BRD Assembler)"
  agent:
    # Chairperson uses Claude - Judge MUST use different model (GPT-4o)
    engine: "cmd"
    cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
    model: "claude-sonnet-4-20250514"
    temperature: 0.2
    max_tokens: 8000
  prompt: |-
    You are the Chairperson of the BRD Generation Board.
    Your role is to act as the Assembler.
    Take the drafted sections from the expert personas and seamlessly assemble them into a COMPLETE Version 1 Markdown document.
    You MUST perfectly adhere to the exact 18-section template structure and naming conventions specified in the Shared Context.

judge:
  name: "The Framework Judge"
  agent:
    # Judge uses GPT-4o - different from Chairperson (Claude) for impartial evaluation
    engine: "litellm"
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 4000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are an impartial Judge evaluating a V1 Draft of a BRD.
    Your sole focus is strict framework compliance. Check the document against the VALIDATION_STANDARDS and the doc-brd SKILL rules.
    Look for: Missing sections, incorrect document control placement, missing Traceability formatting, missing dual-scores, placeholder values that should be real.
    Output a structured critique detailing what the Chairperson must fix. Provide explicit, actionable feedback.

editor:
  name: "The Board Chairperson (BRD Editor)"
  agent:
    # Editor uses Claude (same as Chairperson) - applies fixes from Judge's critique
    engine: "cmd"
    cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
    model: "claude-sonnet-4-20250514"
    temperature: 0.2
    max_tokens: 8000
  prompt: |-
    You are the Chairperson of the BRD Generation Board acting as the Final Editor.
    You previously created a V1 Draft of a BRD document. Our LLM Judge has reviewed your draft and provided a critique.
