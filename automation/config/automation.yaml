---
# automation.yaml — Default Configuration for the Automation Framework
# Override any value via environment variable or project .env file.
# Precedence: env vars > project .env > this file

# =============================================================================
# AI Agent
# =============================================================================
ai_agent: claude          # claude | opencode | codex | cline | ollama | openai-api | litellm
ai_model: ""              # leave blank to use agent default (e.g. claude-sonnet-4)
ai_temperature: 0.3       # default sampling temperature (0.0 = deterministic, 1.0 = creative)
ai_top_k: ""              # leave blank for model default (e.g. 40)
ai_max_tokens: ""         # leave blank for model default limit
ai_timeout: 600           # seconds before ai_exec.sh times out

# =============================================================================
# Pipeline Behaviour
# =============================================================================
dry_run: false            # set to true to print actions without executing

auto_apply:
  # DISABLED BY DEFAULT: Auto-apply works for monolithic (single-file) documents,
  # but fails on section-based documents where content is split across multiple files 
  # (e.g. BRD-01.10_*.md), causing the AI to hallucinate conversational text over the index file.
  # Enable this manually via --auto-apply flag or set to true for PRDs/ADRs.
  enabled: false          # whether to auto-apply structural P0 fixes to source docs
  commit: true            # whether to git commit auto-applied fixes
  types:                  # action types that are safe to auto-apply
    - frontmatter_tag
    - section_add
    - matrix_row
    - tag_correction
    - dependency_add

# =============================================================================
# GitHub Integration
# =============================================================================
github:
  enabled: false          # set to true to enable automated GitHub Issue creation
  repo: ""                # e.g. "owner/repo-name" — set in project .env
  project: ""             # GitHub Project board number (optional)
  labels:
    remediation: "experts:remediation"
    source: "source:experts"
    p0: "priority:P0"
    p1: "priority:P1"
    p2: "priority:P2"
    p3: "priority:P3"
    ai_ready: "ai:ready"
    ai_backlog: "ai:backlog"

# =============================================================================
# Knowledge Base Integration (graceful degradation if not running)
# =============================================================================
knowledge_base:
  enabled: false          # set to true when KB services are running
  rag: false              # enable RAG (pgvector) indexing on ingest
  graph: false            # enable Graph (Neo4j) extraction on ingest

# =============================================================================
# Doc Review Pipeline Specific
# =============================================================================
doc_review:
  report_filename_pattern: "*PERSONA_REVIEW_REPORT*.md"
  p0_blocks_merge: true   # P0 findings block PR merge (for GitHub Actions usage)
  create_iplan: true      # auto-call generate_iplan_from_issue.py after issue creation
  post_pr_comments: true  # post findings as PR review comments (GitHub Actions mode)
