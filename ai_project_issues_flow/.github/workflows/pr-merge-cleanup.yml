name: PR Merge Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  repository-projects: write

env:
  PROJECT_NUMBER: 31
  ORG: "{GITHUB_ORG}"

jobs:
  update-board-status:
    name: Set Board Status to Done
    runs-on: self-hosted
    steps:
      - name: Update PR status to Done (and linked issues if merged)
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_HOST: "{GITHUB_HOST}"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Get project ID, Status field, and Done option in one query
          PROJECT_DATA=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options {
                        id
                        name
                      }
                    }
                  }
                }
              }
            }' -f org="${ORG}" -F number=${PROJECT_NUMBER})

          PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD_ID=$(echo "$PROJECT_DATA" | jq -r '.data.organization.projectV2.field.id')
          DONE_OPTION_ID=$(echo "$PROJECT_DATA" | jq -r '.data.organization.projectV2.field.options[] | select(.name == "Done") | .id')

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "ERROR: Could not find project #${PROJECT_NUMBER}"
            exit 1
          fi

          if [ -z "$STATUS_FIELD_ID" ] || [ -z "$DONE_OPTION_ID" ] || [ "$DONE_OPTION_ID" = "null" ]; then
            echo "Warning: Could not find Status field or Done option"
            exit 0
          fi

          # Helper: set a project item to Done by content node ID
          set_done() {
            local CONTENT_ID="$1"
            local LABEL="$2"

            # Find project item by content ID (paginate up to 500 items)
            ITEM_ID=""
            CURSOR=""
            for i in 1 2 3 4 5; do
              if [ -z "$CURSOR" ]; then
                PAGE=$(gh api graphql -f query='
                  query($org: String!, $number: Int!) {
                    organization(login: $org) {
                      projectV2(number: $number) {
                        items(first: 100) {
                          pageInfo { hasNextPage endCursor }
                          nodes { id content { ... on Issue { id } ... on PullRequest { id } } }
                        }
                      }
                    }
                  }' -f org="${ORG}" -F number=${PROJECT_NUMBER})
              else
                PAGE=$(gh api graphql -f query='
                  query($org: String!, $number: Int!, $cursor: String!) {
                    organization(login: $org) {
                      projectV2(number: $number) {
                        items(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes { id content { ... on Issue { id } ... on PullRequest { id } } }
                        }
                      }
                    }
                  }' -f org="${ORG}" -F number=${PROJECT_NUMBER} -f cursor="$CURSOR")
              fi

              ITEM_ID=$(echo "$PAGE" | jq -r --arg cid "$CONTENT_ID" \
                '.data.organization.projectV2.items.nodes[] | select(.content.id == $cid) | .id')
              if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then
                break
              fi

              HAS_NEXT=$(echo "$PAGE" | jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage')
              if [ "$HAS_NEXT" != "true" ]; then
                break
              fi
              CURSOR=$(echo "$PAGE" | jq -r '.data.organization.projectV2.items.pageInfo.endCursor')
            done

            if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
              echo "  ${LABEL}: not on project board, skipping"
              return
            fi

            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: {singleSelectOptionId: $value}
                }) {
                  projectV2Item { id }
                }
              }' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
              -f field="$STATUS_FIELD_ID" -f value="$DONE_OPTION_ID" > /dev/null

            echo "  ${LABEL}: status set to Done"
          }

          # 1. Set PR status to Done (always, whether merged or just closed)
          echo "PR #${PR_NUMBER}:"
          set_done "$PR_NODE_ID" "PR"

          # 2. Find and update linked issues (only if PR was merged)
          # Closed-but-not-merged PRs should NOT close linked issues
          if [ "${{ github.event.pull_request.merged }}" == "true" ]; then
            LINKED_ISSUES=$(echo "$PR_BODY" | grep -ioE '(closes|fixes|resolves)\s+#[0-9]+' | grep -oE '[0-9]+' || true)

            for ISSUE_NUM in $LINKED_ISSUES; do
              ISSUE_NODE_ID=$(gh api "/repos/${{ github.repository }}/issues/${ISSUE_NUM}" --jq '.node_id' 2>/dev/null || true)
              if [ -n "$ISSUE_NODE_ID" ] && [ "$ISSUE_NODE_ID" != "null" ]; then
                echo "Linked issue #${ISSUE_NUM}:"
                set_done "$ISSUE_NODE_ID" "Issue #${ISSUE_NUM}"
              fi
            done
          else
            echo "PR closed without merge - skipping linked issue updates"
          fi
