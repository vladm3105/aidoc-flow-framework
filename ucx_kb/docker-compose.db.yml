services:
  pk-postgres:
    image: pgvector/pgvector:pg16
    container_name: pk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-lightrag}
      POSTGRES_PASSWORD: ${PG_PASS:-lightrag}
      POSTGRES_DB: ${PG_DB:-lightrag}
    ports:
      - "${PK_DB_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pk_postgres_data:/var/lib/postgresql/data
      - ./db/rag_schema.sql:/docker-entrypoint-initdb.d/01_rag_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-lightrag} -d ${PG_DB:-lightrag}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pk-neo4j:
    image: neo4j:5-community
    container_name: pk-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASS:-neo4jpass}"
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "${PK_DB_NEO4J_HTTP_PORT:-7475}:7474"
      - "${PK_DB_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - pk_neo4j_data:/data
      - pk_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  pk_postgres_data:
  pk_neo4j_data:
  pk_neo4j_logs:
