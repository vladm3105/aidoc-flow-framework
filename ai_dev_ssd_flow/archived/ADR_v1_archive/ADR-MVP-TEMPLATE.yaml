# =============================================================================
#  Document Authority: PRIMARY STANDARD for Autopilot Workflow
# - Purpose: AI-consumable template for automated ADR artifact generation
# - Validation: Validated by ADR_MVP_SCHEMA.yaml (shared with MD template)
# - Human Reference: See ADR-MVP-TEMPLATE.md for narrative explanations
# - Structure: 11 sections aligned with ADR-MVP-TEMPLATE.md
# =============================================================================

id: ADR-NN
title: "[Architecture Decision Title]"

# =============================================================================
# Metadata
# =============================================================================

metadata:
  schema_version: "1.1"
  instance_document_type: "adr-document"
  deliverable_type: "code"  # Options: code, document, ux, risk, process - inherited from BDD

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  status: "Proposed"  # Proposed, Accepted, Deprecated, Superseded
  date: "YYYY-MM-DD"
  decision_makers:
    - "[Names/Roles]"
  author: "[Architect/Lead Name]"
  version: "1.0"
  sys_ready_score: "[Score]/100 (Target: ≥90)"

# =============================================================================
# Section 2: Context
# =============================================================================

context:
  problem_statement:
    originating_topic: "BRD.NN.32.SS - [Topic Name from BRD Section 7.2]"
    description: |
      [1-2 paragraph description of the architectural challenge or decision needed]
    business_driver: "[Why this decision matters to the business - from BRD §7.2]"

  key_constraints:
    - "[Constraint 1 - e.g., budget limit, regulatory requirement]"
    - "[Constraint 2 - e.g., timeline, team expertise]"
    - "[Constraint 3 - e.g., existing infrastructure, integration requirement]"

  technical_context:
    description: "[Brief background on existing system state and technical environment]"
    current_state:
      - "[What exists today]"
      - "[What's working/not working]"
    mvp_requirements:
      - "[Core requirement this decision must satisfy]"
      - "[Quality attribute targets - e.g., p95 < 200ms]"

# =============================================================================
# Section 3: Decision
# =============================================================================

decision:
  id_format: "ADR.NN.10.SS"  # Decision element type

  chosen_solution:
    id: "ADR.NN.10.01"
    solution: "[Selected option/technology/approach]"
    because:
      - "[Primary reason - aligned with business driver]"
      - "[Secondary reason - technical fit]"
      - "[Tertiary reason - cost/time advantage]"

  key_components:
    - component: "[Component 1]"
      purpose: "[What it does]"
      technology: "[Specific tech]"
    - component: "[Component 2]"
      purpose: "[What it does]"
      technology: "[Specific tech]"
    - component: "[Component 3]"
      purpose: "[What it does]"
      technology: "[Specific tech]"

  implementation_approach:
    description: "[2-3 sentences on how this will be implemented for MVP]"
    mvp_scope: "[What's included in MVP implementation]"
    next_cycle_scope: "[What's deferred to next MVP iteration]"

# =============================================================================
# Section 4: Alternatives Considered
# =============================================================================

alternatives_considered:
  id_format: "ADR.NN.12.SS"  # Alternative element type

  options:
    - id: "ADR.NN.12.01"
      name: "[Selected Option Name]"
      selected: true
      description: "[Brief description of the chosen approach]"
      pros:
        - "[Advantage 1]"
        - "[Advantage 2]"
      cons:
        - "[Trade-off 1]"
        - "[Trade-off 2]"
      estimated_cost: "$[X]/month"
      fit: "Best"

    - id: "ADR.NN.12.02"
      name: "[Alternative Option Name]"
      selected: false
      description: "[Brief description]"
      pros:
        - "[Advantage 1]"
        - "[Advantage 2]"
      cons:
        - "[Disadvantage 1 - why rejected]"
        - "[Disadvantage 2]"
      rejection_reason: "[Specific reason why not selected]"
      estimated_cost: "$[X]/month"
      fit: "Good"  # Good/Poor

    - id: "ADR.NN.12.03"
      name: "[Alternative Option Name] (Optional)"
      selected: false
      description: "[Brief description]"
      pros:
        - "[Advantage 1]"
      cons:
        - "[Disadvantage 1]"
      rejection_reason: "[Specific reason]"
      estimated_cost: "$[X]/month"
      fit: "Poor"

# =============================================================================
# Section 5: Consequences
# =============================================================================

consequences:
  id_format: "ADR.NN.13.SS"  # Consequence element type

  positive_outcomes:
    id: "ADR.NN.13.01"
    items:
      - benefit: "[Benefit 1]"
        impact: "[Quantifiable impact]"
      - benefit: "[Benefit 2]"
        impact: "[Quantifiable impact]"
      - benefit: "[Benefit 3]"
        impact: "[Qualitative benefit]"

  tradeoffs_and_risks:
    id: "ADR.NN.13.02"
    items:
      - item: "[Trade-off 1]"
        impact: "H"  # H/M/L
        mitigation: "[How we'll address it]"
      - item: "[Trade-off 2]"
        impact: "M"
        mitigation: "[How we'll address it]"
      - item: "[Risk 1]"
        impact: "L"
        mitigation: "[Mitigation strategy]"

  cost_estimate:
    mvp_phase:
      development: "[X] person-weeks"
      infrastructure: "$[X] one-time"
      third_party_services: "$[X] setup"
      total: "$[X]"
    monthly_ongoing:
      infrastructure: "$[X]/month"
      third_party_services: "$[X]/month"
      total: "$[X]/month"

# =============================================================================
# Section 6: Architecture Flow
# =============================================================================

architecture_flow:
  high_level_flow:
    diagram_type: "mermaid"
    diagram: |
      flowchart TD
          A[Input/Trigger] --> B[Core Component]
          B --> C{Decision Point}
          C --> D[Success Path]
          C --> E[Error Path]

          subgraph "MVP Scope"
              B
              D
          end

          subgraph "External"
              F[External Service]
          end

          B --> F

  key_integration_points:
    - system: "[System 1]"
      integration_type: "[REST/gRPC/Async]"
      purpose: "[What data flows]"
    - system: "[System 2]"
      integration_type: "[REST/gRPC/Async]"
      purpose: "[What data flows]"

# =============================================================================
# Section 7: Implementation Assessment
# =============================================================================

implementation_assessment:
  mvp_development_phases:
    - phase: 1
      duration: "[X] weeks"
      deliverables: "[Core implementation]"
    - phase: 2
      duration: "[X] weeks"
      deliverables: "[Integration & testing]"

  rollback_plan:
    trigger: "[Conditions requiring reversion]"
    steps:
      - "[Step 1]"
      - "[Step 2]"
      - "[Step 3]"
    estimated_rollback_time: "[X] minutes/hours"

  monitoring_mvp_baseline:
    - metric: "Error rate"
      alert_threshold: "> [X]%"
      action: "[Response]"
    - metric: "Latency (p95)"
      alert_threshold: "> [X]ms"
      action: "[Response]"
    - metric: "Availability"
      alert_threshold: "< [X]%"
      action: "[Response]"

# =============================================================================
# Section 8: Verification
# =============================================================================

verification:
  success_criteria:
    - "[Measurable technical outcome 1]"
    - "[Measurable technical outcome 2]"
    - "[Performance target met]"
    - "[Integration working]"

  bdd_scenarios:
    references:
      - feature: "[Feature name]"
        path: "04_BDD/BDD-NN_{suite}/BDD-NN.SS_{slug}.feature"

# =============================================================================
# Section 9: Traceability
# =============================================================================

traceability:
  upstream_references:
    - source: "BRD"
      document: "BRD.NN"
      section: "§7.2 - Architecture Decision Requirements"
    - source: "PRD"
      document: "PRD.NN"
      section: "§18 - Architecture Decision Topics"
    - source: "EARS"
      document: "EARS.NN"
      section: "[Relevant requirements]"

  downstream_artifacts:
    - artifact: "SYS-NN"
      status: "TBD"
      relationship: "System requirements derived from this ADR"
    - artifact: "REQ-NN"
      status: "TBD"
      relationship: "Atomic requirements"
    - artifact: "SPEC-NN"
      status: "TBD"
      relationship: "Technical specifications"

  tags:
    - "@brd: BRD.NN.32.SS"
    - "@prd: PRD.NN.EE.SS"
    - "@ears: EARS.NN.24.SS"

  cross_links:
    depends:
      - "@depends: ADR-NN"
    discoverability:
      - "@discoverability: ADR-NN (short rationale)"

# =============================================================================
# Section 10: Related Decisions
# =============================================================================

related_decisions:
  - relationship: "Depends On"
    adr: "ADR-NN"
    description: "[What this decision depends on]"
  - relationship: "Related"
    adr: "ADR-NN"
    description: "[Related parallel decision]"
  - relationship: "Supersedes"
    adr: "ADR-NN"
    description: "[Previous decision replaced]"

# =============================================================================
# Section 11: MVP Lifecycle
# =============================================================================

mvp_lifecycle:
  lifecycle_principle: |
    Each ADR represents decisions for ONE iteration cycle.
    New architectural decisions require a NEW ADR.

  phases:
    - phase: "MVP"
      duration: "1-2 weeks"
      focus: "Core architecture decisions"
      adr_output: "This ADR → SYS → Implementation"
    - phase: "PROD"
      duration: "30-90 days"
      focus: "Operate, validate decisions, collect feedback"
      adr_output: "Decision outcomes, lessons learned"
    - phase: "NEW MVP"
      duration: "1-2 weeks"
      focus: "Next architecture decisions"
      adr_output: "Create ADR-02, ADR-03, etc."

  when_to_create_new_adr:
    - "Current ADR decisions are validated in production"
    - "New architectural decisions needed for next iteration"
    - "Decision context has significantly changed"
    - "Business case for new architecture approved"

  cross_adr_traceability:
    - "Link to previous cycle: Add @depends: ADR-01 in Related Decisions section"
    - "Reference production outcomes: Include validation data from previous cycle"
    - "Supersedes pattern: Use when replacing a previous decision entirely"
    - "Update index: Add new ADR to ADR-00_index.md with cross-references"

# =============================================================================
# Template Metadata
# =============================================================================

template_metadata:
  template_version: "1.1"
  instance_document_type: "adr-document"
  structure: "11 sections"
  last_updated: "2026-02-26"
  md_reference: "ADR-MVP-TEMPLATE.md"
  schema: "ADR_MVP_SCHEMA.yaml"
  creation_rules: "ADR_MVP_CREATION_RULES.md"
  validation_rules: "ADR_MVP_VALIDATION_RULES.md"
  notes:
    - "YAML template aligned with MD template (11 sections)"
    - "No separate 'full ADR' template - expansion via NEW ADRs"
    - "Maintains ai_dev_flow framework compliance"
