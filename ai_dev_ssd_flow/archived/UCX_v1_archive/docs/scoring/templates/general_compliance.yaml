# UCX Scoring Template: General/Technology
# Version: 1.0.0
#
# General compliance keywords for technology companies
# without industry-specific regulatory requirements.
#
# Usage in project config (docs/UCX/scoring_weights.yaml):
#   extends: general_compliance

industry: general
description: "General technology, SaaS, software development"

compliance:
  keywords:
    # Data Privacy
    - "GDPR"
    - "General Data Protection Regulation"
    - "CCPA"
    - "California Consumer Privacy Act"
    - "CPRA"
    - "California Privacy Rights Act"
    - "LGPD"
    - "PIPEDA"
    - "Data Subject"
    - "Data Controller"
    - "Data Processor"
    - "Right to Erasure"
    - "Right to be Forgotten"
    - "Data Portability"
    - "Consent"
    - "Legitimate Interest"
    - "Privacy Impact Assessment"
    - "PIA"
    - "DPIA"
    - "Data Protection Impact Assessment"
    - "Cross-border Transfer"
    - "Standard Contractual Clauses"
    - "Binding Corporate Rules"

    # Security Frameworks
    - "SOC 2"
    - "SOC2"
    - "SOC 1"
    - "SSAE 18"
    - "ISO 27001"
    - "ISO 27002"
    - "ISO 27017"
    - "ISO 27018"
    - "NIST"
    - "NIST CSF"
    - "CIS Controls"
    - "CSA STAR"
    - "Cloud Security"

    # General
    - "PII"
    - "Personally Identifiable Information"
    - "Personal Data"
    - "Sensitive Data"
    - "Encryption"
    - "Encryption at Rest"
    - "Encryption in Transit"
    - "Access Control"
    - "Audit Log"
    - "Audit Trail"
    - "Data Retention"
    - "Data Classification"
    - "Security Policy"
    - "Incident Response"
    - "Breach Notification"
    - "Vulnerability"
    - "Penetration Test"
    - "Security Assessment"

    # Accessibility
    - "WCAG"
    - "ADA"
    - "Section 508"
    - "Accessibility"
    - "A11y"

  # Weight adjustment: reduce compliance weight for general tech
  weight_adjustment: -0.05  # Reduce to 0.15

quality:
  keywords:
    - "SLA"
    - "Service Level Agreement"
    - "Uptime"
    - "Availability"
    - "Response Time"
    - "Latency"
    - "Throughput"
    - "Scalability"
    - "Performance"
    - "Reliability"
    - "Disaster Recovery"
    - "RTO"
    - "RPO"
    - "Business Continuity"
