repos:
  - repo: local
    hooks:
      - id: prd-core-wrapper
        name: Validate PRD core checks via unified wrapper
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/prd_core_wrapper_hook.sh docs/02_PRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: prd-standardized-element-codes
        name: Validate b-local PRD standardized element type codes
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/prd_standardized_element_codes_hook.sh docs/02_PRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: prd-legacy-patterns
        name: Detect b-local PRD legacy element ID patterns
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/prd_legacy_pattern_hook.sh docs/02_PRD
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ears-core-validator
        name: Validate EARS documents via core validator
        entry: bash ai_dev_ssd_flow/03_EARS/scripts/ears_core_validator_hook.sh docs/03_EARS
        language: system
        files: ^docs/03_EARS/.*\.md$
        pass_filenames: false
        stages: [pre-commit]

      - id: prd-quality-gate
        name: PRD legacy quality-gate alias (manual)
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/validate_prd_wrapper.sh docs/02_PRD --skip-advisory
        language: system
        pass_filenames: false
        stages: [manual]

      - id: brd-quality-gate
        name: BRD legacy quality-gate alias (manual)
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/validate_brd_wrapper.sh docs/01_BRD --skip-advisory
        language: system
        pass_filenames: false
        stages: [manual]

      - id: brd-core-wrapper
        name: Validate b-local BRD core checks via unified wrapper
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/brd_core_wrapper_hook.sh docs/01_BRD
        language: system
        pass_filenames: false
        stages: [manual]  # Temporarily set to manual (was pre-commit)

      - id: brd-standardized-element-codes
        name: Validate b-local BRD standardized element type codes
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/brd_standardized_element_codes_hook.sh docs/01_BRD
        language: system
        pass_filenames: false
        stages: [manual]  # Temporarily set to manual (was pre-commit)

      - id: brd-legacy-patterns
        name: Detect b-local BRD legacy element ID patterns
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/brd_legacy_pattern_hook.sh docs/01_BRD
        language: system
        pass_filenames: false
        stages: [manual]  # Temporarily set to manual (was pre-commit)

      - id: brd-claude-skill-audit
        name: Run Claude BRD skill audit (optional)
        entry: bash ai_dev_ssd_flow/01_BRD/scripts/claude_brd_skill_audit_hook.sh
        language: system
        files: ^docs/01_BRD/.*\.md$
        pass_filenames: true
        stages: [manual]

      - id: prd-claude-skill-audit
        name: Run Claude PRD skill audit (optional)
        entry: bash ai_dev_ssd_flow/02_PRD/scripts/claude_prd_skill_audit_hook.sh
        language: system
        files: ^docs/02_PRD/.*\.md$
        pass_filenames: true
        stages: [manual]

      - id: sdd-layer-quality-matrix
        name: Run all-layer SDD quality matrix (Phase A, manual full)
        entry: bash ai_dev_ssd_flow/scripts/pre_commit_hooks/sdd_layer_quality_matrix_hook.sh docs
        language: system
        pass_filenames: false
        stages: [manual]

      - id: sdd-metadata-scope
        name: Enforce SDD metadata scope (instance + development/production)
        entry: bash ai_dev_ssd_flow/scripts/pre_commit_hooks/sdd_metadata_scope_hook.sh ai_dev_ssd_flow
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: sdd-layer-quality-matrix-blocking
        name: Run all-layer SDD quality matrix (Phase B, blocking changed layers)
        entry: bash ai_dev_ssd_flow/scripts/pre_commit_hooks/sdd_layer_quality_matrix_hook.sh docs --changed-only
        language: system
        pass_filenames: false
        stages: [pre-commit]
