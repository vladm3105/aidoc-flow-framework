# =============================================================================
#  Document Authority: PRIMARY STANDARD for Autopilot Workflow
# - Purpose: AI-consumable template for automated BRD artifact generation
# - Validation: Validated by BRD_MVP_SCHEMA.yaml (shared with MD template)
# - Human Reference: See BRD-MVP-TEMPLATE.md for narrative explanations
# - Lifecycle: MVP → PROD → NEW MVP (each BRD = one iteration cycle)
#
# NOTE: This is a MINIMAL YAML template (structure only).
# BRD is primarily human-facing. Humans should use BRD-MVP-TEMPLATE.md
# for narrative content, business case, stakeholder analysis.
#
# LIFECYCLE PRINCIPLE: Each BRD represents ONE iteration cycle.
# New features = create NEW BRD (BRD-02, BRD-03, etc.)
# =============================================================================

id: BRD-NN
title: "[Business Requirements Title: e.g., E-Commerce Platform MVP]"

# =============================================================================
# Template Metadata
# =============================================================================

metadata:
  schema_version: "1.2"
  last_updated: "2026-02-25"
  total_sections: 18
  lifecycle: "mvp-prod-newmvp"
  template_reference: "BRD-MVP-TEMPLATE.md"
  schema_reference: "BRD_MVP_SCHEMA.yaml"
  creation_rules: "BRD_MVP_CREATION_RULES.md"
  validation_rules: "BRD_MVP_VALIDATION_RULES.md"

# =============================================================================
# Lifecycle: MVP → PROD → NEW MVP
# =============================================================================
# - Each BRD represents ONE iteration cycle (5-15 features)
# - After production deployment, create NEW BRD for next feature set
# - Link cycles via cross_brd_dependencies in Section 16.2
# - Example: BRD-01 → Production → BRD-02 → Production → BRD-03
# =============================================================================

# =============================================================================
# Section Structure (18 Sections)
# =============================================================================

sections:
  - number: 0
    title: "Document Control"
    required: true
    subsections:
      - "Executive Summary"
      - "Revision History"

  - number: 1
    title: "Introduction"
    required: true
    subsections:
      - "1.1 Purpose"
      - "1.2 Document Scope"
      - "1.3 Intended Audience"
      - "1.4 Document Conventions"

  - number: 2
    title: "Business Objectives"
    required: true
    subsections:
      - "2.1 MVP Hypothesis"
      - "2.2 Business Problem Statement"
      - "2.3 MVP Business Goals"
      - "2.4 MVP Success Metrics"
      - "2.5 Expected Benefits"

  - number: 3
    title: "Project Scope"
    required: true
    subsections:
      - "3.1 MVP Scope Statement"
      - "3.2 MVP Core Features"
      - "3.3 Out-of-Scope"
      - "3.4 MVP Workflow"
      - "3.5 MVP Technology Stack"

  - number: 4
    title: "Stakeholders"
    required: true

  - number: 5
    title: "User Stories"
    required: true
    subsections:
      - "5.1 Primary User Stories"
      - "5.2 User Story Summary"

  - number: 6
    title: "Functional Requirements"
    required: true
    subsections:
      - "6.1 MVP Requirements Overview"
      - "6.2 MVP Functional Requirements"
      - "6.3-6.4 Feature Requirements"
      - "6.5 Business Rules"

  - number: 7
    title: "Quality Attributes"
    required: true
    subsections:
      - "7.1 MVP Quality Attributes Overview"
      - "7.2 Architecture Decision Requirements"
      - "7.3 Performance Requirements"
      - "7.4 Security Requirements"
      - "7.5 Reliability Requirements"

  - number: 8
    title: "Business Constraints and Assumptions"
    required: true
    subsections:
      - "8.1 MVP Business Constraints"
      - "8.2 MVP Assumptions"

  - number: 9
    title: "Acceptance Criteria"
    required: true
    subsections:
      - "9.1 MVP Launch Criteria"
      - "9.2 MVP Success Validation"

  - number: 10
    title: "Business Risk Management"
    required: true

  - number: 11
    title: "Implementation Approach"
    required: true
    subsections:
      - "11.1 MVP Development Phases"
      - "11.2 MVP Support Model"

  - number: 12
    title: "Support and Maintenance"
    required: true
    subsections:
      - "12.1 Support Model"
      - "12.2 Maintenance Windows"
      - "12.3 Service Level Targets"

  - number: 13
    title: "Cost-Benefit Analysis"
    required: true

  - number: 14
    title: "Project Governance"
    required: true
    subsections:
      - "14.1 Governance Structure"
      - "14.2 Decision Authority Matrix"
      - "14.3 Status Reporting"
      - "14.4 Change Control"
      - "14.5 Approval and Sign-off"

  - number: 15
    title: "Quality Assurance"
    required: true
    subsections:
      - "15.1 Quality Standards"
      - "15.2 Testing Strategy"
      - "15.3 Quality Gates"

  - number: 16
    title: "Traceability"
    required: true
    subsections:
      - "16.1 Requirements Traceability Matrix"
      - "16.2 Cross-BRD Dependencies"
      - "16.3 Test Coverage Traceability"
      - "16.4 Traceability Summary"

  - number: 17
    title: "Glossary"
    required: true
    subsections:
      - "17.1 Business Terms"
      - "17.2 Technical Terms"
      - "17.3 Domain-Specific Terms"
      - "17.4 Acronyms"
      - "17.5 Cross-References"
      - "17.6 External Standards"

  - number: 18
    title: "Appendices"
    required: true
    subsections:
      - "18.1 Appendix A: MVP Metrics Dashboard"
      - "18.2 Appendix B: Future Roadmap"
      - "18.3 Appendix C: MVP Lifecycle (MVP → PROD → NEW MVP)"
      - "18.4 Appendix D: File Size Guidelines"
      - "18.5 Document Control Notes"

# =============================================================================
# Document Control
# =============================================================================

document_control:
  project_name: "[Project Name]"
  version: "1.0"
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Primary Author]"
  prd_ready_score: "[Score]/100 (MVP Target: >=90/100)"

# =============================================================================
# Executive Summary
# =============================================================================

executive_summary:
  business_objective: |
    [Business objective statement: Clear, concise statement of what this
    business requirement aims to achieve. Include business goals and
    success criteria. Be specific and measurable where possible.]

  success_metrics:
    - metric: "[Metric 1]"
      target_value: "[Target]"
      measurement: "[How measured]"

    - metric: "[Metric 2]"
      target_value: "[Target]"
      measurement: "[How measured]"

  scope: |
    [High-level scope description: What is included and what is excluded
    from this business requirement. Define boundaries of MVP/feature set.]

# =============================================================================
# Business Requirements
# =============================================================================

business_requirements:
  - id: "BRD-NN.01.01"
    priority: "P1"  # P1 (Critical), P2 (High), P3 (Medium), P4 (Low)
    description: |
      [Requirement description: Business requirement statement.]

    acceptance_criteria:
      - "[Acceptance criterion 1]"
      - "[Acceptance criterion 2]"

    success_metrics:
      - metric: "[Metric]"
        target: "[Target]"
        measurement: "[How measured]"

    stakeholders:
      - "[Stakeholder 1]"

    dependencies:
      - "[Dependency 1]"

# =============================================================================
# Architecture Decision Requirements (Section 7.2)
# =============================================================================

adr_topics:
  - id: "BRD.NN.32.01"
    category: "Infrastructure"
    title: "Hosting & Deployment"
    status: "Pending"  # Selected | Pending | N/A
    business_driver: "[Why MVP needs this]"
    budget_constraint: "$[X,XXX]/month"
    recommended_selection: "[Option or Pending]"
    prd_requirements: "[What PRD must detail]"

  - id: "BRD.NN.32.02"
    category: "Data Architecture"
    title: "Database & Storage"
    status: "Pending"
    business_driver: "[Data requirements]"
    budget_constraint: "$[X,XXX]/month"
    recommended_selection: "[Option or Pending]"
    prd_requirements: "[What PRD must detail]"

  - id: "BRD.NN.32.03"
    category: "Integration"
    title: "External Systems"
    status: "Pending"
    business_driver: "[Integration needs]"
    recommended_selection: "[Option or Pending]"
    prd_requirements: "[What PRD must detail]"

  - id: "BRD.NN.32.04"
    category: "Security"
    title: "Authentication & Data Protection"
    status: "Pending"
    business_driver: "[Security requirements]"
    compliance_requirements: "[e.g., GDPR, PII encryption]"
    recommended_selection: "[Option or Pending]"
    prd_requirements: "[What PRD must detail]"

  - id: "BRD.NN.32.05"
    category: "Observability"
    title: "Monitoring & Logging"
    status: "Pending"
    business_driver: "[Error tracking needs]"
    recommended_selection: "[Option or Pending]"
    prd_requirements: "[What PRD must detail]"

  - id: "BRD.NN.32.06"
    category: "AI/ML"
    title: "If Applicable"
    status: "N/A"
    rationale: "[Why N/A or what's needed]"

  - id: "BRD.NN.32.07"
    category: "Technology Selection"
    title: "Core Stack"
    status: "Pending"
    business_driver: "[Why technology choice matters]"
    team_constraints: "[Existing skills]"
    recommended_selection: "[Tech stack or Pending]"
    prd_requirements: "[What PRD must detail]"

# =============================================================================
# Traceability
# =============================================================================

traceability:
  tags:
    - "@brd: BRD-NN"

  cross_links:
    depends:
      - "@depends: BRD-NN"   # Hard prerequisite BRDs
    discoverability:
      - "@discoverability: BRD-NN (short rationale)"

  traceability_matrix:
    objectives_to_requirements:
      - objective_id: "BRD.NN.23.01"
        related_frs: ["BRD.NN.01.01", "BRD.NN.01.02"]
        coverage_status: "Complete"

    requirements_to_downstream:
      - fr_id: "BRD.NN.01.01"
        planned_spec: "SPEC-NN-01"
        planned_tasks: "TASKS-NN-01"

  health_score:
    bo_fr_coverage: "[X]%"
    fr_test_coverage: "[X]%"
    target_score: ">=90/100"

