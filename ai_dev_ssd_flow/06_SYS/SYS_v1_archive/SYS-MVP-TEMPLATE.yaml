# =============================================================================
#  Document Authority: PRIMARY STANDARD for Autopilot Workflow
# - Purpose: AI-consumable template for automated SYS artifact generation
# - Validation: Validated by SYS_MVP_SCHEMA.yaml (shared with MD template)
# - Human Reference: See SYS-MVP-TEMPLATE.md for narrative explanations
# - Migration: v2.0 → v2.1 changes section structure (see SYS-MVP-TEMPLATE_FIX_PLAN.md Phase 4.0)
# =============================================================================

# Template metadata
schema_version: "2.1"
instance_document_type: "sys-document"
deliverable_type: "code"  # Options: code, document, ux, risk, process - inherited from ADR
artifact_type: SYS
layer: 6
total_sections: 15
last_updated: "2026-02-26"

id: SYS-NN
summary: "[Single-sentence description: System requirements defining boundaries, functionality, and non-functional requirements]"

# =============================================================================
# Document Control (Section 1)
# =============================================================================

document_control:
  status: "Draft"  # Draft, Review, Approved, Implemented, Deprecated
  version: "1.0"
  date_created: "YYYY-MM-DD"
  last_updated: "YYYY-MM-DD"
  author: "[Primary Author]"
  reviewers: "[Reviewer Names]"
  owner: "[Team/Person]"
  priority: "High"  # High, Medium, Low
  ears_ready_score: "[PASS] 95% (Target: ≥90%)"
  req_ready_score: "[PASS] 95% (Target: ≥90%)"
  source_document: "@prd: PRD.NN.EE.SS"

# =============================================================================
# Sections (15 total) - Array-based structure for autopilot consumption
# =============================================================================

sections:
  - number: 1
    title: "Document Control"
    required: true
    description: "Metadata table with REQ-Ready Score"

  - number: 2
    title: "Executive Summary"
    required: true
    subsections:
      - "2.1 System Context"
      - "2.2 Business Value"

  - number: 3
    title: "Scope"
    required: true
    subsections:
      - "3.1 System Boundaries"
      - "3.2 Acceptance Scope"
      - "3.3 Environmental Assumptions"
    content:
      in_scope:
        - "[In-scope component 1: e.g., User authentication service]"
        - "[In-scope component 2: e.g., Payment processing system]"
      out_of_scope:
        - "[Out-of-scope component 1: e.g., Legacy mainframe integration]"
        - "[Out-of-scope component 2: e.g., Mobile app (separate project)]"

  - number: 4
    title: "Functional Requirements"
    required: true
    subsections:
      - "4.1 Core System Behaviors"
      - "4.2 Data Processing Requirements"
      - "4.3 Error Handling Requirements"
      - "4.4 Integration Requirements"
      - "4.5 External Dependencies"
    content:
      # Element ID format: SYS.NN.01.SS (unified 4-segment)
      requirements:
        - id: "SYS.NN.01.01"
          description: "[Function description: e.g., User authentication]"
          priority: "High"
          triggered_by:
            - "[Trigger 1: User login attempt]"
        - id: "SYS.NN.01.02"
          description: "[Function description: e.g., Data validation]"
          priority: "High"
          triggered_by:
            - "[Trigger 1: User input submission]"

  - number: 5
    title: "Quality Attributes"
    required: true
    subsections:
      - "5.1 Performance Requirements"
      - "5.2 Reliability Requirements"
      - "5.3 Scalability Requirements"
      - "5.4 Security Requirements"
      - "5.5 Observability Requirements"
      - "5.6 Maintainability Requirements"
    content:
      # Element ID format: SYS.NN.02.SS (02 = Quality Attribute type)
      performance:
        - id: "SYS.NN.02.01"
          requirement: "[Performance requirement: e.g., API response time]"
          metric: "p95 latency <= 200ms"
          scope: "All REST API endpoints"
      reliability:
        - id: "SYS.NN.02.05"
          requirement: "[Reliability requirement: e.g., Availability]"
          metric: "99.9% uptime"
          scope: "Production environment"
      security:
        - id: "SYS.NN.02.10"
          requirement: "[Security requirement: e.g., Authentication]"
          metric: "MFA for all admin accounts"
          scope: "Administrative functions"

  - number: 6
    title: "Interface Specifications"
    required: true
    subsections:
      - "6.1 External Interfaces"
      - "6.2 Internal Interfaces"
    content:
      interfaces:
        - name: "[Interface 1: e.g., REST API]"
          type: "REST API"
          protocol: "HTTPS/1.1"
          description: "[Interface description]"

  - number: 7
    title: "Data Management Requirements"
    required: true
    subsections:
      - "7.1 Data Model Requirements"
      - "7.2 Data Lifecycle Management"

  - number: 8
    title: "Testing and Validation Requirements"
    required: true
    subsections:
      - "8.1 Functional Testing Requirements"
      - "8.2 Quality Attribute Testing Requirements"

  - number: 9
    title: "Deployment and Operations Requirements"
    required: true
    subsections:
      - "9.1 Deployment Requirements"
      - "9.2 Operational Requirements"

  - number: 10
    title: "Compliance and Regulatory Requirements"
    required: true
    subsections:
      - "10.1 Business Compliance"
      - "10.2 Security Compliance"

  - number: 11
    title: "Acceptance Criteria"
    required: true
    subsections:
      - "11.1 System Capability Validation"

  - number: 12
    title: "Risk Assessment"
    required: true
    subsections:
      - "12.1 Technical Implementation Risks"
      - "12.2 Business Risks"
      - "12.3 Risk Mitigation Strategies"

  - number: 13
    title: "Traceability"
    required: true
    subsections:
      - "13.1 Upstream Sources"
      - "13.2 Downstream Artifacts"
      - "13.3 BDD Mapping"
      - "13.4 Code Implementation Paths"
      - "13.5 Document Links and Cross-References"
      - "13.6 Validation Evidence"
      - "13.7 Cross-Reference Validation"
      - "13.8 Same-Type References"
      - "13.9 Traceability Tags"
      - "13.10 Thresholds Referenced"

  - number: 14
    title: "Implementation Notes"
    required: true
    subsections:
      - "14.1 Design Considerations"
      - "14.2 Performance Considerations"
      - "14.3 Monitoring and Troubleshooting Strategy"
      - "14.4 Security Implementation Guidance"
      - "14.5 Deployment Strategy Guidance"

  - number: 15
    title: "Change History"
    required: true
    description: "Version history table"

# =============================================================================
# Traceability (Section 13 content)
# =============================================================================

traceability:
  upstream_references:
    brd: "@brd: BRD.NN.EE.SS"
    prd: "@prd: PRD.NN.EE.SS"
    ears: "@ears: EARS.NN.EE.SS"
    bdd: "@bdd: BDD.NN.EE.SS"
    adr: "@adr: ADR-NN"

  downstream_artifacts:
    req: "REQ"
    spec: "SPEC"
    tasks: "TASKS"

  tags:
    - "@sys: SYS.NN.EE.SS"
    - "@brd: BRD.NN.EE.SS"
    - "@prd: PRD.NN.EE.SS"
    - "@ears: EARS.NN.EE.SS"
    - "@bdd: BDD.NN.EE.SS"
    - "@adr: ADR-NN"

  cross_links:
    depends:
      - "@depends: SYS-NN"
    discoverability:
      - "@discoverability: SYS-NN (short rationale)"

