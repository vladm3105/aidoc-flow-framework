# =============================================================================
#  Document Role: This is a DERIVATIVE of template(s)
# - Authority:
#   * MD Template: ADR-MVP-TEMPLATE.md (primary for human workflow)
#   * YAML Template: ADR-MVP-TEMPLATE.yaml (primary for autopilot workflow)
# - Purpose: Machine-readable validation rules for both MD and YAML documents
# - On conflict: Defer to respective template (MD or YAML based on document format)
# =============================================================================
#
# Authority Hierarchy:
# Human Workflow:  MD Template → YAML Schema (validates MD) → Validators
# Autopilot:    YAML Template → YAML Schema (validates YAML) → Validators
#
# Schema is DERIVATIVE of both templates (dual-authority)
#
# ADR Schema Definition v1.0
# Purpose: Define valid metadata structure and validation rules for ADR documents
# Usage: Reference by validate_adr.py for automated validation

schema_version: "1.1"
artifact_type: ADR
layer: 5
last_updated: "2026-02-26"
total_sections: 11

references:
  md_template: "ADR-MVP-TEMPLATE.md"
  yaml_template: "ADR-MVP-TEMPLATE.yaml"
  creation_rules: "ADR_MVP_CREATION_RULES.md"
  validation_rules: "ADR_MVP_VALIDATION_RULES.md"

# =============================================================================
# Profiles (Full vs MVP)
# =============================================================================

profiles:
  default: full
  allowed:
    - full
    - mvp
  mvp:
    enforcement_level: optional
    notes:
      - "MVP ADRs focus on a single decision with 2-3 alternatives."
      - "Validators should downgrade missing deep analysis sections to warnings."

# =============================================================================
# YAML Frontmatter Requirements
# =============================================================================

metadata:
  # Required fields in custom_fields
  required_custom_fields:
    document_type:
      type: string
      required: true
      allowed_values: ["adr", "adr-document", "template"]
      description: "Use 'adr-document' for instances, 'template' for templates, 'adr' for legacy"

    instance_document_type:
      type: string
      required: false
      allowed_values: ["adr-document"]
      description: "Used by templates to specify document type for generated instances"

    deliverable_type:
      type: string
      required: false
      enum: [code, document, ux, risk, process]
      default: code
      inherit_from: upstream
      description: "Deliverable type - inherited from BDD or set explicitly"
      routing:
        code: CSPEC
        document: DSPEC
        ux: UXSPEC
        risk: RISKSPEC
        process: PROCSPEC

    artifact_type:
      type: string
      required: true
      allowed_values: ["ADR"]
      description: "Must be uppercase 'ADR'"

    layer:
      type: integer
      required: true
      allowed_values: [5]
      description: "ADR is always Layer 5 artifact"

    architecture_approaches:
      type: array
      required: true
      allowed_values:
        - ["ai-agent-based"]
        - ["traditional-8layer"]
        - ["ai-agent-based", "traditional-8layer"]
      description: "Must be array format, not 'architecture_approach' string"

    priority:
      type: string
      required: true
      allowed_values: ["primary", "shared", "fallback"]
      description: "Classification tier based on architecture"

    status:
      type: string
      required: true
      allowed_values: ["development", "production", "active", "draft", "deprecated", "reference", "planned"]
      description: "Lifecycle status (canonical)"

  # Optional custom_fields
  optional_custom_fields:
    development_status:
      type: string
      required: false
      allowed_values: ["active", "draft", "deprecated", "reference", "planned"]
      description: "Legacy compatibility field; use status for new/updated documents"

    agent_id:
      type: string
      pattern: "^AGENT-\\d{2,}$"
      description: "Required for ai-agent-primary documents"

    template_for:
      type: string
      description: "Required when document_type is 'template'"

    template_profile:
      type: string
      allowed_values: ["mvp", "full"]
      description: "Template profile hint for validators (e.g., 'mvp')"

  # Required tags
  required_tags:
    - adr                 # Primary identifier (or adr-template for templates)
    - layer-5-artifact    # Layer identifier - REQUIRED

  # Forbidden tag patterns (will fail validation)
  forbidden_tag_patterns:
    - "^architecture-decision$"   # Use 'adr' instead
    - "^decision-record$"         # Use 'adr' instead
    - "^adr-\\d{2,}$"              # Don't include document number in tags

# =============================================================================
# Document Structure Requirements
# =============================================================================

structure:
  # Document organized with 11 required sections (MVP structure aligned with template)
  total_sections: 11

  # Required sections (aligned with ADR-MVP-TEMPLATE.md)
  required_sections:
    - pattern: "^# ADR-\\d{2,}:"
      name: "Title (H1)"
      description: "Single H1 with format ADR-NN: Title"

    - pattern: "^## 1\\. Document Control$"
      name: "Document Control"
      description: "Section 1 - Contains metadata table with SYS-Ready Score"

    - pattern: "^## 2\\. Context$"
      name: "Context"
      description: "Section 2 with Problem Statement, Technical Context"

    - pattern: "^## 3\\. Decision$"
      name: "Decision"
      description: "Section 3 with Chosen Solution, Key Components, Implementation Approach"

    - pattern: "^## 4\\. Alternatives Considered$"
      name: "Alternatives Considered"
      description: "Section 4 with Options A, B, C evaluation"

    - pattern: "^## 5\\. Consequences$"
      name: "Consequences"
      description: "Section 5 with Positive Outcomes, Trade-offs, Cost Estimate"

    - pattern: "^## 6\\. Architecture Flow$"
      name: "Architecture Flow"
      description: "Section 6 with Mermaid diagram and Integration Points"

    - pattern: "^## 7\\. Implementation Assessment$"
      name: "Implementation Assessment"
      description: "Section 7 with Phases, Rollback Plan, Monitoring"

    - pattern: "^## 8\\. Verification$"
      name: "Verification"
      description: "Section 8 with Success Criteria, BDD Scenarios"

    - pattern: "^## 9\\. Traceability$"
      name: "Traceability"
      description: "Section 9 with upstream/downstream refs, tags, cross-links"

    - pattern: "^## 10\\. Related Decisions$"
      name: "Related Decisions"
      description: "Section 10 with dependency and supersession references"

    - pattern: "^## 11\\. MVP Lifecycle$"
      name: "MVP Lifecycle"
      description: "Section 11 with lifecycle phases and ADR iteration guidance"

  # No optional sections in MVP template - all 11 sections are required

  # Document Control table requirements
  document_control:
    required_fields:
      - Project Name
      - Document Version
      - Date
      - Document Owner
      - Prepared By
      - Status

    optional_fields:
      - ADR-Ready Score

    status_values:
      - Draft
      - "In Review"
      - Approved
      - Proposed
      - Superseded
      - Deprecated

  # Section numbering rules
  section_numbering:
    start: 1
    format: "## N. Section Title"
    subsection_format: "### N.N Subsection Title"
    no_duplicate_numbers: true

  # File naming convention
  file_naming:
    pattern: "^ADR-\\d{2,}_[a-z0-9_]+\\.md$"
    description: "Format: ADR-NN_descriptive_name.md"

# =============================================================================
# ADR-Specific Patterns
# =============================================================================

adr_patterns:
  # Status values
  status_values:
    - value: "Proposed"
      description: "Decision under consideration"
    - value: "Accepted"
      description: "Decision approved for implementation"
    - value: "Deprecated"
      description: "Decision no longer applicable"
    - value: "Superseded"
      description: "Decision replaced by another ADR"

  # Context subsections (required)
  context_subsections:
    required:
      - "### 4.1 Problem Statement"
      - "### 4.2 Background"
      - "### 4.3 Driving Forces"
      - "### 4.4 Constraints"
    optional:
      - "### 4.5 Technology Stack Compliance"

  # Decision subsections (required)
  decision_subsections:
    required:
      - "### 5.1 Chosen Solution"
      - "### 5.2 Key Components"
      - "### 5.3 Implementation Approach"

  # Consequences subsections (required)
  consequences_subsections:
    required:
      - "### 7.1 Positive Outcomes"
      - "### 7.2 Negative Outcomes"

  # Implementation Assessment subsections
  implementation_assessment:
    required:
      - "### 9.1 Complexity Evaluation"
      - "### 9.2 Dependencies"
    optional:
      - "### 9.3 Resources"
      - "### 9.4 Failure Modes & Recovery"
      - "### 9.5 Rollback Plan"
      - "### 9.6 Compatibility"
      - "### 9.7 Monitoring & Observability"

  # Architecture Flow (Mermaid diagram)
  architecture_flow:
    required: true
    format: "mermaid"
    diagram_types:
      - "flowchart"
      - "sequenceDiagram"
      - "stateDiagram-v2"

  # ADR-Ready Score components
  adr_ready_score:
    min_threshold: 90
    components:
      problem_statement:
        weight: 15
        criteria: "Clear technical problem requiring architectural resolution"
      context_completeness:
        weight: 15
        criteria: "Background, driving forces, constraints documented"
      decision_clarity:
        weight: 20
        criteria: "Solution, components, approach clearly defined"
      consequences_analysis:
        weight: 15
        criteria: "Positive and negative outcomes documented"
      architecture_diagram:
        weight: 10
        criteria: "Mermaid flowchart with interactions"
      implementation_assessment:
        weight: 15
        criteria: "Complexity, dependencies, failure modes"
      traceability:
        weight: 10
        criteria: "Upstream 02_PRD/03_EARS/BDD references"

# =============================================================================
# Validation Rules
# =============================================================================

validation_rules:
  # Metadata validation
  metadata:
    - rule: "document_type must be 'adr' or 'template'"
      severity: error

    - rule: "architecture_approaches must be array"
      severity: error
      fix: "Change 'architecture_approach: value' to 'architecture_approaches: [value]'"

    - rule: "tags must include 'adr' (or 'adr-template') and 'layer-5-artifact'"
      severity: error

    - rule: "forbidden tag patterns must not appear"
      severity: error

  # Structure validation
  structure:
    - rule: "Single H1 heading only"
      severity: warning

    - rule: "Sections 1-11 are required (MVP template structure)"
      severity: error

    - rule: "Document Control must have minimum 6 fields"
      severity: error

    - rule: "File name must match ADR-NN_name.md format"
      severity: warning

  # Content validation
  content:
    - rule: "Context section must include Problem Statement subsection"
      severity: error

    - rule: "Context section must include Constraints subsection"
      severity: warning

    - rule: "Decision section must include Chosen Solution"
      severity: error

    - rule: "Consequences section must include both Positive and Negative Outcomes"
      severity: error

    - rule: "Architecture Flow must contain Mermaid diagram"
      severity: warning

    - rule: "Implementation Assessment must include Complexity Evaluation"
      severity: warning

    - rule: "Requirements Satisfied must reference 02_PRD/03_EARS/BDD documents"
      severity: warning

# =============================================================================
# Cross-Reference Requirements (Cumulative Tagging - Layer 5)
# =============================================================================

traceability:
  # Cumulative tagging requirements for Layer 5
  cumulative_tags:
    layer: 5
    required:
      - "@brd: BRD.NN.EE.SS"
      - "@prd: PRD.NN.EE.SS"
      - "@ears: EARS.NN.EE.SS"
      - "@bdd: BDD.NN.EE.SS"
    description: "Layer 5 requires @brd, @prd, @ears, @bdd tags for complete traceability"

  upstream:
    required:
      - type: BRD
        format: "@brd: BRD.NN.EE.SS"
        location: "Traceability section or Requirements Satisfied"
      - type: PRD
        format: "@prd: PRD.NN.EE.SS"
        location: "Traceability section or Requirements Satisfied"
      - type: EARS
        format: "@ears: EARS.NN.EE.SS"
        location: "Traceability section or Requirements Satisfied"
      - type: BDD
        format: "@bdd: BDD.NN.EE.SS"
        location: "Traceability section or Requirements Satisfied"

  downstream:
    expected:
      - type: SYS
        format: "SYS"   # Generic name only; do not reference numeric IDs until they exist
      - type: REQ
        format: "REQ"   # Generic name only; do not reference numeric IDs until they exist
      - type: SPEC
        format: "SPEC"  # Generic name only; do not reference numeric IDs until they exist

  same_type:
    optional:
      - type: ADR
        format: "@related-adr: ADR-NN"
        description: "Related ADR document sharing architectural context"
      - type: ADR
        format: "@supersedes: ADR-NN"
        description: "ADR that this decision supersedes"
      - type: ADR
        format: "@depends-adr: ADR-NN"
        description: "Prerequisite ADR document"

# =============================================================================
# Error Messages
# =============================================================================

error_messages:
  ADR-E001: "Missing required tag 'adr'"
  ADR-E002: "Missing required tag 'layer-5-artifact'"
  ADR-E003: "Invalid document_type: must be 'adr' or 'template'"
  ADR-E004: "Invalid architecture format: use 'architecture_approaches: [value]' array"
  ADR-E005: "Forbidden tag pattern detected"
  ADR-E006: "Missing required section"
  ADR-E007: "Multiple H1 headings detected"
  ADR-E008: "Missing Context section (Section 4)"
  ADR-E009: "Missing Decision section (Section 5)"
  ADR-E010: "Missing Consequences section (Section 7)"
  ADR-E011: "Context missing Problem Statement subsection"
  ADR-E012: "Decision missing Chosen Solution subsection"
  ADR-E013: "Consequences missing Positive or Negative Outcomes"
  ADR-E014: "File name does not match ADR-NN_name.md format"
  ADR-W001: "Missing Architecture Flow Mermaid diagram"
  ADR-W002: "Context missing Constraints subsection"
  ADR-W003: "Missing upstream traceability tags (@prd, @ears, @bdd)"
  ADR-W004: "Implementation Assessment missing Complexity Evaluation"
  ADR-W005: "SYS-Ready Score below 90% threshold"
  ADR-W006: "Requirements Satisfied table missing"
  ADR-I001: "Consider adding Alternatives Considered section"
  ADR-I002: "Consider adding Security Considerations section"
  ADR-I003: "Consider adding Rollback Plan in Implementation Assessment"
