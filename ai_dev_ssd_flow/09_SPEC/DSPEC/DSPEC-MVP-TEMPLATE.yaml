# =============================================================================
#  Document Authority: PRIMARY STANDARD for Autopilot Workflow
# - Purpose: AI-consumable template for automated DSPEC artifact generation
# - Validation: Validated by DSPEC_MVP_SCHEMA.yaml
# - Human Reference: See DSPEC-MVP-TEMPLATE.md for narrative explanations
# - Parent: SPEC (orchestrator) - routes here when deliverable_type == 'document'
# =============================================================================

id: document_name
summary: "Single-sentence description of documentation artifact purpose, scope, and target audience."

# =============================================================================
# Metadata
# =============================================================================

metadata:
  schema_version: "1.0"
  instance_document_type: "dspec-document"
  deliverable_type: "document"  # Fixed for DSPEC - inherited from REQ

document_control:
  status: "draft"  # draft, review, approved, published, deprecated
  version: "1.0.0"
  created_date: "YYYY-MM-DD"
  last_updated: "YYYY-MM-DD"
  author: "[Primary Author]"
  doc_ready_score: "[PASS] 90% (Target: >=85%)"
  ctr_required: false  # CTR is optional for document specifications

custom_fields:
  document_type: template
  instance_document_type: dspec-document
  artifact_type: DSPEC
  layer: 9
  subtype_code: 51
  parent_type: SPEC
  deliverable_output: document
  readiness_score: DOC-Ready
  ctr_required: false

# =============================================================================
# Traceability
# =============================================================================

traceability:
  upstream_references:
    brd: "@brd: BRD.NN.EE.SS"
    prd: "@prd: PRD.NN.EE.SS"
    ears: "@ears: EARS.NN.EE.SS"
    bdd: "@bdd: BDD.NN.EE.SS"
    adr: "@adr: ADR-NN"
    sys: "@sys: SYS.NN.EE.SS"
    req: "@req: REQ.NN.EE.SS"
    ctr: "@ctr: CTR-NN"  # Optional

  downstream_artifacts:
    tasks: "TASKS"
    docs: "docs/"

  tags:
    - "@dspec: DSPEC.NN.55.SS"
    - "@req: REQ.NN.EE.SS"

  cross_links:
    depends:
      - "@depends: DSPEC-NN"
    discoverability:
      - "@discoverability: DSPEC-NN (short rationale)"

# =============================================================================
# Document Specification
# =============================================================================

document_specification:
  document_type: "user_guide"  # user_guide, api_doc, compliance_doc, training_material, reference
  format: "markdown"  # markdown, pdf, html, docx
  audience: "end_users"  # end_users, developers, auditors, operators

  content_outline:
    - id: "DSPEC.NN.55.01"
      section: "[Section Name]"
      purpose: "[Section purpose]"
      content_requirements: "[What must be included]"
    - id: "DSPEC.NN.55.02"
      section: "[Section Name]"
      purpose: "[Section purpose]"
      content_requirements: "[What must be included]"
    - id: "DSPEC.NN.55.03"
      section: "[Section Name]"
      purpose: "[Section purpose]"
      content_requirements: "[What must be included]"

  topics:
    - id: "DSPEC.NN.56.01"
      topic: "[Topic Name]"
      parent_section: "DSPEC.NN.55.01"
      description: "[Topic description]"
      prerequisites: "[Required knowledge]"
    - id: "DSPEC.NN.56.02"
      topic: "[Topic Name]"
      parent_section: "DSPEC.NN.55.01"
      description: "[Topic description]"
      prerequisites: "[Required knowledge]"

  examples:
    - id: "DSPEC.NN.57.01"
      example: "[Example Name]"
      context: "[Where used]"
      purpose: "[What it demonstrates]"

  references:
    - id: "DSPEC.NN.58.01"
      reference: "[Reference Name]"
      type: "external"  # external, internal
      url_or_path: "[URL or path]"

# =============================================================================
# Style Requirements
# =============================================================================

style_requirements:
  tone: "formal"  # formal, informal, technical
  voice: "active"  # active, passive, mixed
  person: "second"  # first, second, third
  reading_level: "intermediate"  # basic, intermediate, advanced

  formatting:
    headings: "[Heading conventions]"
    code_blocks: "[Code formatting requirements]"
    lists: "[List formatting requirements]"
    tables: "[Table formatting requirements]"
    images: "[Image requirements and captions]"

  terminology:
    - term: "[Term 1]"
      definition: "[Definition]"
      usage_context: "[When to use]"

# =============================================================================
# Review Criteria
# =============================================================================

review_criteria:
  accuracy:
    technical_accuracy: "[How to verify technical content]"
    code_examples: "[How to verify code works]"
    links: "[How to verify links are valid]"

  completeness:
    all_sections: "[All outline sections must be present]"
    all_features: "[All features must be documented]"
    all_examples: "[Required examples must be included]"

  clarity:
    sentence_length: "[Maximum sentence length]"
    paragraph_length: "[Maximum paragraph length]"
    jargon_policy: "[Jargon usage policy]"
    readability_score: "[Target Flesch-Kincaid or similar]"

# =============================================================================
# Dependencies
# =============================================================================

dependencies:
  source_materials:
    - source: "[Source 1]"
      type: "[API spec / design doc / etc.]"
      status: "available"  # available, pending
    - source: "[Source 2]"
      type: "[API spec / design doc / etc.]"
      status: "pending"

  subject_matter_experts:
    - expert: "[Name]"
      domain: "[Domain expertise]"
      contact: "[Contact info]"

# =============================================================================
# Verification
# =============================================================================

verification:
  review_workflow:
    - stage: "technical_review"
      reviewer: "[Reviewer role]"
      criteria: "[Technical accuracy]"
    - stage: "editorial_review"
      reviewer: "[Reviewer role]"
      criteria: "[Style and clarity]"
    - stage: "final_approval"
      reviewer: "[Approver role]"
      criteria: "[Publication readiness]"

  testing:
    - type: "link_validation"
      description: "All internal and external links verified"
    - type: "code_testing"
      description: "All code examples executed and verified"
    - type: "screenshot_accuracy"
      description: "All screenshots match current UI"

# =============================================================================
# Implementation
# =============================================================================

implementation:
  output_location: "docs/[category]/"
  file_naming: "[Naming convention]"
  version_control: "[Git branch strategy]"
  publication_channel: "[Where published]"

  tools:
    - name: "[Tool 1]"
      purpose: "[Purpose]"
    - name: "[Tool 2]"
      purpose: "[Purpose]"

# =============================================================================
# Template Metadata
# =============================================================================

# Template Reference: DSPEC-MVP-TEMPLATE.md (for narrative explanations)
# Schema: DSPEC_MVP_SCHEMA.yaml (for validation rules)
# Creation Rules: DSPEC_MVP_CREATION_RULES.md (for guidance)
# Validation Rules: DSPEC_MVP_VALIDATION_RULES.md (for checklist)

# DSPEC Notes:
# - Inherits from SPEC parent (Layer 9)
# - subtype_code: 51 (document specification)
# - CTR required: No (optional for API documentation)
# - Readiness score: DOC-Ready >= 85%
# - Element IDs: DSPEC.NN.55.SS (section), DSPEC.NN.56.SS (topic), etc.

# =============================================================================
