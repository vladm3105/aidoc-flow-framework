# =============================================================================
#  Document Authority: PRIMARY STANDARD for Autopilot Workflow
# - Purpose: AI-consumable template for automated CSPEC artifact generation
# - Validation: Validated by CSPEC_MVP_SCHEMA.yaml
# - Human Reference: See CSPEC-MVP-TEMPLATE.md for narrative explanations
# - Parent: SPEC (orchestrator) - routes here when deliverable_type == 'code'
# =============================================================================

id: component_name
summary: "Single-sentence description of code component purpose, scope, and primary value proposition."

# =============================================================================
# Metadata
# =============================================================================

metadata:
  schema_version: "1.0"
  instance_document_type: "cspec-document"
  deliverable_type: "code"  # Fixed for CSPEC - inherited from REQ

document_control:
  status: "draft"  # draft, review, approved, implemented, deprecated
  version: "1.0.0"
  created_date: "YYYY-MM-DD"
  last_updated: "YYYY-MM-DD"
  author: "[Primary Author]"
  tasks_ready_score: "[PASS] 95% (Target: >=90%)"
  ctr_required: true  # CTR is required for code specifications

custom_fields:
  document_type: template
  instance_document_type: cspec-document
  artifact_type: CSPEC
  layer: 9
  subtype_code: 50
  parent_type: SPEC
  deliverable_output: code
  readiness_score: TASKS-Ready
  ctr_required: true

# =============================================================================
# Traceability
# =============================================================================

traceability:
  upstream_references:
    brd: "@brd: BRD.NN.EE.SS"
    prd: "@prd: PRD.NN.EE.SS"
    ears: "@ears: EARS.NN.EE.SS"
    bdd: "@bdd: BDD.NN.EE.SS"
    adr: "@adr: ADR-NN"
    sys: "@sys: SYS.NN.EE.SS"
    req: "@req: REQ.NN.EE.SS"
    ctr: "@ctr: CTR-NN"
    threshold: "PRD-NN"

  downstream_artifacts:
    tasks: "TASKS"
    code: "src/"
    tests: "tests/"

  tags:
    - "@cspec: CSPEC.NN.50.SS"
    - "@req: REQ.NN.EE.SS"
    - "@ctr: CTR-NN"

  cross_links:
    depends:
      - "@depends: CSPEC-NN"
    discoverability:
      - "@discoverability: CSPEC-NN (short rationale)"

# =============================================================================
# Architecture
# =============================================================================

architecture:
  overview: |
    [High-level component description including purpose, technologies, and integration.
    Describe the architectural pattern, key components, and how they interact.]

  component_structure:
    - name: "[Component 1]"
      responsibility: "[What this component does]"
      dependencies: ["[Dependency 1]", "[Dependency 2]"]
    - name: "[Component 2]"
      responsibility: "[What this component does]"
      dependencies: ["[Dependency 1]"]

  element_ids:
    - id: "CSPEC.NN.50.01"
      type: "interface"
      name: "[Interface name]"
      description: "[Interface description]"
    - id: "CSPEC.NN.51.01"
      type: "method"
      name: "[Method name]"
      description: "[Method description]"
    - id: "CSPEC.NN.52.01"
      type: "model"
      name: "[Data model name]"
      description: "[Model description]"

  pattern: "service"  # service, library, component, integration
  domain: "[business_domain]"
  category: "[functional_category]"

  dependencies:
    internal:
      - name: "[internal_component]"
        interface: "[component_interface]"
        version: ">=1.0.0"
        required: true
    external:
      - name: "[external_service]"
        interface: "[API_contract]"
        protocol: "https"
        required: false
        fallback_strategy: "[fallback]"

# =============================================================================
# Interfaces
# =============================================================================

interfaces:
  external_apis:
    - endpoint: "[HTTP_METHOD] /api/v1/[resource]"
      method: "[GET|POST|PUT|DELETE|PATCH]"
      auth: "[None|JWT Bearer|API Key]"
      rate_limit: "[N] req/min"
      request_schema:
        type: "object"
        required: ["[field1]"]
        properties:
          field1: { type: "string" }
      response_schema:
        type: "object"
        properties:
          result: { type: "string" }
      latency_target: "@threshold: PRD.NN.perf.api.p95_latency"

  internal_apis:
    - interface: "[ClassName].[method_name]()"
      signature: "[def method_name(param: Type) -> ReturnType]"
      purpose: |
        1. [Step 1 description]
        2. [Step 2 description]
        3. [Step 3 description]

  classes:
    - name: "[PrimaryServiceClass]"
      description: "[Class description]"
      constructor:
        params:
          config:
            type: object
            required: true
      methods:
        - name: "[method_name]"
          description: "[Method description]"
          input:
            param_name:
              type: string
              required: true
          output:
            success:
              type: boolean
          errors:
            VALIDATION_ERROR:
              code: "VALIDATION_ERROR"
              message: "[Error message]"
              http_status: 400

# =============================================================================
# Behavior
# =============================================================================

behavior:
  lifecycle:
    startup_sequence:
      - "[Step 1]"
      - "[Step 2]"
    shutdown_sequence:
      - "[Step 1]"
      - "[Step 2]"

  state_management:
    states:
      - UNINITIALIZED
      - ACTIVE
      - COMPLETED
      - ERROR
    transitions:
      - from: "UNINITIALIZED"
        to: "ACTIVE"
        trigger: "[trigger]"
        side_effects: ["[effect 1]"]
    invariants:
      - "[Invariant 1]"

  request_processing:
    concurrency_model: "async"
    max_concurrent_requests: 100
    timeout_handling:
      request_timeout_seconds: 30

# =============================================================================
# Performance
# =============================================================================

performance:
  latency_targets:
    p50_milliseconds: "@threshold: PRD.NN.perf.api.p50_latency"
    p95_milliseconds: "@threshold: PRD.NN.perf.api.p95_latency"
    p99_milliseconds: "@threshold: PRD.NN.perf.api.p99_latency"

  throughput_targets:
    sustained_requests_per_second: "@threshold: PRD.NN.limit.api.requests_per_second"

  resource_limits:
    cpu_cores_allocated: "@threshold: PRD.NN.resource.compute.cpu_cores"
    memory_mb_allocated: "@threshold: PRD.NN.resource.memory.max_heap"

# =============================================================================
# Security
# =============================================================================

security:
  authentication:
    required: true
    methods: ["bearer_jwt", "api_key"]
  authorization:
    enabled: true
    model: "role_based_access_control"
  input_validation:
    strategy: "schema_based_validation"
    sanitization_enabled: true

# =============================================================================
# Observability
# =============================================================================

observability:
  metrics:
    standard_metrics:
      - name: "component_requests_total"
        type: "counter"
        labels: ["method", "endpoint", "status_code"]
      - name: "component_request_duration_seconds"
        type: "histogram"
        buckets: [0.1, 0.5, 1.0, 2.0, 5.0]

  logging:
    level: "INFO"
    format: "json"
    correlation_tracking_enabled: true

  health_checks:
    enabled: true
    endpoints:
      - path: "/health/live"
        checks: ["memory_usage", "thread_deadlock"]
      - path: "/health/ready"
        checks: ["database_connectivity", "dependencies"]

# =============================================================================
# Verification
# =============================================================================

verification:
  bdd_scenarios:
    - "04_BDD/BDD-NN_{suite}/BDD-NN.SS_{slug}.feature#scenario-name"

  performance_tests:
    - target_p95_latency_ms: "@threshold: PRD.NN.perf.api.p95_latency"
      test_scenario: "[test_name]"

  integration_tests:
    - dependencies_tested: ["[dependency1]", "[dependency2]"]
      coverage_target_percent: 85

# =============================================================================
# Implementation
# =============================================================================

implementation:
  language: "python"
  framework: "fastapi"
  module_path: "src/[module]/[component].py"
  entry_point: "main.py"

  dependencies:
    runtime:
      - name: "[package]"
        version: ">=1.0.0"
    development:
      - name: "pytest"
        version: ">=7.0.0"

  environment_variables:
    - name: "[ENV_VAR]"
      required: true
      sensitive: false
      description: "[Description]"

# =============================================================================
# Template Metadata
# =============================================================================

# Template Reference: CSPEC-MVP-TEMPLATE.md (for narrative explanations)
# Schema: CSPEC_MVP_SCHEMA.yaml (for validation rules)
# Creation Rules: CSPEC_MVP_CREATION_RULES.md (for guidance)
# Validation Rules: CSPEC_MVP_VALIDATION_RULES.md (for checklist)

# CSPEC Notes:
# - Inherits from SPEC parent (Layer 9)
# - subtype_code: 50 (code specification)
# - CTR required: Yes (API/data contracts for code)
# - Readiness score: TASKS-Ready >= 90%
# - Element IDs: CSPEC.NN.50.SS (interface), CSPEC.NN.51.SS (method), etc.

# =============================================================================
