# =============================================================================
#  Document Role: DERIVATIVE of RISKSPEC-MVP-TEMPLATE.yaml
# - Authority: RISKSPEC-MVP-TEMPLATE.yaml is PRIMARY
# - Purpose: Machine-readable validation rules for RISKSPEC YAML documents
# - On conflict: Defer to RISKSPEC-MVP-TEMPLATE.yaml
# =============================================================================

schema_version: "1.0"
artifact_type: RISKSPEC
layer: 9
subtype_code: 53
parent_type: SPEC
last_updated: "2026-03-01"
deliverable_type: risk

references:
  md_template: "RISKSPEC-MVP-TEMPLATE.md"
  yaml_template: "RISKSPEC-MVP-TEMPLATE.yaml"
  parent_schema: "../SPEC_MVP_SCHEMA.yaml"
  creation_rules: "RISKSPEC_MVP_CREATION_RULES.md"
  validation_rules: "RISKSPEC_MVP_VALIDATION_RULES.md"

# =============================================================================
# RISKSPEC-Specific Metadata
# =============================================================================

riskspec_metadata:
  description: "Risk Analysis Specification - Risk assessments, impact analyses, and control measures"
  deliverable_output: "Risk matrices, Impact assessments, Control measures"
  ctr_required: false
  readiness_score: "RISK-Ready"
  readiness_target: 90

# =============================================================================
# File Format Requirements
# =============================================================================

file_format:
  extension: ".yaml"
  naming_pattern: "^RISKSPEC-\\d{2,}_[a-z0-9_]+\\.yaml$"
  description: "Format: RISKSPEC-NN_descriptive_name.yaml"
  encoding: "UTF-8"
  yaml_version: "1.2"

# =============================================================================
# Required Fields (inherits from SPEC with RISKSPEC-specific additions)
# =============================================================================

top_level:
  required_fields:
    id:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: "Risk domain identifier (snake_case)"

    summary:
      type: string
      min_length: 10
      max_length: 200
      description: "Single-sentence description of risk domain purpose"

    metadata:
      type: object
      required: true
      fields:
        schema_version:
          type: string
          required: true
        instance_document_type:
          type: string
          required: true
          allowed_values: ["riskspec-document"]
        deliverable_type:
          type: string
          required: true
          allowed_values: ["risk"]

    document_control:
      type: object
      required: true
      fields:
        ctr_required:
          type: boolean
          required: true
          default: false
          description: "CTR is NOT required for risk specifications"

    traceability:
      type: object
      required: true
      description: "Must include REQ upstream reference"

    section_3_risk_specification:
      type: object
      required: true
      description: "Risk framework, matrix, and register"
      fields:
        risk_framework:
          type: string
          required: true
          allowed_values: ["ISO31000", "NIST", "FAIR", "custom"]
        assessment_type:
          type: string
          required: true
          allowed_values: ["qualitative", "quantitative", "hybrid"]
        risk_matrix:
          type: object
          required: true
        risk_register:
          type: array
          required: true
          min_items: 1
        controls:
          type: array
          required: true
          min_items: 1

    mitigations:
      type: object
      required: true
      description: "Mitigation strategies and definitions"

    assessments:
      type: object
      required: true
      description: "Impact assessments and residual risk"

    monitoring:
      type: object
      required: true
      description: "KRIs and review schedules"

    verification:
      type: object
      required: true
      description: "Audit tests and BDD scenarios"

# =============================================================================
# Element Type Codes (RISKSPEC-specific)
# =============================================================================

element_type_codes:
  65: "risk"
  66: "control"
  67: "mitigation"
  68: "assessment"

element_id_format: "RISKSPEC.{DOC}.{TYPE}.{SEQ}"
element_id_example: "RISKSPEC.01.6887"

# =============================================================================
# Risk Categories
# =============================================================================

risk_categories:
  - operational
  - financial
  - compliance
  - security
  - strategic

control_types:
  - preventive
  - detective
  - corrective

mitigation_strategies:
  - avoid
  - transfer
  - mitigate
  - accept

impact_areas:
  - operations
  - financial
  - reputation
  - legal
  - safety

# =============================================================================
# Validation Rules
# =============================================================================

validation_rules:
  structure:
    - rule: "File must be valid YAML"
      severity: error
    - rule: "All required top-level fields must be present"
      severity: error
    - rule: "File name must match RISKSPEC-NN_name.yaml format"
      severity: warning
    - rule: "deliverable_type must be 'risk'"
      severity: error

  traceability:
    - rule: "upstream_references must include REQ"
      severity: error
    - rule: "cumulative_tags must include all upstream tags through REQ"
      severity: warning

  risk_specification:
    - rule: "risk_framework must be specified"
      severity: error
    - rule: "At least one risk must be defined in risk_register"
      severity: error
    - rule: "At least one control must be defined"
      severity: error
    - rule: "Each risk must have likelihood and impact scores"
      severity: error
    - rule: "Risk categories must be from allowed list"
      severity: warning

  controls:
    - rule: "Each control must reference a valid risk_id"
      severity: error
    - rule: "Control types must be preventive, detective, or corrective"
      severity: error
    - rule: "Each control must have an owner"
      severity: warning

  mitigations:
    - rule: "Each mitigation must reference a valid risk_id"
      severity: error
    - rule: "Mitigation strategy must be avoid, transfer, mitigate, or accept"
      severity: error

  assessments:
    - rule: "Residual risk must be calculated for each risk"
      severity: error
    - rule: "Residual score must be less than or equal to inherent score"
      severity: warning

# =============================================================================
# Scoring Criteria (RISK-Ready)
# =============================================================================

scoring:
  name: "RISK-Ready"
  target: 90
  criteria:
    risk_identification:
      weight: 25
      description: "All risks identified with categories and descriptions"
    impact_assessment:
      weight: 25
      description: "Likelihood and impact scores, risk calculations"
    mitigation_strategies:
      weight: 20
      description: "Avoid/transfer/mitigate/accept strategies defined"
    control_measures:
      weight: 15
      description: "Preventive/detective/corrective controls specified"
    traceability:
      weight: 15
      description: "All upstream/downstream links complete"

# =============================================================================
# Error Messages
# =============================================================================

error_messages:
  RISKSPEC-E001: "File is not valid YAML"
  RISKSPEC-E002: "Missing required top-level field"
  RISKSPEC-E003: "deliverable_type must be 'risk'"
  RISKSPEC-E004: "Missing risk_framework specification"
  RISKSPEC-E005: "Missing REQ reference in traceability"
  RISKSPEC-E006: "No risks defined in risk_register"
  RISKSPEC-E007: "No controls defined"
  RISKSPEC-E008: "Risk missing likelihood or impact score"
  RISKSPEC-E009: "Control references invalid risk_id"
  RISKSPEC-E010: "Mitigation references invalid risk_id"
  RISKSPEC-W001: "Risk category not from standard list"
  RISKSPEC-W002: "Control missing owner"
  RISKSPEC-W003: "Missing BDD scenario references"
  RISKSPEC-W004: "Residual risk exceeds inherent risk"

# =============================================================================
