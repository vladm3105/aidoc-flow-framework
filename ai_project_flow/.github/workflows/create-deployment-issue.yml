name: Create Deployment Issue

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to create deployment issue for'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  GH_HOST: "{GITHUB_HOST}"

jobs:
  create-deployment-issue:
    name: Create Deployment Issue
    runs-on: self-hosted
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true)
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT

          # Get PR details
          PR_DATA=$(GH_HOST={GITHUB_HOST} gh pr view ${PR_NUMBER} --json title,body,mergedAt,headRefName)
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          PR_BODY=$(echo "$PR_DATA" | jq -r '.body')
          MERGED_AT=$(echo "$PR_DATA" | jq -r '.mergedAt')
          BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')

          echo "title=${PR_TITLE}" >> $GITHUB_OUTPUT
          echo "merged_at=${MERGED_AT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

          # Extract linked issue number from PR body (Closes #N, Fixes #N, Resolves #N)
          DEV_ISSUE=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves)\s*#[0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "dev_issue=${DEV_ISSUE}" >> $GITHUB_OUTPUT

      - name: Skip if no linked development issue
        if: steps.pr.outputs.dev_issue == ''
        run: |
          echo "::warning::No linked development issue found in PR body. Skipping deployment issue creation."
          echo "PR should contain 'Closes #N', 'Fixes #N', or 'Resolves #N'"
          exit 0

      - name: Get development issue details
        if: steps.pr.outputs.dev_issue != ''
        id: dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV_ISSUE="${{ steps.pr.outputs.dev_issue }}"

          # Get issue details
          ISSUE_DATA=$(GH_HOST={GITHUB_HOST} gh issue view ${DEV_ISSUE} --json title,labels,body)
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')

          # Extract phase label
          PHASE=$(echo "$ISSUE_DATA" | jq -r '.labels[].name' | grep -oE '^phase:[0-9]+$' | head -1)
          PHASE_NUM=$(echo "$PHASE" | cut -d: -f2)

          # Check if it's a development issue
          IS_DEV=$(echo "$ISSUE_DATA" | jq -r '.labels[].name' | grep -c 'ai:development' || echo "0")

          echo "title=${ISSUE_TITLE}" >> $GITHUB_OUTPUT
          echo "phase=${PHASE}" >> $GITHUB_OUTPUT
          echo "phase_num=${PHASE_NUM}" >> $GITHUB_OUTPUT
          echo "is_dev=${IS_DEV}" >> $GITHUB_OUTPUT

          # Extract task ID from title (e.g., [P1-1.1] or [P2-2.3])
          TASK_ID=$(echo "$ISSUE_TITLE" | grep -oE '\[P[0-9]+-[0-9]+\.[0-9a-z]+\]' | tr -d '[]' || echo "")
          if [ -z "$TASK_ID" ]; then
            TASK_ID="P${PHASE_NUM}-$(echo $DEV_ISSUE)"
          fi
          echo "task_id=${TASK_ID}" >> $GITHUB_OUTPUT

          # Extract feature name (title without task ID prefix)
          FEATURE_NAME=$(echo "$ISSUE_TITLE" | sed 's/\[P[0-9]*-[0-9]*\.[0-9a-z]*\]\s*//' | head -c 80)
          echo "feature_name=${FEATURE_NAME}" >> $GITHUB_OUTPUT

      - name: Skip if not a development issue
        if: steps.pr.outputs.dev_issue != '' && steps.dev.outputs.is_dev == '0'
        run: |
          echo "::notice::Issue #${{ steps.pr.outputs.dev_issue }} does not have ai:development label. Skipping."
          exit 0

      - name: Get other deployment issues in phase
        if: steps.pr.outputs.dev_issue != '' && steps.dev.outputs.is_dev != '0'
        id: blockers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHASE="${{ steps.dev.outputs.phase }}"

          # Get all open deployment issues for this phase
          DEPLOY_ISSUES=$(GH_HOST={GITHUB_HOST} gh issue list \
            --label "${PHASE}" \
            --label "ai:deployment" \
            --state open \
            --json number \
            --jq '.[].number' | tr '\n' ',' | sed 's/,$//')

          echo "blockers=${DEPLOY_ISSUES}" >> $GITHUB_OUTPUT

          # Count for ordering
          COUNT=$(GH_HOST={GITHUB_HOST} gh issue list \
            --label "${PHASE}" \
            --label "ai:deployment" \
            --json number | jq 'length')
          NEXT_NUM=$((COUNT + 1))
          echo "deploy_num=${NEXT_NUM}" >> $GITHUB_OUTPUT

      - name: Extract deployment considerations from PR
        if: steps.pr.outputs.dev_issue != '' && steps.dev.outputs.is_dev != '0'
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"

          # Get changed files
          FILES=$(GH_HOST={GITHUB_HOST} gh pr view ${PR_NUMBER} --json files --jq '.files[].path' | head -20)

          # Detect migration files
          HAS_MIGRATIONS=$(echo "$FILES" | grep -c 'migrations\|alembic' || echo "0")

          # Detect config changes
          HAS_CONFIG=$(echo "$FILES" | grep -c '\.env\|config\|terraform\|\.yml\|\.yaml' || echo "0")

          # Detect infrastructure changes
          HAS_INFRA=$(echo "$FILES" | grep -c 'infrastructure\|terraform\|cloudrun\|dockerfile' || echo "0")

          echo "has_migrations=${HAS_MIGRATIONS}" >> $GITHUB_OUTPUT
          echo "has_config=${HAS_CONFIG}" >> $GITHUB_OUTPUT
          echo "has_infra=${HAS_INFRA}" >> $GITHUB_OUTPUT

          # Get commit count
          COMMITS=$(GH_HOST={GITHUB_HOST} gh pr view ${PR_NUMBER} --json commits --jq '.commits | length')
          echo "commits=${COMMITS}" >> $GITHUB_OUTPUT

      - name: Create deployment issue
        if: steps.pr.outputs.dev_issue != '' && steps.dev.outputs.is_dev != '0'
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHASE="${{ steps.dev.outputs.phase }}"
          PHASE_NUM="${{ steps.dev.outputs.phase_num }}"
          TASK_ID="${{ steps.dev.outputs.task_id }}"
          FEATURE_NAME="${{ steps.dev.outputs.feature_name }}"
          DEV_ISSUE="${{ steps.pr.outputs.dev_issue }}"
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          PR_TITLE="${{ steps.pr.outputs.title }}"
          MERGED_AT="${{ steps.pr.outputs.merged_at }}"
          BLOCKERS="${{ steps.blockers.outputs.blockers }}"
          DEPLOY_NUM="${{ steps.blockers.outputs.deploy_num }}"

          HAS_MIGRATIONS="${{ steps.extract.outputs.has_migrations }}"
          HAS_CONFIG="${{ steps.extract.outputs.has_config }}"
          HAS_INFRA="${{ steps.extract.outputs.has_infra }}"
          COMMITS="${{ steps.extract.outputs.commits }}"

          # Build deployment considerations
          MIGRATIONS_NOTE="None detected"
          if [ "$HAS_MIGRATIONS" -gt 0 ]; then
            MIGRATIONS_NOTE="**Yes** - Review migration files"
          fi

          CONFIG_NOTE="None detected"
          if [ "$HAS_CONFIG" -gt 0 ]; then
            CONFIG_NOTE="**Yes** - Review config changes"
          fi

          INFRA_NOTE="None detected"
          if [ "$HAS_INFRA" -gt 0 ]; then
            INFRA_NOTE="**Yes** - Review infrastructure changes"
          fi

          # Build blocked by section
          BLOCKED_BY=""
          if [ -n "$BLOCKERS" ]; then
            BLOCKED_BY="
          **Blocked By** (deploy together):
          $(echo $BLOCKERS | tr ',' '\n' | sed 's/^/- #/')"
          fi

          # Create issue body
          BODY=$(cat <<'ISSUE_BODY'
## Deployment Issue

**Source**
| Field | Value |
|:------|:------|
| Development Issue | #DEV_ISSUE_PLACEHOLDER |
| Pull Request | #PR_NUMBER_PLACEHOLDER |
| Merged | MERGED_AT_PLACEHOLDER |
| Commits | COMMITS_PLACEHOLDER |

**Depends on**: #DEV_ISSUE_PLACEHOLDER (development complete)
BLOCKED_BY_PLACEHOLDER

---

## Changes Summary

PR_TITLE_PLACEHOLDER

---

## Deployment Considerations

| Category | Status | Notes |
|:---------|:-------|:------|
| Database Migrations | MIGRATIONS_PLACEHOLDER | Review `migrations/` or `alembic/` |
| Config Changes | CONFIG_PLACEHOLDER | Review `.env`, `config/`, Terraform |
| Infrastructure | INFRA_PLACEHOLDER | Review Dockerfile, Cloud Run config |

---

## Deployment Checklist

- [ ] Review changes summary above
- [ ] Verify all dependent deployments are ready
- [ ] Check for breaking changes
- [ ] Verify rollback procedure exists
- [ ] Add specific deployment notes below if needed

## Deployment Notes

<!-- AI Agent: Add specific deployment instructions here -->

---

## Test Scenarios for Staging

- [ ] Smoke test: Health endpoint returns 200
- [ ] Feature test: {describe feature-specific test}
- [ ] Regression test: Existing functionality works

---

*Created automatically from PR #PR_NUMBER_PLACEHOLDER merge*
ISSUE_BODY
)

          # Replace placeholders
          BODY=$(echo "$BODY" | sed "s/DEV_ISSUE_PLACEHOLDER/${DEV_ISSUE}/g")
          BODY=$(echo "$BODY" | sed "s/PR_NUMBER_PLACEHOLDER/${PR_NUMBER}/g")
          BODY=$(echo "$BODY" | sed "s/MERGED_AT_PLACEHOLDER/${MERGED_AT}/g")
          BODY=$(echo "$BODY" | sed "s/COMMITS_PLACEHOLDER/${COMMITS}/g")
          BODY=$(echo "$BODY" | sed "s/PR_TITLE_PLACEHOLDER/${PR_TITLE}/g")
          BODY=$(echo "$BODY" | sed "s/MIGRATIONS_PLACEHOLDER/${MIGRATIONS_NOTE}/g")
          BODY=$(echo "$BODY" | sed "s/CONFIG_PLACEHOLDER/${CONFIG_NOTE}/g")
          BODY=$(echo "$BODY" | sed "s/INFRA_PLACEHOLDER/${INFRA_NOTE}/g")
          BODY=$(echo "$BODY" | sed "s|BLOCKED_BY_PLACEHOLDER|${BLOCKED_BY}|g")

          # Create the deployment issue
          DEPLOY_TITLE="[${TASK_ID}-Deploy] ${FEATURE_NAME}"

          DEPLOY_ISSUE=$(GH_HOST={GITHUB_HOST} gh issue create \
            --title "${DEPLOY_TITLE}" \
            --body "${BODY}" \
            --label "${PHASE}" \
            --label "ai:deployment" \
            --json number --jq '.number')

          echo "number=${DEPLOY_ISSUE}" >> $GITHUB_OUTPUT
          echo "Created deployment issue #${DEPLOY_ISSUE}"

      - name: Link deployment issue to development issue
        if: steps.create.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV_ISSUE="${{ steps.pr.outputs.dev_issue }}"
          DEPLOY_ISSUE="${{ steps.create.outputs.number }}"

          # Add comment to development issue
          GH_HOST={GITHUB_HOST} gh issue comment ${DEV_ISSUE} \
            --body "Deployment issue created: #${DEPLOY_ISSUE}

          This development issue is complete. Deployment will occur when all Phase ${{ steps.dev.outputs.phase_num }} development issues are closed."

      - name: Post to Teams
        if: steps.create.outputs.number != ''
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          DEPLOY_ISSUE="${{ steps.create.outputs.number }}"
          DEV_ISSUE="${{ steps.pr.outputs.dev_issue }}"
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          PHASE_NUM="${{ steps.dev.outputs.phase_num }}"
          FEATURE_NAME="${{ steps.dev.outputs.feature_name }}"

          ISSUE_URL="${{ github.server_url }}/${{ github.repository }}/issues/${DEPLOY_ISSUE}"

          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "themeColor": "0076D7",
            "summary": "Deployment Issue Created",
            "sections": [{
              "activityTitle": "Deployment Issue #'${DEPLOY_ISSUE}' Created",
              "facts": [
                {"name": "Phase", "value": "'${PHASE_NUM}'"},
                {"name": "Feature", "value": "'${FEATURE_NAME}'"},
                {"name": "Source PR", "value": "#'${PR_NUMBER}'"},
                {"name": "Dev Issue", "value": "#'${DEV_ISSUE}'"},
                {"name": "Link", "value": "'${ISSUE_URL}'"}
              ]
            }]
          }' ${TEAMS_WEBHOOK} || true

      - name: Check if phase development is complete
        if: steps.create.outputs.number != ''
        id: phase_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHASE="${{ steps.dev.outputs.phase }}"

          # Check for remaining open development issues in this phase
          OPEN_DEV=$(GH_HOST={GITHUB_HOST} gh issue list \
            --label "${PHASE}" \
            --label "ai:development" \
            --state open \
            --json number | jq 'length')

          echo "open_dev_issues=${OPEN_DEV}" >> $GITHUB_OUTPUT

          if [ "$OPEN_DEV" -eq 0 ]; then
            echo "phase_complete=true" >> $GITHUB_OUTPUT
            echo "::notice::All development issues for ${PHASE} are closed. Ready for deployment review."
          else
            echo "phase_complete=false" >> $GITHUB_OUTPUT
            echo "::notice::${OPEN_DEV} development issues remaining for ${PHASE}"
          fi

      - name: Trigger deployment review (if phase complete)
        if: steps.phase_check.outputs.phase_complete == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHASE_NUM="${{ steps.dev.outputs.phase_num }}"

          echo "Triggering deployment review for Phase ${PHASE_NUM}"

          # Trigger the phase completion workflow
          GH_HOST={GITHUB_HOST} gh workflow run check-phase-completion.yml
