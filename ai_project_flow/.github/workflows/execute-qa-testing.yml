name: Execute QA Testing

on:
  # Triggered when all deployment issues in a phase are closed
  workflow_run:
    workflows: ["Deploy to Staging"]
    types: [completed]
  # Manual trigger for specific phase
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase number to run QA tests for'
        required: true
        type: string
  # Scheduled check (backup)
  schedule:
    - cron: '0 11 * * 1-5'  # 06:00 EST weekdays (QA window start)

permissions:
  contents: read
  issues: write

env:
  GH_HOST: "{GITHUB_HOST}"
  QA_TIMEOUT_MINUTES: 120
  MAX_QA_ITERATIONS: 3

jobs:
  check-qa-readiness:
    name: Check QA Readiness
    runs-on: self-hosted
    outputs:
      ready_phases: ${{ steps.check.outputs.ready_phases }}
      has_ready: ${{ steps.check.outputs.has_ready }}
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 https://{GITHUB_HOST}/${{ github.repository }} .
          git checkout ${{ github.sha }}

      - name: Check for phases ready for QA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - use specified phase
            READY_PHASES="${{ inputs.phase }}"
            echo "ready_phases=${READY_PHASES}" >> $GITHUB_OUTPUT
            echo "has_ready=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          READY_PHASES=""

          # Check each phase for QA readiness
          for PHASE in $(seq 1 8); do
            # Check if all deployment issues are closed
            OPEN_DEPLOY=$(GH_HOST={GITHUB_HOST} gh issue list \
              --label "phase:${PHASE}" \
              --label "ai:deployment" \
              --state open \
              --json number | jq 'length')

            if [ "$OPEN_DEPLOY" -gt 0 ]; then
              continue
            fi

            # Check if there are QA issues waiting
            PENDING_QA=$(GH_HOST={GITHUB_HOST} gh issue list \
              --label "phase:${PHASE}" \
              --label "ai:qa-testing" \
              --state open \
              --json number,labels \
              --jq '[.[] | select(.labels[].name != "ai:in-progress")] | length')

            if [ "$PENDING_QA" -gt 0 ]; then
              if [ -z "$READY_PHASES" ]; then
                READY_PHASES="${PHASE}"
              else
                READY_PHASES="${READY_PHASES},${PHASE}"
              fi
            fi
          done

          echo "ready_phases=${READY_PHASES}" >> $GITHUB_OUTPUT

          if [ -n "$READY_PHASES" ]; then
            echo "has_ready=true" >> $GITHUB_OUTPUT
            echo "::notice::Phases ready for QA: ${READY_PHASES}"
          else
            echo "has_ready=false" >> $GITHUB_OUTPUT
            echo "::notice::No phases ready for QA testing"
          fi

  execute-qa:
    name: Execute QA Tests
    needs: check-qa-readiness
    if: needs.check-qa-readiness.outputs.has_ready == 'true'
    runs-on: self-hosted
    strategy:
      matrix:
        phase: ${{ fromJson(format('[{0}]', needs.check-qa-readiness.outputs.ready_phases)) }}
      fail-fast: false
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 https://{GITHUB_HOST}/${{ github.repository }} .
          git checkout ${{ github.sha }}

      - name: Setup Python
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements-dev.txt

      - name: Get QA issues for phase
        id: qa_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHASE="${{ matrix.phase }}"

          # Get all open QA issues for this phase
          QA_ISSUES=$(GH_HOST={GITHUB_HOST} gh issue list \
            --label "phase:${PHASE}" \
            --label "ai:qa-testing" \
            --state open \
            --json number,title,body \
            --jq '.[].number' | tr '\n' ',' | sed 's/,$//')

          echo "issues=${QA_ISSUES}" >> $GITHUB_OUTPUT
          echo "::notice::QA issues for phase ${PHASE}: ${QA_ISSUES}"

      - name: Mark QA issues as in-progress and set Testing status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          # Get project data
          PROJECT_DATA=$(GH_HOST={GITHUB_HOST} gh api graphql -f query='
            query {
              organization(login: "{GITHUB_ORG}") {
                projectV2(number: 31) {
                  id
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField {
                      id
                    }
                  }
                }
              }
            }')

          PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD_ID=$(echo "$PROJECT_DATA" | jq -r '.data.organization.projectV2.field.id')
          TESTING_OPTION_ID="cabb455e"

          IFS=',' read -ra ISSUES <<< "${{ steps.qa_issues.outputs.issues }}"
          for ISSUE in "${ISSUES[@]}"; do
            # Add label
            GH_HOST={GITHUB_HOST} gh issue edit ${ISSUE} --add-label "ai:in-progress"

            # Get issue node ID
            NODE_ID=$(GH_HOST={GITHUB_HOST} gh api "/repos/${{ github.repository }}/issues/${ISSUE}" --jq '.node_id')

            # Find project item and update status
            ITEM_ID=$(GH_HOST={GITHUB_HOST} gh api graphql -f query='
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    items(first: 100) {
                      nodes { id content { ... on Issue { id } } }
                    }
                  }
                }
              }' -f org="{GITHUB_ORG}" -F number=31 \
              | jq -r --arg nid "$NODE_ID" '.data.organization.projectV2.items.nodes[] | select(.content.id == $nid) | .id')

            if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then
              GH_HOST={GITHUB_HOST} gh api graphql -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: {singleSelectOptionId: $value}
                  }) { projectV2Item { id } }
                }' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
                -f field="$STATUS_FIELD_ID" -f value="$TESTING_OPTION_ID" > /dev/null
              echo "Issue #${ISSUE}: status set to Testing"
            fi
          done

      - name: Execute QA tests
        id: tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_URL: https://staging.{PROJECT_PREFIX}.{DOMAIN}
        run: |
          source .venv/bin/activate

          python3 scripts/workflows/execute_qa_tests.py \
            --phase ${{ matrix.phase }} \
            --qa-issues "${{ steps.qa_issues.outputs.issues }}" \
            --staging-url "${STAGING_URL}" \
            --timeout-minutes ${QA_TIMEOUT_MINUTES} \
            --output-file /tmp/qa_results.json

          # Read results
          ALL_PASSED=$(jq -r '.all_passed' /tmp/qa_results.json)
          FAILED_COUNT=$(jq -r '.failed_count' /tmp/qa_results.json)
          PASSED_COUNT=$(jq -r '.passed_count' /tmp/qa_results.json)

          echo "all_passed=${ALL_PASSED}" >> $GITHUB_OUTPUT
          echo "failed_count=${FAILED_COUNT}" >> $GITHUB_OUTPUT
          echo "passed_count=${PASSED_COUNT}" >> $GITHUB_OUTPUT

      - name: Process passed QA issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get passed issues from results
          PASSED_ISSUES=$(jq -r '.passed_issues[]' /tmp/qa_results.json 2>/dev/null || echo "")

          for ISSUE in $PASSED_ISSUES; do
            # Update labels
            GH_HOST={GITHUB_HOST} gh issue edit ${ISSUE} \
              --remove-label "ai:in-progress" \
              --add-label "ai:qa-passed"

            # Add success comment
            GH_HOST={GITHUB_HOST} gh issue comment ${ISSUE} \
              --body "## QA Testing Passed

All tests passed successfully.

**Test Results**
$(jq -r ".issue_results[\"${ISSUE}\"].summary" /tmp/qa_results.json)

*Tested at $(date -u +%Y-%m-%dT%H:%M:%SZ)*"

            # Close the issue
            GH_HOST={GITHUB_HOST} gh issue close ${ISSUE} \
              --reason completed \
              --comment "QA testing completed successfully."
          done

      - name: Process failed QA issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get failed issues from results
          FAILED_ISSUES=$(jq -r '.failed_issues[]' /tmp/qa_results.json 2>/dev/null || echo "")

          for ISSUE in $FAILED_ISSUES; do
            # Update labels
            GH_HOST={GITHUB_HOST} gh issue edit ${ISSUE} \
              --remove-label "ai:in-progress" \
              --add-label "ai:qa-failed"

            # Get failure details
            FAILURES=$(jq -r ".issue_results[\"${ISSUE}\"].failures" /tmp/qa_results.json)

            # Add failure comment
            GH_HOST={GITHUB_HOST} gh issue comment ${ISSUE} \
              --body "## QA Testing Failed

**Failed Tests**
${FAILURES}

Bug issues will be created for each failure.

*Tested at $(date -u +%Y-%m-%dT%H:%M:%SZ)*"
          done

      - name: Create bug issues for failures
        if: steps.tests.outputs.failed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/workflows/create_bug_issues.py \
            --phase ${{ matrix.phase }} \
            --results-file /tmp/qa_results.json \
            --max-iterations ${MAX_QA_ITERATIONS}

      - name: Update phase tracking
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRACKING_FILE="governance/cicd/phase-deployments.json"
          PHASE="${{ matrix.phase }}"
          ALL_PASSED="${{ steps.tests.outputs.all_passed }}"

          if [ "$ALL_PASSED" == "true" ]; then
            QA_STATUS="passed"
          else
            QA_STATUS="failed"
          fi

          # Update tracking file
          jq ".phases[\"${PHASE}\"].qa_status = \"${QA_STATUS}\" |
              .phases[\"${PHASE}\"].qa_tested_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" \
            ${TRACKING_FILE} > /tmp/tracking.json && mv /tmp/tracking.json ${TRACKING_FILE}

          # Commit tracking update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.{GITHUB_HOST}"
          git add ${TRACKING_FILE}
          git commit -m "chore: update phase ${PHASE} QA status to ${QA_STATUS}" || true
          git push || true

      - name: Post summary to Teams
        if: always()
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          PHASE="${{ matrix.phase }}"
          ALL_PASSED="${{ steps.tests.outputs.all_passed }}"
          PASSED_COUNT="${{ steps.tests.outputs.passed_count }}"
          FAILED_COUNT="${{ steps.tests.outputs.failed_count }}"

          if [ "$ALL_PASSED" == "true" ]; then
            COLOR="28A745"
            STATUS="PASSED"
          else
            COLOR="DC3545"
            STATUS="FAILED"
          fi

          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "themeColor": "'${COLOR}'",
            "summary": "QA Testing '${STATUS}'",
            "sections": [{
              "activityTitle": "Phase '${PHASE}' QA Testing '${STATUS}'",
              "facts": [
                {"name": "Phase", "value": "'${PHASE}'"},
                {"name": "Status", "value": "'${STATUS}'"},
                {"name": "Passed", "value": "'${PASSED_COUNT}'"},
                {"name": "Failed", "value": "'${FAILED_COUNT}'"}
              ]
            }]
          }' ${TEAMS_WEBHOOK} || true

  check-phase-complete:
    name: Check Phase QA Complete
    needs: [check-qa-readiness, execute-qa]
    if: always() && needs.check-qa-readiness.outputs.has_ready == 'true'
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 https://{GITHUB_HOST}/${{ github.repository }} .
          git checkout ${{ github.sha }}

      - name: Check if all phase QA passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra PHASES <<< "${{ needs.check-qa-readiness.outputs.ready_phases }}"

          for PHASE in "${PHASES[@]}"; do
            # Check if any QA issues still open
            OPEN_QA=$(GH_HOST={GITHUB_HOST} gh issue list \
              --label "phase:${PHASE}" \
              --label "ai:qa-testing" \
              --state open \
              --json number | jq 'length')

            if [ "$OPEN_QA" -eq 0 ]; then
              # Check if any have failed label
              FAILED_QA=$(GH_HOST={GITHUB_HOST} gh issue list \
                --label "phase:${PHASE}" \
                --label "ai:qa-failed" \
                --json number | jq 'length')

              if [ "$FAILED_QA" -eq 0 ]; then
                echo "::notice::Phase ${PHASE} QA complete - all tests passed!"

                # Update tracking
                TRACKING_FILE="governance/cicd/phase-deployments.json"
                jq ".phases[\"${PHASE}\"].qa_complete = true" \
                  ${TRACKING_FILE} > /tmp/tracking.json && mv /tmp/tracking.json ${TRACKING_FILE}
              else
                echo "::warning::Phase ${PHASE} has ${FAILED_QA} failed QA issues - bug fixes required"
              fi
            else
              echo "::notice::Phase ${PHASE} still has ${OPEN_QA} QA issues pending"
            fi
          done
