# =============================================================================
# Glossary
# =============================================================================

glossary:
  terms:
    - term: Phase 0
      definition: "SDD Document Updates — archive, rewrite, supersedes, version bump. MANDATORY FIRST."
    - term: Phase 1
      definition: "IPLAN Creation/Update — all code implementation steps go here, referencing NEW SDD versions."
    - term: phase field
      definition: "Required field on each implementation step declaring which phase it belongs to."
