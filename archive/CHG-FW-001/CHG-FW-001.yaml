# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  what: |
    Add a mandatory `phase` field to the CHG template's `implementation.steps`
    to structurally enforce SDD-first implementation ordering. The current
    template has a flat `steps` list with no ordering constraint, allowing
    agents to put code implementation steps before SDD lifecycle steps.

    Also sync the outdated governance copy of the template with the layer copy,
    which is missing `document_control`, `creation_checklist`, and SDD-first
    guidance.

  why: |
    The CHG template's `_guidance` correctly describes SDD-first ordering, but
    the schema provides no structural enforcement. The flat `steps` list is the
    exact pattern that allowed CHG-08 to put 18 code steps first with SDD
    updates "Deferred" — violating §3.4 checklist items 13-14 for the third
    time (CHG-04, CHG-06, CHG-08).

    Advisory rules without enforcement get violated. The fix is to add a
    `phase` field that forces agents to declare which phase each step belongs
    to, making violations structurally visible rather than just doctrinally
    prohibited.

  trigger: |
    Self-learn cycle 2026-10-23 found CHG-08 violated items 13-14 (SDD-first
    order, CHG scope). Root cause analysis identified the flat steps list as
    the structural enabler. Audit of the framework template confirmed the gap.

# =============================================================================
# Section 3: Impact Assessment
# =============================================================================

impact_assessment:
  affected_layers:
    - layer: "CHG Template (Layer)"
      artifacts:
        - "framework/layers/09_CHG/CHG-TEMPLATE.yaml"
      impact: |
        Add `phase` field to `implementation.steps` with allowed values:
        `sdd_lifecycle` (Phase 0), `iplan_creation` (Phase 1).
        Update `_guidance` to explain phase enforcement.
        Add `_allowed_phases` reference block.

    - layer: "CHG Template (Governance)"
      artifacts:
        - "framework/governance/chg/CHG-TEMPLATE.yaml"
      impact: |
        Replace entirely with synced version from layer template.
        The governance copy is stale — missing document_control, creation_checklist,
        and all SDD-first guidance added after v0.53.0.

    - layer: "CHG README (Layer)"
      artifacts:
        - "framework/layers/09_CHG/README.md"
      impact: |
        Add phase enforcement note to Implementation Order section.

    - layer: "DOC_GOVERNANCE_CORE"
      artifacts:
        - "framework/governance/DOC_GOVERNANCE_CORE.md"
      impact: |
        No changes needed — §CHG creation checklist items 13-14 already
        describe the rule. The template change provides structural enforcement.

  cascade_direction: lateral
  risk_level: Low

