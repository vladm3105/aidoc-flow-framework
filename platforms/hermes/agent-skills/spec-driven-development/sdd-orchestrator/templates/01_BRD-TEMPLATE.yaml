traceability:
  _guidance: |
    Do NOT create numeric downstream references until artifacts exist.
    Use placeholders. Test coverage traceability belongs in TDD (Layer 7).

    Cross-linking tags (machine-parseable):
      @depends: BRD-NN — hard prerequisite BRD(s)
      @discoverability: BRD-NN (rationale) — related BRDs for AI search

  tags:
    - "@brd: BRD-NN"

  cross_links:
    depends:
      - "@depends: BRD-NN"
    discoverability:
      - "@discoverability: BRD-NN (short rationale)"

  objectives_to_requirements:
    - objective_id: "BRD.NN.04.xxxx"
      objective: "[Objective]"
      related_frs:
        - "BRD.NN.07.xxxx"
        - "BRD.NN.07.xxxx"
      coverage: Complete  # Complete | Partial | Planned

