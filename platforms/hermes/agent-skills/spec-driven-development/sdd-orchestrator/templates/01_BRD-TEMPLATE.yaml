# =============================================================================
# Appendix: Lifecycle Reference
# =============================================================================

appendix:
  lifecycle:
    _guidance: |
      Each BRD represents ONE iteration cycle: MVP → PROD → NEW MVP.
      New features = New BRD (BRD-02, BRD-03, etc.).
      Link cycles via cross_brd_dependencies in traceability section.

      When to create NEW BRD vs update existing:
        Bug fixes, minor clarifications → Update current BRD (patch version)
        New P1/P2 features → Create NEW BRD
        Entirely new product area → Create NEW BRD
        Major scope expansion → Create NEW BRD

    diagram:
      type: flowchart
      content: |
        flowchart LR
            MVP1[MVP BRD-01] --> PROD1[Production v1]
            PROD1 --> FEEDBACK1[User Feedback]
            FEEDBACK1 --> MVP2[NEW MVP BRD-02]
            MVP2 --> PROD2[Production v2]
            PROD2 --> FEEDBACK2[User Feedback]
            FEEDBACK2 --> MVP3[NEW MVP BRD-03]
            MVP3 --> PROD3[Production v3]

    principles:
      - "Each MVP is a complete cycle — BRD defines scope, development delivers, production validates"
      - "New features = New BRD — don't expand existing BRDs indefinitely"
      - "BRDs are versioned iterations — BRD-01, BRD-02, BRD-03 represent successive feature sets"
      - "Traceability links cycles — Cross-BRD dependencies show how iterations build on each other"

    when_to_start_new_cycle:
      - "Current MVP deployed to production and stable"
      - "User feedback collected (30-90 days)"
      - "New feature requirements identified"
      - "Current BRD scope is complete (no pending P1s)"
      - "Business justification for next iteration approved"

  next_cycle_roadmap:
    _guidance: "Plan for after this MVP reaches production."
    next_mvp_features: "[List candidates for next cycle]"
    platform_scaling: "[Considerations for future BRDs]"
    market_expansion: "[Plans for future BRDs]"
    trigger_criteria:
      - "Current MVP stable in production (30+ days)"
      - "User feedback collected and analyzed"
      - "New features prioritized and approved"
      - "Resources allocated for next cycle"

