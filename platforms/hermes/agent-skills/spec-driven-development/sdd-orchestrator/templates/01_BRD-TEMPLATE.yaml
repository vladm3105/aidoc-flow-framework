        reference: "[Document]"
        relevance: "[How it informs this BRD]"

  downstream_expected:
    - type: PRD
      layer: 2
      description: "Product Requirements Document — user stories, product features, acceptance criteria"

  cross_brd_dependencies:
    - related_brd: "[Platform BRD — e.g., BRD-01]"
      dependency_type: Foundation
      rationale: "[Infrastructure/services required]"

  health_score:
