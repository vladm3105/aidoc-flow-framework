# UCX Persona Mappings v1.0
# Machine-readable persona sequences per phase and doctype.
# Projects customize after sdd_init.
#
# Resolution priority:
#   1. Tool call `personas` param (explicit override)
#   2. This file (project default)
#
# All names must match files in UCX/skills/personas/{name}.md
#
# `mode` is metadata-only in v1.0 — documents collaboration pattern,
# not read by runtime. Future: parallel persona orchestration.

version: "1.0"

creation:
  brd:
    personas: [architect, product_owner, business_analyst, strategist, tech_lead]
    mode: sequential
  prd:
    personas: [product_owner, ux_strategist, content_strategist, tech_lead, architect, requirements_specialist]
    mode: sequential
  ears:
    personas: [requirements_specialist, tech_lead, qa_lead, chaos_engineer]
    mode: sequential
  bdd:
    personas: [qa_lead, tech_lead, chaos_engineer, operator, auditor]
    mode: sequential
  adr:
    personas: [architect, tech_lead, auditor, chaos_engineer, operator]
    mode: sequential
  spec:
    personas: [tech_lead, architect, operator, integration_lead, auditor]
    mode: sequential
  tdd:
    personas: [qa_lead, tech_lead, chaos_engineer, operator, auditor]
    mode: sequential
  iplan:
    personas: [tech_lead, architect, operator, integration_lead, qa_lead]
    mode: sequential

review:
  brd:
    personas: [architect, auditor, business_analyst, chaos_engineer, fact_checker, chairperson]
    mode: sequential
  prd:
    personas: [architect, auditor, tech_lead, product_owner, chaos_engineer]
    mode: sequential
  ears:
    personas: [requirements_specialist, tech_lead, qa_lead, chaos_engineer, integration_lead]
    mode: sequential
  bdd:
    personas: [qa_lead, tech_lead, chaos_engineer, operator, auditor]
    mode: sequential
  adr:
    personas: [architect, tech_lead, operator, auditor, chaos_engineer]
    mode: sequential
  spec:
    personas: [tech_lead, architect, chaos_engineer, operator, integration_lead]
    mode: sequential
  tdd:
    personas: [qa_lead, tech_lead, chaos_engineer, operator, auditor]
    mode: sequential
  iplan:
    personas: [tech_lead, architect, operator, integration_lead, auditor]
    mode: sequential

remediation:
  _default:
    personas: [architect, auditor, qa_lead, chaos_engineer, chairperson]
    mode: sequential
    loading: adaptive
