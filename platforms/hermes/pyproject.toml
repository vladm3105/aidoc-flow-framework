[project]
name = "hermes-server"
version = "0.7.4"
description = "MCP server for UCX Hermes SDD lifecycle workflows"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
api = ["litellm>=1.40.0"]

[project.scripts]
hermes-mcp = "mcp_server.server:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
