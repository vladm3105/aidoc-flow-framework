# IPLAN-TEMPLATE.yaml — Implementation Plan (Permanent)
# SDD Layer 8 — Mandatory execution bridge from SPEC to source code
# One IPLAN per SPEC component.
#
# Permanent vs Temporary:
#   Permanent IPLAN (this template): bridges SPEC to code for features/contracts.
#   Temporary IPLAN (tmp/): bugfixes, corrections — no SPEC upstream.
#   Registry: IPLAN-00_index.yaml tracks all permanent plans.
#
# IPLAN is the Layer 8 execution bridge from SPEC/TDD to code.

metadata:
  schema_version: "1.0"
  document_type: "iplan-document"
  layer: 8
  total_sections: 6
  last_updated: "2026-04-29"
  tags:
    - iplan-document
    - layer-8-artifact
    - shared-architecture

  c4_level:
    _guidance: |
      IPLAN is NOT a C4 level. It is the execution bridge between TDD
      and Code. C4-L4 (Code) diagrams belong to the source code layer,
      not to IPLAN documents.
    value: none

  id_standard:
    state: canonical  # provisional | canonical (PROVISIONAL-IDS-001)
    _guidance: |
      IPLAN bridges a single SPEC *component* (one IPLAN per component), so its
      @spec / @tdd references are document-level (DOC-NN) by design, not element
      refs. See framework/registry/LAYER_REGISTRY.yaml id_patterns.

# =============================================================================
# Section 1: Document Control
# =============================================================================
document_control:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  _guidance: |
    One IPLAN per TDD component. Created when TDD reaches
    IPLAN-Ready >=90/100.

    `subtype` selects which sections this IPLAN must carry. Values
    (CLEANUP-PR-E):
      - code_build: file_manifest, execution_commands,
        implementation_contracts, session_handoff, traceability
        required; rollback/smoke/canary/observability NOT required.
      - deploy: rollback_procedure, smoke_tests, canary_metrics,
        observability_hooks, runbook_reference, traceability
        required; file_manifest + execution_commands NOT required.
      - combined (default): both sets required.

    `_required_when_subtype:` markers on individual sections below
    declare which subtype set the section belongs to. The
    `doc-iplan-audit` SKILL reads `subtype` from authored
    `document_control` and selects the section set. Missing subtype
    defaults to `combined` (backward compat for pre-0.19.1 IPLANs).
  iplan_id: "IPLAN-NN"
  subtype: combined  # code_build | deploy | combined
  source_spec: "@spec: SPEC-NN"
  status: Draft  # Draft | In Progress | Completed
  version: "1.0"
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Author]"
  complexity: 3  # 1=1 file, 5=architectural changes
  estimated_files: 0
  session_count: 0  # Incremented per session

# =============================================================================
# Section 2: File Manifest
# =============================================================================
file_manifest:
  _size_target: 400  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Declared file creation order. Tests first (TDD principle).
    Each file tracked with status marker for session handoff.
    One IPLAN per SPEC component — all files belong to the same component.
  files:
    - path: "tests/unit/test_[module].py"
      order: 1
      status: NOT_STARTED  # NOT_STARTED | IN_PROGRESS | DONE | PARTIAL
      session: null
      verified: false
    - path: "src/[module]/[component].py"
      order: 2
      status: NOT_STARTED
      session: null
      verified: false
    - path: "tests/integration/test_[module].py"
      order: 3
      status: NOT_STARTED
      session: null
      verified: false

# =============================================================================
# Section 3: Execution Commands
# =============================================================================
execution_commands:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Runnable bash commands. The actual bridge from specification to code.
    Three categories matching the implementation workflow.
  setup:
    - "python -m venv .venv && source .venv/bin/activate"
    - "pip install -r requirements.txt"
    - "mkdir -p src/[module] tests/unit tests/integration"
  implementation:
    - "# Create test file first (TDD): tests/unit/test_[module].py"
    - "# Create implementation: src/[module]/[component].py"
  validation:
    - "python -m pytest tests/ -v --cov=src/[module] --cov-report=term-missing"
    - "python -m mypy src/[module] --strict"
    - "python -m ruff check src/[module]"

# =============================================================================
# Section 4: Implementation Contracts
# =============================================================================
implementation_contracts:
  _size_target: 400  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Optional. Required when 3+ files depend on shared interfaces.
    Contract types: Protocol Interface, Exception Hierarchy, State Machine,
    Data Model, DI Interface.
    State "No implementation contracts" if not applicable.
  _antipatterns:
    - "FAIL: contracts present but file count <3 — unnecessary overhead"
    - "FAIL: contracts missing but file manifest has 5+ files — guaranteed integration failures"
  provided:
    contracts: []
  consumed:
    dependencies: []

# =============================================================================
# Section 5: Session Handoff
# =============================================================================
session_handoff:
  _size_target: 300  # words; AUTHORING_STYLE.md (AS2)
  _required_when_subtype: [code_build, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Critical for stateless executor calls. Each AI agent session is
    independent — no memory across invocations. This section is the bridge.

    Session startup protocol:
      1. Read this session_handoff — identify last session's state
      2. Check file_manifest — find next NOT_STARTED or PARTIAL file
      3. Read partial_work description if resuming a PARTIAL step
      4. Continue from that point — do NOT regenerate completed work

    Handoff markers:
      NOT_STARTED — file not yet begun
      IN_PROGRESS — session actively working on this file
      DONE — file complete and verified (tests pass)
      PARTIAL — session ended mid-file (resume from partial_work)
  sessions:
    - date: "YYYY-MM-DD"
      agent: "[AI agent / session identifier]"
      files_touched:
        - path: "src/[module]/[file].py"
          action: created  # created | modified
          status: IN_PROGRESS  # NOT_STARTED | IN_PROGRESS | DONE | PARTIAL
      partial_work: "[Exactly what's incomplete if session ended mid-step]"
      blockers: "[Any blockers preventing next session]"
      next_session_directive: "[What the next session should do first — cite file + step]"
      validation_results:
        tests_passing: false  # true | false | null
        coverage: null  # percentage or null
        lint_clean: false

# =============================================================================
# Section 6: Traceability
# =============================================================================
traceability:
  _size_target: 100  # words; AUTHORING_STYLE.md (AS2)
  upstream:
    spec_references:
      - "@spec: SPEC-NN"
    tdd_references:
      - "@tdd: TDD.NN.SS.xxxx"  # element-level (GD-03); pipe-delimit several
  downstream:
    code_paths:
      - "@code: src/[module]/"
    test_paths:
      - "@tests: tests/"
  code_inventory:
    _guidance: |
      Audit trail: every file created/modified during implementation.
      Verified = tests pass + lint clean. Populated by each session.
    files:
      - path: "src/[module]/[file].py"
        status: created  # created | modified
        session: 1
        verified: false  # true after tests pass + lint clean

# =============================================================================
# Section 8: Rollback Procedure (deploy / combined)
# CLEANUP-PR-E item 17 — IPLAN sub-types
# =============================================================================
rollback_procedure:
  _size_target: 300  # words
  _required_when_subtype: [deploy, combined]  # CLEANUP-PR-E item 17
  _guidance: |
    Step-by-step rollback for the cutover this IPLAN executes. Each
    step has a documented reversal: what was applied, the inverse
    operation, and the verification step. Cite the SPEC-named
    one-way decisions (ADR commitments) that constrain the rollback
    surface — e.g., schema migrations that cannot be reversed must
    name a forward-only mitigation instead.
  steps:
    - step: "[Step description]"
      forward_action: "[Operation applied during cutover]"
      reverse_action: "[Operation to undo]"
      verification: "[How to confirm reversal succeeded]"
      reversible: true  # true | false (forward-only)

# =============================================================================
# Section 9: Smoke Tests (deploy / combined)
# =============================================================================
smoke_tests:
  _size_target: 250  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Post-cutover smoke tests with named pass criteria. Each cutover
    step has at least one smoke check that runs immediately after the
    step lands. Pass criteria reference SPEC-named NFR bounds where
    applicable.
  tests:
    - name: "[Smoke test name]"
      runs_after: "[Cutover step name]"
      pass_criterion: "[Named threshold / behavior]"
      timeout_seconds: 60

# =============================================================================
# Section 10: Canary Metrics (deploy / combined)
# =============================================================================
canary_metrics:
  _size_target: 250  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Canary metrics with explicit thresholds (latency, error rate,
    saturation). The canary window's pass condition is "all metrics
    within bounds for N consecutive minutes."
  metrics:
    - name: "[Metric name]"
      threshold: "[Numeric bound]"
      window_minutes: 10
      action_on_breach: "[Rollback | Pause | Alert]"

# =============================================================================
# Section 11: Observability Hooks (deploy / combined)
# =============================================================================
observability_hooks:
  _size_target: 200  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Deploy events emit named signals (logs, metrics, traces) with
    version-pinned identifiers. Dashboards / alert routes name the
    on-call playbook entry that reads them.
  hooks:
    - event: "[Deploy event name]"
      signal_type: log  # log | metric | trace
      signal_name: "[Named signal]"
      dashboard_url: "[Dashboard URL]"

# =============================================================================
# Section 12: Runbook Reference (deploy / combined)
# =============================================================================
runbook_reference:
  _size_target: 150  # words
  _required_when_subtype: [deploy, combined]
  _guidance: |
    Pointer to the on-call runbook updated for this deploy. Names the
    new failure-mode entries this deploy adds + the dashboard URL
    on-call uses to verify post-cutover health.
  runbook_url: "[Runbook URL]"
  new_failure_modes:
    - mode: "[Failure mode name]"
      detection: "[Signal pattern]"
      response: "[Operator action]"
