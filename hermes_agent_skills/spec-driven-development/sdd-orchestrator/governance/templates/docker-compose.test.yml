version: '3.8'

services:
  app:
    build:
      context: ./components/{SERVICE_NAME}
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://test:test@db:5432/testdb
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - FIRESTORE_EMULATOR_HOST=firestore:8086
      - BIGQUERY_EMULATOR_HOST=bigquery:9050
    depends_on:
      db:
        condition: service_healthy
      pubsub:
        condition: service_started
      firestore:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  firestore:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8086
    ports:
      - "8086:8086"

  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: --project=test-project --dataset=test_dataset
    ports:
      - "9050:9050"
