# =============================================================================
#  REQ-TEMPLATE.yaml — Unified Atomic Requirements Template
# =============================================================================
#  Document Authority: PRIMARY STANDARD (single source of truth)
#  Purpose: AI-consumable + human-reviewable REQ template
#  Principle: ONE atomic requirement per document (single testable concept)
#  Rendering: AI assistant converts to MD/HTML on demand
#
#  REPLACES: (archived to REQ_v1_archive/)
#    REQ-MVP-TEMPLATE.md, REQ-MVP-TEMPLATE.yaml, REQ_MVP_SCHEMA.yaml,
#    REQ_MVP_CREATION_RULES.md, REQ_MVP_VALIDATION_RULES.md,
#    REQ_MVP_QUALITY_GATE_VALIDATION.md
#
#  Convention:
#    _guidance     — authoring instructions, ignored by MCP tools
#    _antipatterns — common mistakes to avoid
#
#  Downstream Ownership (NOT duplicated here):
#    CTR (Layer 8)   — data contracts for REQ interface definitions
#    SPEC (Layer 9)  — implementation-ready specifications
#    TSPEC (Layer 10) — test specifications
#    TASKS (Layer 11) — implementation task breakdown
#
#  Validation:
#    MCP tool: sdd_validate (mcp_ucx server)
# =============================================================================

id: REQ-NN
title: "[Atomic Requirement Title]"

# =============================================================================
# Template Metadata
# =============================================================================

metadata:
  schema_version: "1.0"
  document_type: "req-document"
  layer: 7
  lifecycle: mvp-prod-newmvp
  total_sections: 10
  last_updated: "2026-03-29"
  validation:
    tool: sdd_validate
    server: mcp_ucx
    _guidance: |
      SPEC-Ready Score: >=90/100 required before SPEC generation.
      Scoring: functional completeness (30%), interface clarity (25%),
      error handling coverage (20%), traceability (15%), acceptance criteria (10%).

  c4_level:
    _guidance: |
      REQ is NOT a C4 level. It decomposes Component (SYS) into atomic
      requirements for Code (SPEC) implementation.

      SDD layers map to C4 architecture model zoom levels:
        Context (BRD)    — business environment, actors, boundaries
          └─ EARS/BDD    — formalize Context→Container transition
        Container (PRD)  — product features, functional blocks
          └─ ADR         — decisions that shape Component architecture
        Component (SYS)  — system structure, interfaces, quality attributes
          └─ REQ/CTR     — decompose Component→Code into atomic units  ← this layer
        Code (SPEC)      — implementation-ready specifications
          └─ TSPEC       — test specifications
          └─ TASKS       — implementation task breakdown

  diagram_standard:
    _guidance: |
      REQ uses state diagrams for error handling flows and sequence
      diagrams for interface interactions. No C4 level tags.

  tags:
    - req-document
    - layer-7-artifact
    - shared-architecture

  deliverable_type:
    _guidance: "Inherited from upstream chain."
    value: code

  id_standard:
    _guidance: |
      Format: {doc_type}.{doc_id}.{section_id}.{hash}
      Example: REQ.01.03.a1c7
      Hash: SHA256 of content, first 4 hex chars.
    format: "{doc_type}.{doc_id}.{section_id}.{hash}"
    hash_algorithm: SHA256
    hash_length: 4
    max_hash_length: 8
    placeholder: "xxxx"

# =============================================================================
# Section 1: Document Control
# =============================================================================

document_control:
  _guidance: |
    SPEC-Ready Score: >=90/100 required before SPEC generation.
    Each REQ = ONE atomic requirement (single testable concept).
  version: "1.0"
  status: Draft  # Draft | In Review | Approved
  date_created: "YYYY-MM-DDTHH:MM:SS"
  last_updated: "YYYY-MM-DDTHH:MM:SS"
  author: "[Requirements Engineer]"
  sys_reference: "@sys: SYS.NN.04.xxxx"
  adr_reference: "@adr: ADR.NN.03.xxxx"
  brd_reference: "@brd: BRD.NN.07.xxxx"
  spec_ready_score: "[Score]/100"

  revision_history:
    - version: "1.0"
      date: "YYYY-MM-DDTHH:MM:SS"
      author: "[Name]"
      changes: "Initial atomic requirement"

# =============================================================================
# Section 2: Requirement Description
# =============================================================================

requirement_description:
  _guidance: |
    Define exactly ONE atomic requirement per document.
    Statement format: "The system SHALL [precise, atomic behavior]"
    Context: 1-2 paragraphs explaining WHY (business rationale).
    Use case: primary flow + error flow.

  _antipatterns:
    - "FAIL: multiple behaviors in one REQ — split into separate documents"
    - "FAIL: vague statement ('handle data efficiently') — must be specific and testable"
    - "FAIL: implementation details ('use Redis cache') — describe behavior, not implementation"

  statement: |
    The system SHALL [precise, atomic requirement statement that defines
    exactly one specific behavior].

  context: |
    [1-2 paragraphs: why this requirement exists, what problem it solves,
    business rationale.]

  use_case:
    primary_flow:
      - "[Actor] [action]"
      - "[System] [validates]"
      - "[System] [executes]"
      - "[System] [returns outcome]"
    error_flow:
      - "[Error condition] → [error behavior]"

# =============================================================================
# Section 3: Functional Specification
# =============================================================================

functional_specification:
  _guidance: |
    Core functionality with measurable outcomes.
    Business rules in IF/THEN format: "IF [condition] THEN [action]"
    Input/output with strict validation rules.

  core_functionality:
    - id: "REQ.NN.03.xxxx"
      capability: "[Behavior]"
      outcome: "[Measurable result]"

  business_rules:
    - id: "REQ.NN.03.xxxx"
      rule: "IF [condition] THEN [action/outcome]"

  input_output:
    inputs:
      - name: "[Parameter]"
        type: "[Data type]"
        required: true
        validation: "[Validation rules]"
    outputs:
      - field: "[Output field]"
        type: "[Data type]"
        description: "[What it contains]"

# =============================================================================
# Section 4: Interface Definition
# =============================================================================

interface_definition:
  _guidance: |
    High-level interface contract. Detailed API specs belong in CTR (Layer 8).
    Use Protocol/ABC for interface contracts (not prose).
    Use Pydantic data schemas for model definitions.

  _antipatterns:
    - "FAIL: prose-only interface description — use Protocol/ABC code"
    - "FAIL: detailed endpoint specs with JSON schemas — belongs in CTR"

  protocol_contract: |
    [Python Protocol/ABC interface — use raise NotImplementedError(),
    not pass or ...]

  endpoints:
    - endpoint_id: "[ID]"
      path: "[/api/v1/resource]"
      method: "[GET | POST | PUT | DELETE]"
      auth_required: true
      ctr_reference: "[CTR-NN when created]"

# =============================================================================
# Section 5: Error Handling
# =============================================================================

error_handling:
  _guidance: |
    Exhaustive error catalog. Every error code must have a recovery strategy.

  errors:
    - error_code: "REQ-ERR-001"
      error_type: "[ValidationError | BusinessRuleViolation | ResourceNotFound]"
      severity: High
      http_status: 400
      recovery_strategy: "[How to recover]"

  state_machine:
    _guidance: "Mermaid stateDiagram showing error state transitions."
    diagram: |
      stateDiagram-v2
          [*] --> Active
          Active --> Error: failure
          Error --> Active: retry
          Error --> [*]: max_retries

# =============================================================================
# Section 6: Quality Attributes
# =============================================================================

quality_attributes:
  _guidance: "Requirement-specific quality targets. Use @threshold: tags."

  performance:
    - metric: "[Latency/throughput]"
      target: "[p95 < NNms]"
      threshold_ref: "@threshold: PRD.NN.perf.key"

  security:
    - requirement: "[Auth/encryption requirement]"
      standard: "[Compliance standard]"

# =============================================================================
# Section 7: Configuration
# =============================================================================

configuration:
  _guidance: "Runtime configuration parameters for this requirement."

  parameters:
    - name: "[Config parameter]"
      type: "[Data type]"
      default: "[Default value]"
      description: "[Purpose]"

# =============================================================================
# Section 8: Testing Requirements
# =============================================================================

testing_requirements:
  _guidance: |
    What needs testing (not how). TSPEC (Layer 10) owns test specifications.

  test_categories:
    - "Unit test: [core behavior validation]"
    - "Integration test: [interface contract verification]"
    - "Error test: [all error codes in catalog]"

# =============================================================================
# Section 9: Acceptance Criteria
# =============================================================================

acceptance_criteria:
  _guidance: "Minimum 3 criteria with verification methods."

  criteria:
    - id: "REQ.NN.09.xxxx"
      criterion: "[Measurable acceptance condition]"
      verification: "[How to verify]"
    - id: "REQ.NN.09.xxxx"
      criterion: "[Measurable acceptance condition]"
      verification: "[How to verify]"
    - id: "REQ.NN.09.xxxx"
      criterion: "[Measurable acceptance condition]"
      verification: "[How to verify]"

# =============================================================================
# Section 10: Traceability
# =============================================================================

traceability:
  _guidance: |
    Cumulative Tagging Hierarchy — Layer 7 requires all upstream tags.

  tags:
    - "@req: REQ-NN"

  upstream:
    sys_references:
      - "@sys: SYS.NN.04.xxxx"
    adr_references:
      - "@adr: ADR.NN.03.xxxx"
    bdd_references:
      - "@bdd: BDD.NN.03.xxxx"
    ears_references:
      - "@ears: EARS.NN.03.xxxx"
    prd_references:
      - "@prd: PRD.NN.09.xxxx"
    brd_references:
      - "@brd: BRD.NN.07.xxxx"

  downstream_expected:
    - type: CTR
      layer: 8
      description: "Data contracts for REQ interface definitions"
    - type: SPEC
      layer: 9
      description: "Technical specifications implementing this requirement"
    - type: TSPEC
      layer: 10
      description: "Test specifications validating this requirement"

  cross_links:
    depends:
      - "@depends: REQ-NN"
    discoverability:
      - "@discoverability: REQ-NN (short rationale)"

  health_score:
    spec_ready: "[X]%"
    target_score: ">=90/100"

# =============================================================================
# Glossary
# =============================================================================

glossary:
  _guidance: "Flat list of project-specific terms."

  terms:
    - term: REQ
      definition: "Atomic Requirement (single testable concept)"
    - term: SPEC-Ready
      definition: "Score measuring REQ maturity for SPEC transition (>=90%)"
    - term: "[Domain term]"
      definition: "[Definition]"

# =============================================================================
# End of REQ-TEMPLATE.yaml
# =============================================================================
