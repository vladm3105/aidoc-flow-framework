# =============================================================================
#  Document Authority: PRIMARY STANDARD for Autopilot Workflow
# - Purpose: AI-consumable template for automated RISKSPEC artifact generation
# - Validation: Validated by RISKSPEC_MVP_SCHEMA.yaml
# - Human Reference: See RISKSPEC-MVP-TEMPLATE.md for narrative explanations
# - Parent: SPEC (orchestrator) - routes here when deliverable_type == 'risk'
# =============================================================================

id: risk_domain_name
summary: "Single-sentence description of risk domain purpose, scope, and primary assessment objectives."

# =============================================================================
# Metadata
# =============================================================================

metadata:
  schema_version: "1.0"
  instance_document_type: "riskspec-document"
  deliverable_type: "risk"  # Fixed for RISKSPEC - inherited from REQ

document_control:
  status: "draft"  # draft, review, approved, implemented, deprecated
  version: "1.0.0"
  created_date: "YYYY-MM-DD"
  last_updated: "YYYY-MM-DD"
  author: "[Primary Author]"
  risk_ready_score: "[PASS] 95% (Target: >=90%)"
  ctr_required: false  # CTR is NOT required for risk specifications

custom_fields:
  document_type: template
  instance_document_type: riskspec-document
  artifact_type: RISKSPEC
  layer: 9
  subtype_code: 53
  parent_type: SPEC
  deliverable_output: risk
  readiness_score: RISK-Ready
  ctr_required: false

# =============================================================================
# Traceability
# =============================================================================

traceability:
  upstream_references:
    brd: "@brd: BRD.NN.EE.SS"
    prd: "@prd: PRD.NN.EE.SS"
    ears: "@ears: EARS.NN.EE.SS"
    bdd: "@bdd: BDD.NN.EE.SS"
    adr: "@adr: ADR-NN"
    sys: "@sys: SYS.NN.EE.SS"
    req: "@req: REQ.NN.EE.SS"
    threshold: "PRD-NN"

  downstream_artifacts:
    tasks: "TASKS"
    policies: "policies/"
    controls: "controls/"

  tags:
    - "@riskspec: RISKSPEC.NN.65.SS"
    - "@req: REQ.NN.EE.SS"

  cross_links:
    depends:
      - "@depends: RISKSPEC-NN"
    discoverability:
      - "@discoverability: RISKSPEC-NN (short rationale)"

# =============================================================================
# Risk Specification
# =============================================================================

section_3_risk_specification:
  risk_framework: "ISO31000"  # ISO31000, NIST, FAIR, custom
  assessment_type: "qualitative"  # qualitative, quantitative, hybrid

  risk_matrix:
    likelihood_scale: [1, 2, 3, 4, 5]
    impact_scale: [1, 2, 3, 4, 5]
    risk_tolerance: "medium"  # low, medium, high

  risk_register:
    - id: "RISKSPEC.NN.65.01"
      category: "operational"  # operational, financial, compliance, security, strategic
      description: "[Risk description - what could happen and why]"
      likelihood: 3
      impact: 4
      risk_score: 12  # calculated: likelihood x impact
      mitigation_strategy: "mitigate"  # avoid, transfer, mitigate, accept

    - id: "RISKSPEC.NN.65.02"
      category: "security"
      description: "[Risk description - what could happen and why]"
      likelihood: 2
      impact: 5
      risk_score: 10
      mitigation_strategy: "mitigate"

    - id: "RISKSPEC.NN.65.03"
      category: "compliance"
      description: "[Risk description - what could happen and why]"
      likelihood: 2
      impact: 4
      risk_score: 8
      mitigation_strategy: "avoid"

  controls:
    - id: "RISKSPEC.NN.66.01"
      risk_id: "RISKSPEC.NN.65.01"
      control_type: "preventive"  # preventive, detective, corrective
      description: "[Control description - what the control does]"
      owner: "[Control owner role]"
      status: "planned"  # planned, implemented, verified

    - id: "RISKSPEC.NN.66.02"
      risk_id: "RISKSPEC.NN.65.01"
      control_type: "detective"
      description: "[Control description - what the control does]"
      owner: "[Control owner role]"
      status: "planned"

    - id: "RISKSPEC.NN.66.03"
      risk_id: "RISKSPEC.NN.65.02"
      control_type: "corrective"
      description: "[Control description - what the control does]"
      owner: "[Control owner role]"
      status: "planned"

# =============================================================================
# Mitigations
# =============================================================================

mitigations:
  strategies:
    - id: "RISKSPEC.NN.67.01"
      risk_id: "RISKSPEC.NN.65.01"
      strategy: "mitigate"
      implementation: "[How the mitigation will be implemented]"
      timeline: "[Expected completion date]"
      cost_estimate: "[Cost in currency or effort]"
      responsible_party: "[Who is responsible]"

    - id: "RISKSPEC.NN.67.02"
      risk_id: "RISKSPEC.NN.65.02"
      strategy: "transfer"
      implementation: "[Insurance or contract details]"
      timeline: "[Expected completion date]"
      cost_estimate: "[Cost in currency or effort]"
      responsible_party: "[Who is responsible]"

  strategy_definitions:
    avoid: "Eliminate the risk by removing the cause or changing approach"
    transfer: "Shift risk to third party through insurance or contracts"
    mitigate: "Reduce likelihood or impact through controls"
    accept: "Acknowledge and monitor; cost of mitigation exceeds benefit"

# =============================================================================
# Assessments
# =============================================================================

assessments:
  impact_assessments:
    - id: "RISKSPEC.NN.68.01"
      risk_id: "RISKSPEC.NN.65.01"
      impact_area: "operations"  # operations, financial, reputation, legal, safety
      current_state: "[Current exposure or vulnerability]"
      target_state: "[Desired state after mitigation]"
      gap_analysis: "[What needs to change]"

    - id: "RISKSPEC.NN.68.02"
      risk_id: "RISKSPEC.NN.65.01"
      impact_area: "financial"
      current_state: "[Current financial exposure]"
      target_state: "[Acceptable financial risk level]"
      gap_analysis: "[Required risk reduction]"

  residual_risk:
    - risk_id: "RISKSPEC.NN.65.01"
      inherent_score: 12
      controls_applied: ["RISKSPEC.NN.66.01", "RISKSPEC.NN.66.02"]
      residual_score: 4
      within_tolerance: true

    - risk_id: "RISKSPEC.NN.65.02"
      inherent_score: 10
      controls_applied: ["RISKSPEC.NN.66.03"]
      residual_score: 5
      within_tolerance: true

# =============================================================================
# Monitoring
# =============================================================================

monitoring:
  key_risk_indicators:
    - name: "[KRI Name]"
      risk_id: "RISKSPEC.NN.65.01"
      metric: "[What is measured]"
      threshold_warning: "[Warning threshold]"
      threshold_critical: "[Critical threshold]"
      frequency: "daily"  # daily, weekly, monthly, quarterly
      owner: "[Monitoring owner]"

  review_schedule:
    - activity: "Risk register review"
      frequency: "quarterly"
      responsible: "Risk Owner"
      last_review: "YYYY-MM-DD"
      next_review: "YYYY-MM-DD"

    - activity: "Control effectiveness testing"
      frequency: "semi-annual"
      responsible: "Control Owner"
      last_review: "YYYY-MM-DD"
      next_review: "YYYY-MM-DD"

    - activity: "Framework assessment"
      frequency: "annual"
      responsible: "Risk Committee"
      last_review: "YYYY-MM-DD"
      next_review: "YYYY-MM-DD"

# =============================================================================
# Verification
# =============================================================================

verification:
  bdd_scenarios:
    - "04_BDD/BDD-NN_{suite}/BDD-NN.SS_risk_controls.feature#control-verification"

  audit_tests:
    - type: "control_testing"
      coverage_target: "100% critical controls"
      path: "audits/controls/[domain]/"

    - type: "compliance_audit"
      coverage_target: "90%"
      path: "audits/compliance/[domain]/"

