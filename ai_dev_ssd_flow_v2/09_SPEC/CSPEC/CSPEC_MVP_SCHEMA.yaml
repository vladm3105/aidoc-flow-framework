# =============================================================================
#  Document Role: DERIVATIVE of CSPEC-MVP-TEMPLATE.yaml
# - Authority: CSPEC-MVP-TEMPLATE.yaml is PRIMARY
# - Purpose: Machine-readable validation rules for CSPEC YAML documents
# - On conflict: Defer to CSPEC-MVP-TEMPLATE.yaml
# =============================================================================

schema_version: "1.0"
artifact_type: CSPEC
layer: 9
subtype_code: 50
parent_type: SPEC
last_updated: "2026-03-01"
deliverable_type: code

references:
  md_template: "CSPEC-MVP-TEMPLATE.md"
  yaml_template: "CSPEC-MVP-TEMPLATE.yaml"
  parent_schema: "../SPEC_MVP_SCHEMA.yaml"
  creation_rules: "CSPEC_MVP_CREATION_RULES.md"
  validation_rules: "CSPEC_MVP_VALIDATION_RULES.md"

# =============================================================================
# CSPEC-Specific Metadata
# =============================================================================

cspec_metadata:
  description: "Code Specification - Technical specifications for source code implementation"
  deliverable_output: "Source code, unit tests, integration tests"
  ctr_required: true
  readiness_score: "TASKS-Ready"
  readiness_target: 90

# =============================================================================
# File Format Requirements
# =============================================================================

file_format:
  extension: ".yaml"
  naming_pattern: "^CSPEC-\\d{2,}_[a-z0-9_]+\\.yaml$"
  description: "Format: CSPEC-NN_descriptive_name.yaml"
  encoding: "UTF-8"
  yaml_version: "1.2"

# =============================================================================
# Required Fields (inherits from SPEC with CSPEC-specific additions)
# =============================================================================

top_level:
  required_fields:
    id:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: "Component identifier (snake_case)"

    summary:
      type: string
      min_length: 10
      max_length: 200
      description: "Single-sentence description of code component purpose"

    metadata:
      type: object
      required: true
      fields:
        schema_version:
          type: string
          required: true
        instance_document_type:
          type: string
          required: true
          allowed_values: ["cspec-document"]
        deliverable_type:
          type: string
          required: true
          allowed_values: ["code"]

    document_control:
      type: object
      required: true
      fields:
        ctr_required:
          type: boolean
          required: true
          default: true
          description: "CTR is required for code specifications"

    traceability:
      type: object
      required: true
      description: "Must include REQ and CTR upstream references"

    architecture:
      type: object
      required: true
      description: "Component architecture and dependencies"

    interfaces:
      type: object
      required: true
      description: "Interface definitions (classes, methods, APIs)"

    behavior:
      type: object
      required: true
      description: "Behavioral specifications"

    performance:
      type: object
      required: true
      description: "Performance targets (required for code)"

    security:
      type: object
      required: true
      description: "Security specifications"

    observability:
      type: object
      required: true
      description: "Metrics, logging, health checks"

    verification:
      type: object
      required: true
      description: "Test scenarios and validation"

    implementation:
      type: object
      required: true
      description: "Implementation specifics (language, framework, paths)"

# =============================================================================
# Element Type Codes (CSPEC-specific)
# =============================================================================

element_type_codes:
  50: "interface"
  51: "method"
  52: "model"
  53: "error"
  54: "config"

element_id_format: "CSPEC.{DOC}.{TYPE}.{SEQ}"
element_id_example: "CSPEC.01.cea3"

# =============================================================================
# Validation Rules
# =============================================================================

validation_rules:
  structure:
    - rule: "File must be valid YAML"
      severity: error
    - rule: "All required top-level fields must be present"
      severity: error
    - rule: "File name must match CSPEC-NN_name.yaml format"
      severity: warning
    - rule: "deliverable_type must be 'code'"
      severity: error

  traceability:
    - rule: "upstream_references must include REQ"
      severity: error
    - rule: "upstream_references must include CTR"
      severity: error
    - rule: "cumulative_tags must include all upstream tags through REQ"
      severity: warning

  interfaces:
    - rule: "At least one class or API must be defined"
      severity: error
    - rule: "Each class must have at least one method"
      severity: error
    - rule: "Method signatures must include types"
      severity: warning

  performance:
    - rule: "latency_targets must use @threshold references"
      severity: error
    - rule: "throughput_targets must be specified"
      severity: warning

  implementation:
    - rule: "language must be specified"
      severity: error
    - rule: "module_path must be specified"
      severity: error

# =============================================================================
# Scoring Criteria (TASKS-Ready)
# =============================================================================

scoring:
  name: "TASKS-Ready"
  target: 90
  criteria:
    interface_completeness:
      weight: 25
      description: "All interfaces, methods, and APIs fully specified"
    error_handling:
      weight: 20
      description: "Error codes, recovery strategies defined"
    test_coverage_plan:
      weight: 20
      description: "BDD, unit, integration test references"
    traceability:
      weight: 20
      description: "All upstream/downstream links complete"
    implementation_guidance:
      weight: 15
      description: "Language, framework, paths, dependencies"

# =============================================================================
# Error Messages
# =============================================================================

error_messages:
  CSPEC-E001: "File is not valid YAML"
  CSPEC-E002: "Missing required top-level field"
  CSPEC-E003: "deliverable_type must be 'code'"
  CSPEC-E004: "Missing CTR reference (required for code specifications)"
  CSPEC-E005: "Missing REQ reference in traceability"
  CSPEC-E006: "No interfaces defined"
  CSPEC-E007: "No implementation language specified"
  CSPEC-W001: "Performance targets not using @threshold references"
  CSPEC-W002: "Missing method type signatures"
  CSPEC-W003: "Missing BDD scenario references"

# =============================================================================
