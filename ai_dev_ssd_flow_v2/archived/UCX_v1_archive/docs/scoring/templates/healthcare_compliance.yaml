# UCX Scoring Template: Healthcare
# Version: 1.0.0
#
# Industry-specific compliance keywords and weight adjustments
# for healthcare, medical devices, and life sciences applications.
#
# Usage in project config (docs/UCX/scoring_weights.yaml):
#   extends: healthcare_compliance

industry: healthcare
description: "Healthcare, medical devices, pharmaceuticals, life sciences"

compliance:
  keywords:
    # HIPAA
    - "HIPAA"
    - "Health Insurance Portability"
    - "PHI"
    - "Protected Health Information"
    - "ePHI"
    - "Electronic Protected Health Information"
    - "HITECH"
    - "HITECH Act"
    - "Covered Entity"
    - "Business Associate"
    - "BAA"
    - "Business Associate Agreement"
    - "Minimum Necessary"
    - "Notice of Privacy Practices"
    - "NPP"
    - "Authorization"
    - "De-identification"
    - "Limited Data Set"

    # FDA
    - "FDA"
    - "Food and Drug Administration"
    - "21 CFR Part 11"
    - "21 CFR 820"
    - "Quality System Regulation"
    - "QSR"
    - "cGMP"
    - "Good Manufacturing Practice"
    - "510(k)"
    - "PMA"
    - "Pre-Market Approval"
    - "IND"
    - "NDA"
    - "BLA"
    - "Device Classification"
    - "MDR"
    - "Medical Device Reporting"
    - "UDI"
    - "Unique Device Identifier"
    - "Design Controls"
    - "Design History File"
    - "DHF"
    - "DMR"
    - "Device Master Record"
    - "CAPA"
    - "Corrective and Preventive Action"

    # Lab/Clinical
    - "CLIA"
    - "Clinical Laboratory Improvement"
    - "CAP"
    - "College of American Pathologists"
    - "GCP"
    - "Good Clinical Practice"
    - "ICH"
    - "IRB"
    - "Institutional Review Board"
    - "Informed Consent"
    - "Clinical Trial"
    - "Adverse Event"
    - "SAE"
    - "Serious Adverse Event"

    # International
    - "CE Mark"
    - "IVDR"
    - "MDR 2017/745"
    - "EU MDR"
    - "Notified Body"

  # Weight adjustment: increase compliance weight for healthcare
  weight_adjustment: 0.05  # Increase to 0.25

risk:
  keywords:
    - "Patient Safety"
    - "Clinical Risk"
    - "Medical Error"
    - "Adverse Event"
    - "Recall"
    - "Field Safety"
    - "Hazard Analysis"
    - "Risk Management File"
    - "ISO 14971"
    - "Essential Performance"
    - "Harm"
    - "Severity"
