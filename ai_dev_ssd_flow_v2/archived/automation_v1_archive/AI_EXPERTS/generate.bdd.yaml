# Expert Generation Board: Behavior-Driven Development (BDD) — Layer 4
# Team: QA Lead (lead), Tech Lead, Product Owner
# Focus: Complete BDD/Gherkin specification generation with multi-persona drafting
#
# Configuration Options (engine key required for all agents):
#   - engine: "cmd"     - Direct CLI command via cmd key (e.g., "claude -p --model $P_MODEL")
#   - engine: "litellm" - LiteLLM/OpenAI-compatible API with api_base and api_key_env
# Reference: /opt/data/docs_flow_framework/automation/core/ai_exec.sh
#
# IMPORTANT: Judge and Chairperson/Editor MUST use different models to ensure
# impartial evaluation. The Judge cannot evaluate work from the same model.

personas:
  qa_lead:
    name: "The QA Lead"
    skill_file: "qa_lead.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.3
      max_tokens: 5000
    prompt: |-
      You are the QA Lead generating a BDD Feature Specification.
      Your role: Draft the Feature overview, Background scenarios, and primary Given-When-Then test cases.
      Translate the upstream document (EARS/PRD) into executable BDD specifications.
      Output ONLY your drafted sections in markdown format.

  tech_lead:
    name: "The Tech Lead"
    skill_file: "tech_lead.md"
    agent:
      engine: "litellm"
      model: "gemini-2.5-pro"
      temperature: 0.2
      max_tokens: 4000
      api_base: "https://api.openai.com/v1"
      api_key_env: "LITELLM_MASTER_KEY"
    prompt: |-
      You are the Tech Lead generating a BDD specification.
      Your role: Draft the edge cases, negative test scenarios, and technical constraint validation.
      Output ONLY your drafted sections in markdown format.

  product_owner:
    name: "The Product Owner"
    skill_file: "product_owner.md"
    agent:
      engine: "cmd"
      cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
      model: "claude-sonnet-4-20250514"
      temperature: 0.2
      max_tokens: 3000
    prompt: |-
      You are the Product Owner generating a BDD specification.
      Your role: Ensure the BDD scenarios accurately map back to user stories and business metrics. Draft the scenario outlines for user acceptance testing (UAT).
      Output ONLY your drafted sections in markdown format.

chairperson:
  name: "The Board Chairperson (BDD Assembler)"
  agent:
    # Chairperson uses GPT-4o - Judge MUST use different model (Claude)
    engine: "litellm"
    model: "gpt-4o"
    temperature: 0.2
    max_tokens: 6000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are the Chairperson of the BDD Generation Board.
    Your role is to act as the Assembler.
    Take the drafted scenarios from the expert personas and seamlessly assemble them into a COMPLETE Version 1 Markdown document using the strict Gherkin/BDD framework template.
    You MUST perfectly adhere to the exact section structure rules in the Shared Context.

judge:
  name: "The Framework Judge"
  agent:
    # Judge uses Claude - different from Chairperson (GPT-4o) for impartial evaluation
    engine: "cmd"
    cmd: "claude -p --model $P_MODEL --max-budget-usd 0.5"
    model: "claude-sonnet-4-20250514"
    temperature: 0.1
    max_tokens: 3000
  prompt: |-
    You are an impartial Judge evaluating a V1 Draft of a BDD specification.
    Your sole focus is strict framework compliance. Check the document against the doc-bdd SKILL rules.
    Look for: Valid Given-When-Then syntax, no implementation details leaking into the scenarios, all traceability tags present.
    Output a structured critique detailing what the Chairperson must fix. Provide explicit, actionable feedback.

editor:
  name: "The Board Chairperson (BDD Editor)"
  agent:
    # Editor uses GPT-4o (same as Chairperson) - applies fixes from Judge's critique
    engine: "litellm"
    model: "gpt-4o"
    temperature: 0.2
    max_tokens: 6000
    api_base: "https://api.openai.com/v1"
    api_key_env: "LITELLM_MASTER_KEY"
  prompt: |-
    You are the Chairperson of the BDD Generation Board acting as the Final Editor.
    You previously created a V1 Draft of a BDD document. Our LLM Judge has reviewed your draft and provided a critique.
