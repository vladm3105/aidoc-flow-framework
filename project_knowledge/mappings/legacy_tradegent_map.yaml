version: v1
source: tradegent
target: project_knowledge
notes:
  - Map trading-specific fields to domain-neutral metadata for compatibility.
  - Maintain backward compatibility in adapters during migration.
field_mappings:
  ticker:
    target: entity_id
    transform: uppercase
    fallback: null
  doc_type:
    target: source_type
    transform: identity
  file_path:
    target: source_path
    transform: identity
  tags:
    target: tags
    transform: lowercase_unique
  created_at:
    target: created_at
    transform: datetime_parse
  updated_at:
    target: updated_at
    transform: datetime_parse
filters:
  ticker:
    replace_with: entity_id
  analysis_type:
    replace_with: source_type
compatibility:
  preserve_legacy_keys: true
  adapter_required: true
